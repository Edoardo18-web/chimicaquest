<style>
/* ChimicaQuest — stile: tema scuro con accenti neon e card in vetro (glassmorphism) */
:root {
  --bg: #060913; --bg2: #0c1224; --txt: #e8edf7; --muted: #8b97b3;
  --cy: #22d3ee; --vi: #a78bfa; --li: #a3e635; --pk: #f472b6; --am: #fbbf24; --rd: #fb7185;
  --glass: rgba(255, 255, 255, .06); --glass2: rgba(255, 255, 255, .1); --linea: rgba(255, 255, 255, .12);
  --nav: 68px; --top: 56px; --r: 18px;
  font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overscroll-behavior: none; }
body { background:
  radial-gradient(900px 500px at 10% -10%, rgba(34, 211, 238, .13), transparent 60%),
  radial-gradient(800px 500px at 100% 0%, rgba(167, 139, 250, .14), transparent 60%), var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
.nascosto { display: none !important; }

/* ---------- Struttura ---------- */
#app { position: fixed; top: 0; left: 0; right: 0; height: var(--vh, 100dvh); overflow: hidden; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; position: relative; }
/* la barra scende sotto la Dynamic Island / tacca: env(safe-area-inset-top) è lo spazio riservato dal sistema */
#top { height: calc(var(--top) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 14px 0; display: flex; align-items: center; gap: 10px; flex: none; }
#top .logo { font-weight: 800; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; margin-right: auto; }
#top .logo i { font-style: normal; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--cy), var(--vi)); color: #04101f; font-weight: 900; font-size: 13px; }
.pill { height: 36px; padding: 0 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--linea); display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.pill.btn:active { transform: scale(.94); }
.pill { white-space: nowrap; flex: none; }
#top .logo { min-width: 0; }
@media (max-width: 430px) { #top .logo span { display: none; } #top { gap: 7px; } .pill { padding: 0 10px; } }
#vista { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 14px 24px; scroll-behavior: smooth; }
#vista.feedmode { padding: 0; overflow: hidden; }
#nav { height: var(--nav); flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: rgba(8, 12, 24, .86); backdrop-filter: blur(14px); border-top: 1px solid var(--linea); }
#nav button { border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
#nav button b { font-size: 20px; line-height: 1; }
#nav button.attivo { color: var(--txt); background: var(--glass2); }
#nav .badge { position: absolute; top: 2px; right: 22%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--rd); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }

.glass { background: var(--glass); border: 1px solid var(--linea); border-radius: var(--r); backdrop-filter: blur(12px); }
.titolo-sez { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }

/* ---------- Barre XP e progresso ---------- */
.hero { padding: 14px 16px; margin-top: 6px; display: grid; gap: 10px; }
.hero .riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero .rango { font-weight: 800; font-size: 17px; }
.hero small { color: var(--muted); }
.barra { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, .09); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cy), var(--vi), var(--pk)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }

/* ---------- Mappa / Skill tree ---------- */
.mappa { display: flex; flex-direction: column; align-items: center; padding: 8px 0 30px; }
.nodo { width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
.nodo .corpo { display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .2s; }
.nodo .corpo { transform: translateX(calc(var(--dx, 0) * 80px)); }
.filo { transform: translateX(calc(var(--dx, 0) * 80px)); }
@media (max-width: 420px) { .nodo .corpo { transform: translateX(calc(var(--dx, 0) * 56px)); } .filo { transform: translateX(calc(var(--dx, 0) * 56px)); } }
.tile { width: 92px; height: 92px; border-radius: 22px; position: relative; display: grid; place-items: center; background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04));
  border: 2px solid var(--col, var(--cy)); box-shadow: 0 0 26px -6px var(--col, var(--cy)), inset 0 0 20px -8px var(--col, var(--cy)); transition: transform .15s; }
.tile:active { transform: scale(.94); }
.tile .num { position: absolute; top: 6px; left: 9px; font-size: 11px; color: var(--muted); font-weight: 700; }
.tile .simb { font-size: 34px; font-weight: 900; color: var(--col, var(--cy)); text-shadow: 0 0 14px var(--col, var(--cy)); }
.tile .stelle { position: absolute; bottom: 5px; font-size: 11px; letter-spacing: 1px; }
.nodo.bloccato .tile { filter: grayscale(1) brightness(.55); box-shadow: none; border-color: var(--linea); }
.nodo.bloccato .tile::after { content: "🔒"; position: absolute; right: -6px; top: -8px; font-size: 20px; }
.nodo.attuale .tile { animation: pulsa 1.8s infinite; }
@keyframes pulsa { 0%, 100% { box-shadow: 0 0 26px -6px var(--col), 0 0 0 0 color-mix(in srgb, var(--col) 50%, transparent); } 50% { box-shadow: 0 0 34px -2px var(--col), 0 0 0 12px transparent; } }
.nodo .nome { font-weight: 700; font-size: 14px; text-align: center; max-width: 170px; }
.nodo .sub { font-size: 12px; color: var(--muted); margin-top: -4px; }
.filo { width: 3px; height: 34px; background: repeating-linear-gradient(to bottom, var(--linea) 0 6px, transparent 6px 12px); margin: 6px 0; border-radius: 2px; }
.filo.fatto { background: linear-gradient(to bottom, var(--cy), var(--vi)); }

/* ---------- Pannelli (modulo) ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(2, 5, 14, .72); backdrop-filter: blur(4px); animation: dissolvi .2s; }
.overlay.centro { align-items: center; }
@keyframes dissolvi { from { opacity: 0; } }
.foglio { width: 100%; max-width: 720px; max-height: 92dvh; overflow-y: auto; border-radius: 26px 26px 0 0; background: linear-gradient(180deg, #121a33, #0a1020); border: 1px solid var(--linea); padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); animation: sale .28s cubic-bezier(.2, .9, .3, 1); }
@keyframes sale { from { transform: translateY(40px); opacity: 0; } }
.foglio .testa { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.foglio .chiudi { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; background: var(--glass2); font-size: 18px; flex: none; }
.foglio h2 { font-size: 21px; }
.foglio .desc { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 4px; }
.azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.btn { min-height: 52px; padding: 12px 16px; border-radius: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; border: 1px solid var(--linea); background: var(--glass2); transition: transform .12s, filter .15s; }
.btn:active { transform: scale(.96); }
.btn.primario { background: linear-gradient(135deg, var(--cy), var(--vi)); color: #04101f; border: 0; box-shadow: 0 8px 26px -10px var(--cy); }
.btn.boss { background: linear-gradient(135deg, var(--pk), #fb923c); color: #1a0710; border: 0; box-shadow: 0 8px 26px -10px var(--pk); }
.btn.sec { background: var(--glass2); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.pieno { grid-column: 1 / -1; }
.argo { border-radius: 14px; background: var(--glass); border: 1px solid var(--linea); margin-bottom: 8px; overflow: hidden; }
.argo > button { width: 100%; text-align: left; padding: 14px; display: flex; align-items: center; gap: 10px; min-height: 52px; font-weight: 700; font-size: 14.5px; }
.argo > button .chk { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--linea); display: grid; place-items: center; font-size: 13px; flex: none; }
.argo.letto > button .chk { background: var(--li); border-color: var(--li); color: #0b1a02; }
.argo .dentro { padding: 0 14px 14px; font-size: 14px; line-height: 1.6; color: #cbd5ec; display: none; }
.argo.aperto .dentro { display: block; }
.argo .dentro .idea { background: rgba(251, 191, 36, .08); border: 1px solid rgba(251, 191, 36, .3); border-radius: 12px; padding: 10px 12px; margin: 10px 0; color: #fde7a6; }
.argo .dentro ul { margin: 8px 0 0; padding-left: 18px; }
.argo .dentro li { margin: 4px 0; }

/* ---------- Feed (flashcard a schermo intero) ---------- */
.feedwrap { height: 100%; display: flex; flex-direction: column; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 14px 10px; flex: none; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--linea); font-size: 13px; font-weight: 700; color: var(--muted); }
.chip.on { background: var(--glass2); color: var(--txt); border-color: var(--cy); box-shadow: 0 0 14px -6px var(--cy); }
.feed { flex: 1; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.feed::-webkit-scrollbar { display: none; }
.fcard { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.flip { flex: 1; min-height: 0; perspective: 1200px; position: relative; cursor: pointer; }
.flip .faccia { position: absolute; inset: 0; border-radius: 26px; padding: 22px 20px; display: flex; flex-direction: column; backface-visibility: hidden; transition: transform .55s cubic-bezier(.2, .8, .2, 1); overflow-y: auto; }
.flip .fronte { background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03)); border: 1px solid var(--linea); box-shadow: 0 20px 50px -30px var(--col); }
.flip .retro { transform: rotateY(180deg); background: linear-gradient(160deg, color-mix(in srgb, var(--col) 24%, #0b1226), #0b1226); border: 1px solid var(--col); }
.flip.girata .fronte { transform: rotateY(-180deg); }
.flip.girata .retro { transform: rotateY(0); }
.etichetta { display: inline-flex; align-self: flex-start; gap: 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--col); }
.testo-card { margin: auto 0; font-size: clamp(19px, 4.6vw, 26px); font-weight: 700; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
.testo-card.lungo { font-size: clamp(16px, 3.9vw, 20px); font-weight: 600; line-height: 1.5; }
.retro .testo-card { font-weight: 600; font-size: clamp(16px, 4vw, 21px); }
.tocca { margin-top: auto; align-self: center; font-size: 12px; color: var(--muted); animation: lampeggia 2s infinite; }
@keyframes lampeggia { 50% { opacity: .35; } }
.voti { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; margin: 14px 0 6px; }
.voti .btn { min-height: 52px; padding: 10px 8px; font-size: 15px; }
.retro .testo-card { margin: 10px 0 auto; }
.voti .si { background: rgba(163, 230, 53, .16); border-color: var(--li); color: #d9f99d; }
.voti .no { background: rgba(251, 113, 133, .14); border-color: var(--rd); color: #fecdd3; }
.voti.spento { visibility: hidden; }
.suggerimento { text-align: center; font-size: 12px; color: var(--muted); padding: 0 0 4px; }

/* ---------- Boss Fight ---------- */
.schermo { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; animation: dissolvi .25s; }
.schermo::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(600px 380px at 50% -10%, color-mix(in srgb, var(--col) 28%, transparent), transparent 70%); }
.btop { display: flex; align-items: center; gap: 12px; padding: 12px 14px; position: relative; }
.btop .esci { width: 40px; height: 40px; border-radius: 12px; background: var(--glass2); font-size: 18px; }
.btop .barra { flex: 1; }
.cuori { display: flex; gap: 3px; font-size: 22px; }
.cuori span { transition: transform .3s, opacity .3s, filter .3s; display: inline-block; }
.cuori span.perso { filter: grayscale(1); opacity: .3; transform: scale(.8); }
.cuori span.rompi { animation: rompi .6s; }
@keyframes rompi { 30% { transform: scale(1.7) rotate(-15deg); } 100% { transform: scale(.8); } }
.bcorpo { flex: 1; overflow-y: auto; padding: 4px 16px 16px; position: relative; display: flex; flex-direction: column; gap: 14px; }
.bossnome { text-align: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--col); font-weight: 800; }
.domanda { font-size: clamp(18px, 4.4vw, 24px); font-weight: 700; line-height: 1.4; padding: 18px; border-radius: 20px; }
.opz { display: grid; gap: 10px; }
.opz button { text-align: left; padding: 14px 16px; min-height: 58px; border-radius: 16px; background: var(--glass); border: 1.5px solid var(--linea); font-size: 15.5px; line-height: 1.35; display: flex; gap: 12px; align-items: center; transition: transform .12s, background .2s, border-color .2s; }
.opz button i { font-style: normal; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: rgba(255, 255, 255, .09); font-weight: 800; font-size: 13px; flex: none; }
.opz button:active { transform: scale(.98); }
.opz button.giusta { border-color: var(--li); background: rgba(163, 230, 53, .15); animation: ok .45s; }
.opz button.sbagliata { border-color: var(--rd); background: rgba(251, 113, 133, .15); animation: scuoti .45s; }
.opz button.spenta { opacity: .45; }
.opz.bloccato { pointer-events: none; }
@keyframes ok { 40% { transform: scale(1.03); } }
@keyframes scuoti { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.feedback { padding: 14px 16px; border-radius: 18px; animation: sale .25s; line-height: 1.5; font-size: 14.5px; }
.feedback.bene { background: rgba(163, 230, 53, .12); border: 1px solid rgba(163, 230, 53, .5); }
.feedback.male { background: rgba(251, 113, 133, .12); border: 1px solid rgba(251, 113, 133, .5); }
.feedback b { display: block; margin-bottom: 4px; font-size: 15.5px; }
.bpiede { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); position: relative; }
.fine { text-align: center; padding: 28px 10px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.fine .grande { font-size: 64px; animation: rimbalza .8s; }
@keyframes rimbalza { 0% { transform: scale(.2); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.fine h2 { font-size: 26px; }
.fine p { color: var(--muted); max-width: 420px; line-height: 1.5; }
.stelle-grandi { font-size: 38px; letter-spacing: 6px; }
.errlista { width: 100%; text-align: left; display: grid; gap: 10px; }
.errcard { padding: 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
.errcard h4 { margin: 0 0 6px; font-size: 14.5px; }
.errcard .gg { color: var(--li); font-weight: 700; margin-bottom: 4px; }
.errcard small { color: var(--muted); }

/* ---------- Errori / Profilo ---------- */
.riga-err { display: flex; gap: 10px; padding: 13px 14px; align-items: flex-start; border-radius: 14px; background: var(--glass); border: 1px solid var(--linea); margin-bottom: 8px; font-size: 14px; line-height: 1.45; }
.riga-err .pt { width: 10px; height: 10px; border-radius: 50%; background: var(--col); margin-top: 5px; flex: none; box-shadow: 0 0 10px var(--col); }
.riga-err small { color: var(--muted); display: block; margin-top: 2px; }
.griglia-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--linea); }
.stat b { display: block; font-size: 24px; }
.stat span { color: var(--muted); font-size: 12px; }

<script>
// File generato da tools/build-data.js: non modificarlo a mano.
const MODULI = [{"id":"atomo","n":1,"titolo":"L'atomo","icona":"⚛️","colore":"#38bdf8","descrizione":"Lezione 1 · Dall'idea di Democrito al modello nucleare: particelle subatomiche, numero atomico, isotopi e massa atomica.","argomenti":[{"titolo":"Dall'idea di atomo alla teoria di Dalton","riassunto":"Intorno al 400 a.C. Democrito ipotizzò che la materia non si possa dividere all'infinito: prima o poi si arriva a una particella indivisibile, l'«atomos» («che non si può tagliare»). L'idea fu ignorata per circa 2000 anni perché prevalse la teoria di Aristotele e Platone dei quattro elementi (terra, fuoco, aria, acqua). Nel 1785 Lavoisier enunciò la legge di conservazione della massa: la massa dei prodotti di una reazione è esattamente uguale a quella dei reagenti. Dalton formulò poi la teoria atomica: la materia è fatta di atomi indivisibili che non si creano né si distruggono; gli atomi di un elemento non si trasformano in quelli di un altro; gli atomi di uno stesso elemento hanno massa e proprietà identiche; i composti si formano dalla combinazione di un numero preciso di atomi diversi. Da qui la legge delle proporzioni multiple. La teoria (atomi come palle da biliardo) non spiega però perché gli atomi si combinino solo in certi rapporti né l'esistenza di particelle subatomiche cariche. Postulati di Dalton da ricordare (sono quelli che si usano nei quiz): gli atomi sono indivisibili e non si creano né si distruggono; gli atomi di un elemento sono identici fra loro e non si trasformano in atomi di altri elementi; i composti si formano dalla combinazione di numeri interi e precisi di atomi. Non è un postulato di Dalton che gli atomi siano formati da protoni, neutroni ed elettroni: queste particelle furono scoperte dopo (Thomson, Millikan, Rutherford). La legge di conservazione della massa («nulla si crea e nulla si distrugge, ma tutto si trasforma») fu enunciata da Lavoisier. Legge delle proporzioni multiple: se due elementi formano più composti, le masse di uno che si combinano con la stessa massa dell'altro stanno fra loro come numeri interi piccoli. Come si applica: si fissa la stessa massa dell'elemento comune (12 g di C) e si confrontano le masse dell'altro elemento: in CO 16 g di O, in CO₂ 32 g di O → 16 : 32 = 1 : 2.","spiegazione":"Pensa ai mattoncini delle costruzioni: puoi smontare e rimontare un modellino quante volte vuoi, ma i mattoncini sono sempre gli stessi e il loro numero non cambia. Una reazione chimica fa la stessa cosa con gli atomi: li separa e li ricombina, senza crearne o distruggerne. Per questo la massa totale non cambia.","esempi":["Mg + O₂ → MgO: la massa di MgO è uguale a massa(Mg) + massa(O₂) consumato, quindi la massa del solido aumenta senza contraddire Lavoisier.","CO e CO₂ con 12 g di C: 16 g e 32 g di O → rapporto 1 : 2 (proporzioni multiple).","Il legno bruciando diventa cenere, CO₂ e H₂O: sembra «sparire», ma la massa di legno + ossigeno è uguale a quella dei prodotti.","Il magnesio bruciando aumenta di massa perché si combina con l'ossigeno formando MgO.","Proporzioni multiple: in CO e CO₂ le masse di ossigeno che si combinano con la stessa massa di carbonio stanno nel rapporto 1 : 2."]},{"titolo":"La scoperta dell'elettrone","riassunto":"Stoney (1891) osservò che i composti possono essere decomposti dalla corrente elettrica e concluse che l'elettricità esiste in unità discrete associate agli atomi, che chiamò elettroni. Thomson studiò i raggi catodici: in un tubo di vetro a bassissima pressione, applicando circa 10 000 V tra due elettrodi, il catodo emette raggi che fanno brillare il vetro. Perrin (1895) dimostrò che sono particelle di carica negativa, perché un magnete li devia. Sottoponendoli insieme a un campo elettrico e a uno magnetico, Thomson ne calcolò la velocità e il rapporto carica/massa (e/m). Millikan, con l'esperimento delle goccioline d'olio, trovò che le cariche misurate avevano un fattore comune, 1,6·10⁻¹⁹ C: la carica dell'elettrone. Combinandola con il rapporto e/m si ricavò la massa dell'elettrone. Nel modello atomico di Thomson l'atomo è una nube di carica positiva in cui sono immerse le particelle negative. Formule: la carica di una gocciolina è Q = n·e con e = 1,602·10⁻¹⁹ C, e il numero di elettroni in eccesso è n = Q/e. Una gocciolina con 30 elettroni in eccesso ha Q = 30·1,602·10⁻¹⁹ = 4,81·10⁻¹⁸ C; con Q = 6,73·10⁻¹⁸ C si ha n = 6,73·10⁻¹⁸/1,602·10⁻¹⁹ = 42. Thomson misurò il rapporto carica/massa e/m = 1,76·10¹¹ C/kg; Millikan misurò e; dividendo m = e/(e/m) = 1,602·10⁻¹⁹/1,76·10¹¹ = 9,1·10⁻³¹ kg, la massa dell'elettrone. Un magnete devia il fascio di raggi catodici nel verso previsto per una carica negativa.","spiegazione":"Thomson ha misurato «quanto pesa l'elettrone per ogni unità di carica» (il rapporto e/m), Millikan ha misurato la carica da sola. È come conoscere il prezzo al chilo e il prezzo totale: con i due dati ricavi il peso. Il modello di Thomson è spesso chiamato «a panettone»: l'impasto è la carica positiva, l'uvetta sono gli elettroni.","esempi":["Gocciolina con 30 elettroni in eccesso: Q = 30·1,602·10⁻¹⁹ = 4,81·10⁻¹⁸ C.","Q = 6,73·10⁻¹⁸ C → n = 6,73·10⁻¹⁸/1,602·10⁻¹⁹ = 42 elettroni.","m(e) = e/(e/m) = 1,602·10⁻¹⁹ / 1,76·10¹¹ ≈ 9,1·10⁻³¹ kg.","Un magnete avvicinato al tubo devia il fascio nella direzione attesa per una carica negativa.","Tutte le cariche delle goccioline di Millikan sono multipli interi di 1,6·10⁻¹⁹ C.","L'elettrone è circa 1840 volte più leggero del protone."]},{"titolo":"Rutherford e il modello nucleare","riassunto":"Per capire se l'atomo fosse «vuoto», Rutherford bombardò una sottilissima lamina d'oro con particelle α (massa 4 u, carica +2) ad alta energia. Quasi tutte attraversavano la lamina, ma alcune venivano deviate: il risultato si spiega solo ammettendo che quasi tutta la massa dell'atomo sia concentrata in una particella piccolissima, il nucleo. Nel modello nucleare: il nucleo è minuscolo e denso (occupa circa 1/10 000 miliardesimo del volume dell'atomo), contiene praticamente tutta la massa ed è carico positivamente; gli elettroni sono dispersi nello spazio vuoto attorno al nucleo e ne bilanciano la carica. Per spiegare perché il berillio (4 protoni) abbia massa 9,01 u, Rutherford propose un'altra particella nucleare priva di carica e di massa circa 1 u: il neutrone. Il modello ha però dei limiti: non spiega gli spettri di emissione e di assorbimento, l'effetto fotoelettrico, né perché l'elettrone non cada sul nucleo. Il numero di neutroni si ricava dalla massa: N = A − Z; il berillio (Z = 4, massa 9,01 u) ha 9 − 4 = 5 neutroni. Le particelle α sono nuclei di elio (massa 4 u, carica +2). Dalle poche deviazioni (e da qualche rimbalzo all'indietro) Rutherford dedusse un nucleo molto piccolo (circa 10⁻¹⁵ m contro 10⁻¹⁰ m dell'atomo) e molto massiccio; se la massa fosse diffusa, come nel modello di Thomson, non ci sarebbero deviazioni forti.","spiegazione":"Immagina di sparare proiettili contro una nebbia in cui è nascosto qualche sassolino durissimo: quasi tutti passano dritti, ma i pochi che colpiscono un sassolino rimbalzano. Dal fatto che i rimbalzi sono rarissimi capisci che i sassolini (i nuclei) sono piccolissimi rispetto allo spazio vuoto che li circonda.","esempi":["Be: A ≈ 9, Z = 4 → N = 5; massa 4·1 + 5·1 ≈ 9 u.","Diametro del nucleo 10⁻¹⁵ m, dell'atomo 10⁻¹⁰ m: rapporto 10⁵.","Se il nucleo fosse una biglia al centro di uno stadio, gli elettroni occuperebbero le gradinate.","Be: 4 protoni + 5 neutroni ≈ 9 u; i 4 elettroni (0,00055 u ciascuno) non possono giustificare la massa mancante.","L'oro fu scelto perché è molto malleabile: se ne ottengono lamine sottilissime che non assorbono le particelle α."]},{"titolo":"Particelle subatomiche, Z, A e unità di massa atomica","riassunto":"Gli atomi sono formati da tre particelle subatomiche: il protone (carica +1, massa 1,67·10⁻²⁷ kg), il neutrone (carica nulla, massa 1,67·10⁻²⁷ kg) e l'elettrone (carica −1, circa 1840 volte più leggero). Protoni e neutroni (nucleoni) stanno nel nucleo, tenuti insieme dall'interazione nucleare forte, e sono a loro volta formati da quark. Il numero di protoni è il numero atomico Z, che rende un elemento chimicamente diverso da un altro; il numero di nucleoni (protoni + neutroni) è il numero di massa A. In un atomo neutro protoni ed elettroni sono in numero uguale. L'atomo ha dimensioni dell'ordine di 1 Å (10⁻¹⁰ m), protoni e neutroni di 10⁻¹⁵ m: il nucleo è 5 ordini di grandezza più piccolo dell'atomo. La massa degli atomi si misura in unità di massa atomica (u, o amu): 1 u = 1/12 della massa di un atomo di ¹²C = 1,66·10⁻²⁷ kg. Protone ≈ 1,007 u, neutrone ≈ 1,008 u, elettrone ≈ 0,00055 u. Per un atomo neutro: protoni = Z, elettroni = Z, neutroni N = A − Z, massa in u ≈ A (cioè ≈ protoni + neutroni, perché gli elettroni pesano circa 1/1840 di un protone). Il numero in alto a sinistra del simbolo (¹²C, ⁵²Cr) è il numero di massa A; per il ¹²C sono 6 protoni + 6 neutroni. Esempi: ²⁷Al (Z = 13) ha 14 neutroni; un atomo di gallio con Z = 31 e 39 neutroni ha A = 31 + 39 = 70. 1 u = 1,66·10⁻²⁷ kg, quindi un atomo di massa 12 u pesa 12·1,66·10⁻²⁷ = 1,99·10⁻²⁶ kg. Elettroni spaiati: si scrive la configurazione elettronica (1s² 2s² 2p⁶ …) e si riempiono gli orbitali di una stessa sottoshell uno alla volta con spin parallelo prima di appaiarli (regola di Hund); la sottoshell p ha 3 orbitali. Il fluoro (Z = 9, A = 19) ha 9 elettroni: 1s² 2s² 2p⁵; i 5 elettroni 2p riempiono i 3 orbitali p con 2 coppie e 1 elettrone spaiato. Quindi: 9 elettroni, 19 − 9 = 10 neutroni, 1 elettrone spaiato.","spiegazione":"Z è la «carta d'identità» dell'elemento: cambia Z e cambia l'elemento. A dice invece quanto «pesa» quel particolare atomo, perché conta tutte le particelle pesanti del nucleo. I neutroni si ricavano per differenza: N = A − Z.","esempi":["²⁷Al: Z = 13, N = 27 − 13 = 14.","Z = 31, N = 39: A = 70.","F (Z = 9, A = 19): 9 e⁻, 10 n, configurazione 1s² 2s² 2p⁵ → 1 elettrone spaiato.","Atomo con 20 p + 20 n: massa ≈ 40 u.","⁵²Cr con Z = 24: 24 protoni, 24 elettroni e 52 − 24 = 28 neutroni.","Un atomo con 20 protoni e 20 neutroni ha massa di circa 40 u.","Un atomo di ¹²C ha massa 12 u = 12 · 1,66·10⁻²⁷ kg ≈ 1,99·10⁻²⁶ kg."]},{"titolo":"Ioni, molecole e isotopi","riassunto":"Quando protoni ed elettroni non sono in numero uguale si ha uno ione: se prevalgono gli elettroni è un anione (negativo, attratto dall'anodo), se prevalgono i protoni è un catione (positivo, attratto dal catodo). Gli atomi possono legarsi tra loro formando molecole (O₂, H₂O). Atomi dello stesso elemento con diverso numero di massa A si chiamano isotopi: hanno lo stesso numero di protoni ma un diverso numero di neutroni. Avendo gli stessi protoni ed elettroni hanno essenzialmente le stesse proprietà chimiche e fisiche; fa eccezione l'idrogeno, per il quale la differenza di massa tra isotopi (prozio, deuterio, trizio) è paragonabile alla massa dell'atomo stesso. In natura la maggior parte degli elementi è una miscela di isotopi con abbondanze percentuali definite; la massa atomica è la media pesata delle masse degli isotopi. Le masse si misurano con lo spettrometro di massa, che separa gli ioni in base al rapporto massa/carica. Carica di uno ione = protoni − elettroni; elettroni = Z − carica. Al³⁺ (Z = 13): 13 − 3 = 10 e⁻; F⁻ (Z = 9): 9 p e 10 e⁻; Cl⁻ (Z = 17): 17 p e 18 e⁻; un atomo con 20 protoni e 18 elettroni ha carica +20 − 18 = 2+. Il nitrato è lo ione NO₃⁻. Isotopi dell'idrogeno: prozio (1 p, 0 n), deuterio (1 p, 1 n), trizio (1 p, 2 n). Per il carbonio-13 (Z = 6): 6 p e 13 − 6 = 7 n. Massa atomica media: M = Σ (xᵢ · mᵢ), dove xᵢ è l'abbondanza in frazione (percentuale/100) e mᵢ la massa dell'isotopo. Cloro: 0,75·35 + 0,25·37 = 35,5 u (non la media semplice 36). Gallio: 0,6011·68,93 + 0,3989·70,92 = 69,72 u. Con due isotopi di massa m₁ < m₂ e massa media M nota, l'abbondanza del più leggero è x = (m₂ − M)/(m₂ − m₁): per 56 u e 59 u con M = 57,50 si ha x = (59 − 57,50)/3 = 0,50, cioè 50%. Per il rame (M = 63,55; masse 62,94 e 64,93): x(⁶³Cu) = (64,93 − 63,55)/(64,93 − 62,94) = 0,69. La massa media sta sempre tra le masse dei due isotopi, più vicina a quello più abbondante.","spiegazione":"Gli isotopi sono come gemelli con peso diverso: stesso «carattere» chimico (stessi protoni ed elettroni), ma qualche neutrone in più o in meno. La massa atomica che leggi sulla tavola periodica è la media della «classe», pesata su quanti atomi di ciascun tipo esistono in natura; per questo non è un numero intero.","esempi":["Al³⁺: 13 p e 10 e⁻. F⁻: 9 p e 10 e⁻. Atomo con 20 p e 18 e⁻: ione 2+.","Cloro: 75% ³⁵Cl, 25% ³⁷Cl → M = 0,75·35 + 0,25·37 = 35,5 u.","Isotopi 56 u e 59 u, M = 57,50: x(leggero) = (59 − 57,50)/(59 − 56) = 0,50 → 50%.","Cu: M = 63,55 tra 62,94 e 64,93 → x(⁶³Cu) = 1,38/1,99 ≈ 0,69.","F⁻: 9 protoni e 10 elettroni. Li⁺: 3 protoni e 2 elettroni.","Idrogeno: prozio (1 p), deuterio (1 p + 1 n), trizio (1 p + 2 n).","Cloro: 75% ³⁵Cl e 25% ³⁷Cl → massa media ≈ 0,75·35 + 0,25·37 = 35,5 u.","Numero di massa (di un singolo isotopo) e massa atomica (media sperimentale) non sono la stessa cosa."]}]},{"id":"mole","n":2,"titolo":"La mole","icona":"⚖️","colore":"#a78bfa","descrizione":"Lezione 2 · Formule chimiche, mole e massa molare, bilanciamento delle reazioni, numeri di ossidazione e redox.","argomenti":[{"titolo":"Composti, molecole e formule chimiche","riassunto":"Un composto è una sostanza elettricamente neutra formata da due o più elementi diversi, i cui atomi sono presenti in un rapporto definito. I composti si dividono in organici e inorganici, e in molecolari e ionici. Una molecola è un gruppo discreto di atomi legati tra loro in una disposizione specifica; uno ione è un atomo o una molecola con carica positiva o negativa. La formula chimica rappresenta la composizione di un composto mediante i simboli chimici. La stessa molecola si può rappresentare in molti modi: formula molecolare (C₂H₆O), formula di struttura condensata (CH₃CH₂OH), formula di struttura, formula a linee, modelli a sfere e bastoncini o a spazio pieno. Nei composti ionici (Na₂CO₃) e nei solidi reticolari (SiO₂) la formula indica soltanto il rapporto tra gli atomi o gli ioni. Per contare gli atomi di una formula si moltiplica ogni indice per il numero di atomi che lo precede: il pedice indica quanti atomi dell'elemento che lo precede ci sono, e se manca vale 1. Le parentesi moltiplicano tutto ciò che contengono: Ca(OH)₂ ha 1 Ca, 2 O e 2 H, cioè 5 atomi. Il coefficiente davanti a una formula moltiplica tutti i suoi atomi: 3 H₂O ha 6 atomi di H e 3 di O, cioè 9 atomi. Il numero totale di atomi è la somma di tutti gli atomi della formula. La formula bruta indica il numero esatto di atomi della molecola: l'etanolo C₂H₅OH si scrive anche C₂H₆O, con 2 C, 6 H e 1 O, quindi 9 atomi in tutto. La mole serve a contare le particelle: 1 mol contiene Nₐ = 6,022·10²³ entità (atomi, molecole o unità formula). Per sapere quanti atomi di un elemento ci sono in n moli di un composto: atomi = n · (pedice dell'elemento) · Nₐ; per esempio 2 mol di H₂O₂ contengono 4 mol di H e 4 mol di O, cioè 4·Nₐ atomi di ciascuno, e 1 mol di acqua contiene 2·Nₐ atomi di idrogeno. Gli elementi possono essere formati da atomi singoli (i gas nobili He, Ne, Ar; i metalli e il carbonio) oppure da molecole biatomiche: H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂. Quindi 1 mol di Ar o di Fe contiene Nₐ atomi, mentre 1 mol di O₂ contiene Nₐ molecole e 2·Nₐ atomi; 1 mol di H₂ contiene 2 mol di atomi di H e, poiché ogni atomo di idrogeno ha 1 protone (Z = 1), anche 2 mol di protoni. Nei composti ionici (NaCl, CaO, Na₂CO₃) non esistono molecole: la formula indica l'unità formula, cioè il rapporto tra gli ioni; per questo 1 mol di NaCl contiene zero molecole, ma Nₐ ioni Na⁺ e Nₐ ioni Cl⁻, e 14 mol di CaO contengono 14·Nₐ ioni Ca²⁺ e 14·Nₐ ioni O²⁻. La formula di struttura mostra i legami: nel fluoro gassoso F₂ c'è un legame singolo (F–F), in O₂ uno doppio (O=O), in N₂ uno triplo (N≡N).","spiegazione":"La formula molecolare è come la lista degli ingredienti: dice quali atomi ci sono e quanti, ma non come sono collegati. La formula di struttura è invece la «ricetta montata»: mostra chi è legato a chi. C₂H₆O può essere sia etanolo sia un'altra sostanza: solo la struttura le distingue.","esempi":["1 mol di O₂: Nₐ molecole = 2·Nₐ atomi di O. 1 mol di Ar: Nₐ atomi.","0,5 mol di CO₂ contengono 0,5 · Nₐ = 3,01·10²³ molecole.","C₂H₅OH = C₂H₆O: 2 C + 6 H + 1 O = 9 atomi (il quinto H è sul carbonio, il sesto sull'ossigeno).","Ca(OH)₂: 1 Ca + 2 O + 2 H = 5 atomi.","3 H₂O: 3 · 3 = 9 atomi (6 H e 3 O).","Fe₂(SO₄)₃: 2 Fe + 3 S + 12 O = 17 atomi.","H₂O è un composto molecolare: molecole discrete con 2 H e 1 O.","Na₂CO₃ è un composto ionico: ioni Na⁺ e CO₃²⁻ nel rapporto 2 : 1.","Etanolo: formula molecolare C₂H₆O, formula condensata CH₃CH₂OH."]},{"titolo":"Massa atomica, mole e massa molare","riassunto":"La massa di un atomo si misura in unità di massa atomica (u) e tiene conto dell'abbondanza relativa degli isotopi: per il carbonio 12 u · 0,989 + 13 u · 0,011 = 12,011 u. La massa di una molecola è la somma delle masse dei suoi atomi (H₂O: 2 · 1,008 + 15,999 = 18,015 u). I chimici contano atomi, ioni e molecole con la mole: una mole contiene tante entità quanti sono gli atomi in 12 g di carbonio-12, cioè un numero di Avogadro Nₐ = 6,022·10²³ mol⁻¹. Numero di oggetti = moli · Nₐ. Quando si usano le moli bisogna sempre specificare di quali entità si parla (atomi, molecole, ioni). La massa molare M è la massa di una mole di particelle (g/mol): per un elemento coincide numericamente con la massa atomica, per un composto molecolare è la massa di una mole di molecole, per un composto ionico di una mole di unità formula. Il difetto di massa è la differenza tra la massa di un nucleo e la somma delle masse dei suoi nucleoni: corrisponde all'energia necessaria per separarli, secondo ΔE = Δm·c². Le formule da ricordare: il numero di Avogadro è Nₐ = 6,022·10²³ mol⁻¹, cioè il numero di particelle contenute in una mole. Con n = m / M si passa dai grammi alle moli, dove M è la massa molare in g/mol, uguale in valore alla massa molecolare (somma delle masse atomiche degli atomi della formula). Da n si ricava il numero di particelle con N = n · Nₐ, e viceversa m = n · M. In condizioni normali (0 °C, 1 atm) una mole di gas occupa 22,4 L. Elementi e composti: 1 mol di un elemento monoatomico (Ar, Fe, Al) contiene Nₐ atomi; 1 mol di un elemento biatomico (O₂, F₂, H₂) contiene Nₐ molecole e quindi 2·Nₐ atomi, e la sua massa molare è il doppio di quella atomica: M(O₂) = 32,00 g/mol, M(F₂) = 2 · 19,00 = 38,0 g/mol. In 1 mol di un composto ci sono tante moli di atomi di un elemento quanto vale il suo pedice: 1 mol di Li₂O contiene 2 mol di Li (2 · 6,94 ≈ 14 g di litio) e 1 mol di O; 1 mol di CO contiene 1 mol di O, cioè 16 g. Per trovare quanto composto contiene una certa massa di un elemento: si calcolano le moli dell'elemento (n = m / M), si dividono per il suo pedice nella formula (n composto = n elemento / pedice) e si moltiplica per la massa molare del composto. Esempi: 42 g di azoto (14,01 g/mol) sono 3 mol di N, quindi 3 mol di LiNO₃ (1 atomo di N per unità formula); 40 g di calcio (40,08 g/mol) sono circa 1 mol di Ca, quindi 1 mol di CaCO₃ = 100,09 g. Per l'acqua liquida 1 L pesa circa 1000 g (densità 1 g/mL), quindi n = 1000 / 18,015 ≈ 55,5 mol. Per formare 64 g di SO₂ (M = 64,06 g/mol) serve 1 mol di zolfo atomico (32,06 g). Massa atomica media: è la media pesata M̄ = Σ (abbondanza frazionaria × massa isotopica); per due isotopi di massa m₁ e m₂ con M̄ nota, l'abbondanza del primo è x = (M̄ − m₂) / (m₁ − m₂). Per le singole particelle: la massa di una molecola in grammi è M / Nₐ.","spiegazione":"La mole è la «dozzina» dei chimici, solo enormemente più grande. Il trucco è che il numero che leggi sulla tavola periodica vale due volte: in u è la massa di un atomo, in grammi è la massa di una mole di atomi. Così si passa dalla bilancia al numero di particelle con n = m / M.","esempi":["1 mol di Li₂O: 2 mol di Li = 13,9 g di litio.","42 g di N = 3,0 mol di N → 3,0 mol di LiNO₃.","40 g di Ca = 1 mol di Ca → 1 mol di CaCO₃ = 100 g.","1 L di acqua ≈ 1000 g → 1000 / 18,015 ≈ 55,5 mol.","18 g di H₂O: n = 18 / 18,015 ≈ 1,00 mol, quindi N ≈ 6,02·10²³ molecole.","2 mol di CO₂: m = n · M = 2 · 44,01 = 88,0 g.","M di Ba(OH)₂ = 137,33 + 2·15,999 + 2·1,01 = 171,35 g/mol.","1,667 mol di O₂ · 31,998 g/mol = 53,34 g.","45 g di Ag / 107,87 g/mol = 0,42 mol.","Il nucleo di ⁴He pesa meno di 2 protoni + 2 neutroni separati: la massa mancante è energia di legame."]},{"titolo":"Formula empirica, formula molecolare e composizione percentuale","riassunto":"La formula empirica mostra i numeri relativi (il rapporto minimo) degli atomi di ciascun elemento nel composto; la formula molecolare mostra il numero effettivo di atomi nella molecola. Formaldeide CH₂O, acido acetico C₂H₄O₂, acido lattico C₃H₆O₃ e glucosio C₆H₁₂O₆ hanno tutti la stessa formula empirica CH₂O. La composizione percentuale in massa di un elemento è la massa dell'elemento nel campione divisa per la massa totale, per 100. Per determinare la formula di una sostanza incognita: si ricava la composizione elementare con l'analisi chimica; si considera un campione di 100 g, così le percentuali diventano grammi; si convertono i grammi in moli con le masse molari; si dividono tutti i valori per il più piccolo fino a ottenere numeri interi (formula empirica); conoscendo la massa molare si risale alla formula molecolare. La formula bruta è un altro nome della formula molecolare: indica il numero esatto di atomi di ciascun elemento nella molecola e si ottiene sommando gli atomi della formula di struttura: CH₃–CH(OH)–CH₃ (2-propanolo) ha 3 C, 8 H e 1 O, quindi C₃H₈O. Composizione percentuale: % elemento = (numero di atomi · massa atomica) / massa molare del composto · 100; per esempio %K in KCl = 39,10 / 74,55 · 100 = 52,4%. Formula empirica: se dopo aver diviso per il valore più piccolo i rapporti non sono interi, si moltiplica tutto per il numero che li rende interi: 1,5 → ×2 (Al₂O₃: 52,9% Al e 47,1% O danno 1,96 mol di Al e 2,94 mol di O, rapporto 1 : 1,5 = 2 : 3); 1,33 → ×3; 1,25 → ×4; 1,67 → ×3. Dalla formula empirica alla molecolare: k = M(molecolare) / M(empirica), poi si moltiplicano tutti i pedici per k (C₂H₅ con M = 58 g/mol: M(C₂H₅) = 29,06, k = 2 → C₄H₁₀). Dalla molecolare all'empirica si dividono i pedici per il loro massimo comun divisore (C₆H₁₂O₆ → CH₂O).","spiegazione":"La formula empirica è una frazione ridotta ai minimi termini: 6/12/6 diventa 1/2/1. Per risalire alla formula vera serve un'informazione in più, la massa molare: se la molecola «pesa» sei volte l'unità CH₂O, basta moltiplicare tutti i pedici per sei.","esempi":["KCl: %K = 39,10 / 74,55 · 100 = 52,4%.","52,9% Al e 47,1% O → 1,96 mol Al e 2,94 mol O → 1 : 1,5 → ×2 → Al₂O₃.","CH₃CH(OH)CH₃ → C₃H₈O.","40% C, 6,7% H, 53,3% O → in 100 g: 3,33 mol C, 6,6 mol H, 3,33 mol O → diviso 3,33: CH₂O.","CH₂O pesa 30 g/mol; se M = 180 g/mol → 180/30 = 6 → C₆H₁₂O₆.","% di H in H₂O = 2,016 / 18,015 · 100 = 11,2%."]},{"titolo":"Equazioni chimiche e reazioni non redox","riassunto":"Un'equazione chimica indica i reagenti («reagisce con») e i prodotti («per dare»). Per rispettare la conservazione della massa si usano i coefficienti stechiometrici davanti alle formule: ogni elemento deve avere lo stesso numero di atomi tra reagenti e prodotti; anche la carica deve essere bilanciata. L'equazione si legge in moli: 1 mole di Mg reagisce con 2 moli di HCl per dare 1 mole di MgCl₂ e 1 mole di H₂. Nelle reazioni non redox il numero di ossidazione degli atomi non cambia. Ne fanno parte le reazioni acido-base (salificazioni), in cui una sostanza a carattere acido (idracidi, ossoacidi, ossidi acidi) reagisce con una a carattere basico (idrossidi, ossidi basici, basi protoniche) per dare un sale, e le reazioni di scambio (sale + acido, sale + base, sale + sale). Per le reazioni in soluzione si possono scrivere l'equazione molecolare, l'equazione ionica completa e l'equazione ionica netta, che riporta solo le specie che reagiscono davvero. Come si bilancia: scrivi prima le formule corrette (e traduci bene i nomi: nitrato di bario = Ba(NO₃)₂, carbonato di calcio = CaCO₃); poi parti da un elemento che compare in un solo composto per lato e lascia per ultimi gli elementi puri (O₂, H₂); i gruppi poliatomici che restano uguali (SO₄, NO₃, OH) si bilanciano come un blocco unico. Se serve un coefficiente frazionario si moltiplica tutta l'equazione per il denominatore (½ O₂ → si moltiplica per 2). Esempi: SO₂ + O₃ → SO₃ diventa 3 SO₂ + O₃ → 3 SO₃; C₆H₆ + O₂ → CO₂ + H₂O diventa 2 C₆H₆ + 15 O₂ → 12 CO₂ + 6 H₂O; 3 CuSO₄ + 2 Fe(NO₃)₃ → Fe₂(SO₄)₃ + 3 Cu(NO₃)₂; Ba(NO₃)₂ + CaCO₃ → Ca(NO₃)₂ + BaCO₃ è già bilanciata (coefficienti 1, 1, 1, 1); 2 H₃PO₄ + 3 Na₂O → 2 Na₃PO₄ + 3 H₂O. In una reazione acido-base: acido + base (o ossido basico) → sale + acqua: HNO₂ + KOH → KNO₂ + H₂O; 2 HNO₃ + Zn(OH)₂ → Zn(NO₃)₂ + 2 H₂O. I coefficienti si leggono come rapporti in moli: in 2 Mg + O₂ → 2 MgO, 1 mol di Mg reagisce con 0,5 mol di O₂ e dà 1 mol di MgO; in H₂ + F₂ → 2 HF servono 0,5 mol di F₂ per ottenere 1 mol di HF; in 2 H₂ + O₂ → 2 H₂O da 1 mol di H₂ si ottiene 1 mol di H₂O con 0,5 mol di O₂. Reagente limitante: è quello che finisce per primo; si trova dividendo le moli di ciascun reagente per il suo coefficiente: il valore minore indica il limitante. Con 1 mol di Mg e 1 mol di O₂: Mg → 1/2 = 0,5; O₂ → 1/1 = 1; il limitante è Mg, si formano 1 mol di MgO e avanzano 0,5 mol di O₂.","spiegazione":"Bilanciare significa mettere in pari gli atomi sui due lati della freccia, cambiando solo «quante porzioni» di ogni sostanza usi (i coefficienti), mai la sostanza stessa (i pedici). Nell'equazione ionica netta si cancellano gli «ioni spettatori», quelli che compaiono identici a sinistra e a destra.","esempi":["3 SO₂ + O₃ → 3 SO₃.","2 C₆H₆ + 15 O₂ → 12 CO₂ + 6 H₂O.","2 Mg + O₂ → 2 MgO con 1 mol + 1 mol: Mg/2 = 0,5 e O₂/1 = 1 → limitante Mg, 1 mol di MgO.","N₂ + 3 H₂ → 2 NH₃.","H₂SO₄ + Ca(OH)₂ → CaSO₄ + 2 H₂O (acido-base).","Na₂CO₃ + 2 HCl → 2 NaCl + H₂CO₃ (scambio sale + acido).","HNO₃ + NaOH → NaNO₃ + H₂O; ionica netta: H⁺ + OH⁻ → H₂O.","C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O: 204,09 g di reagenti e 204,09 g di prodotti."]},{"titolo":"Numeri di ossidazione","riassunto":"Il numero (o stato) di ossidazione di un atomo è il numero di elettroni virtualmente ceduti (valore positivo) o acquistati (valore negativo) dall'elemento quando si forma il composto. L'ossidazione comporta un aumento del numero di ossidazione, la riduzione una diminuzione. Regole: un elemento non combinato ha numero di ossidazione zero (Xe, Cl₂, S₈); in un composto neutro la somma dei numeri di ossidazione è zero; in uno ione è uguale alla carica dello ione; all'elemento più elettronegativo si assegna il valore negativo. Alcuni elementi hanno quasi sempre lo stesso valore: metalli del gruppo 1 +1, gruppo 2 +2, fluoro −1, idrogeno +1, ossigeno −2. Eccezioni: l'idrogeno vale −1 negli idruri metallici (NaH); l'ossigeno vale −1 nei perossidi (H₂O₂) e +2 in OF₂, perché il fluoro è più elettronegativo; il cloro non vale −1 nei composti con fluoro o ossigeno. Valori che conviene ricordare: metalli del gruppo 1 sempre +1, del gruppo 2 sempre +2, Al +3, Zn +2, Ag +1, F sempre −1; l'ossigeno −2 (tranne perossidi −1 e OF₂ +2), l'idrogeno +1 (−1 negli idruri). Gli altri elementi si ricavano imponendo la somma: nei composti binari con un metallo il non metallo prende il valore che compensa la carica (Ag₂S: 2 Ag = +2, quindi S = −2). Per gli ossiacidi e i loro anioni l'elemento centrale si calcola da ossigeno e idrogeno: H₂SO₄ → 2(+1) + S + 4(−2) = 0 → S = +6; SO₃ → +6; SO₂ → +4; SO₄²⁻ → +6. Il cloro: ClO⁻ +1, ClO₂⁻ +3, ClO₃⁻ +5, ClO₄⁻ +7 (ipoclorito, clorito, clorato, perclorato). Ordine per numero di ossidazione dell'ossigeno: CO₂ e Na₂O −2, H₂O₂ −1, O₂ 0, F₂O +2. Chi si ossida cede elettroni ed è il riducente; chi si riduce acquista elettroni ed è l'ossidante: in Zn + Cu²⁺ → Zn²⁺ + Cu lo zinco si ossida (0 → +2) ed è il riducente, il rame si riduce (+2 → 0) ed è l'ossidante.","spiegazione":"Il numero di ossidazione è una contabilità: si fa finta che in ogni legame gli elettroni vadano tutti all'atomo più elettronegativo e si conta chi è «in credito» e chi «in debito». Si procede come un'equazione: si mettono i valori noti e si ricava l'incognita imponendo che la somma dia zero (o la carica dello ione).","esempi":["H₂SO₄: 2(+1) + S + 4(−2) = 0 → S = +6.","NaClO₂: +1 + Cl + 2(−2) = 0 → Cl = +3.","Ag₂S: 2(+1) + S = 0 → S = −2.","CrCl₃: n + 3·(−1) = 0 → Cr = +3.","Cr₂O₇²⁻: 2n + 7·(−2) = −2 → Cr = +6.","CuSO₄: è Cu²⁺ + SO₄²⁻ → Cu = +2.","H₂O₂: ogni H vale +1, quindi ogni O vale −1."]},{"titolo":"Bilanciamento delle redox e calcoli stechiometrici","riassunto":"Le reazioni redox comportano un trasferimento di elettroni da una specie che si ossida a una che si riduce: cambia il numero di ossidazione di alcuni atomi. Metodo del numero di ossidazione: si calcola la variazione del numero di ossidazione dell'elemento che si ossida e di quello che si riduce (moltiplicata per il numero di atomi presenti nella formula); si scelgono i coefficienti in modo che le due variazioni siano uguali; si ottiene la neutralità elettrica (ambiente acido o basico) e infine si applica la conservazione della massa aggiungendo H₂O. Metodo delle semireazioni: si scrivono separatamente la semireazione di riduzione (ossidante + x e⁻ → forma ridotta) e quella di ossidazione (riducente → forma ossidata + y e⁻), si bilanciano cariche e masse con H⁺ (o OH⁻) e H₂O e si moltiplicano in modo che gli elettroni ceduti siano uguali a quelli acquistati. Con l'equazione bilanciata i coefficienti forniscono i rapporti in moli per i calcoli: grammi → moli → rapporto molare → grammi. Riducente = specie che si ossida e cede elettroni; ossidante = specie che si riduce e acquista elettroni. Elettroni scambiati: variazione del numero di ossidazione × numero di atomi interessati: MnO₄⁻ → Mn²⁺ acquista 5 e⁻ (+7 → +2); Cr₂O₇²⁻ → 2 Cr³⁺ acquista 6 e⁻ (2 · 3); ClO₃⁻ → Cl⁻ acquista 6 e⁻ (+5 → −1); NO₃⁻ → NO acquista 3 e⁻ (+5 → +2); SO₃²⁻ → SO₄²⁻ cede 2 e⁻ (+4 → +6). Calcoli con reagente limitante: si trasformano i grammi in moli, si dividono per i coefficienti e il valore più piccolo indica il reagente limitante; la quantità di prodotto si calcola da questo: n(prodotto) = n(limitante) · coeff. prodotto / coeff. limitante. Resa teorica = massa di prodotto calcolata con la stechiometria; resa percentuale = (massa ottenuta / resa teorica) · 100. Esempi: 4 Na + O₂ → 2 Na₂O: 46 g di Na sono 2 mol, servono 0,5 mol di O₂; H₂ + O₂ → H₂O₂: 34 g di H₂O₂ sono 1 mol, quindi occorre 1 mol di O₂ = 32 g; 3 Fe(OH)₂ + K₂CrO₄ + 4 H₂O → 3 Fe(OH)₃ + KCr(OH)₄ + KOH (reagenti con coefficienti 3, 1, 4).","spiegazione":"In una redox gli elettroni persi da qualcuno devono essere tutti presi da qualcun altro: è un passaggio di mano, niente va perso. Se un atomo ne cede 2 e un altro ne prende 5, servono 5 del primo e 2 del secondo per fare 10 e 10. Il resto del bilanciamento è una normale messa in pari degli atomi.","esempi":["MnO₄⁻ → Mn²⁺: +7 → +2, acquista 5 e⁻.","46 g di Na = 2 mol → 0,5 mol di O₂ (4 Na + O₂ → 2 Na₂O).","Resa % = massa ottenuta / resa teorica · 100.","BaSO₄ + 4 C → BaS + 4 CO: S passa da +6 a −2 (−8), C da 0 a +2 (+2) → servono 4 C.","Zn + 2 HCl → ZnCl₂ + H₂: Zn si ossida (0 → +2), H si riduce (+1 → 0).","Cr₂O₇²⁻ + 6 e⁻ + 14 H⁺ → 2 Cr³⁺ + 7 H₂O.","5 SnSO₄ + 2 KMnO₄ + 8 H₂SO₄ → 5 Sn(SO₄)₂ + 2 MnSO₄ + K₂SO₄ + 8 H₂O."]},{"titolo":"Nomenclatura dei composti inorganici","riassunto":"La nomenclatura inorganica ha due sistemi. Quello tradizionale usa i suffissi -oso (numero di ossidazione minore) e -ico (maggiore) e, per gli elementi con più di due valenze, i prefissi ipo- (il più basso) e per- (il più alto): per il cloro +1 ipocloroso, +3 cloroso, +5 clorico, +7 perclorico. Il sistema IUPAC usa prefissi numerici (mono-, di-, tri-, tetra-, penta-, esa-, epta-) oppure il numero di ossidazione in cifre romane tra parentesi (nomenclatura di Stock: ossido di ferro(III)). Le classi: gli OSSIDI sono metallo + ossigeno (Na₂O ossido di sodio; FeO ossido ferroso; Fe₂O₃ ossido ferrico) e sono basici; le ANIDRIDI sono non metallo + ossigeno (CO₂ anidride carbonica; SO₂ solforosa; SO₃ solforica; N₂O₃ nitrosa; N₂O₅ nitrica) e sono acide. Un ossido basico + H₂O dà un IDROSSIDO (NaOH, Ca(OH)₂, Fe(OH)₃); un'anidride + H₂O dà un OSSIACIDO (SO₃ + H₂O → H₂SO₄; N₂O₅ + H₂O → 2 HNO₃). Gli IDRACIDI sono H + non metallo, senza ossigeno: HF fluoridrico, HCl cloridrico, HBr bromidrico, HI iodidrico, H₂S solfidrico. Un SALE nasce da acido + base (HNO₃ + NaOH → NaNO₃ + H₂O): i sali degli idracidi finiscono in -uro (NaCl cloruro di sodio), quelli degli ossiacidi in -ito (da -oso) e -ato (da -ico): NaClO ipoclorito, NaClO₂ clorito, NaClO₃ clorato, NaClO₄ perclorato. Nei SALI ACIDI resta almeno un idrogeno acido: NaHCO₃ idrogenocarbonato (bicarbonato) di sodio, NaHSO₄ idrogenosolfato, KHS idrogenosolfuro (solfuro acido) di potassio, Na₂HPO₄ idrogenofosfato (fosfato monoacido) di sodio. Gli IDRURI sono metallo + H con H = −1 (NaH, CaH₂); i PEROSSIDI contengono il gruppo O₂²⁻ con O = −1 (H₂O₂ perossido di idrogeno, Na₂O₂, BaO₂). Ioni da ricordare: NO₃⁻ nitrato, NO₂⁻ nitrito, SO₄²⁻ solfato, SO₃²⁻ solfito, CO₃²⁻ carbonato, PO₄³⁻ fosfato, OH⁻ idrossido, NH₄⁺ ammonio, MnO₄⁻ permanganato, CrO₄²⁻ cromato, Cr₂O₇²⁻ dicromato. Metalli con due valenze: Fe²⁺ ferroso e Fe³⁺ ferrico; Cu⁺ rameoso e Cu²⁺ rameico. Come ricavare la formula di un acido: ossido acido + acqua; per l'acido bromico (Br +5): Br₂O₅ + H₂O → H₂Br₂O₆ → HBrO₃ (si dimezza). Dal numero di ossidazione di X in un ossiacido HₐXO_b vale 2b − a (HIO₄: 8 − 1 = +7, il massimo: acido periodico). Alogeni: ipo-…-oso (+1), -oso (+3), -ico (+5), per-…-ico (+7): HBrO ipobromoso, HBrO₃ bromico, HIO₄ periodico. Solo i metalli formano idrossidi: un ossido di non metallo + acqua dà un ossiacido, mai un idrossido. Un SALE ACIDO è un sale in cui gli idrogeni acidi non sono stati completamente sostituiti (KHS, NaHSO₄, Na₂HPO₄, NaHCO₃). Elementi con un solo numero di ossidazione (nomenclatura senza -oso/-ico): Ag⁺, Zn²⁺, Cd²⁺, Al³⁺ e i metalli dei gruppi 1 e 2: Zn(OH)₂ idrossido di zinco, Zn(NO₃)₂ nitrato di zinco. Reazioni: acido + idrossido → sale + acqua: HNO₂ + KOH → KNO₂ + H₂O; 2 Fe(OH)₃ + 3 H₂SO₄ → Fe₂(SO₄)₃ + 6 H₂O; HClO₄ + NaOH → NaClO₄ + H₂O (perclorato di sodio). Altri nomi: KMnO₄ permanganato di potassio; MnO₄²⁻ manganato; PO₄³⁻ fosfato e PO₃³⁻ fosfito; H₃PO₄ acido fosforico; HPO₄²⁻ idrogenofosfato (fosfato monoacido). Gli idruri e i perossidi: gli idruri sono basi fortissime e forti riducenti (H = −1); nei perossidi l'ossigeno vale −1 (BaO₂: Ba = +2, quindi O = −1).","spiegazione":"Il nome dice tre cose: che famiglia è (ossido, acido, sale…), quale elemento c'è e con quale numero di ossidazione. Per scrivere la formula si parte dalle cariche e le si «incrocia» (alluminio 3+ e solfato 2− → Al₂(SO₄)₃). Per i nomi tradizionali impara la scala dell'acido: -oso < -ico, e ipo- e per- agli estremi; poi cambia il suffisso nei sali: -oso → -ito, -ico → -ato.","esempi":["HNO₃ + Zn(OH)₂ → Zn(NO₃)₂ + 2 H₂O.","Br₂O₅ + H₂O → 2 HBrO₃ (acido bromico).","HClO₄ + NaOH → NaClO₄ + H₂O.","Fe₂O₃ → ossido ferrico (ossido di ferro(III)); FeO → ossido ferroso (ossido di ferro(II)).","SO₃ + H₂O → H₂SO₄ (acido solforico); SO₂ + H₂O → H₂SO₃ (acido solforoso).","Cloro: HClO ipocloroso (+1), HClO₂ cloroso (+3), HClO₃ clorico (+5), HClO₄ perclorico (+7); i sali sono ipoclorito, clorito, clorato, perclorato.","H₂CO₃ + Mg(OH)₂ → MgCO₃ + 2 H₂O (carbonato di magnesio); NaHCO₃ è il sale acido, il bicarbonato di sodio.","NaH idruro di sodio (H = −1) ≠ HCl idracido (H = +1); H₂O₂ perossido (O = −1) ≠ H₂O."]}]},{"id":"orbitali","n":3,"titolo":"Orbitali atomici","icona":"🌀","colore":"#f472b6","descrizione":"Lezione 3 · Luce e quanti, modello di Bohr, meccanica quantistica, numeri quantici e configurazione elettronica.","argomenti":[{"titolo":"La luce: onde elettromagnetiche e quanti","riassunto":"La luce è una radiazione elettromagnetica, formata da un campo elettrico e uno magnetico che oscillano perpendicolarmente. Tutte le onde elettromagnetiche viaggiano nel vuoto alla stessa velocità, c = 3,00·10⁸ m/s. L'ampiezza è l'altezza dell'onda e misura l'intensità (luminosità); la lunghezza d'onda λ è la distanza tra due creste successive; la frequenza ν è il numero di onde che passano in un punto nell'unità di tempo (hertz, 1 Hz = 1 s⁻¹). Vale c = λ·ν. Il colore dipende dalla lunghezza d'onda; la luce visibile è solo una piccola parte dello spettro elettromagnetico: le onde radio hanno l'energia più bassa, i raggi gamma la più alta (radiazioni ionizzanti). Un corpo nero assorbe ed emette a tutte le lunghezze d'onda: la teoria classica prevedeva un'intensità infinita a piccole λ (catastrofe ultravioletta). Planck risolse il problema quantizzando l'energia: la luce può scambiare solo energie multiple di E = hν = hc/λ, con h = 6,626·10⁻³⁴ J·s. Einstein spiegò l'effetto fotoelettrico ammettendo che la luce arrivi in pacchetti, i fotoni: esiste una frequenza di soglia sotto la quale non vengono emessi elettroni, qualunque sia l'intensità. L'energia in eccesso diventa energia cinetica dell'elettrone: Ecin = hν − φ. Valori da usare: c = 2,998·10⁸ m/s (≈ 3,00·10⁸), h = 6,626·10⁻³⁴ J·s; 1 nm = 10⁻⁹ m, quindi 500 nm = 5,00·10⁻⁷ m (i nanometri vanno sempre convertiti in metri prima di calcolare). Formule: ν = c / λ, E = h·ν = h·c / λ: a lunghezza d'onda più corta corrispondono frequenza ed energia più alte. Ordine dello spettro a energia crescente: onde radio, microonde, infrarosso, luce visibile, ultravioletto, raggi X, raggi gamma. Nell'effetto fotoelettrico la costante φ si chiama energia di estrazione (o di legame) dell'elettrone nel metallo: se hν < φ non viene emesso alcun elettrone, anche con luce molto intensa; se hν > φ l'elettrone parte con energia cinetica Ecin = hν − φ.","spiegazione":"Pensa alla luce come a una pioggia di palline (i fotoni). Il colore decide quanto è «pesante» ogni pallina, l'intensità quante ne arrivano. Per staccare un elettrone serve una pallina abbastanza pesante: mille palline leggere (luce rossa intensa) non ci riescono, una sola pesante (luce blu) sì.","esempi":["λ = 440 nm = 4,40·10⁻⁷ m → ν = 2,998·10⁸ / 4,40·10⁻⁷ = 6,8·10¹⁴ Hz.","Fotone da 8,0·10⁻¹⁹ J su un metallo con φ = 3,0·10⁻¹⁹ J → Ecin = 5,0·10⁻¹⁹ J.","Luce con λ = 500 nm: ν = c/λ = 6,0·10¹⁴ Hz; E = hν ≈ 4,0·10⁻¹⁹ J per fotone.","Lunghezza d'onda corta = frequenza alta = energia alta (raggi X, gamma).","Fotone da 5,0·10⁻¹⁹ J su un metallo con φ = 3,0·10⁻¹⁹ J → elettrone con 2,0·10⁻¹⁹ J di energia cinetica."]},{"titolo":"Spettri atomici e modello di Bohr","riassunto":"Quando atomi o molecole assorbono energia, spesso la riemettono sotto forma di luce (fuochi d'artificio, luci al neon). Facendo passare questa luce attraverso un prisma si ottiene uno spettro di emissione non continuo, a righe, caratteristico di ogni elemento: può essere usato per riconoscerlo (saggi alla fiamma). Bohr spiegò gli spettri proponendo che gli elettroni possano avere solo valori ben precisi di energia (quantizzati): viaggiano su orbite a distanza fissa dal nucleo, dette stati stazionari. Un elettrone emette radiazione quando «salta» da un'orbita a energia maggiore a una a energia minore, e assorbe un fotone quando compie il salto opposto; in entrambi i casi l'energia del fotone è uguale alla differenza tra i due livelli, E₂ − E₁ = hν. Per questo gli spettri di assorbimento e di emissione sono formati da righe nette. Per l'idrogeno le righe visibili cadono a 656,3, 486,1, 434,0 e 410,1 nm. Energia dei livelli: per l'idrogeno Eₙ = −2,18·10⁻¹⁸ J / n²; per gli ioni con un solo elettrone (He⁺ con Z = 2, Li²⁺ con Z = 3) Eₙ = −2,18·10⁻¹⁸ J · Z² / n². L'energia è negativa perché l'elettrone è legato (E = 0 per n = ∞, elettrone libero): il livello più basso è n = 1 (stato fondamentale). In una transizione da n_i a n_f l'energia scambiata è |ΔE| = 2,18·10⁻¹⁸ J · |1/n_f² − 1/n_i²|: se n diminuisce (n_i > n_f) l'atomo emette un fotone, se n aumenta lo assorbe. La lunghezza d'onda del fotone si ricava da λ = h·c / |ΔE|. Serie dell'idrogeno: transizioni verso n = 1 (serie di Lyman, ultravioletto, es. 4 → 1: 97,2 nm), verso n = 2 (serie di Balmer, righe visibili: 3 → 2 a 656 nm), verso n = 3 (serie di Paschen, infrarosso). L'energia di ionizzazione dell'idrogeno è l'energia per portare l'elettrone da n = 1 a n = ∞: 2,18·10⁻¹⁸ J.","spiegazione":"L'elettrone di Bohr è come una persona su una scala: può stare su un gradino o su un altro, mai a metà. Scendendo di un gradino libera un pacchetto di energia (un fotone) esattamente pari al dislivello. Poiché i gradini sono fissi, anche i colori emessi sono sempre gli stessi: ecco le righe.","esempi":["n = 2: E₂ = −2,18·10⁻¹⁸ / 4 = −5,45·10⁻¹⁹ J.","4 → 1: ΔE = 2,18·10⁻¹⁸ · (1 − 1/16) = 2,04·10⁻¹⁸ J → λ = hc/ΔE = 97,2 nm (ultravioletto).","Saggi alla fiamma: bario, calcio, litio, potassio e rame danno colori diversi.","Idrogeno, salto n = 3 → n = 2: riga rossa a 656,3 nm.","Assorbimento: l'elettrone sale di livello assorbendo un fotone della stessa energia."]},{"titolo":"Dualismo onda-particella, Heisenberg e Schrödinger","riassunto":"Le onde, quando incontrano una fenditura di dimensioni simili alla loro lunghezza d'onda, la aggirano (diffrazione) e si sovrappongono dando interferenza: costruttiva se sono in fase, distruttiva se sono in opposizione di fase. Le particelle, in senso classico, non diffrangono. De Broglie (1924) propose che anche le particelle abbiano carattere ondulatorio, con λ = h / (m·v): la lunghezza d'onda è inversamente proporzionale alla quantità di moto. Per l'elettrone, che è piccolissimo, questo carattere è rilevante: un fascio di elettroni inviato su due fenditure produce una figura di interferenza. Il principio di indeterminazione di Heisenberg afferma che più precisamente si conosce la posizione di una particella piccola come l'elettrone, meno si conosce la sua velocità, e viceversa. Non si può quindi prevedere la traiettoria: si può solo descrivere la probabilità di trovare l'elettrone in una certa regione. L'equazione di Schrödinger descrive l'elettrone con una funzione d'onda ψ, il cui quadrato ψ² misura la densità di probabilità di trovarlo in un punto. I nodi sono i punti in cui la probabilità si annulla. L'atomo di idrogeno è l'unico per cui l'equazione si risolve esattamente. Per usare λ = h / (m·v) servono la massa in kg e la velocità in m/s: massa dell'elettrone 9,109·10⁻³¹ kg, del protone 1,673·10⁻²⁷ kg, del neutrone 1,675·10⁻²⁷ kg; h = 6,626·10⁻³⁴ J·s. Più la massa è grande, più la lunghezza d'onda è piccola: per un oggetto macroscopico (una palla) λ è inconcepibilmente piccola e non si osserva, per un elettrone o un neutrone sì. La formula si ricava dalla quantità di moto p = m·v: λ = h / p. Il principio di Heisenberg si scrive Δx · m·Δv ≥ h / 4π.","spiegazione":"Non possiamo «fotografare» un elettrone lungo un'orbita: osservarlo ne cambia il comportamento. Al posto di una traiettoria abbiamo una mappa di probabilità, come una mappa meteo che non dice dove cadrà la singola goccia ma dove è più probabile che piova. Quella mappa è l'orbitale.","esempi":["Neutrone (1,675·10⁻²⁷ kg) a 5,0·10⁵ m/s: λ = 6,626·10⁻³⁴ / (1,675·10⁻²⁷ · 5,0·10⁵) = 7,9·10⁻¹³ m.","Elettrone a 1,0·10⁶ m/s: λ = h/(mv) ≈ 7,3·10⁻¹⁰ m, paragonabile alle dimensioni di un atomo.","Con le due fenditure gli elettroni non formano due macchie ma frange di interferenza.","Per un orbitale s la densità di probabilità ψ² è massima sul nucleo e diminuisce allontanandosi."]},{"titolo":"Numeri quantici e forma degli orbitali","riassunto":"Le soluzioni dell'equazione di Schrödinger sono tridimensionali e caratterizzate da tre numeri quantici; le funzioni d'onda degli elettroni negli atomi si chiamano orbitali atomici. Un orbitale è la regione di spazio fuori dalla quale la probabilità di trovare l'elettrone è trascurabile. Il numero quantico principale n (intero ≥ 1) determina l'energia e la dimensione: più n è grande, maggiori sono energia e dimensioni; le energie sono negative (E = 0 quando l'elettrone sfugge all'atomo) e per l'idrogeno Eₙ = −2,18·10⁻¹⁸ J · (1/n²). Il numero quantico del momento angolare l (da 0 a n−1) determina la forma: l = 0 orbitale s (sferico), l = 1 orbitali p (due lobi), l = 2 orbitali d (per lo più quattro lobi), l = 3 orbitali f (per lo più otto lobi). Il numero quantico magnetico ml (da −l a +l) determina l'orientazione: c'è 1 orbitale s, ci sono 3 orbitali p (px, py, pz), 5 orbitali d, 7 orbitali f. Gli esperimenti di Stern e Gerlach mostrarono che l'elettrone possiede anche uno spin, descritto dal numero quantico ms = +½ o −½. Conteggi da ricordare: un sottolivello con numero quantico l contiene 2l + 1 orbitali (s 1, p 3, d 5, f 7) e al massimo 2(2l + 1) elettroni (s 2, p 6, d 10, f 14); il livello n contiene n sottolivelli, n² orbitali e al massimo 2n² elettroni (n = 3: 9 orbitali, 18 elettroni). Nodi: un orbitale ha n − 1 nodi in tutto, di cui l angolari e n − l − 1 radiali (3s: 2 radiali, 0 angolari; 4d: 1 radiale e 2 angolari, 3 in tutto). Le energie dei livelli dell'idrogeno sono Eₙ = −2,18·10⁻¹⁸ J / n². Per n = 6 l arriva a 5 e quindi ml va da −5 a +5: il valore massimo è +5.","spiegazione":"I numeri quantici sono l'indirizzo dell'elettrone: n è il piano del palazzo (più in alto, più energia), l è il tipo di appartamento (la forma), ml è l'orientamento dell'appartamento, ms dice quale dei due letti occupa. Ogni «indirizzo completo» può appartenere a un solo elettrone.","esempi":["Sottolivello 3d: l = 2 → 5 orbitali, al massimo 10 elettroni.","Orbitale 3s: nodi radiali = 3 − 0 − 1 = 2; orbitale 4d: nodi totali = 4 − 1 = 3.","n = 3: l può valere 0, 1, 2 → sottolivelli 3s, 3p, 3d.","l = 2: ml = −2, −1, 0, +1, +2 → 5 orbitali d.","n = 2, l = 2 non è permesso: l arriva al massimo a n − 1.","Un orbitale 3s ha n − 1 = 2 nodi."]},{"titolo":"Configurazione elettronica","riassunto":"La configurazione elettronica indica come gli elettroni sono distribuiti negli orbitali, seguendo il principio generale della minima energia. Ogni orbitale ospita al massimo due elettroni; il livello n può contenerne al massimo 2n² (2, 8, 18, 32). Nell'idrogeno e nei sistemi con un solo elettrone i sottolivelli di uno stesso livello hanno la stessa energia (sono degeneri); negli atomi con più elettroni la repulsione tra elettroni separa le energie. Gli elettroni interni schermano il nucleo: la carica nucleare efficace è Zeff = Z − S, dove S è la costante di schermo. Per effetto della penetrazione, dal quarto livello in poi il sottolivello s ha energia inferiore al sottolivello d del livello precedente (4s si riempie prima di 3d). Tre regole: Aufbau (si occupano per primi gli orbitali a energia più bassa), principio di Pauli (al massimo due elettroni per orbitale, con spin opposto), regola di Hund (tra più configurazioni possibili è favorita quella con il massimo numero di elettroni spaiati). Ordine di riempimento degli orbitali (a energia crescente): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p. I sottolivelli contengono al massimo s 2, p 6, d 10, f 14 elettroni. Configurazione abbreviata: si indica con il simbolo del gas nobile precedente ([He], [Ne], [Ar], [Kr], [Xe]) e si scrive solo la parte che segue: P (Z = 15) = [Ne] 3s² 3p³; Zn (Z = 30) = [Ar] 3d¹⁰ 4s²; Fe (Z = 26) = [Ar] 3d⁶ 4s². Elettroni spaiati: in un sottolivello p, d, f gli elettroni si distribuiscono uno per orbitale (Hund): in un sottolivello con tre orbitali p³ gli spaiati sono 3; in d con n elettroni gli spaiati sono n se n ≤ 5 e 10 − n se n > 5 (d⁶: 4 spaiati). Un orbitale si dice riempito se contiene due elettroni: 1s² 2s² 2p⁶ ha 1 + 1 + 3 = 5 orbitali riempiti. Eccezioni da ricordare: il cromo è [Ar] 3d⁵ 4s¹ e il rame [Ar] 3d¹⁰ 4s¹ (sottolivello d pieno o semipieno più stabile). Ioni: per formare un catione si tolgono gli elettroni dal livello con n più alto: nei metalli di transizione prima i 4s e poi i 3d (Co³⁺ = [Ar] 3d⁶ partendo da Co [Ar] 3d⁷ 4s²; Ti²⁺ = [Ar] 3d²); per un anione si aggiungono elettroni all'ultimo livello fino al gas nobile (S²⁻ = [Ne] 3s² 3p⁶ = [Ar]).","spiegazione":"Riempire gli orbitali è come far sedere i passeggeri su un autobus: si occupano prima le file davanti (energia più bassa); ogni sedile doppio tiene al massimo due persone «rivolte in versi opposti» (Pauli); e finché ci sono sedili doppi liberi nella stessa fila, ognuno si siede da solo prima di fare coppia (Hund).","esempi":["Zn (Z = 30): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² = [Ar] 3d¹⁰ 4s².","Co³⁺: Co = [Ar] 3d⁷ 4s² → togli 4s² e un 3d → [Ar] 3d⁶ (4 spaiati).","P (Z = 15): [Ne] 3s² 3p³ → 3 elettroni spaiati.","Mg (Z = 12): 1s² 2s² 2p⁶ 3s² = [Ne] 3s².","N (Z = 7): 1s² 2s² 2p³ con tre elettroni spaiati nei tre orbitali 2p.","Al (Z = 13): [Ne] 3s² 3p¹.","Kr (Z = 36): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁶."]},{"titolo":"Elettroni di valenza, simboli di Lewis e ioni","riassunto":"La tavola periodica si può dividere in blocchi a seconda del tipo di orbitali di valenza. Gli elettroni interni sono quelli del gas nobile che precede l'elemento e occupano i livelli a energia più bassa; gli elettroni esterni sono quelli con il valore di n più alto; gli elettroni di valenza sono quelli che prendono parte ai legami (nei metalli di transizione a volte lo diventano anche elettroni più interni). Gli elementi di uno stesso gruppo hanno lo stesso numero di elettroni di valenza. Nella rappresentazione di Lewis (1910) gli elettroni di valenza sono indicati con puntini attorno al simbolo dell'elemento; otto elettroni di valenza (ottetto) corrispondono a una stabilità particolare. Gli elementi vicini ai gas nobili formano ioni che ne raggiungono la configurazione elettronica. Elettroni di valenza degli elementi dei gruppi principali: gruppi 1 e 2 → il numero del gruppo; gruppi 13–18 → numero del gruppo − 10 (O, gruppo 16: 6; Cl, gruppo 17: 7). Formazione degli ioni: i metalli perdono gli elettroni di valenza e raggiungono la configurazione del gas nobile precedente (gruppo 1 → 1+, gruppo 2 → 2+, Al → 3+); i non metalli acquistano elettroni fino al gas nobile successivo (gruppo 15 → 3−, gruppo 16 → 2−, gruppo 17 → 1−). Specie isoelettroniche con il neon (1s² 2s² 2p⁶): N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺, Al³⁺; con l'argon: P³⁻, S²⁻, Cl⁻, Ar, K⁺, Ca²⁺. Un metallo di transizione allo stato puro non può avere la configurazione 1s² 2s² 2p⁶, che è quella di un gas nobile o dei suoi ioni isoelettronici.","spiegazione":"Gli elettroni di valenza sono quelli «di frontiera»: gli unici che incontrano gli altri atomi, quindi gli unici che decidono la chimica dell'elemento. Per questo elementi della stessa colonna, che hanno la stessa frontiera, si comportano in modo simile.","esempi":["S²⁻: [Ne] 3s² 3p⁶ = 1s² 2s² 2p⁶ 3s² 3p⁶ (come l'argon).","Isoelettronici con Ne: N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺, Al³⁺.","Ossigeno: 1s² 2s² 2p⁴ → 6 elettroni di valenza.","Cloro: [Ne] 3s² 3p⁵ → 7 elettroni di valenza; acquistandone uno raggiunge la configurazione dell'argon.","Dal litio al fluoro i puntini di Lewis passano da 1 a 7."]},{"titolo":"Tabella dei numeri quantici: valori e orbitali corrispondenti","riassunto":"Riepilogo operativo. n (principale) = 1, 2, 3, 4… (livello: energia e dimensione). l (momento angolare, forma) = 0, 1, …, n−1: l = 0 → s, l = 1 → p, l = 2 → d, l = 3 → f. ml (magnetico, orientazione) = −l, …, 0, …, +l: sono 2l+1 valori, cioè 2l+1 orbitali nel sottolivello (1 orbitale s, 3 p, 5 d, 7 f). ms (spin) = +½ oppure −½. Ogni orbitale contiene al massimo 2 elettroni con spin opposti, quindi un sottolivello s contiene al massimo 2 elettroni, p 6, d 10, f 14. Il livello n contiene n sottolivelli, n² orbitali e al massimo 2n² elettroni. Tabella: n = 1 → 1s (l = 0, ml = 0), 1 orbitale, 2 e⁻. n = 2 → 2s (l = 0, ml = 0); 2p (l = 1, ml = −1, 0, +1), 4 orbitali, 8 e⁻. n = 3 → 3s; 3p; 3d (l = 2, ml = −2, −1, 0, +1, +2), 9 orbitali, 18 e⁻. n = 4 → 4s; 4p; 4d; 4f (l = 3, ml = −3…+3), 16 orbitali, 32 e⁻. Un sottolivello come 1p, 2d o 3f non esiste, perché l non può superare n−1; e ml = +3 non è permesso per l = 2. Il numero di nodi totali di un orbitale è n−1: l nodi angolari e n−l−1 nodi radiali.","spiegazione":"Per scoprire quale orbitale indica una terna (n, l, ml): n dà il numero davanti, l dà la lettera (0 s, 1 p, 2 d, 3 f), e ml dice solo quale degli orbitali di quel sottolivello è (px, py, pz per i p). Per controllare se una terna è permessa si verifica in ordine: l ≤ n−1 e poi |ml| ≤ l.","esempi":["(n = 3, l = 1, ml = 0) → orbitale 3p (uno dei tre 3p).","(n = 4, l = 2, ml = +1) → orbitale 4d.","(n = 1, l = 0, ml = 0) → 1s; (n = 2, l = 2, ml = 0) → non permesso.","Livello n = 3: 3 sottolivelli (3s, 3p, 3d), 1 + 3 + 5 = 9 orbitali, al massimo 18 elettroni.","Sottolivello 4f: l = 3, ml da −3 a +3 → 7 orbitali, al massimo 14 elettroni."]}]},{"id":"tavola","n":4,"titolo":"La tavola periodica","icona":"🧪","colore":"#34d399","descrizione":"Lezione 4 · Legge periodica, andamento di raggio, energia di ionizzazione, affinità elettronica ed elettronegatività, gruppi e metalli di transizione.","argomenti":[{"titolo":"Legge periodica e struttura della tavola","riassunto":"La legge periodica (1869, Mendeleev in Russia e Meyer in Germania) afferma che, ordinando gli elementi per massa atomica crescente, alcune proprietà variano periodicamente. Mendeleev raggruppò i 66 elementi allora noti in base alle proprietà e previde quelle di elementi non ancora scoperti, come gallio e germanio. In seguito Moseley stabilì che ogni elemento ha un numero atomico unico: è così che è organizzata la tavola attuale. La tavola è divisa in colonne (gruppi) e righe (periodi): le proprietà chimiche degli elementi di un gruppo sono simili, quelle degli elementi di un periodo cambiano progressivamente. La legge di Mendeleev permette di prevedere le proprietà di un elemento dalla sua posizione, ma non spiega perché esista la periodicità: lo spiega la meccanica quantistica. Gli elementi di una stessa colonna hanno proprietà simili perché hanno lo stesso numero di elettroni di valenza nello stesso tipo di orbitali. Ogni periodo inizia con un elemento che ha un solo elettrone in un orbitale s del guscio esterno e termina con un elemento che ha gli orbitali s e p esterni completi. Come si trovano gruppo e periodo dalla configurazione elettronica: il periodo è il numero quantico n più alto occupato (Z = 14, [Ne] 3s² 3p² → periodo 3); il gruppo si ottiene dagli elettroni di valenza: per gli elementi s (gruppi 1 e 2) è il numero di elettroni ns; per gli elementi p (gruppi 13–18) è 10 + il numero di elettroni di valenza (3s² 3p² → 4 elettroni → gruppo 14); per i metalli di transizione (blocco d, gruppi 3–12) è la somma degli elettroni ns e (n−1)d. La tavola si divide in blocchi in base all'ultimo orbitale riempito: blocco s (gruppi 1–2), p (13–18), d (metalli di transizione) e f (lantanidi, che riempiono i 4f, e attinidi, che riempiono i 5f; gli attinidi appartengono al 7° periodo). Poiché nella tavola attuale si trovano solo orbitali s, p, d, f, il valore massimo del numero quantico l degli elettroni degli elementi noti è 3. Eccezioni alla regola di riempimento: il palladio è [Kr] 4d¹⁰ (5s vuoto), il cromo [Ar] 3d⁵ 4s¹ e il rame [Ar] 3d¹⁰ 4s¹.","spiegazione":"La tavola periodica è un calendario: le righe sono le settimane, le colonne i giorni. Tutti i lunedì si somigliano anche se appartengono a settimane diverse. Allo stesso modo litio, sodio e potassio si somigliano perché hanno tutti un solo elettrone esterno, anche se in gusci diversi.","esempi":["Z = 6: [He] 2s² 2p² → periodo 2, 4 e⁻ di valenza → gruppo 14 (carbonio).","Z = 26: [Ar] 3d⁶ 4s² → periodo 4, 8 e⁻ (6 + 2) → gruppo 8 (ferro).","Mendeleev lasciò caselle vuote e previde le proprietà di Ga e Ge prima che fossero scoperti.","Li, Na, K: stessa colonna, tutti con configurazione esterna ns¹.","Nel terzo periodo si passa da solidi (Na, Mg, Al, Si, P, S) a gas (Cl, Ar)."]},{"titolo":"Configurazione elettronica e carica degli ioni","riassunto":"Il numero di elettroni di valenza determina in larga parte il comportamento chimico (e in parte fisico) di un elemento; poiché questo numero segue un andamento periodico, anche le proprietà sono periodiche. Otto elettroni di valenza danno un atomo molto stabile: i gas nobili sono infatti poco reattivi. Al contrario, gli elementi con un elettrone in più o in meno sono molto reattivi: gli alogeni sono i non metalli più reattivi e i metalli alcalini i metalli più reattivi. Molti metalli e non metalli formano un solo ione, la cui carica è prevedibile dalla posizione: gruppo 1 → +1, gruppo 2 → +2, gruppo 17 → −1, gruppo 16 → −2. Questi atomi formano ioni con la stessa configurazione elettronica del gas nobile più vicino. Gli anioni si formano quando un atomo acquista abbastanza elettroni da averne 8 di valenza; i cationi quando un atomo perde tutti i suoi elettroni di valenza (processo sempre endotermico). Specie isoelettroniche sono atomi o ioni con lo stesso numero di elettroni (per uno ione: Z meno la carica, oppure Z più la carica negativa): Kr ha 36 elettroni, come Br⁻ (35 + 1), Rb⁺ (37 − 1), Sr²⁺ (38 − 2) e Y³⁺ (39 − 3). Carica più probabile dello ione di un elemento dei gruppi principali: gruppo 1 → +1, gruppo 2 → +2, gruppo 13 → +3, gruppo 15 → −3, gruppo 16 → −2, gruppo 17 → −1 (gli altri non formano un ione prevedibile così). Un catione si forma perdendo gli elettroni di valenza (si ottiene la configurazione del gas nobile precedente); un anione acquistando elettroni fino al gas nobile successivo: Mg²⁺ = 1s² 2s² 2p⁶ (come il neon), S²⁻ = 1s² 2s² 2p⁶ 3s² 3p⁶ (come l'argon). I metalli alcalini formano sempre ioni 1⁺ (non 2⁺).","spiegazione":"Ogni atomo «punta» alla configurazione del gas nobile più vicino e sceglie la strada più corta: chi ha uno o due elettroni esterni li perde, chi ne ha sei o sette ne acquista due o uno. Dal numero del gruppo si legge quindi direttamente la carica dello ione.","esempi":["Isoelettronici con Kr (36 e⁻): Br⁻, Rb⁺, Sr²⁺, Y³⁺.","Carica dello ione: Al (gruppo 13) → Al³⁺; N (gruppo 15) → N³⁻.","S: 1s² 2s² 2p⁶ 3s² 3p⁴ → S²⁻: 1s² 2s² 2p⁶ 3s² 3p⁶ (come l'argon).","Mg: 1s² 2s² 2p⁶ 3s² → Mg²⁺: 1s² 2s² 2p⁶ (come il neon).","Na⁺, Mg²⁺, F⁻ e O²⁻ hanno tutti 10 elettroni."]},{"titolo":"Raggio atomico e raggio ionico","riassunto":"Il raggio di un atomo si può misurare in modi diversi (raggio di van der Waals, non legante; raggio covalente, di legame); il raggio atomico è una media. 100 pm = 0,1 nm = 1 Å. Nei gruppi principali il raggio atomico aumenta scendendo lungo un gruppo, perché il guscio di valenza è sempre più lontano dal nucleo, e diminuisce lungo un periodo da sinistra a destra: gli elettroni si aggiungono allo stesso guscio mentre la carica nucleare efficace aumenta e li attrae di più. I metalli di transizione aumentano di dimensioni scendendo nel gruppo, ma lungo il blocco d hanno raggi circa uguali. Il raggio ionico si ricava dalle dimensioni dei composti. I cationi sono più piccoli dell'atomo di partenza (si rimuove l'elettrone più esterno e le repulsioni diminuiscono): maggiore è la carica positiva, più piccolo è il catione. Gli anioni sono più grandi dell'atomo di partenza (si aggiungono elettroni e le repulsioni aumentano): maggiore è la carica negativa, più grande è l'anione. Le dimensioni degli ioni aumentano scendendo nel gruppo. Per specie isoelettroniche (stesso numero di elettroni) il raggio diminuisce all'aumentare del numero atomico Z: più protoni attirano più forte gli stessi elettroni. Tra ioni con 10 elettroni: O²⁻ > F⁻ > Na⁺ > Mg²⁺ > Al³⁺ (Z = 8, 9, 11, 12, 13). Per gli atomi neutri il raggio è minore in alto a destra e maggiore in basso a sinistra: i gas nobili sono gli elementi più piccoli del loro periodo (Ar è più piccolo di Na, Pb e Fr nello stesso confronto), i metalli alcalini i più grandi (Na < Fr perché Fr è più in basso nel gruppo). Un anione ha raggio maggiore di quello dei cationi di pari elettroni.","spiegazione":"Scendendo in un gruppo si aggiunge un «piano» all'edificio: l'atomo cresce. Andando verso destra nel periodo, invece, i piani restano gli stessi ma il nucleo tira sempre più forte, come una calamita più potente che stringe la stessa nuvola di elettroni: l'atomo si restringe.","esempi":["Raggio: Xe (periodo 5) < Cs; Ar (periodo 3) < Na (periodo 3) ma Ar < Xe perché Ar è più in alto.","Isoelettronici con Xe (54 e⁻): I⁻ (Z = 53) > Cs⁺ (55) > Ba²⁺ (56) > La³⁺ (57).","N è più grande di F (N è più a sinistra).","Ge è più grande di C (Ge è più in basso).","Al è più grande di N (più in basso e più a sinistra).","Tra ioni con 10 elettroni: Mg²⁺ < Na⁺ < F⁻ < O²⁻."]},{"titolo":"Energia di ionizzazione e affinità elettronica","riassunto":"L'energia di ionizzazione (EI) è l'energia minima necessaria per rimuovere un elettrone da un atomo allo stato gassoso; è un processo endotermico. La prima EI riguarda l'atomo neutro, la seconda lo ione +1, e così via. Maggiore è la carica nucleare efficace sull'elettrone, più energia serve; più l'elettrone è lontano dal nucleo, meno ne serve. La prima EI diminuisce scendendo lungo un gruppo e in generale aumenta lungo un periodo. Ci sono due irregolarità, tra i gruppi 2 e 13 e tra i gruppi 15 e 16: per ionizzare Be bisogna rompere un sottolivello pieno, mentre ionizzando B se ne ottiene uno pieno; per ionizzare N si rompe un sottolivello semipieno, mentre ionizzando O se ne ottiene uno semipieno. Le energie di ionizzazione successive crescono regolarmente e subiscono un forte salto quando si iniziano a rimuovere gli elettroni interni. L'affinità elettronica (AE) è l'energia rilasciata quando un atomo neutro gassoso acquista un elettrone: in generale diventa più negativa da sinistra a destra, è massima per gli alogeni e sfavorevole per i metalli alcalino-terrosi e i gas nobili. Prima EI: X(g) → X⁺(g) + e⁻; seconda EI: X⁺(g) → X²⁺(g) + e⁻ (per il cloro: l'energia per togliere un
