o","Ossido di ferro (I)","Ossido di ferro (II)"],"r":0,"s":"Il ferro qui ha numero di ossidazione 3, ossia il più alto tra i due che possiede(2,3) quindi il prefisso è ico e non oso","f":0,"e":1},{"id":"mole-q106","c":"mole","l":3,"a":6,"q":"Nomenclatura tradizionale di: NaOH","o":["Sodio ossidato","Idrossido di sodio","Ossido di sodio","Idrossido di azoto","Idruro ossigenato di sodio"],"r":1,"s":"https://it.wikipedia.org/wiki/Idrossido_di_sodio","f":0,"e":1},{"id":"mole-q107","c":"mole","l":3,"a":6,"q":"Qual è la definizione del sale acido?","o":["Un sale in cui gli idrogeni acidi non sono stati completamente sostituiti","un sale che deriva da un sale forte","un sale che deriva da un sale debole"],"r":0,"s":"Un sale è acido se contiene degli idrogeni residui dell'acido da cui deriva. 2H2SO4 + 2Na → 2NaHSO4 + H2 (solfato acido di sodio o bisolfato di sodio) (wiki)","f":0,"e":1},{"id":"mole-q108","c":"mole","l":3,"a":6,"q":"Cos'è un idruro?","o":["Qualsiasi idracido","Qualsiasi composto con H","Sostanza dove H ha numero di ossidazione -1","Un acido"],"r":2,"s":"Gli idruri sono composti in cui l'idrogeno ha come numero di ossidazione −1. Sono basi fortissime ed altrettanto forti agenti riducenti.","f":0,"e":1},{"id":"mole-q109","c":"mole","l":3,"a":6,"q":"Selezionare il sale acido","o":["KH","HCO3-","H2CO3","KHS"],"r":3,"s":"(solfuro acido di potassio)","f":0,"e":1},{"id":"mole-q110","c":"mole","l":3,"a":6,"q":"Quale gruppo contiene solamente idracidi?","o":["HI, HF, HBr, H2S","HF, HBr, HCN, H2SO4","HI, HN3, H2SO3"],"r":0,"s":"Composti binari formati da H + elemento del VI o VII gruppo.","f":0,"e":1},{"id":"mole-q111","c":"mole","l":3,"a":6,"q":"Fe (OH)3+ H2SO4→","o":["FeSO4","FeSO3","Fe2 (SO4)3","FeS","Fe (SO3)3"],"r":2,"s":"Formazione di un sale; Ferrico +3 ione Solfato -2 ( https://bit.ly/2WJcpuQ )","f":0,"e":1},{"id":"mole-q112","c":"mole","l":3,"a":6,"q":"Il perclorato di sodio si può ottenere facendo reagire","o":["NaOH + HClO4","NaOH + HClO3","NaOH + NaClO2","NaOCl + KCl","H2O2 + HCLO4"],"r":0,"s":"Il prefisso per- intende che il cloro ha valenza massima, quindi pari a 7 ( https://bit.ly/2WRtqD8 )","f":0,"e":1},{"id":"mole-q113","c":"mole","l":3,"a":6,"q":"Cosa si ottiene da HNO2+KOH?","o":["KNO2 + H2O","KNO","KNO5 + H2O"],"r":0,"s":"acido + base --> sale + acqua ( https://bit.ly/2BxkF86 )","f":0,"e":1},{"id":"mole-q114","c":"mole","l":3,"a":6,"q":"Quale dei seguenti composti è prodotto dalla reazione tra acido nitrico e idrossido di zinco?","o":["Zn(NO3)2","ZnN2","Zn2NO3","Zn(NO2)2","Zn2N"],"r":0,"s":"HNO3 + Zn(OH)2 -> Zn(NO3)2 + H2O Poiché lo zinco ha numero di ossidazione +2 e NO3- vale - 1","f":0,"e":1},{"id":"mole-q115","c":"mole","l":3,"a":6,"q":"Come si forma l'acido solforico, facendo reagire uno di questi componenti con l'acqua?","o":["SO2","SO3","SO4(2-)","SO","Nessuna di queste"],"r":1,"s":"SO3 + H2O -> H2SO4 https://it.wikipedia.org/wiki/Acido_solforico","f":1,"e":1},{"id":"mole-q116","c":"mole","l":3,"a":6,"q":"Quale composto reagisce con H20 per dare acido nitrico?","o":["N2O5","N2O3","H2","N2","NH4+"],"r":0,"s":"L'acido nitrico è dato dalla reazione tra anidride nitrica e acqua. Nell'anidride nitrica l'azoto ha n.o. pari a 5, pertanto si ottiene N2O5. Altrimenti è possibile ricavare la formula da 2(HNO3) - H2O","f":0,"e":1},{"id":"mole-q117","c":"mole","l":3,"a":6,"q":"quale dei seguenti ossidi reagisce con l'acqua per formare un idrossido?","o":["SO2","CO","CO2","N2O5","nessuna delle altre risposte è corretta"],"r":4,"s":"Per formare un'idrossido è necessaria la presenza di un metallo. Dato che gli alogeni non si combinano per creare idrossidi.","f":1,"e":1},{"id":"mole-q118","c":"mole","l":3,"a":6,"q":"Quali di questi composti è un perossido?","o":["H2O","Na2O","Cl2O7","CO2","BaO2"],"r":4,"s":"Nei perossidi l'ossigeno ha sempre numero di ossidazione -1. Il bario ha sempre n.o. = 2. Pertanto l'ossigeno in questo composto ha proprio n.o. = -1","f":0,"e":1},{"id":"mole-q119","c":"mole","l":3,"a":6,"q":"Indicare quale tra questi è il nome di Na3PO4","o":["fosfito di sodio","trifosfito di sodio","ossido misto di sodio e zolfo","fosfato di sodio"],"r":3,"s":"Il PO₄³⁻ è lo ione fosfato (fosforo +5, suffisso -ato): Na₃PO₄ è il fosfato di sodio; il fosfito è PO₃³⁻.","f":0,"e":1},{"id":"mole-q120","c":"mole","l":3,"a":6,"q":"a cosa corrispondono tali composti H2SO4 / Na2SO3","o":["acido solforico / solfito di sodio","acido solfidrico / solfato di sodio","acido solforico / solfato di sodio","acido solforoso / solfito di sodio","acido solforoso / solfato di sodio"],"r":0,"s":"N ha numero di ossidazione +5 e il solfito è SO3 mentre il solfato è SO4","f":0,"e":1},{"id":"orbitali-q0","c":"orbitali","l":1,"a":0,"q":"Che cos'è la lunghezza d'onda λ?","o":["L'altezza dell'onda","Il numero di onde che passano in un secondo","La velocità con cui l'onda si propaga","La distanza tra due creste successive dell'onda"],"r":3,"s":"λ misura la distanza coperta da un'oscillazione completa. L'altezza è l'ampiezza, il numero di onde al secondo è la frequenza.","f":0,"e":0},{"id":"orbitali-q1","c":"orbitali","l":1,"a":0,"q":"Che cos'è la frequenza ν di un'onda?","o":["La distanza tra due creste","L'intensità della radiazione","Il numero di onde che passano in un punto nell'unità di tempo","L'energia totale trasportata dall'onda"],"r":2,"s":"La frequenza si misura in hertz (1 Hz = 1 s⁻¹) ed è legata alla lunghezza d'onda da c = λ·ν.","f":0,"e":0},{"id":"orbitali-q2","c":"orbitali","l":1,"a":0,"q":"Quale relazione, introdotta da Planck, lega l'energia di un quanto alla frequenza?","o":["E = m·c²","E = h·ν","E = h / ν","E = λ·ν"],"r":1,"s":"L'energia è scambiata in quanti proporzionali alla frequenza; h = 6,626·10⁻³⁴ J·s è la costante di Planck.","f":0,"e":0},{"id":"orbitali-q3","c":"orbitali","l":1,"a":0,"q":"Che cos'è un fotone?","o":["Un pacchetto (quanto) di energia luminosa","Un elettrone emesso da un metallo","Una particella del nucleo","Un'onda sonora ad alta frequenza"],"r":0,"s":"Einstein propose che la luce ceda energia agli atomi in pacchetti discreti, i fotoni, ciascuno di energia hν.","f":0,"e":0},{"id":"orbitali-q4","c":"orbitali","l":1,"a":1,"q":"Secondo Bohr, gli elettroni nell'atomo:","o":["Possono avere qualsiasi valore di energia","Sono fermi a distanza fissa dal nucleo","Sono distribuiti in una nube di carica positiva","Possono avere solo valori ben precisi (quantizzati) di energia"],"r":3,"s":"Nel modello di Bohr gli elettroni si muovono su orbite a distanza fissa dal nucleo (stati stazionari), ciascuna con un'energia definita.","f":0,"e":0},{"id":"orbitali-q5","c":"orbitali","l":1,"a":2,"q":"Che cosa afferma il principio di indeterminazione di Heisenberg?","o":["Un orbitale non può contenere più di due elettroni","L'energia della luce è proporzionale alla frequenza","Non si possono conoscere con precisione, insieme, posizione e velocità di una particella","Gli elettroni occupano prima gli orbitali a energia più bassa"],"r":2,"s":"Più accuratamente si conosce la posizione di un elettrone, meno si conosce la sua velocità, e viceversa.","f":0,"e":0},{"id":"orbitali-q6","c":"orbitali","l":1,"a":2,"q":"Che cosa rappresenta il quadrato della funzione d'onda, ψ²?","o":["La traiettoria dell'elettrone","La densità di probabilità di trovare l'elettrone in un punto","L'energia dell'elettrone","La carica dell'elettrone"],"r":1,"s":"ψ non ha un significato fisico diretto; ψ² indica dove è più o meno probabile trovare l'elettrone.","f":0,"e":0},{"id":"orbitali-q7","c":"orbitali","l":1,"a":3,"q":"Che cosa determina il numero quantico principale n?","o":["L'energia e la dimensione dell'orbitale","La forma dell'orbitale","L'orientazione dell'orbitale","Il verso di rotazione dell'elettrone"],"r":0,"s":"Più grande è n, maggiori sono l'energia e le dimensioni dell'orbitale.","f":0,"e":0},{"id":"orbitali-q8","c":"orbitali","l":1,"a":3,"q":"Che cosa determina il numero quantico l?","o":["La dimensione dell'orbitale","L'orientazione dell'orbitale nello spazio","Lo spin dell'elettrone","La forma dell'orbitale"],"r":3,"s":"l = 0, 1, 2, 3 corrispondono agli orbitali s, p, d, f, che hanno forme diverse.","f":0,"e":0},{"id":"orbitali-q9","c":"orbitali","l":1,"a":4,"q":"Che cosa afferma il principio di Pauli?","o":["Gli orbitali si riempiono in ordine di energia crescente","Gli elettroni occupano singolarmente gli orbitali di uguale energia","Un orbitale può ospitare al massimo due elettroni, con spin opposto","Posizione e velocità non si possono conoscere insieme"],"r":2,"s":"Due elettroni nello stesso orbitale devono avere spin opposto (ms = +½ e −½).","f":0,"e":0},{"id":"orbitali-q10","c":"orbitali","l":1,"a":4,"q":"Che cosa afferma la regola di Hund?","o":["Ogni orbitale contiene al massimo due elettroni","È favorita la configurazione con il massimo numero di elettroni spaiati","Gli orbitali a energia più bassa si occupano per primi","Gli elettroni di valenza sono sempre otto"],"r":1,"s":"Negli orbitali di uguale energia gli elettroni si dispongono prima uno per orbitale, con spin paralleli, e solo dopo si appaiano.","f":0,"e":0},{"id":"orbitali-q11","c":"orbitali","l":1,"a":3,"q":"Quali valori può assumere il numero quantico di spin ms?","o":["+½ e −½","0 e 1","Da −l a +l","Qualsiasi intero positivo"],"r":0,"s":"Lo spin ha solo due orientazioni possibili («su» e «giù»).","f":0,"e":0},{"id":"orbitali-q12","c":"orbitali","l":2,"a":3,"q":"Per n = 3, quali valori può assumere l?","o":["0, 1, 2","1, 2, 3","0, 1, 2, 3","−1, 0, +1"],"r":0,"s":"l va da 0 a n − 1: per n = 3 si hanno i sottolivelli 3s, 3p e 3d.","f":0,"e":0},{"id":"orbitali-q13","c":"orbitali","l":2,"a":3,"q":"Quanti orbitali d esistono in un livello che li possiede?","o":["3","7","10","5"],"r":3,"s":"Per l = 2, ml assume i valori −2, −1, 0, +1, +2: cinque orbitali (che ospitano fino a 10 elettroni).","f":0,"e":0},{"id":"orbitali-q14","c":"orbitali","l":2,"a":4,"q":"Quanti elettroni può contenere al massimo il livello n = 3?","o":["8","9","18","32"],"r":2,"s":"Il numero massimo è 2n² = 2 · 9 = 18.","f":0,"e":0},{"id":"orbitali-q15","c":"orbitali","l":2,"a":4,"q":"Qual è la configurazione elettronica del magnesio (Z = 12)?","o":["1s² 2s² 2p⁶ 3p²","1s² 2s² 2p⁶ 3s²","1s² 2s² 2p⁸","1s² 2s² 2p⁴ 3s² 3p²"],"r":1,"s":"12 elettroni disposti in ordine di energia crescente: [Ne] 3s². Il sottolivello 2p contiene al massimo 6 elettroni.","f":0,"e":0},{"id":"orbitali-q16","c":"orbitali","l":2,"a":4,"q":"Quanti elettroni spaiati ha l'atomo di azoto (Z = 7) nello stato fondamentale?","o":["3","1","5","0"],"r":0,"s":"Configurazione 1s² 2s² 2p³: per la regola di Hund i tre elettroni 2p occupano tre orbitali diversi.","f":0,"e":0},{"id":"orbitali-q17","c":"orbitali","l":2,"a":0,"q":"Qual è la frequenza di una luce con λ = 500 nm? (c = 3,00·10⁸ m/s)","o":["1,5·10² Hz","6,0·10⁵ Hz","1,7·10⁻¹⁵ Hz","6,0·10¹⁴ Hz"],"r":3,"s":"ν = c / λ = 3,00·10⁸ / 5,00·10⁻⁷ = 6,0·10¹⁴ Hz. Attenzione a convertire i nanometri in metri.","f":0,"e":0},{"id":"orbitali-q18","c":"orbitali","l":2,"a":0,"q":"Quale di queste radiazioni ha l'energia più alta?","o":["Onde radio","Luce visibile","Raggi gamma","Radiazione infrarossa"],"r":2,"s":"Minore è la lunghezza d'onda, maggiori sono frequenza ed energia: i raggi gamma sono all'estremo ad alta energia dello spettro.","f":0,"e":0},{"id":"orbitali-q19","c":"orbitali","l":2,"a":3,"q":"Quale forma hanno gli orbitali s e p?","o":["s a due lobi, p sferica","s sferica, p a due lobi","Entrambi sferici","s a quattro lobi, p a otto lobi"],"r":1,"s":"Gli orbitali s sono sferici; i tre orbitali p hanno due lobi e sono orientati lungo gli assi x, y, z.","f":0,"e":0},{"id":"orbitali-q20","c":"orbitali","l":2,"a":4,"q":"Qual è la configurazione elettronica dell'alluminio (Z = 13)?","o":["[Ne] 3s² 3p¹","[Ne] 3s¹ 3p²","[Ne] 3p³","[Ar] 3s² 3p¹"],"r":0,"s":"Dopo i 10 elettroni del neon, due vanno in 3s e uno in 3p.","f":0,"e":0},{"id":"orbitali-q21","c":"orbitali","l":2,"a":1,"q":"Nel modello di Bohr, quando un atomo emette un fotone?","o":["Quando un elettrone passa da un'orbita a energia minore a una a energia maggiore","Quando un elettrone resta nella stessa orbita","Quando il nucleo perde un protone","Quando un elettrone passa da un'orbita a energia maggiore a una a energia minore"],"r":3,"s":"Scendendo di livello l'elettrone libera la differenza di energia come fotone (E₂ − E₁ = hν); salendo, lo assorbe.","f":0,"e":0},{"id":"orbitali-q22","c":"orbitali","l":2,"a":5,"q":"Quanti elettroni di valenza ha l'ossigeno (1s² 2s² 2p⁴)?","o":["2","4","6","8"],"r":2,"s":"Gli elettroni del livello più esterno (n = 2) sono 2 + 4 = 6.","f":0,"e":0},{"id":"orbitali-q23","c":"orbitali","l":2,"a":3,"q":"Quale di queste combinazioni di numeri quantici NON è permessa?","o":["n = 2, l = 1, ml = −1","n = 2, l = 2, ml = 0","n = 3, l = 2, ml = +2","n = 1, l = 0, ml = 0"],"r":1,"s":"l può valere al massimo n − 1: per n = 2 sono ammessi solo l = 0 e l = 1 (non esiste l'orbitale 2d).","f":0,"e":0},{"id":"orbitali-q24","c":"orbitali","l":1,"a":6,"q":"Per l = 1, quanti valori può assumere ml?","o":["1","2","5","3"],"r":3,"s":"ml va da −l a +l: −1, 0, +1, cioè 2l + 1 = 3 valori (i tre orbitali p).","f":0,"e":0},{"id":"orbitali-q25","c":"orbitali","l":1,"a":6,"q":"A quale tipo di orbitale corrisponde l = 2?","o":["Orbitale s","Orbitale p","Orbitale d","Orbitale f"],"r":2,"s":"l = 0 s, l = 1 p, l = 2 d, l = 3 f.","f":0,"e":0},{"id":"orbitali-q26","c":"orbitali","l":1,"a":6,"q":"Quali sottolivelli esistono nel livello n = 2?","o":["Solo 2s","2s e 2p","2s, 2p e 2d","2p e 2d"],"r":1,"s":"l va da 0 a n−1 = 1: 2s (l = 0) e 2p (l = 1).","f":0,"e":0},{"id":"orbitali-q27","c":"orbitali","l":1,"a":6,"q":"Quanti orbitali contiene un sottolivello p?","o":["3","1","5","6"],"r":0,"s":"Per l = 1 ci sono 3 valori di ml: px, py e pz.","f":0,"e":0},{"id":"orbitali-q28","c":"orbitali","l":1,"a":6,"q":"Quanti elettroni può contenere al massimo un sottolivello d?","o":["6","5","14","10"],"r":3,"s":"Un sottolivello d ha 5 orbitali da 2 elettroni ciascuno: 10.","f":0,"e":0},{"id":"orbitali-q29","c":"orbitali","l":1,"a":6,"q":"A quale orbitale corrispondono n = 1, l = 0, ml = 0?","o":["1p","2s","1s","2p"],"r":2,"s":"n = 1 dà il numero e l = 0 la lettera s: orbitale 1s.","f":0,"e":0},{"id":"orbitali-q30","c":"orbitali","l":2,"a":6,"q":"A quale orbitale corrispondono n = 3, l = 1, ml = 0?","o":["3s","3d","3p","2p"],"r":2,"s":"n = 3, l = 1 è un sottolivello 3p; ml = 0 è uno dei suoi tre orbitali.","f":0,"e":0},{"id":"orbitali-q31","c":"orbitali","l":2,"a":6,"q":"Quanti orbitali ci sono in totale nel livello n = 3?","o":["3","9","6","18"],"r":1,"s":"1 (3s) + 3 (3p) + 5 (3d) = 9 = n².","f":0,"e":0},{"id":"orbitali-q32","c":"orbitali","l":2,"a":6,"q":"Quanti elettroni può contenere al massimo il livello n = 4?","o":["32","16","18","8"],"r":0,"s":"Il livello n contiene al massimo 2n² elettroni: 2 · 16 = 32.","f":0,"e":0},{"id":"orbitali-q33","c":"orbitali","l":2,"a":6,"q":"Quale di queste combinazioni (n, l, ml) NON è permessa?","o":["n = 3, l = 2, ml = −2","n = 1, l = 0, ml = 0","n = 4, l = 3, ml = +3","n = 2, l = 2, ml = 0"],"r":3,"s":"Per n = 2 il valore massimo di l è 1: l = 2 non è permesso (non esiste il sottolivello 2d).","f":0,"e":0},{"id":"orbitali-q34","c":"orbitali","l":2,"a":6,"q":"Quale terna (n, l, ml) descrive un orbitale 4d?","o":["n = 4, l = 1, ml = +1","n = 4, l = 3, ml = +2","n = 4, l = 2, ml = +1","n = 3, l = 2, ml = +1"],"r":2,"s":"4d: n = 4 e l = 2 (lettera d); ml può valere −2, …, +2.","f":0,"e":0},{"id":"orbitali-q35","c":"orbitali","l":2,"a":6,"q":"Quale di questi sottolivelli NON esiste?","o":["3d","2d","4f","2p"],"r":1,"s":"Il sottolivello d richiede l = 2, quindi n ≥ 3: il 2d non esiste.","f":0,"e":0},{"id":"orbitali-q36","c":"orbitali","l":2,"a":6,"q":"Qual è il massimo valore di ml in un orbitale 4f?","o":["+3","+2","+4","+7"],"r":0,"s":"Per un f è l = 3: ml va da −3 a +3.","f":0,"e":0},{"id":"orbitali-q37","c":"orbitali","l":2,"a":6,"q":"Quanti numeri quantici servono per identificare completamente un elettrone in un atomo?","o":["2","3","5","4"],"r":3,"s":"n, l, ml e ms: due elettroni non possono avere gli stessi quattro valori (principio di Pauli).","f":0,"e":0},{"id":"orbitali-q38","c":"orbitali","l":2,"a":6,"q":"Quanti elettroni possono avere i numeri quantici n = 3 e l = 2?","o":["6","5","10","18"],"r":2,"s":"Sono gli elettroni del sottolivello 3d: 5 orbitali, 2 elettroni ciascuno.","f":0,"e":0},{"id":"orbitali-q39","c":"orbitali","l":2,"a":6,"q":"Quali valori di n e l descrivono un orbitale 5p?","o":["n = 5, l = 0","n = 5, l = 1","n = 4, l = 1","n = 5, l = 2"],"r":1,"s":"5 è il numero del livello (n) e p corrisponde a l = 1.","f":0,"e":0},{"id":"orbitali-q46","c":"orbitali","l":3,"a":0,"q":"il rapporto tra l'energia di un fotone e la frequenza della radiazione è uguale:","o":["alla lunghezza d'onda","alla costante di Planck","a pigreco","alla velocità della luce","alla temperatura"],"r":1,"s":"E = hv dove E = energia del fotone, h = costante di Planck, v= frequenza della radiazione.","f":0,"e":1},{"id":"orbitali-q47","c":"orbitali","l":3,"a":0,"q":"I raggi X sono","o":["onde elettromagnetiche ad alta frequenza","onde elettromagnetiche a bassa frequenza","elettroni","protoni","particelle alfa"],"r":0,"s":"Definizione di raggi X ( https://it.wikipedia.org/wiki/Raggi_X )","f":0,"e":1},{"id":"orbitali-q48","c":"orbitali","l":3,"a":2,"q":"Principio di indeterminazione di Heisenberg","o":["Non è possibile conoscere con precisione la posizione di un elettrone","Non è possibile conoscere con precisione contemporaneamente la posizione e la quantità di moto di un elettrone","Non è possibile conoscere con precisione la velocità di un elettrone"],"r":1,"s":"Heisenberg: non si possono conoscere contemporaneamente con precisione posizione e quantità di moto (velocità) di una particella.","f":0,"e":1},{"id":"orbitali-q49","c":"orbitali","l":3,"a":3,"q":"Quale proprietà è legata al numero quantico secondario l?","o":["La maggior parte dell'energia dell'orbitale","L'orientamento nello spazio dell'orbitale","La forma","Lo spin","Le dimensioni dell'orbitale"],"r":2,"s":"https://www.chimica-online.it/download/numero-quantico-secondario.htm","f":0,"e":1},{"id":"orbitali-q50","c":"orbitali","l":3,"a":3,"q":"Il numero quantico secondario può essere associato a quale delle seguenti caratteristiche del moto dell'elettrone?","o":["L'energia dell'orbitale in assenza di campo magnetico","Il numero degli elettroni","Nessuna delle altre caratteristiche","L'orientamento spaziale dell'orbitale","La forma dell'orbitale"],"r":4,"s":"definizione","f":1,"e":1},{"id":"orbitali-q51","c":"orbitali","l":3,"a":4,"q":"Quanti elettroni possono occupare contemporaneamente lo stesso orbitale?","o":["2","1","10","8","6"],"r":0,"s":"Poichè i numeri di spin ammessi sono solo 2: 1/2 e -1/2","f":0,"e":1},{"id":"orbitali-q52","c":"orbitali","l":3,"a":4,"q":"Quanti orbitali sono riempiti nell'atomo con configurazione elettronica 1s2 2s2 2p6?","o":["2","3","4","5","6"],"r":3,"s":"1 (1s2) + 1 (2s2) + 3 (2p6) = 5","f":0,"e":1},{"id":"orbitali-q53","c":"orbitali","l":3,"a":5,"q":"Cosa non può essere un elemento con configurazione elettronica 1 s2 2 s2 2p6","o":["Un metallo di transizione allo stato puro","Nessun elemento","Un gas nobile allo stato puro","Un catione","Un anione"],"r":0,"s":"Credo sia la a quella corretta, perché con quella configurazione si parla di 8 elettroni. Quindi potrebbe essere un gas nobile, oppure catione di un alogeno, oppure anione di un metallo alcalino","f":1,"e":1},{"id":"orbitali-q54","c":"orbitali","l":3,"a":5,"q":"Selezionare la configurazione elettronica dello ione solfuro.","o":["[Ne] 2s2 2p6","1s2 2s2 2p6 3s2 3p6","[Ne] 3s2 3p5","1s2 2s2 2p6 3s0 3p4","1s2 2s2 2p6 3p4"],"r":1,"s":"Lo zolfo acquista due elettroni per raggiungere la configurazione del gas nobile più vicino, l'Argon","f":0,"e":1},{"id":"orbitali-q55","c":"orbitali","l":3,"a":6,"q":"Per n = 6 , qual è il valore massimo che può assumere il numero quantico magnetico?","o":["+3","+4","+5","+6"],"r":2,"s":"Per n = 6 il numero quantico l arriva a 5; m va da −l a +l, quindi il valore massimo è +5.","f":0,"e":1},{"id":"orbitali-q56","c":"orbitali","l":3,"a":6,"q":"Quale orbitale ha n=3 l=2, m=1?","o":["Orbitale s","Orbitale p","Orbitale d","Nessuno","Orbitale ibrido"],"r":2,"s":"l = 2 corrisponde agli orbitali d; m = 1 è uno dei 5 valori possibili (−2, −1, 0, +1, +2).","f":1,"e":1},{"id":"orbitali-q57","c":"orbitali","l":3,"a":0,"q":"Qual è l'energia di un fotone con λ = 500 nm? (h = 6,626·10⁻³⁴ J·s, c = 3,00·10⁸ m/s)","o":["1,1·10⁻²⁷ J","3,3·10⁻⁴⁰ J","4,0·10⁻²⁸ J","4,0·10⁻¹⁹ J"],"r":3,"s":"E = hc/λ = (6,626·10⁻³⁴ · 3,00·10⁸) / 5,00·10⁻⁷ = 3,98·10⁻¹⁹ J.","f":0,"e":0},{"id":"orbitali-q58","c":"orbitali","l":3,"a":0,"q":"Una luce rossa molto intensa non estrae elettroni da un metallo, mentre una luce blu debole sì. Perché?","o":["Perché la luce blu è più intensa di quella rossa","Perché la luce rossa viene riflessa dal metallo","Perché l'energia di ogni fotone dipende dalla frequenza, non dall'intensità","Perché la luce blu ha una lunghezza d'onda maggiore"],"r":2,"s":"Ogni elettrone assorbe un solo fotone: serve che il singolo fotone superi l'energia di legame (frequenza di soglia). L'intensità cambia solo il numero di fotoni.","f":0,"e":0},{"id":"orbitali-q59","c":"orbitali","l":3,"a":0,"q":"Un fotone di energia 5,0·10⁻¹⁹ J colpisce un metallo la cui energia di legame è φ = 3,0·10⁻¹⁹ J. Qual è l'energia cinetica dell'elettrone emesso?","o":["8,0·10⁻¹⁹ J","2,0·10⁻¹⁹ J","5,0·10⁻¹⁹ J","Nessun elettrone viene emesso"],"r":1,"s":"Ecin = hν − φ = 5,0·10⁻¹⁹ − 3,0·10⁻¹⁹ = 2,0·10⁻¹⁹ J: l'energia in eccesso rispetto a quella di legame diventa energia cinetica.","f":0,"e":0},{"id":"orbitali-q60","c":"orbitali","l":3,"a":1,"q":"Nell'idrogeno Eₙ = −2,18·10⁻¹⁸ J / n². Qual è l'energia del fotone emesso nella transizione n = 3 → n = 2?","o":["3,03·10⁻¹⁹ J","2,18·10⁻¹⁸ J","7,87·10⁻¹⁹ J","1,21·10⁻¹⁹ J"],"r":0,"s":"ΔE = 2,18·10⁻¹⁸ · (1/4 − 1/9) = 2,1 in gioco è l'affinità elettronica, massima per gli alogeni.","f":0,"e":0},{"id":"tavola-q5","c":"tavola","l":1,"a":4,"q":"Che cos'è l'elettronegatività?","o":["L'energia per rimuovere un elettrone da un atomo isolato","La carica negativa di un anione","Il numero di elettroni di valenza","La proprietà di un atomo in una molecola di attrarre gli elettroni di legame"],"r":3,"s":"L'elettronegatività riguarda un atomo legato, non isolato: misura quanto «tira» verso di sé gli elettroni condivisi.","f":0,"e":0},{"id":"tavola-q6","c":"tavola","l":1,"a":2,"q":"Come varia il raggio atomico scendendo lungo un gruppo?","o":["Diminuisce","Resta costante","Aumenta","Prima diminuisce poi aumenta"],"r":2,"s":"Scendendo, il guscio di valenza è sempre più lontano dal nucleo.","f":0,"e":0},{"id":"tavola-q7","c":"tavola","l":1,"a":2,"q":"Come varia il raggio atomico lungo un periodo, da sinistra a destra?","o":["Aumenta","Diminuisce","Resta costante","Raddoppia a ogni elemento"],"r":1,"s":"Gli elettroni si aggiungono allo stesso guscio mentre la carica nucleare efficace cresce: il guscio è attratto più vicino al nucleo.","f":0,"e":0},{"id":"tavola-q8","c":"tavola","l":1,"a":5,"q":"Che cosa sono gli allotropi?","o":["Forme cristalline o molecolari diverse dello stesso elemento","Atomi dello stesso elemento con diverso numero di neutroni","Composti con la stessa formula molecolare","Ioni dello stesso elemento con carica diversa"],"r":0,"s":"Grafite, diamante e fullereni sono allotropi del carbonio; O₂ e O₃ dell'ossigeno. Atomi con neutroni diversi sono invece isotopi.","f":0,"e":0},{"id":"tavola-q9","c":"tavola","l":1,"a":6,"q":"Da che cosa dipende il paramagnetismo di un atomo o di uno ione?","o":["Dall'assenza di elettroni spaiati","Dal numero di neutroni","Dalla massa atomica","Dalla presenza di elettroni spaiati"],"r":3,"s":"Gli elettroni spaiati generano un campo magnetico netto: la specie è attratta da un campo magnetico.","f":0,"e":0},{"id":"tavola-q10","c":"tavola","l":1,"a":4,"q":"Come si comportano i metalli nelle reazioni chimiche?","o":["Tendono ad acquistare elettroni formando anioni","Non scambiano elettroni","Tendono a perdere elettroni (si ossidano) formando cationi","Condividono sempre elettroni con altri metalli"],"r":2,"s":"I metalli hanno bassa energia di ionizzazione: cedono elettroni. I non metalli li acquistano.","f":0,"e":0},{"id":"tavola-q11","c":"tavola","l":1,"a":5,"q":"Perché i gas nobili sono poco reattivi?","o":["Perché non possiedono elettroni","Perché hanno il guscio di valenza completo","Perché hanno una massa molto elevata","Perché sono liquidi a temperatura ambiente"],"r":1,"s":"Con il guscio esterno completo non hanno tendenza né a cedere né ad acquistare elettroni.","f":0,"e":0},{"id":"tavola-q12","c":"tavola","l":2,"a":2,"q":"Quale atomo è più grande tra azoto e fluoro?","o":["Il fluoro, perché ha più elettroni","L'azoto, perché è più a sinistra nel periodo","Hanno lo stesso raggio","Il fluoro, perché è più elettronegativo"],"r":1,"s":"Lungo un periodo il raggio diminuisce verso destra: N è più a sinistra di F.","f":0,"e":0},{"id":"tavola-q13","c":"tavola","l":2,"a":2,"q":"Quale atomo è più grande tra carbonio e germanio?","o":["Il germanio, perché è più in basso nel gruppo","Il carbonio, perché è più leggero","Hanno lo stesso raggio","Il carbonio, perché ha meno protoni"],"r":0,"s":"Scendendo in un gruppo si occupano gusci sempre più esterni.","f":0,"e":0},{"id":"tavola-q14","c":"tavola","l":2,"a":3,"q":"Quale elemento ha la prima energia di ionizzazione minore tra Al e S?","o":["S, perché è più a destra nel periodo","Sono uguali","S, perché ha più elettroni di valenza","Al, perché è più a sinistra nel periodo"],"r":3,"s":"L'energia di ionizzazione in generale aumenta lungo un periodo: l'elemento più a sinistra perde l'elettrone più facilmente.","f":0,"e":0},{"id":"tavola-q15","c":"tavola","l":2,"a":3,"q":"Quale elemento ha la prima energia di ionizzazione minore tra As e Sb?","o":["As, perché è più in alto ne izione terminano con il gruppo IIB","f":1,"e":1},{"id":"legame-q0","c":"legame","l":1,"a":0,"q":"Perché gli atomi formano legami chimici?","o":["Perché i legami aumentano l'energia potenziale del sistema","Perché i legami abbassano l'energia potenziale del sistema","Perché gli atomi isolati non possiedono elettroni","Perché i nuclei si attraggono tra loro"],"r":1,"s":"Un processo è spontaneo se porta a un'energia potenziale più bassa: legandosi, le particelle cariche degli atomi raggiungono una situazione più stabile.","f":0,"e":0},{"id":"legame-q1","c":"legame","l":1,"a":0,"q":"Che cosa rappresentano i puntini in un simbolo di Lewis?","o":["Gli elettroni di valenza","Tutti gli elettroni dell'atomo","I protoni del nucleo","I legami già formati dall'atomo"],"r":0,"s":"Il simbolo dell'elemento rappresenta nucleo ed elettroni interni; i puntini solo gli elettroni di valenza.","f":0,"e":0},{"id":"legame-q2","c":"legame","l":1,"a":1,"q":"Come si forma un legame ionico?","o":["Per condivisione di coppie di elettroni tra due non metalli","Per delocalizzazione degli elettroni di valenza su tutto il cristallo","Per sovrapposizione di orbitali di due atomi uguali","Per trasferimento di elettroni da un atomo elettropositivo a uno elettronegativo, seguito da attrazione elettrostatica"],"r":3,"s":"L'atomo con bassa energia di ionizzazione cede elettroni a quello con grande affinità elettronica; gli ioni di carica opposta si attraggono.","f":0,"e":0},{"id":"legame-q3","c":"legame","l":1,"a":1,"q":"Che cos'è l'energia reticolare?","o":["L'energia necessaria per rimuovere un elettrone da un atomo","L'energia di un singolo legame covalente","L'energia rilasciata quando il solido cristallino si forma dagli ioni gassosi separati","L'energia necessaria per fondere un metallo"],"r":2,"s":"È sempre esotermica e misura quanto fortemente gli ioni sono tenuti insieme nel reticolo.","f":0,"e":0},{"id":"legame-q4","c":"legame","l":1,"a":2,"q":"Che cosa sono le coppie solitarie?","o":["Coppie do un atomo acquista un elettrone","L'energia necessaria per ionizzare una mole di atomi","L'energia cinetica degli elettroni di legame"],"r":0,"s":"Si riferisce alla rottura omolitica del legame, in cui ogni atomo riceve metà degli elettroni di legame.","f":0,"e":0},{"id":"legame-q10","c":"legame","l":1,"a":6,"q":"Come è descritto il legame metallico nel modello più semplice?","o":["Anioni e cationi alternati in un reticolo","Molecole discrete tenute insieme da forze deboli","Atomi uniti da coppie di elettroni localizzate","Cationi metallici immersi in un mare di elettroni delocalizzati"],"r":3,"s":"Gli atomi rilasciano gli elettroni di valenza, condivisi da tutto il cristallo; il legame è l'attrazione tra cationi ed elettroni delocalizzati.","f":0,"e":0},{"id":"legame-q11","c":"legame","l":1,"a":3,"q":"Che cosa caratterizza il legame covalente coordinato?","o":["Ogni atomo fornisce un elettrone alla coppia","Un atomo cede definitivamente un elettrone all'altro","La coppia di elettroni condivisa proviene da un solo atomo","Gli elettroni sono delocalizzati su tutta la molecola"],"r":2,"s":"Un atomo dona l'intera coppia, che va a occupare un orbitale libero dell'altro atomo (un tempo era detto legame dativo).","f":0,"e":0},{"id":"legame-q12","c":"legame","l":2,"a":4,"q":"L'elettronegatività di N è 3,0 e quella di O è 3,5. Il legame N–O è:","o":["Covalente puro","Ionico","Covalente polare","Metallico"],"r":2,"s":"ΔEN = 0,5: rientra nell'intervallo 0,5–1,9 del legame covalente polare.","f":0,"e":0},{"id":"legame-q13","c":"legame","l":2,"a":4,"q":"Secondo la classificazione della lezione, da quale differenza di elettronegatività un legame è considerato ionico?","o":["Da 0,5 in su","Da 2,0 in su","Da 1,0 in su","Solo se è esattamente 4,0"],"r":1,"s":"ΔEN = 0 covalente puro; 0,1–0,4 non polare; 0,5–1,9 polare; ≥ 2,0 ionico.","f":0,"e":0},{"id":"legame-q14","c":"legame","l":2,"a":2,"q":"Quanti elettroni di valenza si devono distribuire nella struttura di Lewis di HNO₃?","o":["24","32","18","26"],"r":0,"s":"H = 1, N = 5, tre O = 3 · 6 = 18: in totale 24 elettroni.","f":0,"e":0},{"id":"legame-q15","c":"legame","l":2,"a":2,"q":"In SO₂, nella struttura con un legame doppio e uno singolo, lo zolfo ha una coppia solitaria e tre coppie di legame. Qual è la sua carica formale?","o":["0","−1","+2","+1"],"r":3,"s":"CF = elettroni di valenza − (elettroni di non legame + ½ elettroni di legame) = 6 − (2 + 3) = +1.","f":0,"e":0},{"id":"legame-q16","c":"legame","l":2,"a":1,"q":"Quale di questi cloruri ha l'energia reticolare maggiore (in valore assoluto)?","o":["NaCl","KCl","LiCl","CsCl"],"r":2,"s":"A parità di carica, lo ione più piccolo dà la distanza minore e l'attrazione più forte: LiCl −834, NaCl −787, KCl −701, CsCl −657 kJ/mol.","f":0,"e":0},{"id":"legame-q17","c":"legame","l":2,"a":5,"q":"Quale legame carbonio-carbonio è il più corto?","o":["C=C (134 pm)","C≡C (120 pm)","C–C (154 pm)","Hanno tutti la stessa lunghezza"],"r":1,"s":"Più elettroni sono condivisi, più i nuclei sono tenuti vicini.","f":0,"e":0},{"id":"legame-q18","c":"legame","l":2,"a":5,"q":"Quale legame carbonio-carbonio è il più forte?","o":["C≡C (837 kJ/mol)","C=C (611 kJ/mol)","C–C (347 kJ/mol)","Hanno tutti la stessa energia"],"r":0,"s":"Più elettroni sono condivisi, più forte è il legame; i legami più corti sono anche i più forti.","f":0,"e":0},{"id":"legame-q19","c":"legame","l":2,"a":2,"q":"Qual è lo schema di legame più comune per l'azoto?","o":["4 legami e nessuna coppia solitaria","2 legami e 2 coppie solitarie","1 legame e 3 coppie solitarie","3 legami e 1 coppia solitaria"],"r":3,"s":"Con 5 elettroni di valenza l'azoto forma 3 legami e conserva una coppia solitaria. Il carbonio ne forma 4, l'ossigeno 2, gli alogeni 1.","f":0,"e":0},{"id":"legame-q20","c":"legame","l":2,"a":3,"q":"In BF₃ il boro è circondato da 6 elettroni. Di che tipo di eccezione si tratta?","o":["Ottetto espanso","Numero dispari di elettroni","Ottetto incompleto","Non è un'eccezione"],"r":2,"s":"B e Al sono stabili con 6 elettroni di valenza, Be con 4, H con 2.","f":0,"e":0},{"id":"legame-q21","c":"legame","l":2,"a":3,"q":"Perché lo zolfo in SF₆ può avere più di otto elettroni di valenza?","o":["Perché il fluoro cede elettroni allo zolfo","Perché dispone di orbitali d vuoti (ottetto espanso)","Perché lo zolfo è un metallo","Perché i legami S–F sono ionici"],"r":1,"s":"Gli elementi dal terzo periodo in poi possono usare gli orbitali d vuoti per ospitare elettroni in eccesso: sono composti ipervalenti.","f":0,"e":0},{"id":"legame-q22","c":"legame","l":2,"a":1,"q":"Come si comporta NaCl rispetto alla conduzione elettrica?","o":["Non conduce allo stato solido, conduce fuso o in soluzione","Conduce allo stato solido, non in soluzione","Conduce in ogni stato","Non conduce in nessuno stato"],"r":0,"s":"Nel solido gli ioni sono bloccati; nel liquido e in soluzione sono liberi di muoversi verso gli elettrodi.","f":0,"e":0},{"id":"legame-q23","c":"legame","l":2,"a":6,"q":"Come varia la conducibilità elettrica di un metallo all'aumentare della temperatura?","o":["Aumenta","Resta costante","Si annulla subito","Diminuisce"],"r":3,"s":"Scaldando, gli ioni metallici vibrano più velocemente e ostacolano il passaggio degli elettroni attraverso il cristallo.","f":0,"e":0},{"id":"legame-q30","c":"legame","l":3,"a":1,"q":"Seleziona la proprietà che non appartiene ai solidi ionici","o":["Fragilità","Alto punto di fusione","Buona conducibilità elettrica allo stato solido","Buona conducibilità elettrica allo stato fuso","Buona conducibilità elettrica in soluzioni acquose"],"r":2,"s":"Gli ioni non hanno la libertà di movimento.","f":0,"e":1},{"id":"legame-q31","c":"legame","l":3,"a":1,"q":"Quale di questi composti contiene legami ionici?","o":["CO","F2","MgO","HF","H2O"],"r":2,"s":"Essendo un ossido metallico, il legame che si crea è ionico","f":0,"e":1},{"id":"legame-q32","c":"legame","l":3,"a":1,"q":"Quali di questi composti contiene un legame ionico","o":["BaCl2","H2","CO2","O2"],"r":0,"s":"BaCl₂ è formato da un metallo (Ba) e un non metallo (Cl): legame ionico. Gli altri sono molecole covalenti.","f":0,"e":1},{"id":"legame-q33","c":"legame","l":3,"a":1,"q":"Quale delle seguenti coppie di elementi può formare un legame ionico?","o":["Calcio e fluoro","Azoto e cloro","Zolfo e idrogeno","Carbonio e ossigeno","Cloro e bromo"],"r":0,"s":"differenza di elettronegatività maggiore di 1.9","f":0,"e":1},{"id":"legame-q34","c":"legame","l":3,"a":1,"q":"Quale contiene legami ionici?","o":["CaO","CO2","H2O","Cl2"],"r":0,"s":"Tutti gli altri legami sono covalenti. Inoltre, Δχ ≈ 2,44 quindi il legame ha elevato carattere ionico.","f":0,"e":1},{"id":"legame-q35","c":"legame","l":3,"a":2,"q":"quanti legami covalente singolare deve formare un atomo di ossigeno per raggiungere l'otteto?","o":["5","2","3","4"],"r":1,"s":"Si basta pensare alla molecola biatomica O2, che contiene un doppio legame covalente","f":0,"e":1},{"id":"legame-q36","c":"legame","l":3,"a":2,"q":"Da quale legame è costituita la molecola dell'azoto gassoso?","o":["Legame covalente singolo","Legame covalente doppio","Legame covalente triplo","Legame ionico"],"r":2,"s":"In N2 si ha un legame triplo covalente poiché si tratta di un non metallo e legandosi con se stesso avrà differenza di elettronegatività=0. Triplo per Lewis: e- esterni=5+5; per l'ottetto=8+8--> (16-10)/2=3 ordine di legame.","f":0,"e":1},{"id":"legame-q37","c":"legame","l":3,"a":2,"q":"Secondo la struttura di Lewis, quanti elettroni di valenza ha l'azoto nel suo stato fondamentale?","o":["4","6","5","10"],"r":2,"s":"Appartiene al quinto gruppo quindi 5 elettroni spaiati","f":0,"e":1},{"id":"legame-q38","c":"legame","l":3,"a":3,"q":"Nella molecola dell'acido nitrico l’azoto presenta :","o":["un legame semplice e due doppi.","la molecola è un ibrido di risonanza e la carica negativa è ripartita su tre atomi di ossigeno.","due legami semplici ed un legame doppio.","tre legami doppi.","tre legami semplici"],"r":2,"s":"HNO₃: l'azoto forma due legami semplici (N–OH, N–O) e un legame doppio con l'ossigeno (una delle formule limite).","f":0,"e":1},{"id":"legame-q39","c":"legame","l":3,"a":3,"q":"quale tra questi non è un ibrido di risonanza","o":["SO2","CCl4","C6H6","sono tutti ibridi di risonanza","O3"],"r":1,"s":"Ha solo legami singoli","f":0,"e":1},{"id":"legame-q40","c":"legame","l":3,"a":3,"q":"Quante sono le risonanze di struttura limite dell acido nitrico?","o":["1","2","3","4","5"],"r":1,"s":"HNO3 forma un legame semplice con O che lega H, un legame doppio e un legame dativo con gli altri due O; quest'ultimi si invertono nelle due forme limite...","f":0,"e":1},{"id":"legame-q41","c":"legame","l":3,"a":3,"q":"Quale tra questi non è un ibrido di risonanza","o":["HNO3","SO3","NO3-","CH3COOH"],"r":3,"s":"HNO3, SO3 e NO3- formano tutti un doppio legame con O2 che può essere ripartito tra i tre legami covalenti. CH3COOH non presenta risonanza.","f":0,"e":1},{"id":"legame-q42","c":"legame","l":3,"a":3,"q":"Quale composto non segue la regola dell'ottetto di Lewis (non le ricordo tutte)","o":["PCl5","HCN","NH3"],"r":0,"s":"PCl5 è una eccezione alla regola dell'ottetto perchè attorno al fosforo si contano 10 elettroni (5 doppietti)","f":0,"e":1},{"id":"legame-q43","c":"legame","l":3,"a":3,"q":"Quale di queste non rispetta la regola dell'ottetto?","o":["NH3","PCl5","H2O","S2","NH4+"],"r":1,"s":"https://www.chimicamo.org/chimica-generale/eccezioni-alla-regola-dellottetto.html","f":0,"e":1},{"id":"legame-q44","c":"legame","l":3,"a":3,"q":"Un ibrido di risonanza A, ha due formule limite A1 e A2. Sotto che forma è possibile trovarlo in un composto?","o":["Solo come A","Come A1, A2 e A","Come A1 e A"],"r":0,"s":"L'ibrido si trova solo nella forma di risonanza A","f":0,"e":1},{"id":"legame-q45","c":"legame","l":3,"a":4,"q":"Quale tra questi ha legami covalenti","o":["CH4","BaO","NaO"],"r":0,"s":"CH₄: carbonio e idrogeno sono non metalli e condividono elettroni, quindi legami covalenti.","f":0,"e":1},{"id":"legame-q46","c":"legame","l":3,"a":4,"q":"Quale ha legami covalenti?","o":["KBr","CsF","NaCl","H2O"],"r":3,"s":"H₂O: idrogeno e ossigeno sono non metalli e condividono elettroni; KBr, CsF e NaCl sono sali ionici.","f":0,"e":1},{"id":"legame-q47","c":"legame","l":3,"a":4,"q":"Quale tra i seguenti composti presenta solo legami covalenti?","o":["SO3","PbS","NaCl","BaSO4","HCl"],"r":4,"s":"Possibili composti la cui differenza di elettronegatività sia inferiore a 1,7 (0,96 per HCl) e che condividono elettroni per il raggiungimento dell’ottetto presentano legame covalente.","f":0,"e":1},{"id":"legame-q48","c":"legame","l":3,"a":5,"q":"Qual è il legame più forte?","o":["C-C","C-H","C=C","C≡C","C-O"],"r":3,"s":"Perché il triplo legame presenta una maggior vicinanza tra le due molecole aumentando l'energia di legame","f":0,"e":1},{"id":"legame-q49","c":"legame","l":3,"a":5,"q":"Quale tra questi legami è il più forte?","o":["N2","O2","HCl","N3"],"r":0,"s":"Il legame triplo è il più forte","f":0,"e":1},{"id":"legame-q50","c":"legame","l":3,"a":5,"q":"Which molecule has the highest dissociation energy?","o":["Cl2","F2","N2","O2","Br2"],"r":2,"s":"L'energia di dissociazione è tanto maggiore quanto è forte il legame. Quindi maggiore sarà l'energia di legame e maggiore sarà a sua volta l'energia di dissociazione. In questo caso l'energia di legame maggiore ce l'ha N2 che forma un triplo legame e quindi avrà anche l'energia di dissociazione maggiore. Comunque per conferma: https://www.chimicamo.org/chimica-fisica/energia-di-legame.html","f":0,"e":1},{"id":"legame-q51","c":"legame","l":3,"a":5,"q":"Ordinare in ordine decrescente di forza di legame i seguenti composti","o":["HF, HCl, HBr, HI","HBr, HF, HI, HCl","HF, HBr, HI, HCl","HCl, HF, HBr, HI"],"r":0,"s":"HF, HCl, HBr, HI","f":0,"e":1},{"id":"legame-q52","c":"legame","l":3,"a":5,"q":"Quale tra le seguenti scelte ha la forza di legame maggiore in ordine decrescente?","o":["HI- HBr - HCl- HF","HF- HCl- HBr - HI","HCl- HF- HI- HBr","HI- HF - HCl- HBr"],"r":1,"s":"più il legame è ionico, più è forte. Quindi la forza di legame descresce con l'elettronegatività","f":0,"e":1},{"id":"orbitalimolecolari-q0","c":"orbitalimolecolari","l":1,"a":0,"q":"Qual è il principio alla base della teoria VSEPR?","o":["Gli elettroni di valenza si attraggono tra loro","Gli atomi più pesanti occupano il centro della molecola","Le regioni ad alta densità elettronica si respingono e si dispongono il più lontano possibile","Gli orbitali atomici si combinano in orbitali molecolari"],"r":2,"s":"Legami e coppie solitarie attorno all'atomo centrale si dispongono in modo da rendere minima la repulsione reciproca.","f":0,"e":0},{"id":"orbitalimolecolari-q1","c":"orbitalimolecolari","l":1,"a":0,"q":"Nella teoria VSEPR, come si conta un legame doppio?","o":["Come due gruppi di elettroni","Come un solo gruppo di elettroni","Come quattro gruppi di elettroni","Non si conta"],"r":1,"s":"Le coppie di un legame multiplo restano insieme e respingono le altre come un'unica regione ad alta densità elettronica.","f":0,"e":0},{"id":"orbitalimolecolari-q2","c":"orbitalimolecolari","l":1,"a":0,"q":"Quale geometria corrisponde a due gruppi di elettroni attorno all'atomo centrale?","o":["Lineare, con angolo di 180°","Trigonale planare, con angoli di 120°","Tetraedrica, con angoli di 109,5°","Angolare, con angolo di 90°"],"r":0,"s":"Due gruppi si dispongono da parti opposte rispetto all'atomo centrale.","f":0,"e":0},{"id":"orbitalimolecolari-q3","c":"orbitalimolecolari","l":1,"a":0,"q":"Quale geometria corrisponde a quattro gruppi di elettroni, tutti di legame?","o":["Planare quadrata, con angoli di 90°","Trigonale planare, con angoli di 120°","Lineare, con angolo di 180°","Tetraedrica, con angoli di 109,5°"],"r":3,"s":"Quattro gruppi si dirigono verso i vertici di un tetraedro (non di un quadrato): così sono più lontani.","f":0,"e":0},{"id":"orbitalimolecolari-q4","c":"orbitalimolecolari","l":1,"a":1,"q":"Nella formula VSEPR AXₙEₘ, che cosa rappresenta E?","o":["Un atomo legato all'atomo centrale","L'atomo centrale","Una coppia solitaria sull'atomo centrale","Un elettrone spaiato"],"r":2,"s":"A è l'atomo centrale, X un atomo legato, E una coppia solitaria.","f":0,"e":0},{"id":"orbitalimolecolari-q5","c":"orbitalimolecolari","l":1,"a":2,"q":"Come si forma un legame sigma (σ)?","o":["Per sovrapposizione laterale di due orbitali p","Per sovrapposizione degli orbitali lungo l'asse che congiunge i due nuclei","Per trasferimento di un elettrone","Per delocalizzazione degli elettroni su tutta la molecola"],"r":1,"s":"Il legame σ ha simmetria cilindrica attorno all'asse internucleare e nessun piano nodale che lo contenga.","f":0,"e":0},{"id":"orbitalimolecolari-q6","c":"orbitalimolecolari","l":1,"a":2,"q":"Come si forma un legame pi greco (π)?","o":["Per sovrapposizione laterale di orbitali p perpendicolari all'asse di legame","Per sovrapposizione frontale di due orbitali s","Per sovrapposizione di un orbitale s con uno p lungo l'asse","Per attrazione tra ioni di carica opposta"],"r":0,"s":"Nel legame π la densità elettronica sta in due lobi ai lati dell'asse internucleare, che giace su un piano nodale.","f":0,"e":0},{"id":"orbitalimolecolari-q7","c":"orbitalimolecolari","l":1,"a":3,"q":"Che cos'è l'ibridazione?","o":["La combinazione di orbitali di atomi diversi in orbitali molecolari","Il trasferimento di elettroni da un atomo all'altro","La delocalizzazione degli elettroni in un metallo","La combinazione di orbitali atomici dello stesso atomo in nuovi orbitali"],"r":3,"s":"Gli orbitali ibridi (sp³, sp², sp) nascono mescolando orbitali s e p di uno stesso atomo.","f":0,"e":0},{"id":"orbitalimolecolari-q8","c":"orbitalimolecolari","l":1,"a":4,"q":"Nel metodo LCAO, quanti orbitali molecolari si ottengono combinando un certo numero di orbitali atomici?","o":["La metà","Il doppio","Lo stesso numero","Sempre due"],"r":2,"s":"Il numero di orbitali molecolari è uguale al numero di orbitali atomici di partenza: da due orbitali 1s si ottengono un legante e un antilegante.","f":0,"e":0},{"id":"orbitalimolecolari-q9","c":"orbitalimolecolari","l":1,"a":4,"q":"Che cos'è un orbitale molecolare antilegante?","o":["Un orbitale a energia più bassa, con alta densità elettronica tra i nuclei","Un orbitale a energia più alta, derivante da interferenza distruttiva","Un orbitale che contiene solo coppie solitarie","Un orbitale atomico non ibridato"],"r":1,"s":"Un elettrone in un orbitale antilegante è in gran parte escluso dalla regione tra i nuclei e ha energia maggiore che negli orbitali atomici.","f":0,"e":0},{"id":"orbitalimolecolari-q10","c":"orbitalimolecolari","l":1,"a":4,"q":"Come si calcola l'ordine di legame nella teoria degli orbitali molecolari?","o":["½ (elettroni leganti − elettroni antileganti)","Elettroni leganti + elettroni antileganti","2 · (elettroni leganti − elettroni antileganti)","Elettroni leganti / elettroni antileganti"],"r":0,"s":"Ogni coppia di elettroni leganti non compensata da elettroni antileganti corrisponde a un legame.","f":0,"e":0},{"id":"orbitalimolecolari-q11","c":"orbitalimolecolari","l":1,"a":5,"q":"Che cosa distingue un conduttore, un semiconduttore e un isolante?","o":["Il numero di protoni nel nucleo","La massa degli atomi","Il colore del materiale","L'ampiezza del gap di energia tra banda di valenza e banda di conduzione"],"r":3,"s":"Gap nullo o piccolo → conduttore; gap intermedio → semiconduttore; gap molto grande rispetto a kB·T → isolante.","f":0,"e":0},{"id":"orbitalimolecolari-q12","c":"orbitalimolecolari","l":2,"a":0,"q":"Quale geometria ha la molecola PCl₅?","o":["Ottaedrica","Tetraedrica","Piramide a base quadrata","Bipiramide trigonale"],"r":3,"s":"Cinque coppie di legame: tre atomi equatoriali a 120° e due assiali a 90° dal piano.","f":0,"e":0},{"id":"orbitalimolecolari-q13","c":"orbitalimolecolari","l":2,"a":0,"q":"Quale geometria ha la molecola SF₆?","o":["Bipiramide trigonale","Esagonale planare","Ottaedrica","Tetraedrica"],"r":2,"s":"Sei coppie di legame: quattro ai vertici di un quadrato e due sopra e sotto il piano.","f":0,"e":0},{"id":"orbitalimolecolari-q14","c":"orbitalimolecolari","l":2,"a":0,"q":"Quale geometria ha la molecola BF₃?","o":["Piramidale trigonale, 107°","Trigonale planare, 120°","Tetraedrica, 109,5°","A forma di T, 90°"],"r":1,"s":"Il boro ha tre coppie di legame e nessuna coppia solitaria (AX₃).","f":0,"e":0},{"id":"orbitalimolecolari-q15","c":"orbitalimolecolari","l":2,"a":1,"q":"Lo ione solfito SO₃²⁻ ha una coppia solitaria sullo zolfo (AX₃E). Qual è la sua forma?","o":["Piramidale trigonale","Trigonale planare","Tetraedrica","A forma di T"],"r":0,"s":"Quattro gruppi di elettroni in disposizione tetraedrica, ma solo tre sono atomi: la forma è una piramide trigonale, come NH₃.","f":0,"e":0},{"id":"orbitalimolecolari-q16","c":"orbitalimolecolari","l":2,"a":1,"q":"Qual è l'ordine corretto dell'intensità delle repulsioni tra coppie di elettroni?","o":["legame–legame > solitaria–legame > solitaria–solitaria","solitaria–legame > solitaria–solitaria > legame–legame","Sono tutte uguali","solitaria–solitaria > solitaria–legame > legame–legame"],"r":3,"s":"Le coppie solitarie sono localizzate sull'atomo centrale e occupano più spazio: respingono di più.","f":0,"e":0},{"id":"orbitalimolecolari-q17","c":"orbitalimolecolari","l":2,"a":1,"q":"La molecola CO₂ ha legami C=O polari. È una molecola polare?","o":["Sì, perché contiene legami polari","Sì, perché l'ossigeno ha coppie solitarie","No, perché è lineare e i dipoli si annullano","No, perché i legami C=O non sono polari"],"r":2,"s":"Per essere polare una molecola deve avere legami polari e una forma non simmetrica: in CO₂ i due dipoli sono uguali e opposti.","f":0,"e":0},{"id":"orbitalimolecolari-q18","c":"orbitalimolecolari","l":2,"a":3,"q":"Quale ibridazione ha il carbonio nel metano, CH₄?","o":["sp²","sp³","sp","Nessuna"],"r":1,"s":"Quattro gruppi di elettroni → quattro orbitali ibridi sp³ a 109,5°.","f":0,"e":0},{"id":"orbitalimolecolari-q19","c":"orbitalimolecolari","l":2,"a":3,"q":"Quale ibridazione ha ciascun carbonio nell'etene, C₂H₄?","o":["sp²","sp³","sp","sp³d"],"r":0,"s":"Tre gruppi di elettroni attorno a ogni carbonio → tre ibridi sp² a 120°; l'orbitale p rimasto forma il legame π.","f":0,"e":0},{"id":"orbitalimolecolari-q20","c":"orbitalimolecolari","l":2,"a":3,"q":"Quale ibridazione ha ciascun carbonio nell'etino, C₂H₂?","o":["sp²","sp³","sp³d²","sp"],"r":3,"s":"Due gruppi di elettroni → due ibridi sp a 180°; i due orbitali p rimasti formano i due legami π del triplo legame.","f":0,"e":0},{"id":"orbitalimolecolari-q21","c":"orbitalimolecolari","l":2,"a":2,"q":"Da quali legami è formato il triplo legame della molecola N₂?","o":["Tre legami σ","Due legami σ e un legame π","Un legame σ e due legami π","Tre legami π"],"r":2,"s":"Solo una coppia di orbitali p può sovrapporsi frontalmente (σ); le altre due coppie si sovrappongono lateralmente (π).","f":0,"e":0},{"id":"orbitalimolecolari-q22","c":"orbitalimolecolari","l":2,"a":4,"q":"Qual è l'ordine di legame della molecola H₂?","o":["0","1","2","½"],"r":1,"s":"Due elettroni nell'orbitale legante e nessuno nell'antilegante: ½ (2 − 0) = 1.","f":0,"e":0},{"id":"orbitalimolecolari-q23","c":"orbitalimolecolari","l":2,"a":5,"q":"Che tipo di semiconduttore si ottiene drogando il silicio con fosforo?","o":["Di tipo n, perché il fosforo fornisce elettroni in più","Di tipo p, perché il fosforo fornisce lacune","Intrinseco","Un isolante"],"r":0,"s":"Il fosforo ha un elettrone di valenza in più del silicio. Con il gallio, che ne ha uno in meno, si ottiene il tipo p.","f":0,"e":0},{"id":"orbitalimolecolari-q30","c":"orbitalimolecolari","l":3,"a":0,"q":"Indicare la geometria molecolare del metano.","o":["Trigonale Planare","Lineare","Tetraedrica","Trigonale piramidale","Ottaedrica"],"r":2,"s":"Nel metano il carbonio ha 4 coppie di legame e nessuna coppia solitaria: geometria tetraedrica.","f":0,"e":1},{"id":"orbitalimolecolari-q31","c":"orbitalimolecolari","l":3,"a":0,"q":"la molecola dell'acqua ha geometria","o":["Lineare","Trigolane planare","Tetragonale","Angolare"],"r":3,"s":"Ha due coppie di elettroni legati e due solitari->NS=4, 2 solitari->forma angolare","f":0,"e":1},{"id":"orbitalimolecolari-q32","c":"orbitalimolecolari","l":3,"a":0,"q":"quale tipo di struttura presenza l'ammoniaca ?","o":["trigonale planare","ottaedrica","tetragonale","piramide trigonale"],"r":3,"s":"In NH₃ l'azoto ha 3 legami e 1 coppia solitaria: la geometria è a piramide trigonale.","f":0,"e":1},{"id":"orbitalimolecolari-q33","c":"orbitalimolecolari","l":3,"a":0,"q":"Qual è la geometria della molecola di CO2","o":["Planare","Trigonale","Tetraedrica","Lineare","Piramidale"],"r":3,"s":"In CO₂ il carbonio ha 2 regioni di densità elettronica e nessuna coppia solitaria: geometria lineare.","f":0,"e":1},{"id":"orbitalimolecolari-q34","c":"orbitalimolecolari","l":3,"a":0,"q":"Quale di queste molecole è lineare?","o":["H2S","CO2","CH3-CH3","SO2","CH4"],"r":1,"s":"Teoria. Molecola apolare lineare","f":0,"e":1},{"id":"orbitalimolecolari-q35","c":"orbitalimolecolari","l":3,"a":0,"q":"Per prevedere il grado di polarità di una molecola è necessario conoscere:","o":["L'elettronegatività dei suoi atomi e la sua geometria","L'elettronegatività dei suoi atomi","Il numero di ossidazione dei suoi atomi","La sua geometria","La sua formula di struttura"],"r":0,"s":"La differenza vettoriale dell'elettronegatività dei singoli atomi permette di stimare il grado di polarità di un legame. Perciò il grado di polarità varia all'aumentare della differenza di elettronegatività tra gli atomi coinvolti nel legame.","f":0,"e":1},{"id":"orbitalimolecolari-q36","c":"orbitalimolecolari","l":3,"a":1,"q":"Quale delle seguenti molecole non è polare?","o":["Br2","HCl","H2O"],"r":0,"s":"Simmetrica, stesso valore di elettronegatività.","f":0,"e":1},{"id":"orbitalimolecolari-q37","c":"orbitalimolecolari","l":3,"a":1,"q":"quale delle molecole seguenti è polare","o":["F2","HBr","Br2","H2","SF6"],"r":1,"s":"Il legame covalente polare si verifica tra DUE atomi che hanno differenza di elettronegatività tra 0.4 e 1.7. Oppure tra molecole con struttura non regolare","f":0,"e":1},{"id":"orbitalimolecolari-q38","c":"orbitalimolecolari","l":3,"a":1,"q":"Quale delle seguenti molecole è apolare?","o":["HI","Br2","HCl","HCN"],"r":1,"s":"Br₂ è biatomica omonucleare: ΔEN = 0, quindi apolare. HI, HCl e HCN sono polari.","f":0,"e":1},{"id":"orbitalimolecolari-q39","c":"orbitalimolecolari","l":3,"a":1,"q":"Quali di queste molecole è apolare?","o":["HCN","HCl","H2","HBr","NO"],"r":2,"s":"H₂ è biatomica omonucleare: non c'è differenza di elettronegatività, quindi è apolare.","f":0,"e":1},{"id":"orbitalimolecolari-q40","c":"orbitalimolecolari","l":3,"a":1,"q":"Quale tra questi composti non è polare","o":["CO2","HCl","HF","HI","H2O"],"r":0,"s":"CO₂ ha legami C=O polari, ma la geometria lineare fa annullare i dipoli: molecola apolare.","f":0,"e":1},{"id":"orbitalimolecolari-q41","c":"orbitalimolecolari","l":3,"a":1,"q":"Dire quale tra cis-2-butene e trans-2-butene ha momento di dipolo non nullo","o":["Cis","Trans","Nessuno","Entrambi","Non c’è isomeria"],"r":0,"s":"Il cis-2-butene non è simmetrico rispetto al legame doppio","f":1,"e":1},{"id":"orbitalimolecolari-q42","c":"orbitalimolecolari","l":3,"a":3,"q":"Che tipo di ibridazione è presente nell'atomo centrale di C quando forma il metano?","o":["sp","sp3","sp2","sp3d2","Nessuna di queste"],"r":1,"s":"Il carbonio del metano forma 4 legami σ equivalenti con 4 orbitali ibridi sp³.","f":1,"e":1},{"id":"orbitalimolecolari-q43","c":"orbitalimolecolari","l":3,"a":3,"q":"Cosa hanno in comune il bezene e l'etene?","o":["ibridazione sp2","risonanza","si ossidano facilmente"],"r":0,"s":"Teoria VB, il carbonio con doppi legami è ibridizzato sp2","f":0,"e":1},{"id":"orbitalimolecolari-q44","c":"orbitalimolecolari","l":3,"a":3,"q":"l modello dell'ibridazione sp3 puo essere usato per rappresentare la struttura di :","o":["Acetilene C2H2 (gas infiammabile)","catione ammonio (NH4+ )","C grafite (solido covalente)","Benzene C6H6 (liquido)"],"r":1,"s":"Acetilene è un alchino quindi ibridizzato sp, benzene sp2 e la grafite sp2","f":0,"e":1},{"id":"orbitalimolecolari-q45","c":"orbitalimolecolari","l":3,"a":3,"q":"Quale delle seguenti affermazioni riguardo al diamante è falsa:","o":["è un solido covalente di simmetria tetraedrica","Il carbonio si ibridizza sp3 per cui si collega ad altri 4 atomi di C","non riesce a condurre elettricità","è preparato per sintesi dalla grafite","il carbonio non è ibiridizzato"],"r":4,"s":"La configurazione elettronica del carbonio nel suo stato fondamentale è 1s2 2s2 2p2 ma esso può legare altri atomi facendo uso dei suoi quattro orbitali ibridi sp3 diretti verso i vertici di un tetraedro. Ciascun atomo di carbonio si legherà così covalentemente con altri quattro atomi di carbonio disposti tetraedricamente per dare l'edificio cristallino del diamante.","f":0,"e":1},{"id":"orbitalimolecolari-q46","c":"orbitalimolecolari","l":3,"a":3,"q":"Quale di queste proprietà è attribuibile al Benzene?","o":["La sua formula di struttura è C6H12","Il Carbonio è ibridato sp","I legami sono saturi","E' molto reattivo","La molecola di benzene è planare"],"r":4,"s":"I carboni del benzene sono ibridati sp2, pertanto la disposizione della molecola è planare","f":0,"e":1},{"id":"organica-q0","c":"organica","l":1,"a":0,"q":"Che cosa sono gli idrocarburi?","o":["Composti formati da carbonio, idrogeno e ossigeno","Composti che contengono acqua","Tutti i composti che contengono carbonio","Composti formati solo da carbonio e idrogeno"],"r":3,"s":"Gli idrocarburi contengono solo C e H; per questo non hanno legami polari e sono insolubili in acqua.","f":0,"e":0},{"id":"organica-q1","c":"organica","l":1,"a":0,"q":"Qual è la formula generale degli alcani a catena aperta?","o":["CₙH₂ₙ","CₙH₂ₙ₋₂","CₙH₂ₙ₊₂","CₙHₙ"],"r":2,"s":"CₙH₂ₙ è la formula degli alcheni con un doppio legame ( ₁/T₁ = P₂/T₂ a volume costante, con T in kelvin.","f":0,"e":0},{"id":"gas-q5","c":"gas","l":1,"a":1,"q":"Che cosa afferma la legge di Avogadro?","o":["A pari temperatura, tutti i gas hanno la stessa densità","A pari volume, tutti i gas hanno la stessa massa","A pari pressione, il volume non dipende dal numero di molecole","A pari temperatura e pressione, lo stesso numero di molecole occupa lo stesso volume, qualunque sia il gas"],"r":3,"s":"Il volume dipende da quante molecole ci sono, non dalla loro natura chimica.","f":0,"e":0},{"id":"gas-q6","c":"gas","l":1,"a":2,"q":"Qual è l'equazione di stato dei gas ideali?","o":["PV = RT/n","P/V = nRT","PV = nRT","PT = nRV"],"r":2,"s":"Combina le leggi di Boyle, Charles e Avogadro; R = 0,0821 L·atm/(mol·K).","f":0,"e":0},{"id":"gas-q7","c":"gas","l":1,"a":2,"q":"A quali condizioni corrisponde la sigla STP?","o":["25 °C e 1 atm","0 °C e 1 atm","0 K e 1 atm","100 °C e 1 bar"],"r":1,"s":"A temperatura e pressione standard (0 °C, 1 atm) una mole di gas ideale occupa 22,4 L.","f":0,"e":0},{"id":"gas-q8","c":"gas","l":1,"a":4,"q":"Che cosa afferma la legge di Dalton?","o":["La pressione totale di una miscela è la somma delle pressioni parziali dei gas","Il volume totale di una miscela è minore della somma dei volumi parziali","In una miscela tutti i gas hanno la stessa pressione parziale","La pressione totale è il prodotto delle pressioni parziali"],"r":0,"s":"Ptot = Pa + Pb + Pc + …: ogni gas contribuisce come se fosse da solo nel recipiente.","f":0,"e":0},{"id":"gas-q9","c":"gas","l":1,"a":4,"q":"Che cos'è la frazione molare di un componente?","o":["La massa del componente divisa per la massa totale","Le moli del componente divise per il volume","Le moli totali divise per le moli del componente","Le moli del componente divise per le moli totali"],"r":3,"s":"È un numero tra 0 e 1; la somma delle frazioni molari di tutti i componenti vale 1.","f":0,"e":0},{"id":"gas-q10","c":"gas","l":1,"a":5,"q":"Quanto vale il fattore di compressione Z per un gas ideale?","o":["0","Infinito","1","Dipende dalla temperatura"],"r":2,"s":"Z è il rapporto tra il volume molare reale e quello ideale: per un gas ideale i due coincidono.","f":0,"e":0},{"id":"gas-q11","c":"gas","l":1,"a":5,"q":"Che cos'è la temperatura critica?","o":["La temperatura a cui un gas ha volume zero","La temperatura sopra la quale una sostanza non può esistere come liquido, a qualunque pressione","La temperatura di ebollizione a 1 atm","La temperatura a cui un gas diventa ideale"],"r":1,"s":"Sopra la temperatura critica nessuna compressione riesce a liquefare il gas.","f":0,"e":0},{"id":"gas-q12","c":"gas","l":2,"a":0,"q":"A quante atmosfere corrispondono 380 mmHg?","o":["2,0 atm","0,50 atm","0,38 atm","380 atm"],"r":1,"s":"1 atm = 760 mmHg, quindi 380 / 760 = 0,50 atm.","f":0,"e":0},{"id":"gas-q13","c":"gas","l":2,"a":1,"q":"Un gas occupa 2,0 L a 1,0 atm. A temperatura costante viene compresso fino a 4,0 atm. Qual è il nuovo volume?","o":["0,50 L","8,0 L","2,0 L","1,0 L"],"r":0,"s":"Boyle: V₂ = P₁V₁ / P₂ = 1,0 · 2,0 / 4,0 = 0,50 L.","f":0,"e":0},{"id":"gas-q14","c":"gas","l":2,"a":1,"q":"Un gas occupa 3,0 L a 300 K. A pressione costante viene scaldato fino a 600 K. Qual è il nuovo volume?","o":["1,5 L","3,0 L","9,0 L","6,0 L"],"r":3,"s":"Charles: V₂ = V₁ · T₂/T₁ = 3,0 · 600/300 = 6,0 L.","f":0,"e":0},{"id":"gas-q15","c":"gas","l":2,"a":1,"q":"Un gas in un recipiente rigido ha pressione 1,0 atm a 273 K. Quale pressione ha a 546 K?","o":["0,50 atm","1,0 atm","2,0 atm","4,0 atm"],"r":2,"s":"Gay-Lussac: P₂ = P₁ · T₂/T₁ = 1,0 · 546/273 = 2,0 atm.","f":0,"e":0},{"id":"gas-q16","c":"gas","l":2,"a":2,"q":"Quale volume occupa 1,00 mol di gas ideale a 273 K e 1,00 atm?","o":["24,5 L","22,4 L","1,00 L","0,0821 L"],"r":1,"s":"V = nRT/P = 1,00 · 0,0821 · 273 / 1,00 = 22,4 L: è il volume molare a STP.","f":0,"e":0},{"id":"gas-q17","c":"gas","l":2,"a":2,"q":"Quante moli di gas sono contenute in 10,0 L a 2,00 atm e 300 K? (R = 0,0821 L·atm/(mol·K))","o":["0,812 mol","1,23 mol","0,0667 mol","8,12 mol"],"r":0,"s":"n = PV/RT = (2,00 · 10,0) / (0,0821 · 300) = 0,812 mol.","f":0,"e":0},{"id":"gas-q18","c":"gas","l":2,"a":4,"q":"Una miscela contiene N₂ a 0,60 atm, O₂ a 0,30 atm e Ar a 0,10 atm. Qual è la pressione totale?","o":["0,33 atm","0,018 atm","0,60 atm","1,00 atm"],"r":3,"s":"Dalton: Ptot = 0,60 + 0,30 + 0,10 = 1,00 atm.","f":0,"e":0},{"id":"gas-q19","c":"gas","l":2,"a":4,"q":"Nell'aria la frazione molare dell'ossigeno è 0,21. A una pressione totale di 1,0 atm, qual è la pressione parziale di O₂?","o":["0,79 atm","4,8 atm","0,21 atm","1,0 atm"],"r":2,"s":"Pᵢ = xᵢ · Ptot = 0,21 · 1,0 = 0,21 atm.","f":0,"e":0},{"id":"gas-q20","c":"gas","l":2,"a":3,"q":"A parità di temperatura e pressione, quale di questi gas è il più denso?","o":["N₂ (28 g/mol)","CO₂ (44 g/mol)","O₂ (32 g/mol)","He (4 g/mol)"],"r":1,"s":"d = PM/RT: a pari P e T la densità cresce con la massa molare.","f":0,"e":0},{"id":"gas-q21","c":"gas","l":2,"a":1,"q":"A quale temperatura in gradi Celsius corrisponde lo zero assoluto?","o":["−273,15 °C","0 °C","−100 °C","−373,15 °C"],"r":0,"s":"Estrapolando la legge di Charles, il volume di tutti i gas si annullerebbe a −273,15 °C = 0 K.","f":0,"e":0},{"id":"gas-q22","c":"gas","l":2,"a":5,"q":"In quali condizioni i gas reali si discostano di più dal comportamento ideale?","o":["Basse pressioni e alte temperature","Basse pressioni e basse temperature","Solo a 0 °C e 1 atm","Alte pressioni e basse temperature"],"r":3,"s":"A pressioni alte le molecole sono vicine e a temperature basse sono lente: le forze intermolecolari diventano importanti.","f":0,"e":0},{"id":"gas-q23","c":"gas","l":2,"a":4,"q":"In una miscela gassosa, a che cosa è uguale la percentuale in volume di un componente?","o":["Alla sua percentuale in massa","Alla sua massa molare","Alla sua percentuale in moli","Alla sua densità"],"r":2,"s":"%vᵢ = xᵢ · 100: per Avogadro il volume è proporzionale al numero di moli.","f":0,"e":0},{"id":"gas-q30","c":"g  Dunque per T=0 P=0 quindi il grafico toccherà l’asse delle ascisse per T = 0K","f":1,"e":1},{"id":"gas-q37","c":"gas","l":3,"a":1,"q":"se ho un contenitore indeformabile con all'interno gas ideale alla pressione di 1 atm a 1 °C. Se la pressione viene portata a 2 atm quanto vale la temperatura?","o":["275 °C","275 K","2 °C","Nessuna della altre"],"r":0,"s":"A volume costante il rapporto pressione temperatura rimane costante. Quindi 1/1=2/2. La temperatura però deve essere espressa in Kelvin, quindi se T1 = 274 K allora T2 = 2*274 K = 548 K ovvero 275 °C","f":1,"e":1},{"id":"gas-q38","c":"gas","l":3,"a":1,"q":"A parità di pressione e temperatura, una mole di gas He occupa un volume pari a quello occupato da :","o":["16 g di ossigeno","due moli di un gas monoatomico","mezza mole di un gas biatomico","14 g di azoto","28 g di azoto"],"r":4,"s":"16g di o2 = 1/2 mole 14g di N2 = 1/2 mole 28g di N2 = 1 mole V=nRT/P-> V1=V2 (n uguale)","f":0,"e":1},{"id":"gas-q39","c":"gas","l":3,"a":1,"q":"Ci sono due contenitori di 100 ml contenenti uno Azoto e l'altro Ossigeno a condizioni di pressione e temperatura standard. Essi hanno:","o":["stesso numero di molecole","stessa velocità media delle molecole","nessuna delle precedenti"],"r":0,"s":"è la risposta esatta, ho chiesto al prof","f":1,"e":1},{"id":"gas-q40","c":"gas","l":3,"a":1,"q":"Un gas ideale occupa un volume di 4,5 L a 300K. Considerando P costante, a quale T il gas occupa un volume di 9,0 L?","o":["150K","150°C","600K","373K","300K"],"r":2,"s":"V1/T1=V2/T2","f":0,"e":1},{"id":"gas-q41","c":"gas","l":3,"a":1,"q":"Ho un gas a 100K e il volume aumenta de 50%. A pressione costante quale sarà la temperatura?","o":["Non è possibile rispondere","100k","50K","150K","200k"],"r":3,"s":"A P costante V/T = costante: se V aumenta del 50%, T = 100 · 1,5 = 150 K.","f":0,"e":1},{"id":"gas-q42","c":"gas","l":3,"a":1,"q":"Un gas in condizioni normali viene compresso isotermicamente fino a raggiungere una pressione pari a 3 volte quella at  considerano nulli gli effetti delle interazioni intermolecolari responsabili della liquefazione. \" Ronchetti Delmastro","f":0,"e":1},{"id":"gas-q58","c":"gas","l":3,"a":5,"q":"A V=cost. Se aumento T in un gas, quale di queste proprietà cambia?","o":["Pressione","Il rapporto tra pressione e temperatura","Almeno due delle risposte"],"r":0,"s":"P=nRT/V con NR/V costante . Quindi la pressione varia linearmente con la temperatura","f":1,"e":1},{"id":"termo1-q0","c":"termo1","l":1,"a":0,"q":"Che cosa scambia con l'ambiente un sistema chiuso?","o":["Materia ed energia","Energia ma non materia","Né materia né energia","Materia ma non energia"],"r":1,"s":"Aperto: materia ed energia. Chiuso: solo energia. Isolato: nulla.","f":0,"e":0},{"id":"termo1-q1","c":"termo1","l":1,"a":0,"q":"Che cosa scambia con l'ambiente un sistema isolato?","o":["Nulla","Solo energia","Solo materia","Materia ed energia"],"r":0,"s":"Un sistema isolato non scambia né materia né energia: la sua energia interna resta costante.","f":0,"e":0},{"id":"termo1-q2","c":"termo1","l":1,"a":1,"q":"Che cosa afferma il primo principio della termodinamica?","o":["L'entropia di un sistema isolato aumenta sempre","Il calore fluisce sempre dal corpo freddo a quello caldo","L'energia interna di ogni sistema è sempre zero","L'energia interna di un sistema isolato è costante"],"r":3,"s":"In un sistema chiuso ΔU = q + w; se il sistema è isolato non ci sono scambi e U non cambia.","f":0,"e":0},{"id":"termo1-q3","c":"termo1","l":1,"a":1,"q":"Che cos'è una funzione di stato?","o":["Una proprietà che dipende dal percorso seguito","Una proprietà che vale solo per i gas","Una proprietà che dipende solo dallo stato attuale del sistema, non da come è stato raggiunto","Una proprietà che non può mai variare"],"r":2,"s":"U, H, P e V sono funzioni di stato; calore e lavoro no, perché dipendono dal modo in cui avviene la trasformazione.","f":0,"e":0},{"id":"termo1-q4","c":"termo1","l":1,"a":1,"q":"Che cos'è un processo esotermico?","o":["Un processo che assorbe calore dall'ambiente","Un processo che rilascia calore nell'ambiente","Un processo che avviene senza scambio di calore","Un processo che avviene a volume costante"],"r":1,"s":"Nelle trasformazioni esotermiche (per esempio le combustioni) q è negativo: l'energia esce dal sistema.","f":0,"e":0},{"id":"termo1-q5","c":"termo1","l":1,"a":2,"q":"Che cos'è il calore specifico?","o":["Il calore necessario per aumentare di 1 °C la temperatura di 1 g di sostanza","Il calore necessario per fondere 1 g di sostanza","Il calore necessario per aumentare di 1 °C la temperatura di una mole di sostanza","Il calore contenuto in 1 g di sostanza"],"r":0,"s":"Si misura in J/(g·°C) e compare in q = m·Cs·ΔT. Riferito a una mole è la capacità termica molare.","f":0,"e":0},{"id":"termo1-q6","c":"termo1","l":1,"a":3,"q":"Come è definita l'entalpia?","o":["H = U − PV","H = q + w","H = U − TS","H = U + PV"],"r":3,"s":"L'entalpia è la funzione di stato che permette di seguire gli scambi di energia a pressione costante.","f":0,"e":0},{"id":"termo1-q7","c":"termo1","l":1,"a":3,"q":"A pressione costante e senza lavoro non di espansione, a che cosa è uguale ΔH?","o":["Al lavoro compiuto","A zero","Al calore scambiato","Alla variazione di temperatura"],"r":2,"s":"Per questo l'entalpia è così usata in chimica: la maggior parte delle reazioni avviene a pressione atmosferica costante.","f":0,"e":0},{"id":"termo1-q8","c":"termo1","l":1,"a":5,"q":"Che cosa afferma la legge di Hess?","o":["Il ΔH di una reazione dipende dal numero di stadi","Il ΔH di una reazione è la somma dei ΔH degli stadi in cui può essere scomposta","Il ΔH di una reazione è sempre negativo","Il ΔH di una reazione non dipende dallo stato fisico dei reagenti"],"r":1,"s":"È una conseguenza del fatto che l'entalpia è una funzione di stato: conta solo la differenza tra stato finale e iniziale.","f":0,"e":0},{"id":"termo1-q9","c":"termo1","l":1,"a":5,"q":"Che cos'è l'entalpia standard di formazione?","o":["Il ΔH° per la formazione di una mole di sostanza dai suoi elementi nella forma più stabile","Il ΔH° per la combustione di una mole di sostanza","Il ΔH° per la fusione di una mole di sostanza","L'energia per separare una mole di sostanza nei suoi ioni"],"r":0,"s":"Si esprime in kJ/mol e permette di calcolare l'entalpia di qualsiasi reazione.","f":0,"e":0},{"id":"termo1-q10","c":"termo1","l":1,"a":5,"q":"Quanto vale l'entalpia standard di formazione di un elemento nella sua forma più stabile?","o":["Dipende dall'elemento","È sempre positiva","È sempre negativa","Zero"],"r":3,"s":"Per convenzione gli elementi nella forma stabile sono il riferimento: ΔH°f = 0.","f":0,"e":0},{"id":"termo1-q11","c":"termo1","l":1,"a":1,"q":"Quale di queste grandezze NON è una funzione di stato?","o":["L'energia interna","L'entalpia","Il lavoro","La pressione"],"r":2,"s":"Il lavoro dipende da come avviene la trasformazione: un gas che si espande nel vuoto non ne compie, contro una pressione esterna sì, anche a parità di stato finale.","f":0,"e":0},{"id":"termo1-q12","c":"termo1","l":2,"a":1,"q":"Un sistema assorbe 50 J di calore e compie 20 J di lavoro sull'ambiente. Quanto vale ΔU?","o":["+70 J","−30 J","+30 J","−70 J"],"r":2,"s":"q = +50 J (entra), w = −20 J (esce): ΔU = q + w = +30 J.","f":0,"e":0},{"id":"termo1-q13","c":"termo1","l":2,"a":2,"q":"Quanto calore assorbe una moneta di rame da 3,10 g scaldata da −8,0 °C a 37,0 °C? (Cs = 0,385 J/(g·°C))","o":["34,6 J","53,7 J","44,2 J","1,19 J"],"r":1,"s":"ΔT = 37,0 − (−8,0) = 45,0 °C; q = m·Cs·ΔT = 3,10 · 0,385 · 45,0 = 53,7 J. (34,6 J si ottiene sbagliando il segno e usando ΔT = 29 °C.)","f":0,"e":0},{"id":"termo1-q14","c":"termo1","l":2,"a":0,"q":"A quanti joule corrispondono 100 cal?","o":["418,4 J","23,9 J","100 J","4184 J"],"r":0,"s":"1 cal = 4,184 J, quindi 100 cal = 418,4 J. 4184 J corrispondono a 1 kcal, cioè a una caloria alimentare.","f":0,"e":0},{"id":"termo1-q15","c":"termo1","l":2,"a":3,"q":"Che relazione c'è tra l'entalpia di congelamento e l'entalpia di fusione di una sostanza?","o":["ΔH(congelamento) = ΔH(fusione)","ΔH(congelamento) = 2·ΔH(fusione)","Non c'è nessuna relazione","ΔH(congelamento) = −ΔH(fusione)"],"r":3,"s":"L'entalpia è una funzione di stato: il processo inverso ha ΔH uguale e di segno opposto.","f":0,"e":0},{"id":"termo1-q16","c":"termo1","l":2,"a":3,"q":"Come si esprime l'entalpia di sublimazione in funzione di quelle di fusione e di vaporizzazione (alla stessa temperatura)?","o":["ΔHsub = ΔHvap − ΔHfus","ΔHsub = ΔHfus · ΔHvap","ΔHsub = ΔHfus + ΔHvap","ΔHsub = ΔHfus − ΔHvap"],"r":2,"s":"Passare da solido a vapore direttamente o attraverso il liquido porta allo stesso stato finale: i ΔH si sommano.","f":0,"e":0},{"id":"termo1-q17","c":"termo1","l":2,"a":4,"q":"Per C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O, ΔH = −2044 kJ. Quanto vale ΔH per la combustione di 2 mol di propano?","o":["−2044 kJ","−4088 kJ","−1022 kJ","+4088 kJ"],"r":1,"s":"L'entalpia di reazione è estensiva: raddoppiando le quantità raddoppia ΔH.","f":0,"e":0},{"id":"termo1-q18","c":"termo1","l":2,"a":5,"q":"Che cosa accade al ΔH se si inverte un'equazione chimica?","o":["Cambia segno","Resta uguale","Raddoppia","Si annulla"],"r":0,"s":"Se la reazione diretta libera calore, quella inversa ne assorbe la stessa quantità.","f":0,"e":0},{"id":"termo1-q19","c":"termo1","l":2,"a":2,"q":"In quali condizioni misura il calore una bomba calorimetrica?","o":["A pressione costante","A temperatura costante","In assenza di ossigeno","A volume costante"],"r":3,"s":"La bomba è un contenitore rigido: il calore misurato corrisponde a ΔU. Il calorimetro a bicchieri lavora invece a pressione costante (ΔH).","f":0,"e":0},{"id":"termo1-q20","c":"termo1","l":2,"a":3,"q":"In una curva di riscaldamento, che cosa accade alla temperatura durante la fusione?","o":["Aumenta rapidamente","Diminuisce","Resta costante","Oscilla"],"r":2,"s":"Il calore fornito serve a separare le particelle e non ad aumentare la temperatura: la curva presenta un tratto orizzon  / T","ΔS = q(rev) · T","ΔS = ΔH − TΔG","ΔS = w / T"],"r":0,"s":"È il calore scambiato reversibilmente diviso per la temperatura assoluta.","f":0,"e":0},{"id":"termo2-q3","c":"termo2","l":1,"a":3,"q":"Che cosa afferma il secondo principio della termodinamica?","o":["L'energia interna di un sistema isolato è costante","L'entropia di un cristallo perfetto è zero a 0 K","L'entalpia di ogni reazione spontanea è negativa","L'entropia di un sistema isolato aumenta in ogni trasformazione spontanea"],"r":3,"s":"Nel bilancio vanno considerati sistema e ambiente: la loro entropia totale deve aumentare.","f":0,"e":0},{"id":"termo2-q4","c":"termo2","l":1,"a":2,"q":"Che cosa afferma il terzo principio della termodinamica?","o":["L'entropia dell'universo è costante","L'energia non si crea né si distrugge","L'entropia dei cristalli perfetti tende a zero quando la temperatura tende a 0 K","L'entropia dei gas è zero a 25 °C"],"r":2,"s":"A 0 K un cristallo perfetto ha una sola disposizione possibile (W = 1), quindi S = k·ln 1 = 0.","f":0,"e":0},{"id":"termo2-q5","c":"termo2","l":1,"a":2,"q":"Quale relazione, proposta da Boltzmann, definisce l'entropia a livello molecolare?","o":["S = k·W","S = k·ln W","S = W / k","S = ln(k·T)"],"r":1,"s":"k è la costante di Boltzmann (1,381·10⁻²³ J/K) e W il numero di microstati.","f":0,"e":0},{"id":"termo2-q6","c":"termo2","l":1,"a":2,"q":"Che cosa rappresenta W nella formula di Boltzmann?","o":["Il numero di modi in cui le particelle possono disporsi con la stessa energia totale","Il lavoro compiuto dal sistema","La massa del campione","Il numero di moli di gas"],"r":0,"s":"W è il numero di microstati: più sono, maggiore è l'entropia.","f":0,"e":0},{"id":"termo2-q7","c":"termo2","l":1,"a":4,"q":"Come è definita l'energia libera di Gibbs?","o":["G = H + TS","G = U + PV","G = TS − H","G = H − TS"],"r":3,"s":"È una funzione di stato perché è definita solo attraverso funzioni di stato (H, T, S).","f":0,"e":0},{"id":"termo2-q8","c":"termo2","l":1,"a":4, 3","c":"termo2","l":2,"a":1,"q":"Che cosa accade all'entropia di una sostanza quando viene scaldata?","o":["Diminuisce","Resta costante","Aumenta","Si annulla"],"r":2,"s":"ΔS = C·ln(T₂/T₁): se T₂ > T₁ il logaritmo è positivo. Il riscaldamento aumenta il disordine termico.","f":0,"e":0},{"id":"termo2-q14","c":"termo2","l":2,"a":3,"q":"Per il processo CaCl₂(s) → Ca²⁺(aq) + 2 Cl⁻(aq), che segno ha ΔS del sistema?","o":["Negativo, perché si formano ioni carichi","Positivo, perché da un solido si forma una soluzione","Zero, perché non si formano gas","Negativo, perché il solido è più disordinato"],"r":1,"s":"L'entropia aumenta quando da solidi si formano liquidi o soluzioni.","f":0,"e":0},{"id":"termo2-q15","c":"termo2","l":2,"a":3,"q":"Per la reazione 2 H₂(g) + O₂(g) → 2 H₂O(g), che segno ha ΔS del sistema?","o":["Negativo, perché le moli di gas diminuiscono da 3 a 2","Positivo, perché si forma acqua","Zero, perché tutte le specie sono gas","Positivo, perché la reazione è esotermica"],"r":0,"s":"Δn(gas) = 2 − 3 = −1: meno molecole di gas indipendenti, minore entropia.","f":0,"e":0},{"id":"termo2-q16","c":"termo2","l":2,"a":3,"q":"Che cosa accade all'entropia dell'ambiente quando nel sistema avviene una reazione esotermica?","o":["Diminuisce","Resta invariata","Diventa zero","Aumenta"],"r":3,"s":"Il calore che lascia il sistema entra nell'ambiente: ΔSambiente = −ΔH/T, positivo se ΔH è negativo.","f":0,"e":0},{"id":"termo2-q17","c":"termo2","l":2,"a":3,"q":"Che cosa indica una variazione totale di entropia ΔStot = 0?","o":["Che il processo è spontaneo","Che è spontaneo il processo inverso","Che il sistema è all'equilibrio","Che il processo è impossibile"],"r":2,"s":"ΔStot > 0 spontaneo; ΔStot < 0 spontaneo l'inverso; ΔStot = 0 nessuna tendenza a procedere in una direzione.","f":0,"e":0},{"id":"termo2-q18","c":"termo2","l":2,"a":5,"q":"Una reazione ha ΔH < 0 e ΔS > 0. Quando è spontanea?","o":["Solo ad alta temperatura","A tutte le temperature","Solo a bassa temperatura"," ase da uno stato cristallino solido a una struttura disorganizzata liquida.","f":0,"e":1},{"id":"termo2-q37","c":"termo2","l":3,"a":4,"q":"Per quali di questi valori un processo non è MAI spontaneo?","o":["ΔH>0 ΔS>0","ΔH<0 ΔS>0","ΔG<0","ΔH>0 ΔS<0","ΔH<0 ΔS<0"],"r":3,"s":"ΔG=ΔH-TΔS Reazione non spontanea = ΔG>0 => ΔH>0, ΔS<0","f":0,"e":1},{"id":"termo2-q38","c":"termo2","l":3,"a":4,"q":"In quale caso una reazione è spontanea solo ad alte temperature?","o":["ΔH>0 e ΔS>0","ΔH<0 e ΔS>0","ΔH<0 e ΔS<0","ΔH>0 e ΔS<0"],"r":0,"s":"ΔG = ΔH − TΔS: con ΔH > 0 e ΔS > 0, ΔG diventa negativo solo quando TΔS supera ΔH, cioè ad alta temperatura.","f":0,"e":1},{"id":"termo2-q39","c":"termo2","l":3,"a":4,"q":"Per far si che una reazione sia spontanea a basse temperature","o":["DeltaG>0","DeltaH < 0 delta S>0","DeltaH < 0 delta S<0","DeltaH > 0 delta S>0","DeltaH > 0 delta S<0"],"r":2,"s":"Con ΔH < 0 e ΔS < 0 il termine −TΔS è positivo: ΔG è negativo solo se T è abbastanza bassa.","f":0,"e":1},{"id":"termo2-q40","c":"termo2","l":3,"a":4,"q":"In quale delle seguenti condizioni la reazione non può essere spontanea?","o":["DeltaH < 0 DeltaS < 0","DeltaG < 0","DeltaH < 0 DeltaS > 0","DeltaH > 0 DeltaS > 0","DeltaH > 0 DeltaS < 0"],"r":4,"s":"Con ΔH > 0 e ΔS < 0, ΔG = ΔH − TΔS è positivo a qualsiasi temperatura: la reazione non è mai spontanea.","f":0,"e":1},{"id":"termo2-q41","c":"termo2","l":3,"a":4,"q":"Cosa determina la spontaneità di una reazione","o":["temperatura","delta G","delta S"],"r":1,"s":"Variazione di energia libera di Gibbs Se delta G<0 il processo è spontaneo Se delta G>0 il processo non è spontaneo Se delta G = 0 la reazione è già avvenuta e il sistema è in equilibrio","f":0,"e":1},{"id":"termo2-q42","c":"termo2","l":3,"a":4,"q":"Per la fusione del ghiaccio ΔHfus = 6,01 kJ/mol e ΔSfus = 22,0 J/(K·mol). Quanto vale ΔG a 10 °C, e la fusione è spontanea?","o":["Circa +0,22 kJ/mol: non spontanea","Circa +5,79 kJ/mol: non spontanea","Circa −0,22 kJ/mol: spontanea","Circa −6,23 kJ/mol: spontanea"],"r":2,"s":"ΔG = ΔH − TΔS = 6010 − 283 · 22,0 = 6010 − 6226 = −216 J/mol. (+5,79 kJ/mol si ottiene usando 10 °C invece di 283 K.)","f":0,"e":0},{"id":"termo2-q43","c":"termo2","l":3,"a":4,"q":"Con gli stessi dati (ΔHfus = 6,01 kJ/mol, ΔSfus = 22,0 J/(K·mol)), che cosa si trova a 0 °C?","o":["ΔG molto negativo: la fusione è spontanea","ΔG ≈ 0: ghiaccio e acqua sono in equilibrio","ΔG molto positivo: è spontaneo il congelamento","ΔG = 6,01 kJ/mol"],"r":1,"s":"ΔG = 6010 − 273 · 22,0 = 6010 − 6006 ≈ 0: al punto di fusione le due fasi coesistono.","f":0,"e":0},{"id":"termo2-q44","c":"termo2","l":3,"a":1,"q":"Per l'acqua ΔHvap = 40,7 kJ/mol al punto di ebollizione (373 K). Quanto vale ΔSvap, e come si confronta con la regola di Trouton?","o":["109 J/(K·mol): maggiore di 85 per via dei legami a idrogeno","85 J/(K·mol): esattamente il valore di Trouton","0,109 J/(K·mol): molto minore di 85","407 J/(K·mol): molto maggiore di 85"],"r":0,"s":"ΔSvap = 40 700 J/mol / 373 K = 109 J/(K·mol). Nel liquido i legami a idrogeno creano ordine: vaporizzando l'aumento di disordine è più grande del solito.","f":0,"e":0}];
