 O₂ → 0,360 L a 298 K e 1,02 atm."]},{"titolo":"Miscele gassose","riassunto":"Legge di Dalton delle pressioni parziali: la pressione totale di una miscela di gas è la somma delle pressioni dei singoli gas, Ptot = Pa + Pb + Pc + … Legge di Amagat dei volumi parziali: Vtot = V₁ + V₂ + V₃ + … La composizione di una fase gassosa si può esprimere come percentuale in peso, percentuale in volume o frazione molare. La frazione molare xᵢ è il numero di moli del componente diviso il numero totale di moli: è compresa tra 0 e 1 e la somma di tutte le frazioni molari vale 1. La percentuale in volume è uguale alla percentuale in moli: %vᵢ = xᵢ · 100. Con la frazione molare si calcolano la pressione parziale, Pᵢ = xᵢ · Ptot, e il volume parziale, Vᵢ = xᵢ · Vtot. Formule: Ptot = ΣPᵢ (Dalton); Pᵢ = xᵢ · Ptot; xᵢ = nᵢ/ntot; Vᵢ = xᵢ · Vtot, quindi Vtot = Vᵢ/xᵢ (se il 20% in volume è O₂ e O₂ occupa 40 L, la miscela occupa 40/0,2 = 200 L). La pressione parziale dipende dalla frazione molare. La frazione molare non è la frazione in massa: da grammi si passa a moli con n = m/M (48 g di Cl₂ con M = 70,90 e 9 g di H₂ con M = 2,02 → 0,677 e 4,46 mol → x(Cl₂) = 0,677/5,14 = 0,132). Pressione incognita: Ptot meno le altre (2 atm − 0,5 atm − 1 atm = 0,5 atm). Massa molare media di una miscela: M̄ = Σ xᵢMᵢ, con x = frazione in volume = frazione molare: per 50% CO (28) e 50% CO₂ (44), M̄ = 0,5·28 + 0,5·44 = 36 g/mol. Composizione dell'aria secca (in volume): circa 78% N₂, 21% O₂, 1% Ar. L'aria umida contiene anche vapore acqueo (0,1–4%), che è più abbondante nell'aria calda. Il volume dell'aria secca che contiene 0,84 mol di O₂ non ha un valore fisso: dipende da P e T (V = nRT/P).","spiegazione":"In una miscela ogni gas si comporta come se fosse solo nel recipiente e contribuisce alla pressione in proporzione a quante molecole ha. Se l'ossigeno è il 21% delle molecole dell'aria, «fa» il 21% della pressione: a 1 atm, 0,21 atm.","esempi":["He 4,5 mol + Ar 1,5 mol + CO₂ 1 mol, Ptot = 5,5 atm: ntot = 7; x(Ar) = 1,5/7 = 0,214; P(Ar) = 0,214·5,5 = 1,18 atm.","Miscela 14% NH₃, 78% SO₂, 8% Ne: M̄ = 0,14·17,03 + 0,78·64,06 + 0,08·20,18 = 54 g/mol.","Frazione volumetrica O₂ = 0,2 e 40 L di O₂ → Vtot = 40/0,2 = 200 L.","Aria a 1,0 atm con x(O₂) = 0,21 → P(O₂) = 0,21 atm.","0,50 mol di N₂ + 1,50 mol di H₂ a 8,0 atm: x(H₂) = 0,75 → P(H₂) = 6,0 atm.","Un gas al 30% in volume ha frazione molare 0,30."]},{"titolo":"Gas reali","riassunto":"Tutti i gas reali hanno proprietà diverse da quelle previste dalla legge dei gas ideali; le differenze sono significative ad alte pressioni e basse temperature. Il fattore di compressione Z è il rapporto tra il volume molare reale del gas e quello di un gas ideale nelle stesse condizioni: Z = Vm / Vm(ideale). Tutte le deviazioni dal comportamento ideale si spiegano con le forze intermolecolari, attrattive e repulsive. L'equazione di van der Waals corregge la non idealità: (P + a·n²/V²)(V − n·b) = nRT. Il parametro a rappresenta il ruolo delle attrazioni, il parametro b quello delle repulsioni: n·b è il volume occupato dalle molecole. Per un gas ideale a e b sono nulli e Z = 1. Quando prevalgono le repulsioni (b apprezzabile, a piccolo) Z > 1; quando prevalgono le attrazioni (a grande, b piccolo) Z < 1. I valori di a e b si ricavano sperimentalmente. La temperatura critica è la temperatura al di sopra della quale una sostanza non può esistere come liquido, qualunque sia la pressione; la pressione critica è la pressione corrispondente a questa condizione limite. Formule per i gas reali. Van der Waals: (P + a n²/V²)(V − nb) = nRT, quindi P = nRT/(V − nb) − a n²/V²; a si esprime in L²·atm/mol² (attrazioni), b in L/mol (volume delle molecole); per il CH₄ con a = 2,25 e b = 0,0428, 1,00 mol in 1,7 L a 340,15 K danno P = 16,8 − 0,78 = 16,1 atm contro 16,4 atm del gas ideale. Legge di Graham (effusione): v₁/v₂ = √(M₂/M₁): il gas più leggero effonde più velocemente (Ar rispetto a O₂: √(32,00/39,95) = 0,895). Velocità quadratica media: u = √(3RT/M) con R = 8,314 J/(mol·K), T in kelvin e M in kg/mol (NO₂ a 497,15 K, M = 0,046 kg/mol → 519 m/s). A volume costante, se aumenta T cambia (aumenta) la pressione, proporzionalmente.","spiegazione":"Il gas ideale è fatto di punti senza volume che si ignorano a vicenda. Le molecole vere invece occupano spazio (quindi a pressioni alte il gas si comprime meno del previsto) e si attraggono (quindi a temperature basse si «tengono» un po' e premono meno sulle pareti). Van der Waals aggiunge esattamente queste due correzioni.","esempi":["Graham: v(Ar)/v(O₂) = √(32,00/39,95) = 0,895.","u(NO₂) a 224 °C: √(3·8,314·497,15/0,046) = 519 m/s.","Gas ideale a 1,7 L, 1,00 mol, 340 K: P = nRT/V = 16,4 atm; con van der Waals 16,1 atm: Z < 1, prevalgono le attrazioni.","Z = 1: comportamento ideale.","Z < 1: prevalgono le attrazioni, il gas occupa meno volume del previsto.","Z > 1: prevalgono le repulsioni, il gas occupa più volume del previsto.","Sopra la temperatura critica un gas non liquefa, per quanto lo si comprima."]}]},{"id":"termo1","n":9,"titolo":"Termodinamica 1","icona":"🔥","colore":"#f87171","descrizione":"Lezione 9 · Sistema e ambiente, lavoro e calore, primo principio, calorimetria, entalpia, legge di Hess ed entalpie di formazione.","argomenti":[{"titolo":"Sistema, ambiente, lavoro e calore","riassunto":"La termodinamica studia come l'energia si trasforma da una forma all'altra e si trasferisce da un luogo all'altro. La regione che ci interessa (un pallone di gas, una miscela di reazione) è il sistema; tutto il resto è l'ambiente. Un sistema aperto scambia con l'ambiente materia ed energia, uno chiuso solo energia, uno isolato nulla. Il lavoro è il processo con cui si ottiene un movimento contro una forza che si oppone: lavoro = forza × spostamento; si misura in joule (1 J = 1 kg·m²/s² = 1 N·m). L'energia è la capacità di un sistema di compiere lavoro. Un sistema può compiere lavoro di espansione (variazione di volume) o lavoro non di espansione (per esempio una batteria). Il calore è lo scambio di energia termica tra sistema e ambiente dovuto a una differenza di temperatura: fluisce dal corpo più caldo a quello più freddo finché raggiungono la stessa temperatura (equilibrio termico). Anche il calore si misura in joule; è ancora usata la caloria: 1 cal = 4,184 J; la caloria alimentare (Cal) è in realtà una chilocaloria. Le pareti adiabatiche non permettono il trasferimento di energia come calore; le pareti diatermiche lo permettono. Calcolo del lavoro di espansione contro una pressione esterna costante: w = −P_est·ΔV, con ΔV = V(finale) − V(iniziale). Se il gas si espande (ΔV > 0) w è negativo, perché il sistema compie lavoro e perde energia; se viene compresso (ΔV < 0) w è positivo. Con P in atm e V in L il risultato è in L·atm, che si converte in joule con 1 L·atm = 101,3 J (101,325 J). Conversioni di energia: 1 cal = 4,184 J, 1 kJ = 1000 J, 1 kcal = 1000 cal = 4184 J (la «Cal» alimentare). Un sistema chiuso scambia energia ma non materia; un sistema isolato non scambia né l'una né l'altra; un sistema aperto scambia entrambe.","spiegazione":"Il sistema è «ciò che sto guardando», l'ambiente è tutto il resto. L'energia può passare dall'uno all'altro in due soli modi: spingendo qualcosa (lavoro) o per differenza di temperatura (calore). Un thermos chiuso è quasi un sistema isolato: non entra e non esce né materia né energia.","esempi":["Espansione di un gas contro 1 atm da 19 L a 27 L: ΔV = +8 L; w = −1·8 = −8 L·atm = −8·101,3 = −810 J (il sistema compie lavoro).","100 cal = 100·4,184 = 418,4 J; 1 kcal = 4184 J = 4,184 kJ.","Una pentola senza coperchio è un sistema aperto; con il coperchio sigillato è chiuso; un thermos ideale è isolato.","Un gas che si espande spingendo un pistone compie lavoro di espansione.","100 cal = 418,4 J; 1 Cal alimentare = 1 kcal = 4184 J."]},{"titolo":"Primo principio e funzioni di stato","riassunto":"La riserva totale di energia di un sistema è la sua energia interna U; se ne misurano le variazioni, ΔU = U(finale) − U(iniziale), indicando sempre il segno. Quando l'energia entra nel sistema come lavoro, U aumenta e w è positivo; quando esce, w è negativo. Lo stesso vale per il calore: se entra nel sistema q è positivo, se esce è negativo. Un processo che rilascia calore è esotermico (le combustioni), uno che lo assorbe è endotermico (la vaporizzazione). In generale la variazione di energia interna di un sistema chiuso è il risultato netto degli scambi di calore e di lavoro: ΔU = q + w. Se il sistema è isolato l'energia interna non può cambiare: è il primo principio della termodinamica, «l'energia interna di un sistema isolato è costante». L'energia interna è una funzione di stato: dipende solo dallo stato attuale del sistema e non da come ci si è arrivati. Il lavoro e il calore non sono funzioni di stato: dipendono da come avviene la trasformazione. Convenzione dei segni (punto di vista del sistema): q > 0 se il sistema assorbe calore, q < 0 se lo cede; w > 0 se l'ambiente compie lavoro sul sistema (compressione), w < 0 se il sistema compie lavoro sull'ambiente (espansione). Quindi ΔU = q + w: se un sistema assorbe 234 J di calore (q = +234) e su di esso si compie un lavoro di 159 J (w = +159), ΔU = +393 J. Un processo esotermico ha q < 0 e, a pressione costante, ΔH < 0; un processo endotermico ha q > 0 e ΔH > 0. Una reazione con ΔH = −115,12 kJ è quindi esotermica, cioè cede calore all'ambiente. Sono funzioni di stato: U, H, P, V, T; non lo sono il lavoro w e il calore q.","spiegazione":"L'energia interna è il saldo di un conto in banca: q e w sono i versamenti (positivi) e i prelievi (negativi). Il saldo finale dipende solo da quanto è entrato e uscito in totale, non dall'ordine delle operazioni: è una funzione di stato. Come l'altitudine di una vetta: è la stessa qualunque sentiero tu abbia percorso, mentre i chilometri fatti (il lavoro) dipendono dal sentiero.","esempi":["Il sistema cede 40 J di calore e subisce un lavoro di 25 J: ΔU = −40 + 25 = −15 J.","Segno di ΔH: combustione ΔH < 0 (esotermica); vaporizzazione ΔH > 0 (endotermica); ΔH = −115 kJ → esotermica.","Il sistema assorbe 50 J di calore e compie 20 J di lavoro: ΔU = +50 − 20 = +30 J.","Un gas che si espande nel vuoto non compie lavoro; contro una pressione esterna sì: stesso stato finale, lavoro diverso.","Combustione: esotermica (q < 0). Vaporizzazione: endotermica (q > 0)."]},{"titolo":"Capacità termica e calorimetria","riassunto":"Quando un sistema assorbe calore la sua temperatura aumenta in modo proporzionale al calore assorbito: q = C·ΔT, dove C è la capacità termica (J/°C o J/K). La capacità termica dipende dalla massa (200 g di acqua richiedono il doppio del calore di 100 g per lo stesso aumento di temperatura) e dal tipo di materiale. Il calore specifico Cs è il calore necessario per aumentare di 1 °C la temperatura di un grammo di sostanza, in J/(g·°C): q = m·Cs·ΔT. La capacità termica molare si riferisce a una mole. L'acqua ha un calore specifico elevato: assorbe molto calore con piccoli aumenti di temperatura, per cui è un ottimo refrigerante e mitiga il clima delle coste. Gli scambi di calore si misurano con un calorimetro, registrando la variazione di temperatura prodotta dal processo: q(cal) = C(cal)·ΔT, e il calore del processo è uguale e opposto a quello assorbito dal calorimetro. Il calorimetro a bicchieri di polistirolo lavora a pressione costante; la bomba calorimetrica, un contenitore rigido in cui il campione viene acceso elettricamente, misura il calore a volume costante. Formule: q = m·Cs·ΔT (con ΔT = T finale − T iniziale, segno compreso), q = C·ΔT, C = m·Cs. Calore specifico dell'acqua: 4,184 J/(g·°C) (≈ 4,18); la differenza di temperatura in °C è uguale a quella in K. Equilibrio termico di due corpi in un calorimetro isolato: calore ceduto = calore assorbito, cioè m₁Cs₁(T₁ − T) = m₂Cs₂(T − T₂), da cui T = (m₁Cs₁T₁ + m₂Cs₂T₂)/(m₁Cs₁ + m₂Cs₂): per 95 g di zinco (c = 0,388 J/(g·°C)) a 78 °C in 208 g d'acqua a 12 °C si trova T = 14,7 °C. Calorimetro a soluzione: q(reazione) = −q(soluzione) = −m(soluzione)·Cs·ΔT, dove m(soluzione) è la massa del solvente più quella del soluto; poi ΔH = q(reazione)/n con n = m/M del soluto. Se la temperatura scende (ΔT < 0) la reazione è endotermica (ΔH > 0). Esempio: 7 g di KCl (M = 74,55 g/mol) in 100 g d'acqua (soluzione 107 g), ΔT = −3,6 °C: q(soluzione) = 107·4,18·(−3,6) = −1610 J; n = 0,0939 mol; ΔH = +1610 J/0,0939 mol = +17,1 kJ/mol. Bomba calorimetrica a volume costante: il calore misurato è ΔU; calorimetro a bicchiere a pressione costante: ΔH.","spiegazione":"Il calore specifico dice quanto una sostanza è «pigra» a scaldarsi. L'acqua è molto pigra: ne serve tanto, di calore, per farle cambiare temperatura. La sabbia no: per questo d'estate la spiaggia scotta e il mare resta fresco, pur ricevendo lo stesso sole.","esempi":["201 g di zinco (c = 0,388) da 12 a 87 °C: q = 201·0,388·75 = 5850 J = 5,85 kJ.","Moneta di rame: ΔT = 37,0 − (−8,0) = 45,0 °C; q = 3,10·0,385·45,0 = 53,7 J.","Capacità termica doppia per massa doppia: C(200 g di acqua) = 2·C(100 g).","Moneta di rame da 3,10 g scaldata da −8,0 a 37,0 °C (Cs = 0,385 J/(g·°C)): q = 3,10 · 0,385 · 45,0 = 53,7 J.","1000 J scaldano 100 g di sabbia di 12 °C ma 100 g di acqua di soli 2,4 °C.","In soluzione: q(reazione) = −m·Cs·ΔT della soluzione."]},{"titolo":"Entalpia e cambiamenti di stato","riassunto":"Se il sistema ha pareti rigide non compie lavoro di espansione: a volume costante ΔU = q. In chimica però interessano soprattutto gli scambi di calore a pressione costante, perché la maggior parte delle reazioni avviene in recipienti aperti all'atmosfera (circa 1 atm). La funzione di stato adatta è l'entalpia: H = U + PV. A pressione costante e senza lavoro non di espansione, ΔH = q: se il sistema assorbe calore (endotermico) l'entalpia aumenta, se lo cede (esotermico) diminuisce. In un passaggio di stato a pressione costante il calore scambiato è la variazione di entalpia della sostanza. L'entalpia di vaporizzazione è ΔHvap = Hm(vapore) − Hm(liquido); l'entalpia di fusione è ΔHfus = Hm(liquido) − Hm(solido). Le sostanze con forze intermolecolari intense, come i legami a idrogeno, hanno le entalpie di vaporizzazione più alte. Poiché l'entalpia è una funzione di stato, ΔH del processo inverso è l'opposto di quello diretto: l'entalpia di congelamento è −ΔHfus. L'entalpia di sublimazione è ΔHsub = ΔHfus + ΔHvap (alla stessa temperatura). Una curva di riscaldamento mostra la temperatura di un campione scaldato a velocità costante: durante i passaggi di stato la temperatura resta costante; più ripida è la curva, minore è la capacità termica. Calcolo del calore per cambiamenti di stato: q = n·ΔH con n = m/M (fusione: ΔHfus; ebollizione: ΔHvap). Per l'acqua: ΔHfus = 6,01 kJ/mol (333 J/g), ΔHvap = 40,7 kJ/mol (2260 J/g), M = 18,02 g/mol; c(ghiaccio) = 2,09 J/(g·°C), c(acqua liquida) = 4,184 J/(g·°C). Per scaldare una sostanza attraverso più fasi si sommano le tappe: riscaldamento di una fase q = m·c·ΔT, passaggio di stato q = n·ΔH. 37 g di ghiaccio da −23 a +81 °C: ghiaccio da −23 a 0 °C = 37·2,09·23 = 1,78 kJ; fusione n = 37/18,02 = 2,05 mol → 2,05·6,01 = 12,3 kJ; acqua da 0 a 81 °C = 37·4,184·81 = 12,5 kJ; totale 26,7 kJ. Per il benzene (M = 78,11 g/mol, ΔHfus = 9,87 kJ/mol), 325 g → 4,16 mol → 41,1 kJ. Processi endotermici (ΔH > 0): fusione, vaporizzazione, sublimazione; processi esotermici (ΔH < 0): congelamento, condensazione, brinamento (deposizione). Il passaggio solido → vapore diretto si chiama sublimazione. Un liquido bolle quando la tensione di vapore eguaglia la pressione esterna. Una reazione endotermica ha ΔH > 0: i prodotti hanno entalpia maggiore dei reagenti, ΔH = H(prodotti) − H(reagenti). A volume costante e T costante, il calore scambiato è uguale alla variazione di energia interna: q_V = ΔU.","spiegazione":"L'entalpia è l'energia interna con dentro già «il biglietto» per fare spazio nell'atmosfera: così, a pressione costante, il calore che misuri è direttamente ΔH. Durante un passaggio di stato il calore non alza la temperatura perché viene speso tutto per separare le molecole: ecco i tratti piatti della curva di riscaldamento.","esempi":["Fusione di 325 g di benzene: n = 325/78,11 = 4,16 mol; q = 4,16·9,87 = 41,1 kJ.","Ghiaccio −23 °C → acqua 81 °C (37 g): 1,78 + 12,3 + 12,5 = 26,7 kJ.","Esotermici: condensazione, congelamento. Endotermici: fusione dello zinco, sublimazione del ghiaccio.","Fondere 500 g di ghiaccio: 500 · 333 = 1,67·10⁵ J; scaldare l'acqua da 0 a 100 °C: 500 · 4,2 · 100 = 2,1·10⁵ J; vaporizzarla: 500 · 2260 = 1,13·10⁶ J. Totale 1,51·10⁶ J.","L'acqua liquida ha capacità termica maggiore del ghiaccio e del vapore: il suo tratto di curva è meno ripido.","Surriscaldamento e sottoraffreddamento: il liquido può superare per poco il punto di ebollizione o scendere sotto quello di congelamento."]},{"titolo":"Entalpia di reazione e relazione tra ΔH e ΔU","riassunto":"La variazione di entalpia di una reazione è una proprietà estensiva: più reagenti si usano, maggiore è ΔH. Per convenzione si riferisce al numero di moli indicato dai coefficienti dell'equazione così come è scritta: l'insieme di equazione e ΔH è un'equazione termochimica. Per C₃H₈(g) + 5 O₂(g) → 3 CO₂(g) + 4 H₂O(g), ΔH = −2044 kJ: si liberano 2044 kJ per ogni mole di propano o per ogni 5 moli di ossigeno. Raddoppiando i coefficienti raddoppia ΔH. Conta anche lo stato fisico di reagenti e prodotti: la combustione del metano libera 191,7 kcal se si forma H₂O(g) e 212,7 kcal se si forma H₂O(l). Il valore standard di una proprietà si indica con il simbolo °: ogni reagente e prodotto è nel suo stato standard, cioè in forma pura a 1 bar (per un soluto, concentrazione 1 mol/L); i dati sono di solito riportati a 25 °C (298,15 K). L'entalpia standard di reazione ΔH° è l'entalpia di reazione quando reagenti negli stati standard si trasformano in prodotti negli stati standard. Per convertire ΔU (misurato a volume costante) in ΔH: ΔH = ΔU + Δn(gas)·RT, dove Δn(gas) è la variazione delle moli di gas e R = 8,314 J/(K·mol). Se nella reazione non cambiano le moli di gas, ΔH = ΔU. Calcolo di ΔH per una quantità diversa da quella dell'equazione: ΔH(reale) = ΔH(equazione) · (moli reali / moli dell'equazione): 2 mol di C₃H₈ con ΔH = −2044 kJ per mole di equazione → −4088 kJ. Con una massa si passa prima dalle moli: n = m/M. Δn(gas) = moli di gas dei prodotti − moli di gas dei reagenti (si contano solo i gas, non solidi o liquidi): 2 CO + O₂ → 2 CO₂ ha Δn = 2 − 3 = −1; Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂ ha Δn = 3 − 3 = 0. Formule: ΔH = ΔU + Δn·R·T, quindi ΔU = ΔH − Δn·R·T; con R = 8,314 J/(mol·K) = 0,008314 kJ/(mol·K) (si converte in kJ per sommarlo a ΔH). Nell'esempio 2 CO + O₂ → 2 CO₂ a 298 K: ΔU = −566 − (−1)·0,008314·298 = −563,5 kJ. Per una reazione A + B → C di gas (Δn = 1 − 2 = −1): ΔH = ΔU − RT, ossia ΔU = ΔH + RT. Il calore sviluppato da una reazione dipende dalle quantità, dallo stato fisico di reagenti e prodotti e dalla temperatura; non dipende dalla velocità con cui la reazione avviene né dal percorso (ΔH è una funzione di stato).","spiegazione":"L'equazione termochimica è una ricetta con lo scontrino: «per queste quantità, questo calore». Se raddoppi le dosi raddoppi il calore, se inverti la reazione cambi il segno. La differenza tra ΔH e ΔU è solo il lavoro fatto dai gas che si formano o scompaiono: se il numero di moli di gas non cambia, le due grandezze coincidono.","esempi":["ΔH(2 mol C₃H₈) = 2·(−2044) = −4088 kJ.","2 CO + O₂ → 2 CO₂ a 298 K, ΔH = −566 kJ: Δn = −1; ΔU = −566 + 0,008314·298 = −563,5 kJ.","Δn(gas) per Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂: 3 − 3 = 0 → ΔH = ΔU.","13,2 kg di C₃H₈ (M = 44,09 g/mol) → 299 mol → 299 · 2044 = 6,12·10⁵ kJ liberati.","2 CO(g) + O₂(g) → 2 CO₂(g), ΔH = −566,0 kJ: Δn(gas) = −1 → ΔU = −566,0 + 2,5 = −563,5 kJ.","H₂ + ½ O₂ → H₂O(l): −68,4 kcal/mol; → H₂O(g): −57,8 kcal/mol."]},{"titolo":"Legge di Hess, entalpie di formazione e ciclo di Born-Haber","riassunto":"Legge di Hess: se una reazione può essere espressa come una serie di stadi, il ΔH della reazione complessiva è la somma dei ΔH dei singoli stadi. Per applicarla si combinano equazioni note in modo da cancellare le specie indesiderate; se si inverte un'equazione si cambia il segno di ΔH; se si moltiplicano i coefficienti per un fattore, anche ΔH va moltiplicato per lo stesso fattore. L'entalpia standard di formazione ΔH°f di una sostanza è l'entalpia standard di reazione, per mole, per la formazione della sostanza dai suoi elementi nella forma più stabile; si esprime in kJ/mol. Per convenzione le entalpie di formazione degli elementi nella loro forma stabile sono zero. Con le entalpie di formazione si calcola l'entalpia standard di qualsiasi reazione: ΔH° = Σ n·ΔH°f(prodotti) − Σ n·ΔH°f(reagenti), dove n sono i coefficienti stechiometrici. Il ciclo di Born-Haber è un metodo per determinare l'energia reticolare di un composto ionico usando la legge di Hess: l'entalpia di formazione del sale è la somma delle entalpie di formazione degli atomi gassosi del metallo e del non metallo, dell'energia di ionizzazione (tutte quelle necessarie per ottenere il catione), dell'affinità elettronica e dell'energia reticolare. Applicazione della legge di Hess: se la reazione complessiva è la somma di due equazioni, ΔH = ΔH₁ + ΔH₂ (somma algebrica): da 2 A → B (−276 kJ) e B → C (+87 kJ) si ottiene 2 A → C con ΔH = −276 + 87 = −189 kJ. Calcolo con le entalpie di formazione: ΔH° = Σ(n·ΔH°f prodotti) − Σ(n·ΔH°f reagenti); gli elementi nella forma stabile (O₂, H₂, C grafite…) valgono 0. Per CaCO₃ → CaO + CO₂ con ΔH°f = −1210, −635, −394 kJ/mol: ΔH° = (−635 − 394) − (−1210) = +181 kJ (con i dati più precisi +178,3). Dal ΔH per mole al calore per una massa: q = n·|ΔH°| con n = m/M (121 g di CH₄, M = 16,04 → 7,54 mol → 7,54·890,3 = 6710 kJ). Ciclo di Born-Haber (per un sale MX con M⁺ e X⁻): ΔH°f = ΔHsub(M) + IE(M) + ½D(X₂) + AE(X) + U, dove ΔHsub è la sublimazione del metallo, IE l'energia di ionizzazione, D l'energia di legame di X₂, AE l'affinità elettronica (di solito negativa) e U l'energia reticolare (negativa). L'energia reticolare si ricava per differenza: U = ΔH°f − (ΔHsub + IE + ½D + AE).","spiegazione":"La legge di Hess è la regola del dislivello: per sapere di quanto sei salito tra due rifugi puoi sommare i dislivelli di qualunque percorso a tappe che li collega. Le entalpie di formazione sono il «livello del mare» comune: ogni sostanza ha la sua quota rispetto agli elementi, e la differenza di quota tra prodotti e reagenti è il ΔH della reazione.","esempi":["2 A → B (−276) + B → C (+87) → 2 A → C: −276 + 87 = −189 kJ.","CaCO₃ → CaO + CO₂: ΔH° = (−635 − 394) − (−1210) = +181 kJ (endotermica).","Born-Haber: ΔH°f = −531, ΔHsub = 150, IE = 561, ½D = 96, AE = −340 → U = −531 − (150 + 561 + 96 − 340) = −998 kJ/mol.","CH₄ + 2 O₂ → CO₂ + 2 H₂O(l): ΔH° = [−393,5 + 2·(−285,8)] − [−74,8] = −890,3 kJ.","Termite: 2 Al + Fe₂O₃ → Al₂O₃ + 2 Fe(l): ΔH° = [−1669,8 + 2·12,40] − [−822,2] = −822,8 kJ, circa −15,2 kJ per grammo di Al.","Born-Haber per LiF: sublimazione di Li, dissociazione di F₂, ionizzazione di Li, affinità elettronica di F, energia reticolare."]}]},{"id":"termo2","n":10,"titolo":"Termodinamica 2","icona":"🎲","colore":"#c084fc","descrizione":"Lezione 10 · Processi spontanei, entropia, secondo e terzo principio, energia libera di Gibbs ed effetto della temperatura.","argomenti":[{"titolo":"Processi spontanei, reversibili e irreversibili","riassunto":"Il primo principio dice che, se una reazione avviene, l'energia totale dell'universo (sistema più ambiente) resta invariata; non dice però perché alcune reazioni tendono ad avvenire e altre no. Una trasformazione spontanea è una trasformazione che tende ad avvenire senza bisogno di essere guidata da un'influenza esterna. Una trasformazione spontanea non è necessariamente veloce e in alcuni casi deve essere innescata. Un blocco di metallo caldo in una stanza fredda si raffredda perché l'energia dei suoi atomi si disperde nell'ambiente; le molecole di un gas si distribuiscono in tutto il recipiente: energia e materia tendono a disperdersi in modo disordinato. Un processo reversibile è un processo che può essere invertito da una variazione infinitesima di una variabile; in un processo irreversibile una variazione infinitesima non ne inverte la direzione. Il caso più semplice è l'espansione reversibile e isoterma di un gas ideale: per essa ΔU = 0, quindi q = −w, e il lavoro reversibile vale w = −nRT·ln(V₂/V₁). Il lavoro (e il calore) scambiato lungo il percorso reversibile è maggiore, in valore assoluto, di quello scambiato lungo un percorso irreversibile tra gli stessi stati. Il secondo principio della termodinamica spiega l'irreversibilità dei processi naturali: nei processi spontanei l'entropia dell'universo aumenta (lo si approfondisce nei paragrafi seguenti). Calcolo del lavoro: espansione reversibile isoterma di un gas ideale w_rev = −nRT·ln(V₂/V₁) (R = 8,314 J/(mol·K), T in kelvin, ln = logaritmo naturale), con ΔU = 0 e quindi q = −w. Espansione irreversibile contro una pressione esterna costante: w_irr = −P_est·ΔV (1 L·atm = 101,3 J). Tra gli stessi stati |w_rev| > |w_irr|: il percorso reversibile fornisce il lavoro massimo. Per 1,00 mol di gas ideale a 292 K che si espande da 8,00 a 20,00 L: w_rev = −1,00·8,314·292·ln(2,5) = −2,22·10³ J (ln 2,5 = 0,916); se invece si espande contro la pressione finale P = nRT/V₂ = 0,08206·292/20,0 = 1,20 atm, w_irr = −1,20·12,0 = −14,4 L·atm ≈ −1,46·10³ J: lavoro minore in valore assoluto. Spontaneo non significa veloce: la termodinamica dice se un processo tende ad avvenire, non con quale velocità.","spiegazione":"Spontaneo non vuol dire rapido: vuol dire «in discesa». Una palla in cima a un pendio può restare ferma finché non le dai un colpetto (l'innesco), ma una volta partita scende da sola e non risale. Un processo reversibile è invece una discesa fatta a passi infinitamente piccoli, sempre a un soffio dall'equilibrio, tanto che basterebbe un niente per tornare indietro.","esempi":["w_rev = −nRT ln(V₂/V₁) = −8,314·292·ln 2,5 = −2224 J ≈ −2,22 kJ.","w_irr (P_est = 1,20 atm): −1,20·(20,0 − 8,00) = −14,4 L·atm = −1,46 kJ. |w_rev| > |w_irr|.","Espansione isoterma di un gas ideale: ΔU = 0, quindi q = −w (il calore assorbito è uguale al lavoro compiuto).","Il ferro arrugginisce spontaneamente, ma lentamente.","Un gas si espande spontaneamente nel vuoto; non torna spontaneamente a comprimersi.","1,00 mol di gas ideale a 292 K da 8,00 L a 20,00 L: stesso stato finale, ma lavoro diverso lungo il percorso reversibile e quello irreversibile."]},{"titolo":"Entropia: definizione termodinamica e variazioni","riassunto":"La tendenza di energia e materia a disperdersi si misura con l'entropia, S. A temperatura costante la variazione di entropia di un sistema è ΔS = q(rev) / T, dove q(rev) è il calore scambiato reversibilmente. L'entropia è una funzione di stato: per calcolare ΔS tra due stati collegati da un percorso irreversibile si può cercare un percorso reversibile tra gli stessi stati. Il riscaldamento aumenta il disordine termico, dovuto al moto delle molecole: ΔS = C·ln(T₂/T₁); se T₂ > T₁ l'entropia aumenta, e l'aumento è tanto maggiore quanto più grande è la capacità termica. La dispersione delle molecole in un volume maggiore aumenta il disordine posizionale: per un gas ideale a temperatura costante ΔS = nR·ln(V₂/V₁). In un passaggio di stato alla temperatura di transizione la temperatura resta costante, lo scambio di calore è reversibile e, a pressione costante, il calore è uguale a ΔH: quindi ΔSvap = ΔHvap / Teb e ΔSfus = ΔHfus / Tfus. Molte sostanze hanno entropie di vaporizzazione vicine a 85 J/(K·mol) (regola di Trouton); i liquidi con estesi legami a idrogeno, come l'acqua, hanno valori maggiori. La fusione comporta un aumento di entropia minore della vaporizzazione, perché un liquido è solo poco più disordinato di un solido. Formule dell'entropia. Scambio reversibile a T costante: ΔS = q_rev/T. Riscaldamento (da T₁ a T₂): ΔS = C·ln(T₂/T₁). Espansione isoterma di un gas ideale: ΔS = nR·ln(V₂/V₁). Passaggio di stato (alla temperatura di transizione, T in kelvin): ΔS = ΔH/T, cioè ΔSvap = ΔHvap/Teb e ΔSfus = ΔHfus/Tfus. Attenzione alle unità: ΔH è in kJ/mol e ΔS in J/(K·mol), quindi si moltiplica ΔH per 1000. Esempi: mercurio, ΔHvap = 59,1 kJ/mol a 630 K → ΔS = 59 100/630 = 93,8 J/(K·mol); ammoniaca, ΔHfus = 5,65 kJ/mol a 195 K → ΔS = 5650/195 = 28,9 J/(K·mol); acqua 40 700/373 = 109 J/(K·mol) > 85 (Trouton: valore elevato per i legami a idrogeno). Entropia di reazione: ΔS° = Σ n·S°(prodotti) − Σ n·S°(reagenti). Per 2 CO + O₂ → 2 CO₂ con S° = 198 (CO), 205 (O₂), 214 (CO₂) J/(K·mol): ΔS° = 2·214 − (2·198 + 205) = 428 − 601 = −173 J/K (diminuiscono le moli di gas).","spiegazione":"L'entropia conta in quanti modi l'energia e le molecole possono essere sparpagliate. Scaldare aggiunge agitazione, espandere aggiunge spazio: in entrambi i casi i modi possibili aumentano e l'entropia cresce. Dividere per T ha senso: lo stesso calore «disturba» molto un sistema freddo e ordinato, poco uno già caldo e caotico, come uno starnuto in biblioteca o in una strada trafficata.","esempi":["Mercurio: ΔSvap = 59 100 J/mol / 630 K = 93,8 J/(K·mol).","Ammoniaca: ΔSfus = 5650 J/mol / 195 K = 28,9 J/(K·mol).","2 CO + O₂ → 2 CO₂: ΔS° = 2·214 − 2·198 − 205 = −173 J/K.","ΔS = nR ln(V₂/V₁) = 1,00·8,314·ln(20/8) = 7,62 J/K.","Acqua: ΔHvap = 40,7 kJ/mol a 373 K → ΔSvap = 40 700 / 373 = 109 J/(K·mol), sopra il valore di Trouton.","1,00 mol di gas ideale da 8,00 a 20,00 L: ΔS = 8,314 · ln(2,5) = 7,62 J/K.","Scaldando una sostanza la sua entropia aumenta sempre."]},{"titolo":"Interpretazione molecolare e terzo principio","riassunto":"Terzo principio della termodinamica: l'entropia di tutti i cristalli perfetti tende a zero quando la temperatura assoluta tende a zero. Boltzmann propose una definizione molecolare dell'entropia: S = k·ln W, dove k = 1,381·10⁻²³ J/K è la costante di Boltzmann e W è il numero di microstati, cioè il numero di modi in cui gli atomi o le molecole del campione possono essere disposti dando la stessa energia totale. L'entropia così calcolata si chiama entropia statistica. W, e quindi S, aumenta all'aumentare della temperatura, del volume e del numero di molecole che si muovono indipendentemente. Poiché S(0) = 0, l'entropia a una temperatura T è la variazione di entropia per il riscaldamento da 0 a T: si ottiene misurando la capacità termica a tutte le temperature (è l'area sotto il grafico di Cp/T) e aggiungendo le entropie delle eventuali transizioni di fase. I liquidi hanno entropie molari maggiori dei solidi, perché le loro molecole hanno più libertà di movimento; i gas le hanno molto maggiori, perché le molecole occupano volumi molto più grandi e si muovono in modo quasi del tutto disordinato. Calcolo di S = k·ln W con k = 1,381·10⁻²³ J/K. Se le N molecole hanno ciascuna 2 orientazioni possibili, W = 2ᴺ e ln W = N·ln 2 = N·0,693: per N = 20, ln W = 13,9 e S = 1,381·13,9·10⁻²³ = 19,1·10⁻²³ J/K; per 4 molecole W = 2⁴ = 16 e S = 3,83·10⁻²³ J/K. Con W = 1 (cristallo perfetto a 0 K) S = 0. Unità: l'entropia si misura in J/K (entropia molare J/(K·mol)); il suo simbolo è S (H è l'entalpia, G l'energia libera). Per prevedere il segno di ΔS° di una reazione si guarda il numero di moli di gas: se aumenta (Δn(gas) > 0, come CaCO₃(s) → CaO(s) + CO₂(g), ΔS° = +159 J/K) l'entropia aumenta; se diminuisce, diminuisce. Per ordinare le entropie molari: solido < liquido < gas; tra gas, più sono grandi e complesse le molecole più alta è l'entropia. Valori di riferimento S° a 298 K (J/(K·mol)): solidi e liquidi: C(grafite) 5,7; Fe 27,3; CaO 38,1; H₂O(l) 70,0; Fe₂O₃ 87,4; CaCO₃ 92,9. Gas: H₂ 130,7; CH₄ 186,3; HCl 186,9; H₂O(g) 188,8; N₂ 191,6; NH₃ 192,8; CO 197,7; O₂ 205,2; NO 210,8; CO₂ 213,8; C₂H₄ 219,6; Cl₂ 223,1; C₂H₆ 229,6; NO₂ 240,1; SO₂ 248,2; SO₃ 256,8; C₃H₈ 270,3; N₂O₄ 304,4. Per ordinare le entropie molari basta confrontarle: la minore è H₂O(l) rispetto a CH₄, H₂O(g), C₂H₄. Se in una reazione Δn(gas) = 0 il segno di ΔS° non si deduce dalle moli di gas e si calcola con ΔS° = Σ n·S°(prodotti) − Σ n·S°(reagenti).","spiegazione":"W è il numero di «fotografie» diverse a livello molecolare che corrispondono allo stesso stato visto da fuori. Un cristallo perfetto a 0 K ha una sola fotografia possibile: W = 1, ln 1 = 0, entropia zero. Appena le molecole possono orientarsi o muoversi in più modi, le fotografie possibili si moltiplicano e l'entropia sale.","esempi":["W = 2²⁰: S = 1,381·10⁻²³·20·0,693 = 19,1·10⁻²³ J/K.","Ordine di S°: H₂O(l) (70) < CH₄ (186) < H₂O(g) (189) < C₂H₄ (220).","CaCO₃ → CaO + CO₂(g): Δn(gas) = +1 → ΔS° > 0.","Quattro molecole di CO tutte allineate: W = 1 → S = 0.","Quattro molecole di CO con due orientazioni possibili ciascuna: W = 2⁴ = 16 → S = k·ln 16 = 3,83·10⁻²³ J/K.","Entropia molare: solido < liquido < gas."]},{"titolo":"Secondo principio: entropia di sistema, ambiente e universo","riassunto":"Secondo principio: l'entropia di un sistema isolato aumenta nel corso di ogni trasformazione spontanea. Per applicarlo correttamente bisogna considerare il sistema come parte di un sistema isolato più grande, che comprende anche l'ambiente: un processo è spontaneo solo se la variazione totale di entropia, ΔStot = ΔSsistema + ΔSambiente, è positiva. Se ΔStot è negativa è spontaneo il processo inverso; se ΔStot = 0 il processo non ha tendenza a procedere in nessuna direzione (equilibrio). L'entropia di reazione del sistema si calcola come per l'entalpia: ΔS° = Σ n·S°(prodotti) − Σ m·S°(reagenti). L'entropia del sistema aumenta quando da solidi si formano liquidi o soluzioni e quando aumenta il numero di moli di gas. Il calore che lascia il sistema entra nell'ambiente: a temperatura e pressione costanti ΔSambiente = −ΔH / T. Una reazione esotermica aumenta quindi l'entropia dell'ambiente, e a parità di calore ceduto l'aumento è maggiore se l'ambiente è a bassa temperatura. Le reazioni endotermiche spontanee sono guidate dall'aumento di disordine del sistema, che prevale. Come risultato di tutti i processi, l'entropia dell'universo aumenta costantemente (disuguaglianza di Clausius: ΔS ≥ q/T). Formule: ΔStot = ΔSsistema + ΔSambiente, con ΔSambiente = −ΔH/T (T in kelvin, ΔH del sistema; con ΔH in kJ e ΔS in J/K si moltiplica per 1000). Processo spontaneo se ΔStot > 0. Esempio: ΔSsist = −47 J/K, ΔH = −83 kJ, T = 400 K: ΔSamb = 83 000/400 = +208 J/K → ΔStot = −47 + 208 = +161 J/K > 0: spontaneo. Nel linguaggio dell'energia libera (paragrafo successivo): ΔG = ΔH − TΔS, e la reazione è spontanea se ΔG < 0, cioè se ΔH < TΔS. Esempio: ΔH = 2000 kJ e ΔS = 20 kJ/K → spontanea se T > ΔH/ΔS = 2000/20 = 100 K. Vaporizzazione e fusione hanno sempre ΔS > 0 (si passa da uno stato più ordinato a uno più disordinato); la temperatura a cui avvengono non si può dedurre da questo. Regole per il segno di ΔS del sistema: aumenta quando da un solido si forma un liquido o una soluzione e quando aumentano le moli di gas.","spiegazione":"Per decidere se un processo è spontaneo non basta guardare il sistema: bisogna fare il bilancio dell'universo. Una reazione può anche mettere ordine nel sistema (ΔS negativo), purché scaldi abbastanza l'ambiente da creare lì più disordine di quanto ne ha tolto. Il conto totale deve essere sempre in attivo.","esempi":["ΔSsist = −47 J/K; ΔH = −83 kJ a 400 K: ΔSamb = +208 J/K; ΔStot = +161 J/K → spontanea.","ΔH = −100 kJ a 298 K: ΔSamb = +100 000/298 = +336 J/K.","Evaporazione dell'acqua e fusione di un solido: ΔS > 0.","CaCl₂(s) → Ca²⁺(aq) + 2 Cl⁻(aq): ΔS del sistema positivo.","2 H₂(g) + O₂(g) → 2 H₂O(g): da 3 a 2 moli di gas → ΔS del sistema negativo.","Reazione con ΔH = −100 kJ a 298 K: ΔSambiente = +100 000 / 298 = +336 J/K.","NH₄NO₃(s) → NH₄⁺(aq) + NO₃⁻(aq): endotermica ma spontanea, guidata dall'entropia."]},{"titolo":"Energia libera di Gibbs","riassunto":"Usare il secondo principio richiede di calcolare tre quantità: ΔSsistema, ΔSambiente e la loro somma. Per semplificare si introduce una nuova funzione di stato, l'energia libera di Gibbs: G = H − TS. Per un processo a temperatura costante ΔG = ΔH − TΔS. Poiché ΔStot = ΔS − ΔH/T, confrontando le due espressioni si ottiene ΔG = −T·ΔStot (a temperatura e pressione costanti). Quindi, a temperatura e pressione costanti, la direzione della trasformazione spontanea è quella in cui l'energia libera di Gibbs diminuisce: ΔG < 0 processo spontaneo, ΔG > 0 spontaneo il processo inverso, ΔG = 0 equilibrio. In questo modo la spontaneità si prevede usando solo proprietà termodinamiche del sistema. Come per l'entalpia, si usano solo le variazioni di G e non i valori assoluti. L'energia libera molare di una sostanza diminuisce all'aumentare della temperatura (a pressione costante), e diminuisce più rapidamente per le fasi a entropia maggiore: questo spiega l'origine termodinamica dei passaggi di stato, perché a ogni temperatura è stabile la fase con G molare più bassa. Calcolo di ΔG = ΔH − TΔS (T in kelvin; ΔS in J/K va diviso per 1000 per essere in kJ come ΔH). Esempio: ΔH = +130 kJ, ΔS = −244 J/K, T = 1000 K: ΔG = 130 − 1000·(−0,244) = +374 kJ → non spontanea. Regola dei segni, ΔG = ΔH − TΔS: ΔH < 0 e ΔS > 0 → ΔG < 0 sempre: spontanea a tutte le temperature; ΔH > 0 e ΔS < 0 → ΔG > 0 sempre: mai spontanea; ΔH < 0 e ΔS < 0 → spontanea solo a basse temperature (prevale ΔH); ΔH > 0 e ΔS > 0 → spontanea solo ad alte temperature (prevale TΔS). La spontaneità è determinata da ΔG (ΔG < 0 spontaneo, ΔG > 0 non spontaneo nella direzione scritta, ΔG = 0 equilibrio). Fusione del ghiaccio: ΔG = ΔH − TΔS = 6010 − 283·22,0 = −216 J/mol a 10 °C (283 K): spontanea; a 0 °C (273 K) ΔG = 6010 − 273·22,0 ≈ 0: equilibrio. Con T in °C invece che in kelvin il risultato è sbagliato.","spiegazione":"ΔG mette sulla stessa bilancia le due «spinte» di un processo: la tendenza a cedere energia (ΔH negativo) e la tendenza al disordine (ΔS positivo), quest'ultima pesata dalla temperatura. Se il piatto pende dalla parte negativa, il processo va avanti da solo. È il secondo principio riscritto in modo da non dover più pensare all'ambiente.","esempi":["ΔH = −114 kJ, ΔS = +230 J/K: ΔG < 0 a qualsiasi T → spontanea sempre.","ΔH = +130 kJ, ΔS = −244 J/K, 1000 K: ΔG = 130 + 244 = +374 kJ → non spontanea.","Ghiaccio a 10 °C = 283 K: ΔG = 6010 − 283·22,0 = −216 J/mol (spontanea). A 273 K: ΔG ≈ 0.","Fusione del ghiaccio (ΔHfus = 6,01 kJ/mol, ΔSfus = 22,0 J/(K·mol)) a 10 °C: ΔG = 6010 − 283·22,0 = −216 J/mol → spontanea.","A 0 °C: ΔG = 6010 − 273·22,0 ≈ 0 → ghiaccio e acqua in equilibrio.","Sotto 0 °C ΔG > 0: è spontaneo il congelamento."]},{"titolo":"ΔG° di reazione, stabilità ed effetto della temperatura","riassunto":"L'energia libera standard di reazione ΔG° si riferisce agli stati standard: è una quantità fissa per una data reazione e non cambia mentre la reazione procede. L'energia libera standard di formazione, ΔG°f, è l'energia libera standard di reazione, per mole, per la formazione di un composto dai suoi elementi nella forma più stabile; con essa si calcola ΔG° = Σ n·ΔG°f(prodotti) − Σ m·ΔG°f(reagenti). Un composto con ΔG°f negativa è termodinamicamente stabile rispetto ai suoi elementi (l'acqua); uno con ΔG°f positiva è termodinamicamente instabile (il benzene). Stabilità termodinamica e velocità sono cose diverse: le sostanze che si decompongono o reagiscono rapidamente sono labili, quelle che sopravvivono a lungo sono non labili o inerti. Il benzene è termodinamicamente instabile ma non labile. ΔG° = ΔH° − TΔS° dipende dalla temperatura e può cambiare segno. Reazioni esotermiche con ΔS > 0: spontanee a tutte le temperature. Esotermiche con ΔS < 0: spontanee a bassa temperatura (guidate dall'entalpia). Endotermiche con ΔS > 0: spontanee ad alta temperatura (guidate dall'entropia). Endotermiche con ΔS < 0: mai spontanee. La temperatura a cui ΔG° cambia segno è T = ΔH° / ΔS°. Calcolo della temperatura di inversione: ΔG° = 0 quando T = ΔH°/ΔS° (ΔH in J e ΔS in J/K, risultato in kelvin). Se ΔH° = −42 kJ e ΔS° = −204 J/K: T = −42 000/−204 = 206 K; ΔH° = +57,2 kJ e ΔS° = +175,8 J/K (N₂O₄ → 2 NO₂): T = 57 200/175,8 = 325 K; per ΔH e ΔS di segno uguale si usa il caso (−/−): spontanea sotto T; (+/+): spontanea sopra T. Calcolo di ΔG° a una data T: ΔG° = ΔH° − TΔS°: per 2 SO₂ + O₂ → 2 SO₃ con ΔH° = −197,8 kJ e ΔS° = −188,0 J/K a 1000 K: ΔG° = −197,8 + 1000·0,1880 = −9,8 kJ (spontanea). Con ΔG°f di formazione si calcola ΔG° = Σ n·ΔG°f(prodotti) − Σ n·ΔG°f(reagenti) (come per ΔH°). Riepilogo dei casi: (ΔH < 0, ΔS > 0) sempre; (ΔH > 0, ΔS < 0) mai; (ΔH < 0, ΔS < 0) a bassa T; (ΔH > 0, ΔS > 0) ad alta T. Termodinamica e velocità sono indipendenti: un composto con ΔG°f > 0 è instabile, ma se non reagisce in tempi osservabili è «inerte» (non labile).","spiegazione":"La temperatura è la manopola che decide quanto conta l'entropia. A freddo comanda l'entalpia: vince chi libera calore. A caldo comanda l'entropia: vince chi crea disordine. Quando le due spinte vanno in direzioni opposte esiste una temperatura di «pareggio», T = ΔH/ΔS, oltre la quale la reazione cambia verso.","esempi":["ΔH° = −42 kJ, ΔS° = −204 J/K: T = (−42·1000)/(−204) = 206 K (spontanea sotto 206 K).","N₂O₄ → 2 NO₂: ΔH° = +57,2 kJ, ΔS° = +175,8 J/K: T = 325 K; spontanea per T > 325 K.","2 SO₂ + O₂ → 2 SO₃ a 1000 K: ΔG° = −197,8 − 1000·(−0,188) = −9,8 kJ.","2 H₂ + O₂ → 2 H₂O(g): ΔH < 0, ΔS < 0 → guidata dall'entalpia.","Dissoluzione di NH₄NO₃: ΔH > 0, ΔS > 0 → guidata dall'entropia.","Na₂CO₃(s) + HCl(aq) → NaCl(aq) + CO₂(g): ΔH < 0 e ΔS > 0 → guidata da entrambe.","ΔH° = +178 kJ e ΔS° = +161 J/K: spontanea sopra 178 000 / 161 ≈ 1106 K."]}]}];
const DOMANDE = [{"id":"atomo-q0","c":"atomo","l":1,"a":0,"q":"Che cosa significa il termine «atomos» usato da Democrito?","o":["Molto piccolo","Che non si può tagliare (indivisibile)","Privo di massa","Fatto di vuoto"],"r":1,"s":"Per Democrito, dividendo la materia si arriva a un pezzo che non può più essere diviso: lo chiamò «atomos», cioè «non tagliabile».","f":0,"e":0},{"id":"atomo-q1","c":"atomo","l":1,"a":0,"q":"Che cosa afferma la legge di Lavoisier (1785)?","o":["La massa dei prodotti di una reazione è uguale a quella dei reagenti","Il volume dei prodotti è uguale a quello dei reagenti","Gli atomi di elementi diversi hanno la stessa massa","La massa dei prodotti è sempre maggiore di quella dei reagenti"],"r":0,"s":"È la legge di conservazione della massa: in una reazione chimica la massa totale non cambia.","f":0,"e":0},{"id":"atomo-q2","c":"atomo","l":1,"a":0,"q":"Quale di queste affermazioni NON è un postulato di Dalton?","o":["La materia è fatta di atomi che non si creano né si distruggono","Gli atomi di uno stesso elemento hanno massa e proprietà identiche","I composti si formano dalla combinazione di un numero preciso di atomi diversi","Gli atomi sono formati da protoni, neutroni ed elettroni"],"r":3,"s":"Per Dalton l'atomo era indivisibile (una «palla da biliardo»): le particelle subatomiche furono scoperte più tardi da Thomson, Millikan e Rutherford.","f":0,"e":0},{"id":"atomo-q3","c":"atomo","l":1,"a":1,"q":"Da che cosa sono costituiti i raggi catodici?","o":["Da particelle α di carica positiva","Da neutroni","Da particelle di carica negativa (elettroni)","Da radiazione luminosa priva di carica"],"r":2,"s":"Perrin dimostrò che un magnete devia i raggi catodici nella direzione corrispondente a una carica negativa: sono elettroni.","f":0,"e":0},{"id":"atomo-q4","c":"atomo","l":1,"a":1,"q":"Che cosa determinò Millikan con l'esperimento delle goccioline d'olio?","o":["La massa del neutrone","La carica dell'elettrone (1,6·10⁻¹⁹ C)","Le dimensioni del nucleo","Il numero di Avogadro"],"r":1,"s":"Le cariche misurate sulle goccioline avevano un fattore comune, 1,6·10⁻¹⁹ C: la più piccola carica elettrica, attribuita all'elettrone.","f":0,"e":0},{"id":"atomo-q5","c":"atomo","l":1,"a":2,"q":"Secondo il modello di Rutherford, dove si trova quasi tutta la massa dell'atomo?","o":["In un nucleo piccolissimo, denso e carico positivamente","Distribuita uniformemente in tutto l'atomo","Negli elettroni che circondano il nucleo","Nello spazio vuoto tra nucleo ed elettroni"],"r":0,"s":"Il nucleo occupa una frazione minuscola del volume dell'atomo ma ne contiene praticamente tutta la massa; gli elettroni contribuiscono in modo trascurabile.","f":0,"e":0},{"id":"atomo-q6","c":"atomo","l":1,"a":3,"q":"Che cosa indica il numero atomico Z?","o":["Il numero di neutroni","La somma di protoni e neutroni","La massa dell'atomo in grammi","Il numero di protoni"],"r":3,"s":"Z è il numero di protoni ed è ciò che rende un elemento chimicamente diverso da un altro.","f":0,"e":0},{"id":"atomo-q7","c":"atomo","l":1,"a":3,"q":"Che cosa indica il numero di massa A?","o":["Il numero di elettroni","La massa atomica media dell'elemento","Il numero totale di nucleoni (protoni + neutroni)","Il numero di protoni"],"r":2,"s":"A conta le particelle del nucleo: protoni più neutroni.","f":0,"e":0},{"id":"atomo-q8","c":"atomo","l":1,"a":3,"q":"Come è definita l'unità di massa atomica (u)?","o":["La massa di un atomo di idrogeno","1/12 della massa di un atomo di ¹²C","La massa di un elettrone","1/16 della massa di un atomo di ossigeno"],"r":1,"s":"Per convenzione il riferimento è il carbonio-12: 1 u = 1/12 della sua massa = 1,66·10⁻²⁷ kg.","f":0,"e":0},{"id":"atomo-q9","c":"atomo","l":1,"a":4,"q":"Che cosa sono gli isotopi?","o":["Atomi dello stesso elemento con diverso numero di neutroni","Atomi di elementi diversi con la stessa massa","Atomi dello stesso elemento con diverso numero di protoni","Ioni dello stesso elemento con carica diversa"],"r":0,"s":"Gli isotopi hanno lo stesso Z (stessi protoni) ma diverso A, perché cambia il numero di neutroni.","f":0,"e":0},{"id":"atomo-q10","c":"atomo","l":1,"a":4,"q":"Che cos'è un catione?","o":["Uno ione negativo, in cui gli elettroni prevalgono sui protoni","Un atomo neutro con più neutroni che protoni","Una molecola formata da due atomi uguali","Uno ione positivo, in cui i protoni prevalgono sugli elettroni"],"r":3,"s":"Se un atomo perde elettroni restano più protoni che elettroni: lo ione è positivo ed è attratto dal catodo.","f":0,"e":0},{"id":"atomo-q11","c":"atomo","l":1,"a":3,"q":"Quale particella subatomica è priva di carica elettrica?","o":["Il protone","L'elettrone","Il neutrone","La particella α"],"r":2,"s":"Il neutrone ha carica nulla e massa circa uguale a quella del protone (≈ 1 u).","f":0,"e":0},{"id":"atomo-q12","c":"atomo","l":2,"a":3,"q":"Quanti neutroni contiene un atomo di ⁵²Cr (Z = 24)?","o":["24","52","28","76"],"r":2,"s":"Neutroni = A − Z = 52 − 24 = 28.","f":0,"e":0},{"id":"atomo-q13","c":"atomo","l":2,"a":4,"q":"Quanti elettroni possiede lo ione Al³⁺ (Z = 13)?","o":["13","10","16","3"],"r":1,"s":"L'atomo neutro ha 13 elettroni; la carica 3+ indica che ne ha persi 3: 13 − 3 = 10.","f":0,"e":0},{"id":"atomo-q14","c":"atomo","l":2,"a":4,"q":"Lo ione F⁻ (Z = 9) contiene:","o":["9 protoni e 10 elettroni","10 protoni e 9 elettroni","9 protoni e 8 elettroni","8 protoni e 9 elettroni"],"r":0,"s":"I protoni restano 9 (è sempre fluoro); la carica 1− indica un elettrone in più: 10.","f":0,"e":0},{"id":"atomo-q15","c":"atomo","l":2,"a":3,"q":"Un atomo ha 20 protoni e 20 neutroni. La sua massa è circa:","o":["20 u","60 u","0,011 u","40 u"],"r":3,"s":"Protoni e neutroni hanno massa di circa 1 u ciascuno; gli elettroni sono trascurabili: 20 + 20 = 40 u.","f":0,"e":0},{"id":"atomo-q16","c":"atomo","l":2,"a":4,"q":"Un atomo ha 20 protoni e 18 elettroni. Qual è la sua carica?","o":["2−","18+","2+","Nulla"],"r":2,"s":"Ci sono due cariche positive in più rispetto a quelle negative: lo ione è 2+ (non 2−).","f":0,"e":0},{"id":"atomo-q17","c":"atomo","l":2,"a":4,"q":"Quanti protoni e neutroni contiene il carbonio-13 (Z = 6)?","o":["7 protoni e 6 neutroni","6 protoni e 7 neutroni","6 protoni e 13 neutroni","13 protoni e 6 neutroni"],"r":1,"s":"Z = 6 protoni; neutroni = 13 − 6 = 7.","f":0,"e":0},{"id":"atomo-q18","c":"atomo","l":2,"a":4,"q":"Il trizio è l'isotopo dell'idrogeno il cui nucleo contiene:","o":["1 protone e 2 neutroni","1 protone e 1 neutrone","2 protoni e 1 neutrone","3 protoni"],"r":0,"s":"Tutti gli isotopi dell'idrogeno hanno 1 protone: prozio 0 neutroni, deuterio 1, trizio 2.","f":0,"e":0},{"id":"atomo-q19","c":"atomo","l":2,"a":2,"q":"Nell'esperimento di Rutherford, che cosa accadeva alla maggior parte delle particelle α?","o":["Rimbalzavano all'indietro","Venivano assorbite dalla lamina","Venivano tutte deviate di piccoli angoli","Attraversavano la lamina d'oro senza essere deviate"],"r":3,"s":"L'atomo è quasi tutto spazio vuoto: solo le poche particelle che passano vicino a un nucleo vengono deviate.","f":0,"e":0},{"id":"atomo-q20","c":"atomo","l":2,"a":1,"q":"Come è descritto l'atomo nel modello di Thomson?","o":["Un nucleo positivo attorno a cui ruotano gli elettroni","Una sfera indivisibile priva di cariche","Una nube di carica positiva in cui sono immerse le particelle negative","Un nucleo di neutroni circondato da protoni"],"r":2,"s":"Nel modello di Thomson non esiste un nucleo: la carica positiva è diffusa e gli elettroni vi sono immersi.","f":0,"e":0},{"id":"atomo-q21","c":"atomo","l":2,"a":0,"q":"Bruciando, il magnesio aumenta di massa. Perché questo non contraddice la legge di Lavoisier?","o":["Perché durante la combustione si creano nuovi atomi","Perché si combina con l'ossigeno: la massa di Mg + O₂ è uguale a quella di MgO","Perché la legge vale solo per i gas","Perché il calore ha una massa che si aggiunge al solido"],"r":1,"s":"Tra i reagenti va contato anche l'ossigeno dell'aria: la massa dei reagenti è uguale a quella del prodotto MgO.","f":0,"e":0},{"id":"atomo-q22","c":"atomo","l":2,"a":3,"q":"Di quanto la massa del protone è maggiore di quella dell'elettrone?","o":["Circa 1840 volte","Circa 2 volte","Circa 100 volte","Circa un milione di volte"],"r":0,"s":"L'elettrone è circa 1840 volte più leggero del protone: per questo la massa dell'atomo sta quasi tutta nel nucleo.","f":0,"e":0},{"id":"atomo-q23","c":"atomo","l":2,"a":3,"q":"L'atomo ha dimensioni di circa 10⁻¹⁰ m, protoni e neutroni di circa 10⁻¹⁵ m. Il nucleo è quindi più piccolo dell'atomo di circa:","o":["2 ordini di grandezza","10 ordini di grandezza","15 ordini di grandezza","5 ordini di grandezza"],"r":3,"s":"10⁻¹⁰ / 10⁻¹⁵ = 10⁵: il nucleo è centomila volte più piccolo dell'atomo.","f":0,"e":0},{"id":"atomo-q30","c":"atomo","l":3,"a":0,"q":"Chi ha formulato la legge della conservazione di massa?","o":["Democrito","Lavoisier","Dalton","Lewis"],"r":1,"s":"\"nulla si crea e nulla si distrugge ma tutto si trasforma\" sunto di Lavoisier","f":0,"e":1},{"id":"atomo-q31","c":"atomo","l":3,"a":3,"q":"Il numero di massa è","o":["Somma neutroni e protoni in un nucleo","Somma protoni elettroni e neutroni in un nucleo","Numero di protoni","Numero di neutroni","Differenza protoni e neutroni"],"r":0,"s":"definizione","f":0,"e":1},{"id":"atomo-q32","c":"atomo","l":3,"a":3,"q":"Sia un atomo Z=9, A=19 , scrivere nell' ordine il numero di elettroni, neutroni, elettroni spaiati","o":["9, 10, 1","1, 9, 10","19, 10, 9","9, 19, 1","9, 10, 0"],"r":0,"s":"Z=9 quindi si tratta del fluoro F . Il numero di protoni e quindi elettroni sarà di 9 (Z). Il numero di neutroni è uguale a : n = A -p = 19-9= 10. La configurazione del fluoro è 1s2 2s2 2p5 quindi ha 1 elettrone spaiato","f":0,"e":1},{"id":"atomo-q33","c":"atomo","l":3,"a":3,"q":"Cosa rappresenta il 12 nel carbonio-12?","o":["Numero Atomico","Numero di avogadro","Numero di massa","Peso atomico","Numero di elettroni"],"r":2,"s":"Il numero in apice (¹²C) è il numero di massa A = protoni + neutroni: nel carbonio-12 sono 6 + 6.","f":0,"e":1},{"id":"atomo-q34","c":"atomo","l":3,"a":4,"q":"Cosa è il nitrato?","o":["NO3-","NO4-","NH4","NH3","Un atomo"],"r":0,"s":"Il nitrato è lo ione NO3-","f":0,"e":1},{"id":"atomo-q35","c":"atomo","l":3,"a":4,"q":"Il cloro naturale è formato per circa il 75% da ³⁵Cl e per il 25% da ³⁷Cl. Qual è la massa atomica media?","o":["36,0 u","Circa 35,5 u","35,0 u","36,5 u"],"r":1,"s":"Media pesata: 0,75 · 35 + 0,25 · 37 = 26,25 + 9,25 = 35,5 u. Non è la media aritmetica (36): pesa di più l'isotopo più abbondante.","f":0,"e":0},{"id":"atomo-q36","c":"atomo","l":3,"a":4,"q":"Il gallio è formato da ⁶⁹Ga (68,93 u; 60,11%) e ⁷¹Ga (70,92 u; 39,89%). Qual è la sua massa atomica?","o":["69,72 u","69,93 u","70,12 u","68,93 u"],"r":0,"s":"0,6011 · 68,93 + 0,3989 · 70,92 = 41,43 + 28,29 = 69,72 u. Il valore sta tra le due masse, più vicino all'isotopo più abbondante.","f":0,"e":0},{"id":"atomo-q37","c":"atomo","l":3,"a":4,"q":"Il rame ha massa atomica 63,55 u ed è formato da ⁶³Cu (62,94 u) e ⁶⁵Cu (64,93 u). Qual è l'abbondanza di ⁶³Cu?","o":["Circa 31%","Circa 50%","Circa 90%","Circa 69%"],"r":3,"s":"62,94·x + 64,93·(1 − x) = 63,55 → 1,99·x = 1,38 → x ≈ 0,69. La media è più vicina a 62,94, quindi ⁶³Cu deve essere il più abbondante.","f":0,"e":0},{"id":"atomo-q38","c":"atomo","l":3,"a":2,"q":"Quale osservazione portò Rutherford a concludere che la massa dell'atomo è concentrata in un nucleo piccolissimo?","o":["Tutte le particelle α venivano assorbite dalla lamina","Le particelle α venivano tutte deviate dello stesso angolo","Poche particelle α venivano deviate, mentre quasi tutte passavano indisturbate","La lamina d'oro emetteva elettroni"],"r":2,"s":"Se la massa fosse diffusa (modello di Thomson) nessuna particella verrebbe deviata in modo marcato. Le rare deviazioni indicano un ostacolo molto massiccio ma molto piccolo.","f":0,"e":0},{"id":"atomo-q39","c":"atomo","l":3,"a":2,"q":"Il berillio ha 4 protoni ma massa 9,01 u. Come spiegò Rutherford la massa «in più»?","o":["Con la massa dei 4 elettroni","Con la presenza nel nucleo di particelle neutre di massa circa 1 u, i neutroni","Con l'energia di legame tra protoni","Con la presenza di 9 protoni, di cui 5 neutralizzati da elettroni esterni"],"r":1,"s":"I 4 elettroni pesano in tutto circa 0,002 u: non bastano. Servono 5 neutroni, senza carica e con massa di circa 1 u ciascuno.","f":0,"e":0},{"id":"atomo-q40","c":"atomo","l":3,"a":0,"q":"In CO e CO₂ le masse di ossigeno che si combinano con 12 g di carbonio sono 16 g e 32 g. Quale legge illustra questo dato?","o":["La legge delle proporzioni multiple: le masse stanno in un rapporto di piccoli numeri interi (1 : 2)","La legge di conservazione della massa","La legge di Avogadro","La legge di Boyle"],"r":0,"s":"Quando due elementi formano più composti, le masse di uno che si combinano con la stessa massa dell'altro stanno tra loro in rapporti semplici. Fu il primo grande successo della teoria di Dalton.","f":0,"e":0},{"id":"atomo-q41","c":"atomo","l":3,"a":1,"q":"Come fu possibile calcolare la massa dell'elettrone?","o":["Pesando direttamente un fascio di raggi catodici","Dall'esperimento della lamina d'oro di Rutherford","Dalla legge delle proporzioni multiple","Combinando la carica misurata da Millikan con il rapporto carica/massa misurato da Thomson"],"r":3,"s":"Thomson conosceva e/m, Millikan misurò e: dividendo e per il rapporto e/m si ottiene m.","f":0,"e":0},{"id":"atomo-q42","c":"atomo","l":3,"a":2,"q":"Quale di questi fenomeni NON è spiegato dal modello di Rutherford?","o":["La deviazione di alcune particelle α","La concentrazione della massa nel nucleo","Gli spettri di emissione degli atomi","La neutralità elettrica dell'atomo"],"r":2,"s":"Il modello nucleare non spiega gli spettri di emissione e di assorbimento, l'effetto fotoelettrico, né perché l'elettrone non cada sul nucleo: serviranno gli orbitali atomici.","f":0,"e":0},{"id":"atomo-q43","c":"atomo","l":3,"a":4,"q":"Perché gli isotopi di uno stesso elemento hanno essenzialmente le stesse proprietà chimiche?","o":["Perché hanno la stessa massa","Perché hanno lo stesso numero di protoni e di elettroni","Perché hanno lo stesso numero di neutroni","Perché hanno lo stesso numero di massa"],"r":1,"s":"Il comportamento chimico dipende dagli elettroni (e quindi da Z). Gli isotopi differiscono solo per i neutroni; l'effetto della massa è rilevante solo per l'idrogeno.","f":0,"e":0},{"id":"atomo-q44","c":"atomo","l":3,"a":0,"q":"Quale fu un limite della teoria atomica di Dalton?","o":["Non poteva spiegare l'esistenza di particelle subatomiche elettricamente cariche","Non rispettava la legge di conservazione della massa","Non prevedeva che i composti contengano atomi diversi","Considerava gli atomi infinitamente divisibili"],"r":0,"s":"Gli atomi «palle da biliardo» non spiegano né le particelle cariche scoperte in seguito né perché gli atomi si combinino solo in certi rapporti (H₂O ma non H₃O).","f":0,"e":0},{"id":"mole-q0","c":"mole","l":1,"a":0,"q":"Che cos'è un composto?","o":["Una miscela di sostanze in proporzioni variabili","Una sostanza formata da atomi di un solo elemento","Una sostanza neutra formata da due o più elementi diversi in rapporto definito","Un atomo o una molecola dotati di carica elettrica"],"r":2,"s":"Il composto è elettricamente neutro e contiene atomi di elementi diversi in un rapporto fisso. Una specie carica è invece uno ione.","f":0,"e":0},{"id":"mole-q1","c":"mole","l":1,"a":1,"q":"Quante entità contiene una mole?","o":["Tante quanti sono gli atomi in 1 g di idrogeno, cioè 6,022·10²⁰","Tante quanti sono gli atomi in 12 g di carbonio-12, cioè 6,022·10²³","Esattamente un miliardo","Dipende dalla sostanza considerata"],"r":1,"s":"La mole è definita rispetto a 12 g di ¹²C e contiene sempre un numero di Avogadro di entità, qualunque esse siano.","f":0,"e":0},{"id":"mole-q2","c":"mole","l":1,"a":1,"q":"Che cos'è la massa molare?","o":["La massa di una mole di particelle, espressa in g/mol","La massa di una singola molecola, espressa in grammi","Il numero di particelle contenute in un grammo","Il volume occupato da una mole di sostanza"],"r":0,"s":"La massa molare M lega grammi e moli (n = m / M); per un elemento coincide numericamente con la massa atomica.","f":0,"e":0},{"id":"mole-q3","c":"mole","l":1,"a":2,"q":"Che cosa indica la formula empirica?","o":["Il numero effettivo di atomi nella molecola","Il modo in cui gli atomi sono legati tra loro","La massa di una mole di composto","I numeri relativi (rapporto minimo) degli atomi di ciascun elemento"],"r":3,"s":"La formula empirica dà solo il rapporto più semplice tra gli atomi: CH₂O vale per formaldeide, acido acetico e glucosio.","f":0,"e":0},{"id":"mole-q4","c":"mole","l":1,"a":2,"q":"Che cosa indica la formula molecolare?","o":["Il rapporto minimo tra gli atomi","La disposizione degli atomi nello spazio","Il numero effettivo di atomi di ciascun elemento nella molecola","La percentuale in massa di ciascun elemento"],"r":2,"s":"La formula molecolare riporta quanti atomi ci sono davvero nella molecola (C₆H₁₂O₆ per il glucosio).","f":0,"e":0},{"id":"mole-q5","c":"mole","l":1,"a":3,"q":"A che cosa servono i coefficienti stechiometrici?","o":["A indicare lo stato fisico delle sostanze","A rispettare la conservazione della massa: stesso numero di atomi tra reagenti e prodotti","A indicare la velocità della reazione","A modificare la formula delle sostanze"],"r":1,"s":"I coefficienti si mettono davanti alle formule per avere lo stesso numero di atomi di ogni elemento sui due lati della freccia.","f":0,"e":0},{"id":"mole-q6","c":"mole","l":1,"a":4,"q":"Qual è il numero di ossidazione di un elemento non combinato (per esempio Cl₂ o S₈)?","o":["Zero","+1","−1","Uguale al numero del gruppo"],"r":0,"s":"Un elemento allo stato elementare ha numero di ossidazione zero, qualunque sia la sua struttura.","f":0,"e":0},{"id":"mole-q7","c":"mole","l":1,"a":4,"q":"Che cosa accade al numero di ossidazione di un elemento che si ossida?","o":["Diminuisce","Resta invariato","Diventa zero","Aumenta"],"r":3,"s":"Ossidazione = aumento del numero di ossidazione (perdita di elettroni); riduzione = diminuzione.","f":0,"e":0},{"id":"mole-q8","c":"mole","l":1,"a":4,"q":"Che cosa caratterizza una reazione redox?","o":["La formazione di un sale da un acido e una base","Lo scambio di ioni tra due sali senza altre variazioni","Un trasferimento di elettroni, con variazione dei numeri di ossidazione","L'assenza di variazioni di massa"],"r":2,"s":"Nelle redox una specie cede elettroni (si ossida) e un'altra li acquista (si riduce); nelle reazioni non redox i numeri di ossidazione non cambiano.","f":0,"e":0},{"id":"mole-q9","c":"mole","l":1,"a":4,"q":"A quanto è uguale la somma dei numeri di ossidazione degli atomi di uno ione poliatomico?","o":["Sempre a zero","Alla carica dello ione","Al numero di atomi dello ione","Al numero di ossidazione dell'atomo centrale"],"r":1,"s":"In un composto neutro la somma è zero; in uno ione è uguale alla sua carica.","f":0,"e":0},{"id":"mole-q10","c":"mole","l":1,"a":1,"q":"Come si calcola la massa di una molecola?","o":["Sommando le masse degli atomi che la compongono","Moltiplicando tra loro le masse degli atomi","Dividendo la massa atomica per il numero di atomi","Sommando i numeri atomici degli atomi"],"r":0,"s":"Per H₂O: 2 · 1,008 + 15,999 = 18,015 u.","f":0,"e":0},{"id":"mole-q11","c":"mole","l":1,"a":1,"q":"Che cos'è il difetto di massa?","o":["La massa persa da un atomo quando diventa catione","La differenza di massa tra due isotopi","L'errore sperimentale nella misura della massa atomica","La differenza tra la massa del nucleo e la somma delle masse dei nucleoni che lo formano"],"r":3,"s":"Il nucleo pesa meno dei suoi nucleoni separati: la differenza corrisponde all'energia che serve per separarli (ΔE = Δm·c²).","f":0,"e":0},{"id":"mole-q12","c":"mole","l":2,"a":1,"q":"Qual è la massa molare di Ba(OH)₂? (Ba = 137,33; O = 16,00; H = 1,01)","o":["154,34 g/mol","155,35 g/mol","308,69 g/mol","171,35 g/mol"],"r":3,"s":"137,33 + 2 · 16,00 + 2 · 1,01 = 171,35 g/mol: il pedice 2 vale per tutto il gruppo OH.","f":0,"e":0},{"id":"mole-q13","c":"mole","l":2,"a":1,"q":"Quanti grammi corrispondono a 1,667 mol di O₂ (M = 32,00 g/mol)?","o":["26,7 g","19,2 g","53,3 g","0,052 g"],"r":2,"s":"m = n · M = 1,667 · 32,00 = 53,3 g. (26,7 g è l'errore di chi usa la massa atomica 16 invece di quella della molecola O₂.)","f":0,"e":0},{"id":"mole-q14","c":"mole","l":2,"a":1,"q":"Quante moli sono contenute in 45 g di argento (M = 107,87 g/mol)?","o":["2,4 mol","0,42 mol","4854 mol","0,24 mol"],"r":1,"s":"n = m / M = 45 / 107,87 = 0,42 mol.","f":0,"e":0},{"id":"mole-q15","c":"mole","l":2,"a":4,"q":"Qual è il numero di ossidazione del cromo in CrCl₃?","o":["+3","+1","−3","+6"],"r":0,"s":"Il cloro vale −1: n + 3·(−1) = 0 → n = +3.","f":0,"e":0},{"id":"mole-q16","c":"mole","l":2,"a":4,"q":"Qual è il numero di ossidazione del cromo nello ione dicromato Cr₂O₇²⁻?","o":["+7","+12","+3","+6"],"r":3,"s":"2n + 7·(−2) = −2 → 2n = +12 → n = +6. Attenzione: gli atomi di cromo sono due.","f":0,"e":0},{"id":"mole-q17","c":"mole","l":2,"a":4,"q":"Qual è il numero di ossidazione dell'ossigeno in H₂O₂?","o":["−2","0","−1","+1"],"r":2,"s":"È un perossido: ogni H vale +1, quindi per avere somma zero ogni O deve valere −1.","f":0,"e":0},{"id":"mole-q18","c":"mole","l":2,"a":4,"q":"Qual è il numero di ossidazione dell'idrogeno in NaH?","o":["+1","−1","0","+2"],"r":1,"s":"Negli idruri metallici l'idrogeno è presente come ione H⁻: il sodio (gruppo 1) vale sempre +1, quindi H vale −1.","f":0,"e":0},{"id":"mole-q19","c":"mole","l":2,"a":3,"q":"Quali coefficienti bilanciano __ N₂ + __ H₂ → __ NH₃ ?","o":["1, 3, 2","1, 1, 1","2, 3, 2","1, 2, 3"],"r":0,"s":"N₂ + 3 H₂ → 2 NH₃: 2 atomi di N e 6 di H su entrambi i lati.","f":0,"e":0},{"id":"mole-q20","c":"mole","l":2,"a":3,"q":"Nella reazione H₂SO₄ + Ca(OH)₂ → CaSO₄ + __ H₂O, quante moli di acqua si formano?","o":["1","3","4","2"],"r":3,"s":"L'acido cede 2 H⁺ e la base 2 OH⁻: si formano 2 H₂O. È una reazione acido-base (salificazione).","f":0,"e":0},{"id":"mole-q21","c":"mole","l":2,"a":2,"q":"Qual è la formula empirica del glucosio, C₆H₁₂O₆?","o":["C₆H₁₂O₆","C₂H₄O₂","CH₂O","CHO"],"r":2,"s":"Dividendo tutti i pedici per 6 si ottiene il rapporto minimo 1 : 2 : 1.","f":0,"e":0},{"id":"mole-q22","c":"mole","l":2,"a":3,"q":"Qual è l'equazione ionica netta di HNO₃(aq) + NaOH(aq) → NaNO₃(aq) + H₂O(l)?","o":["Na⁺ + NO₃⁻ → NaNO₃","H⁺ + OH⁻ → H₂O","H⁺ + NO₃⁻ → HNO₃","Na⁺ + OH⁻ → NaOH"],"r":1,"s":"Na⁺ e NO₃⁻ compaiono identici tra reagenti e prodotti (ioni spettatori) e si cancellano: resta la formazione di acqua.","f":0,"e":0},{"id":"mole-q23","c":"mole","l":2,"a":1,"q":"Il carbonio naturale è formato per il 98,9% da ¹²C (12 u) e per l'1,1% da ¹³C (13 u). Qual è la massa atomica media?","o":["12,011 u","12,500 u","12,000 u","12,989 u"],"r":0,"s":"12 · 0,989 + 13 · 0,011 = 11,868 + 0,143 = 12,011 u.","f":0,"e":0},{"id":"mole-q24","c":"mole","l":1,"a":6,"q":"Qual è la formula del cloruro di sodio?","o":["Na₂Cl","NaClO","NaCl","NaCl₂"],"r":2,"s":"I sali degli idracidi finiscono in -uro: Na⁺ e Cl⁻ si combinano 1 a 1, quindi NaCl.","f":0,"e":0},{"id":"mole-q25","c":"mole","l":1,"a":6,"q":"Che cosa si ottiene facendo reagire un ossido basico con l'acqua?","o":["Un ossiacido","Un idrossido","Un'anidride","Un idruro"],"r":1,"s":"Ossido basico + H₂O → idrossido (per esempio Na₂O + H₂O → 2 NaOH).","f":0,"e":0},{"id":"mole-q26","c":"mole","l":1,"a":6,"q":"Qual è il nome di H₂SO₄?","o":["Acido solforico","Acido solforoso","Acido solfidrico","Solfato di idrogeno e sodio"],"r":0,"s":"Lo zolfo ha numero di ossidazione +6 (il maggiore): suffisso -ico, acido solforico.","f":0,"e":0},{"id":"mole-q27","c":"mole","l":1,"a":6,"q":"Qual è il nome tradizionale di CO₂?","o":["Ossido di carbonio basico","Acido carbonico","Carbonato di carbonio","Anidride carbonica"],"r":3,"s":"Un non metallo + ossigeno è un'anidride: CO₂ è l'anidride carbonica (IUPAC: diossido di carbonio).","f":0,"e":0},{"id":"mole-q28","c":"mole","l":1,"a":6,"q":"Qual è il numero di ossidazione dell'ossigeno nei perossidi (come H₂O₂)?","o":["−2","0","−1","+1"],"r":2,"s":"Nei perossidi c'è il gruppo O₂²⁻: ogni ossigeno vale −1.","f":0,"e":0},{"id":"mole-q29","c":"mole","l":1,"a":6,"q":"Da un acido con suffisso -ico si ottiene un sale con suffisso:","o":["-ito","-ato","-uro","-oso"],"r":1,"s":"-ico → -ato (acido nitrico → nitrato); -oso → -ito (acido nitroso → nitrito).","f":0,"e":0},{"id":"mole-q30","c":"mole","l":1,"a":6,"q":"Qual è la formula dell'idrossido di calcio?","o":["Ca(OH)₂","CaOH","CaOH₂","Ca₂OH"],"r":0,"s":"Ca ha carica 2+ e l'ione idrossido OH⁻ ha carica 1−: servono due OH, quindi Ca(OH)₂.","f":0,"e":0},{"id":"mole-q31","c":"mole","l":1,"a":6,"q":"Quale di questi composti è un idracido?","o":["HNO₃","H₂SO₄","H₃PO₄","HCl"],"r":3,"s":"Gli idracidi sono H + non metallo, senza ossigeno: HCl è l'acido cloridrico.","f":0,"e":0},{"id":"mole-q32","c":"mole","l":1,"a":6,"q":"Qual è la formula dell'acido nitrico?","o":["HNO₂","NH₃","HNO₃","H₂NO₃"],"r":2,"s":"Azoto con numero di ossidazione +5 (il maggiore): HNO₃. HNO₂ è l'acido nitroso.","f":0,"e":0},{"id":"mole-q33","c":"mole","l":1,"a":6,"q":"Come si chiama NaH?","o":["Idrossido di sodio","Idruro di sodio","Idracido di sodio","Perossido di sodio"],"r":1,"s":"Metallo + idrogeno con H = −1 è un idruro: NaH è l'idruro di sodio.","f":0,"e":0},{"id":"mole-q34","c":"mole","l":2,"a":6,"q":"Come si chiama Fe₂O₃ nella nomenclatura tradizionale?","o":["Ossido ferroso","Ossido ferrico","Perossido di ferro","Idrossido ferrico"],"r":1,"s":"Fe₂O₃ contiene Fe³⁺ (la valenza maggiore): ossido ferrico, o ossido di ferro(III).","f":0,"e":0},{"id":"mole-q35","c":"mole","l":2,"a":6,"q":"Come si chiama HClO₄?","o":["Acido perclorico","Acido ipocloroso","Acido clorico","Acido cloroso"],"r":0,"s":"Il cloro ha numero di ossidazione +7, il massimo: prefisso per- e suffis
