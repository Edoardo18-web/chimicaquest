inizione","f":"Come definisci «Legami σ e π: ogni legame singolo»?","b":"Legami σ e π: ogni legame singolo è un σ; un doppio legame è 1 σ + 1 π; un triplo è 1 σ + 2 π."},{"id":"legame-12","c":"legame","a":2,"t":"definizione","f":"Come definisci «Gli elettroni di valenza dell'azoto»?","b":"Gli elettroni di valenza dell'azoto sono 5 (gruppo 15)."},{"id":"legame-13","c":"legame","a":3,"t":"concetto","f":"Che cosa devi sapere su «Risonanza, eccezioni all'ottetto e legame coordinato»?","b":"Quando per una molecola si possono scrivere più strutture di Lewis che differiscono solo per la posizione degli elettroni, queste si chiamano strutture di risonanza: la molecola reale è una combinazione di tutte, un ibrido di risonanza, e non oscilla tra le forme."},{"id":"legame-14","c":"legame","a":3,"t":"concetto","f":"In parole semplici: «Risonanza, eccezioni all'ottetto e legame coordinato»","b":"Le strutture di risonanza sono come più fotografie sfocate della stessa persona: nessuna è quella vera, ma sovrapponendole ottieni un'immagine fedele. Un mulo non è a volte cavallo e a volte asino: è un ibrido, sempre uguale a se stesso. Così nel carbonato i tre legami C–O sono identici, a metà strada tra singolo e doppio."},{"id":"legame-15","c":"legame","a":4,"t":"concetto","f":"Che cosa devi sapere su «Polarità di legame ed elettronegatività»?","b":"Il legame covalente tra atomi diversi comporta una condivisione non equa degli elettroni: un atomo attira gli elettroni di legame più vicino a sé e un'estremità del legame ha densità elettronica maggiore dell'altra."},{"id":"legame-16","c":"legame","a":4,"t":"concetto","f":"In parole semplici: «Polarità di legame ed elettronegatività»","b":"Un legame è un tiro alla fune per gli elettroni. Se i due atomi tirano uguale la fune resta al centro (covalente puro); se uno tira di più la fune si sposta dalla sua parte (covalente polare); se uno è molto più forte si prende tutta la fune (ionico). La differenza di elettronegatività dice di quanto un atomo è più forte dell'altro."},{"id":"legame-17","c":"legame","a":4,"t":"definizione","f":"Come definisci «Il risultato»?","b":"Il risultato è un legame covalente polare: l'estremità più ricca di elettroni ha una parziale carica negativa (δ−), quella più povera una parziale carica positiva (δ+)."},{"id":"legame-18","c":"legame","a":4,"t":"definizione","f":"Come definisci «Più grande»?","b":"Più grande è la differenza di elettronegatività (ΔEN), più polare è il legame: ΔEN = 0 covalente puro; da 0,1 a 0,4 covalente non polare; da 0,5 a 1,9 covalente polare; maggiore o uguale a 2,0 ionico."},{"id":"legame-19","c":"legame","a":4,"t":"definizione","f":"Come definisci «Il carattere ionico percentuale»?","b":"Il carattere ionico percentuale è il rapporto tra il momento di dipolo misurato e quello che il legame avrebbe se le cariche fossero intere."},{"id":"legame-20","c":"legame","a":5,"t":"concetto","f":"Che cosa devi sapere su «Energia e lunghezza di legame»?","b":"Le reazioni chimiche comportano la rottura dei legami nei reagenti e la formazione di nuovi legami nei prodotti. L'energia di legame è l'energia necessaria per rompere una mole di un certo legame in un composto allo stato gassoso, in modo omolitico (ogni atomo riceve metà degli elettroni di legame)."},{"id":"legame-21","c":"legame","a":5,"t":"concetto","f":"In parole semplici: «Energia e lunghezza di legame»","b":"Più coppie di elettroni fanno da «colla» tra due nuclei, più i nuclei vengono tirati vicini e più fatica serve per separarli: i legami tripli sono i più corti e i più forti. Ma la seconda e la terza coppia incollano meno della prima: per questo un doppio legame non vale due legami singoli."},{"id":"legame-22","c":"legame","a":5,"t":"definizione","f":"Come definisci «L'energia di legame»?","b":"L'energia di legame è l'energia necessaria per rompere una mole di un certo legame in un composto allo stato gassoso, in modo omolitico (ogni atomo riceve metà degli elettroni di legame)."},{"id":"legame-23","c":"legame","a":5,"t":"definizione","f":"Come definisci «Più corto»?","b":"Più corto è il legame, più è forte: Br–F (237) > Br–Cl (218) > Br–Br (193); i legami si indeboliscono scendendo lungo un gruppo."},{"id":"legame-24","c":"legame","a":5,"t":"definizione","f":"Come definisci «La lunghezza di legame»?","b":"La lunghezza di legame è la distanza tra i nuclei degli atomi legati; poiché dipende dagli altri atomi presenti, si usa un valore medio."},{"id":"legame-25","c":"legame","a":5,"t":"definizione","f":"Come definisci «Le energie dei legami multipli non»?","b":"Le energie dei legami multipli non sono multipli esatti di quelle dei legami singoli."},{"id":"legame-26","c":"legame","a":5,"t":"definizione","f":"Come definisci «Il legame più forte tra due atomi uguali»?","b":"Il legame più forte tra due atomi uguali è quello triplo: N≡N è più forte di O=O e di F–F; a parità di atomi C≡C > C=C > C–C."},{"id":"legame-27","c":"legame","a":6,"t":"concetto","f":"Che cosa devi sapere su «Legame metallico»?","b":"La bassa energia di ionizzazione dei metalli permette loro di perdere facilmente elettroni. Nella teoria più semplice gli atomi del metallo rilasciano i propri elettroni di valenza, che vengono condivisi da tutti gli atomi/ioni: si hanno «isole» di cationi metallici in un mare di elettroni delocalizzati su tutta la struttura."},{"id":"legame-28","c":"legame","a":6,"t":"concetto","f":"In parole semplici: «Legame metallico»","b":"Immagina delle biglie (i cationi) immerse nel miele (gli elettroni): se spingi, le biglie scivolano le une sulle altre ma il miele continua a tenerle insieme. Per questo un metallo si piega e si lamina senza rompersi, al contrario di un cristallo ionico."},{"id":"legame-29","c":"legame","a":0,"t":"quiz","f":"Perché gli atomi formano legami chimici?","b":"✅ Perché i legami abbassano l'energia potenziale del sistema\nUn processo è spontaneo se porta a un'energia potenziale più bassa: legandosi, le particelle cariche degli atomi raggiungono una situazione più stabile."},{"id":"legame-30","c":"legame","a":0,"t":"quiz","f":"Che cosa rappresentano i puntini in un simbolo di Lewis?","b":"✅ Gli elettroni di valenza\nIl simbolo dell'elemento rappresenta nucleo ed elettroni interni; i puntini solo gli elettroni di valenza."},{"id":"legame-31","c":"legame","a":1,"t":"quiz","f":"Come si forma un legame ionico?","b":"✅ Per trasferimento di elettroni da un atomo elettropositivo a uno elettronegativo, seguito da attrazione elettrostatica\nL'atomo con bassa energia di ionizzazione cede elettroni a quello con grande affinità elettronica; gli ioni di carica opposta si attraggono."},{"id":"legame-32","c":"legame","a":1,"t":"quiz","f":"Che cos'è l'energia reticolare?","b":"✅ L'energia rilasciata quando il solido cristallino si forma dagli ioni gassosi separati\nÈ sempre esotermica e misura quanto fortemente gli ioni sono tenuti insieme nel reticolo."},{"id":"legame-33","c":"legame","a":2,"t":"quiz","f":"Che cosa sono le coppie solitarie?","b":"✅ Coppie di elettroni non condivise, che appartengono a un solo atomo\nSono dette anche coppie di non legame. Le coppie condivise sono invece coppie di legame."},{"id":"legame-34","c":"legame","a":2,"t":"quiz","f":"Quanti elettroni sono condivisi in un doppio legame?","b":"✅ 4\nUn legame doppio corrisponde a due coppie condivise, cioè 4 elettroni (il triplo a 6)."},{"id":"legame-35","c":"legame","a":3,"t":"quiz","f":"In che cosa differiscono tra loro le strutture di risonanza di una molecola?","b":"✅ Solo nella posizione degli elettroni\nLe strutture di risonanza hanno la stessa connettività e lo stesso numero di elettroni: cambia solo dove sono disegnati."},{"id":"legame-36","c":"legame","a":4,"t":"quiz","f":"Che cos'è un legame covalente polare?","b":"✅ Un legame in cui gli elettroni sono condivisi in modo non equo tra atomi diversi\nL'atomo più elettronegativo attira di più gli elettroni e assume una parziale carica negativa (δ−)."},{"id":"legame-37","c":"legame","a":4,"t":"quiz","f":"Come è definito il momento di dipolo di un legame?","b":"✅ μ = q·r, prodotto della carica parziale per la distanza\nIl momento di dipolo è proporzionale sia alle cariche parziali sia alla distanza tra esse; si misura in debye. Non è la legge di Coulomb."},{"id":"legame-38","c":"legame","a":5,"t":"quiz","f":"Che cos'è l'energia di legame?","b":"✅ L'energia necessaria per rompere una mole di un certo legame allo stato gassoso\nSi riferisce alla rottura omolitica del legame, in cui ogni atomo riceve metà degli elettroni di legame."},{"id":"legame-39","c":"legame","a":6,"t":"quiz","f":"Come è descritto il legame metallico nel modello più semplice?","b":"✅ Cationi metallici immersi in un mare di elettroni delocalizzati\nGli atomi rilasciano gli elettroni di valenza, condivisi da tutto il cristallo; il legame è l'attrazione tra cationi ed elettroni delocalizzati."},{"id":"legame-40","c":"legame","a":3,"t":"quiz","f":"Che cosa caratterizza il legame covalente coordinato?","b":"✅ La coppia di elettroni condivisa proviene da un solo atomo\nUn atomo dona l'intera coppia, che va a occupare un orbitale libero dell'altro atomo (un tempo era detto legame dativo)."},{"id":"legame-41","c":"legame","a":4,"t":"quiz","f":"L'elettronegatività di N è 3,0 e quella di O è 3,5. Il legame N–O è:","b":"✅ Covalente polare\nΔEN = 0,5: rientra nell'intervallo 0,5–1,9 del legame covalente polare."},{"id":"legame-42","c":"legame","a":4,"t":"quiz","f":"Secondo la classificazione della lezione, da quale differenza di elettronegatività un legame è considerato ionico?","b":"✅ Da 2,0 in su\nΔEN = 0 covalente puro; 0,1–0,4 non polare; 0,5–1,9 polare; ≥ 2,0 ionico."},{"id":"legame-43","c":"legame","a":2,"t":"quiz","f":"Quanti elettroni di valenza si devono distribuire nella struttura di Lewis di HNO₃?","b":"✅ 24\nH = 1, N = 5, tre O = 3 · 6 = 18: in totale 24 elettroni."},{"id":"legame-44","c":"legame","a":2,"t":"quiz","f":"In SO₂, nella struttura con un legame doppio e uno singolo, lo zolfo ha una coppia solitaria e tre coppie di legame. Qual è la sua carica formale?","b":"✅ +1\nCF = elettroni di valenza − (elettroni di non legame + ½ elettroni di legame) = 6 − (2 + 3) = +1."},{"id":"legame-45","c":"legame","a":1,"t":"quiz","f":"Quale di questi cloruri ha l'energia reticolare maggiore (in valore assoluto)?","b":"✅ LiCl\nA parità di carica, lo ione più piccolo dà la distanza minore e l'attrazione più forte: LiCl −834, NaCl −787, KCl −701, CsCl −657 kJ/mol."},{"id":"legame-46","c":"legame","a":5,"t":"quiz","f":"Quale legame carbonio-carbonio è il più corto?","b":"✅ C≡C (120 pm)\nPiù elettroni sono condivisi, più i nuclei sono tenuti vicini."},{"id":"legame-47","c":"legame","a":5,"t":"quiz","f":"Quale legame carbonio-carbonio è il più forte?","b":"✅ C≡C (837 kJ/mol)\nPiù elettroni sono condivisi, più forte è il legame; i legami più corti sono anche i più forti."},{"id":"legame-48","c":"legame","a":2,"t":"quiz","f":"Qual è lo schema di legame più comune per l'azoto?","b":"✅ 3 legami e 1 coppia solitaria\nCon 5 elettroni di valenza l'azoto forma 3 legami e conserva una coppia solitaria. Il carbonio ne forma 4, l'ossigeno 2, gli alogeni 1."},{"id":"legame-49","c":"legame","a":3,"t":"quiz","f":"In BF₃ il boro è circondato da 6 elettroni. Di che tipo di eccezione si tratta?","b":"✅ Ottetto incompleto\nB e Al sono stabili con 6 elettroni di valenza, Be con 4, H con 2."},{"id":"legame-50","c":"legame","a":3,"t":"quiz","f":"Perché lo zolfo in SF₆ può avere più di otto elettroni di valenza?","b":"✅ Perché dispone di orbitali d vuoti (ottetto espanso)\nGli elementi dal terzo periodo in poi possono usare gli orbitali d vuoti per ospitare elettroni in eccesso: sono composti ipervalenti."},{"id":"legame-51","c":"legame","a":1,"t":"quiz","f":"Come si comporta NaCl rispetto alla conduzione elettrica?","b":"✅ Non conduce allo stato solido, conduce fuso o in soluzione\nNel solido gli ioni sono bloccati; nel liquido e in soluzione sono liberi di muoversi verso gli elettrodi."},{"id":"legame-52","c":"legame","a":6,"t":"quiz","f":"Come varia la conducibilità elettrica di un metallo all'aumentare della temperatura?","b":"✅ Diminuisce\nScaldando, gli ioni metallici vibrano più velocemente e ostacolano il passaggio degli elettroni attraverso il cristallo."},{"id":"legame-53","c":"legame","a":0,"t":"calcolo","f":"Quanti elettroni di valenza ha H e quanti legami forma tipicamente?","b":"Elettroni di valenza = numero del gruppo = 1\nLegami tipici = 1 (per completare l'ottetto o il duplet)"},{"id":"legame-54","c":"legame","a":0,"t":"calcolo","f":"Quanti elettroni di valenza ha C e quanti legami forma tipicamente?","b":"Elettroni di valenza = numero del gruppo = 4\nLegami tipici = 4 (per completare l'ottetto o il duplet)"},{"id":"legame-55","c":"legame","a":1,"t":"calcolo","f":"Quanti elettroni cede l'atomo di K per formare lo ione stabile, e con quale carica?","b":"Il metallo cede tanti elettroni quanti ne ha di valenza: 1\nCarica dello ione: +1"},{"id":"legame-56","c":"legame","a":1,"t":"calcolo","f":"Quanti elettroni cede l'atomo di Al per formare lo ione stabile, e con quale carica?","b":"Il metallo cede tanti elettroni quanti ne ha di valenza: 3\nCarica dello ione: +3"},{"id":"legame-57","c":"legame","a":2,"t":"calcolo","f":"Che tipo di legame c'è nella molecola Cl₂?","b":"Cl₂: legame singolo\nMotivo: 1 coppia condivisa (1 σ)"},{"id":"legame-58","c":"legame","a":2,"t":"calcolo","f":"Che tipo di legame c'è nella molecola N₂?","b":"N₂: legame triplo\nMotivo: 3 coppie condivise (1 σ + 2 π)"},{"id":"legame-59","c":"legame","a":4,"t":"calcolo","f":"Il legame Li–F è ionico, covalente polare o covalente non polare/puro? (EN Li = 1, F = 4)","b":"ΔEN = 3,0\nRegola: ΔEN < 0,4 apolare; 0,5–1,9 polare; ≥ 2,0 ionico → legame ionico"},{"id":"legame-60","c":"legame","a":4,"t":"calcolo","f":"Il legame H–Cl è ionico, covalente polare o covalente non polare/puro? (EN H = 2.2, Cl = 3)","b":"ΔEN = 0,8\nRegola: ΔEN < 0,4 apolare; 0,5–1,9 polare; ≥ 2,0 ionico → legame covalente polare"},{"id":"legame-61","c":"legame","a":2,"t":"calcolo","f":"Calcola la carica formale dell'atomo di B nello ione BF₄⁻.","b":"4 legami e nessuna coppia solitaria: 3 − (0 + 4) = −1\nCarica formale = −1"},{"id":"legame-62","c":"legame","a":2,"t":"calcolo","f":"Calcola la carica formale dell'atomo di B nello ione BF₄⁻.","b":"4 legami e nessuna coppia solitaria: 3 − (0 + 4) = −1\nCarica formale = −1"},{"id":"legame-63","c":"legame","a":5,"t":"calcolo","f":"Ordina per energia di legame crescente: C≡C, C–C, C=C.","b":"Ordine: C–C < C=C < C≡C\nPiù elettroni condivisi → legame più forte e più corto"},{"id":"legame-64","c":"legame","a":5,"t":"calcolo","f":"Ordina per energia di legame crescente: C≡C, C=C, C–C.","b":"Ordine: C–C < C=C < C≡C\nPiù elettroni condivisi → legame più forte e più corto"},{"id":"orbitalimolecolari-0","c":"orbitalimolecolari","a":0,"t":"concetto","f":"Che cosa devi sapere su «Teoria VSEPR: le geometrie di base»?","b":"Le proprietà delle sostanze molecolari dipendono dalla struttura della molecola: disposizione degli atomi, tipo di legame e forma. La forma si descrive con figure geometriche che indicano la posizione degli atomi attorno a un atomo centrale, con angoli di legame caratteristici."},{"id":"orbitalimolecolari-1","c":"orbitalimolecolari","a":0,"t":"concetto","f":"In parole semplici: «Teoria VSEPR: le geometrie di base»","b":"Lega insieme per il nodo dei palloncini: si sistemano da soli il più lontano possibile uno dall'altro. Due palloncini si mettono in linea, tre a triangolo, quattro a tetraedro. Le coppie di elettroni fanno lo stesso attorno all'atomo centrale, e un legame doppio o triplo conta come un solo palloncino."},{"id":"orbitalimolecolari-2","c":"orbitalimolecolari","a":0,"t":"definizione","f":"Come definisci «Ogni coppia solitaria»?","b":"Ogni coppia solitaria è un gruppo di elettroni; ogni legame è un gruppo, indipendentemente dal fatto che sia singolo, doppio o triplo."},{"id":"orbitalimolecolari-3","c":"orbitalimolecolari","a":1,"t":"concetto","f":"Che cosa devi sapere su «Coppie solitarie e polarità delle molecole»?","b":"Nella descrizione della disposizione elettronica si contano tutte le regioni ad alta densità (legami e coppie solitarie), ma per indicare la forma della molecola si considerano solo le posizioni degli atomi. Si usa la formula VSEPR AXₙEₘ: A è l'atomo centrale, X un atomo legato, E una coppia solitaria."},{"id":"orbitalimolecolari-4","c":"orbitalimolecolari","a":1,"t":"concetto","f":"In parole semplici: «Coppie solitarie e polarità delle molecole»","b":"Una coppia solitaria è un palloncino più gonfio degli altri: si prende più spazio e schiaccia i vicini, chiudendo gli angoli. Ecco perché si passa da 109,5° nel metano a circa 107° nell'ammoniaca e a circa 104,5° nell'acqua. La coppia solitaria però «non si vede»: la forma della molecola si legge guardando solo dove sono gli atomi."},{"id":"orbitalimolecolari-5","c":"orbitalimolecolari","a":1,"t":"definizione","f":"Come definisci «Si usa la formula VSEPR AXₙEₘ: A»?","b":"Si usa la formula VSEPR AXₙEₘ: A è l'atomo centrale, X un atomo legato, E una coppia solitaria."},{"id":"orbitalimolecolari-6","c":"orbitalimolecolari","a":1,"t":"definizione","f":"Come definisci «Con 3 gruppi e una coppia solitaria la forma»?","b":"Con 3 gruppi e una coppia solitaria la forma è angolare (< 120°); con 4 gruppi si hanno la piramide trigonale (AX₃E, come NH₃ e SO₃²⁻) e la forma angolare (AX₂E₂, come H₂O)."},{"id":"orbitalimolecolari-7","c":"orbitalimolecolari","a":1,"t":"definizione","f":"Come definisci «Una molecola»?","b":"Una molecola è polare se ha legami polari e una forma non simmetrica: i dipoli si sommano come vettori."},{"id":"orbitalimolecolari-8","c":"orbitalimolecolari","a":2,"t":"concetto","f":"Che cosa devi sapere su «Teoria del legame di valenza: legami σ e π»?","b":"Il modello di Lewis assume che ogni coppia di legame sia localizzata tra i due atomi legati. La teoria del legame di valenza descrive il legame covalente con la meccanica quantistica: il legame nasce dalla sovrapposizione di orbitali atomici, e gli orbitali sovrapposti ospitano al massimo due elettroni (principio di Pauli)."},{"id":"orbitalimolecolari-9","c":"orbitalimolecolari","a":2,"t":"concetto","f":"In parole semplici: «Teoria del legame di valenza: legami σ e π»","b":"Due orbitali che si incontrano «di punta», come due mani che si stringono, danno il legame σ: solido e libero di ruotare. Due orbitali p affiancati che si toccano «di fianco», sopra e sotto l'asse, danno il legame π: più debole e che blocca la rotazione. Ogni legame ha sempre un σ; i π si aggiungono dopo."},{"id":"orbitalimolecolari-10","c":"orbitalimolecolari","a":2,"t":"definizione","f":"Come definisci «Maggiore»?","b":"Maggiore è la sovrapposizione, più forte è il legame; se però gli atomi si avvicinano troppo, la repulsione tra i nuclei fa aumentare l'energia."},{"id":"orbitalimolecolari-11","c":"orbitalimolecolari","a":2,"t":"definizione","f":"Come definisci «Un legame multiplo»?","b":"Un legame multiplo è formato da un solo legame σ più uno (doppio) o due (triplo) legami π."},{"id":"orbitalimolecolari-12","c":"orbitalimolecolari","a":2,"t":"definizione","f":"Come definisci «La sovrapposizione laterale»?","b":"La sovrapposizione laterale è minore di quella frontale, quindi il legame π è più debole del σ: per questo un legame multiplo carbonio-carbonio è più debole della somma dei legami singoli (circa 350, 610 e 840 kJ/mol)."},{"id":"orbitalimolecolari-13","c":"orbitalimolecolari","a":3,"t":"concetto","f":"Che cosa devi sapere su «Ibridazione degli orbitali»?","b":"Applicando il legame di valenza al metano si incontra una difficoltà: il carbonio ha solo due orbitali 2p semipieni, ma forma sempre quattro legami disposti a tetraedro. L'ibridazione è la combinazione lineare di orbitali atomici dello stesso atomo in nuovi orbitali, gli ibridi."},{"id":"orbitalimolecolari-14","c":"orbitalimolecolari","a":3,"t":"concetto","f":"In parole semplici: «Ibridazione degli orbitali»","b":"Ibridare significa mescolare gli ingredienti prima di usarli: un orbitale s e tre p, impastati insieme, danno quattro porzioni identiche (sp³). Il nome dice la ricetta, e il numero di ibridi coincide con il numero di gruppi di elettroni attorno all'atomo: 4 gruppi sp³, 3 gruppi sp², 2 gruppi sp."},{"id":"orbitalimolecolari-15","c":"orbitalimolecolari","a":3,"t":"definizione","f":"Come definisci «L'ibridazione»?","b":"L'ibridazione è la combinazione lineare di orbitali atomici dello stesso atomo in nuovi orbitali, gli ibridi."},{"id":"orbitalimolecolari-16","c":"orbitalimolecolari","a":3,"t":"definizione","f":"Come definisci «PCl₃ (3 + 1 = 4)»?","b":"PCl₃ (3 + 1 = 4) è sp³; NH₄⁺ (4) sp³; SO₂ (2 + 1 = 3) sp²; BF₃ sp²; PCl₅ sp³d; SF₆ sp³d²."},{"id":"orbitalimolecolari-17","c":"orbitalimolecolari","a":3,"t":"definizione","f":"Come definisci «Il benzene»?","b":"Il benzene è planare perché i suoi carboni sono sp², e ha in comune con l'etene l'ibridazione sp²."},{"id":"orbitalimolecolari-18","c":"orbitalimolecolari","a":4,"t":"concetto","f":"Che cosa devi sapere su «Teoria degli orbitali molecolari»?","b":"Le teorie di Lewis e del legame di valenza prevedono che O₂ sia diamagnetico (tutti gli elettroni appaiati), mentre l'ossigeno liquido è paramagnetico. Nella teoria degli orbitali molecolari (OM) gli elettroni occupano orbitali estesi a tutta la molecola: tutti gli elettroni di valenza sono delocalizzati."},{"id":"orbitalimolecolari-19","c":"orbitalimolecolari","a":4,"t":"concetto","f":"In parole semplici: «Teoria degli orbitali molecolari»","b":"Gli elettroni negli orbitali leganti sono «colla» tra i nuclei, quelli negli antileganti sono «solvente» che la scioglie. L'ordine di legame fa il bilancio: colla meno solvente, diviso due. Se il bilancio è zero, come in He₂, non resta nessun legame e la molecola non esiste."},{"id":"orbitalimolecolari-20","c":"orbitalimolecolari","a":4,"t":"definizione","f":"Come definisci «L'ordine di legame»?","b":"L'ordine di legame è ½ (elettroni negli orbitali leganti − elettroni negli antileganti): se è maggiore di zero la molecola è più stabile degli atomi separati, se è zero la molecola non si forma; più è alto, più forte è il legame."},{"id":"orbitalimolecolari-21","c":"orbitalimolecolari","a":4,"t":"definizione","f":"Come definisci «HOMO»?","b":"HOMO è l'orbitale occupato a più alta energia, LUMO quello vuoto a più bassa energia."},{"id":"orbitalimolecolari-22","c":"orbitalimolecolari","a":4,"t":"definizione","f":"Come definisci «Più alto»?","b":"Più alto è OL, più il legame è forte e corto; una specie con elettroni spaiati è paramagnetica, con tutti gli elettroni appaiati è diamagnetica."},{"id":"orbitalimolecolari-23","c":"orbitalimolecolari","a":5,"t":"concetto","f":"Che cosa devi sapere su «Teoria delle bande, semiconduttori e diodi»?","b":"Nel modello a elettroni liberi il metallo è un reticolo di nuclei in un mare di elettroni: spiega conducibilità elettrica e termica, malleabilità, opacità e lucentezza."},{"id":"orbitalimolecolari-24","c":"orbitalimolecolari","a":5,"t":"concetto","f":"In parole semplici: «Teoria delle bande, semiconduttori e diodi»","b":"Pensa a un parcheggio a due piani. Il piano di sotto (banda di valenza) è dove stanno normalmente le auto; quello di sopra (banda di conduzione) è dove possono circolare. Nei metalli i due piani sono collegati o il primo è mezzo vuoto: si circola sempre. Negli isolanti la rampa è altissima e nessuno sale. Nei semiconduttori la rampa è bassa: basta un po' di energia (calore, luce) per far salire qualche auto. Drogare significa aggiungere auto in più (tipo n) o posti vuoti (tipo p)."},{"id":"orbitalimolecolari-25","c":"orbitalimolecolari","a":5,"t":"definizione","f":"Come definisci «Nei metalli alcalini la banda di valenza s»?","b":"Nei metalli alcalini la banda di valenza s è piena solo a metà: per questo conducono, e la banda di valenza è anche banda di conduzione."},{"id":"orbitalimolecolari-26","c":"orbitalimolecolari","a":5,"t":"definizione","f":"Come definisci «Nei metalli alcalino-terrosi la banda s»?","b":"Nei metalli alcalino-terrosi la banda s è piena, ma si sovrappone alla banda p vuota, quindi conducono."},{"id":"orbitalimolecolari-27","c":"orbitalimolecolari","a":5,"t":"definizione","f":"Come definisci «Un diodo»?","b":"Un diodo è la giunzione tra un semiconduttore n e uno p: la corrente passa in un solo verso."},{"id":"orbitalimolecolari-28","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Qual è il principio alla base della teoria VSEPR?","b":"✅ Le regioni ad alta densità elettronica si respingono e si dispongono il più lontano possibile\nLegami e coppie solitarie attorno all'atomo centrale si dispongono in modo da rendere minima la repulsione reciproca."},{"id":"orbitalimolecolari-29","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Nella teoria VSEPR, come si conta un legame doppio?","b":"✅ Come un solo gruppo di elettroni\nLe coppie di un legame multiplo restano insieme e respingono le altre come un'unica regione ad alta densità elettronica."},{"id":"orbitalimolecolari-30","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Quale geometria corrisponde a due gruppi di elettroni attorno all'atomo centrale?","b":"✅ Lineare, con angolo di 180°\nDue gruppi si dispongono da parti opposte rispetto all'atomo centrale."},{"id":"orbitalimolecolari-31","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Quale geometria corrisponde a quattro gruppi di elettroni, tutti di legame?","b":"✅ Tetraedrica, con angoli di 109,5°\nQuattro gruppi si dirigono verso i vertici di un tetraedro (non di un quadrato): così sono più lontani."},{"id":"orbitalimolecolari-32","c":"orbitalimolecolari","a":1,"t":"quiz","f":"Nella formula VSEPR AXₙEₘ, che cosa rappresenta E?","b":"✅ Una coppia solitaria sull'atomo centrale\nA è l'atomo centrale, X un atomo legato, E una coppia solitaria."},{"id":"orbitalimolecolari-33","c":"orbitalimolecolari","a":2,"t":"quiz","f":"Come si forma un legame sigma (σ)?","b":"✅ Per sovrapposizione degli orbitali lungo l'asse che congiunge i due nuclei\nIl legame σ ha simmetria cilindrica attorno all'asse internucleare e nessun piano nodale che lo contenga."},{"id":"orbitalimolecolari-34","c":"orbitalimolecolari","a":2,"t":"quiz","f":"Come si forma un legame pi greco (π)?","b":"✅ Per sovrapposizione laterale di orbitali p perpendicolari all'asse di legame\nNel legame π la densità elettronica sta in due lobi ai lati dell'asse internucleare, che giace su un piano nodale."},{"id":"orbitalimolecolari-35","c":"orbitalimolecolari","a":3,"t":"quiz","f":"Che cos'è l'ibridazione?","b":"✅ La combinazione di orbitali atomici dello stesso atomo in nuovi orbitali\nGli orbitali ibridi (sp³, sp², sp) nascono mescolando orbitali s e p di uno stesso atomo."},{"id":"orbitalimolecolari-36","c":"orbitalimolecolari","a":4,"t":"quiz","f":"Nel metodo LCAO, quanti orbitali molecolari si ottengono combinando un certo numero di orbitali atomici?","b":"✅ Lo stesso numero\nIl numero di orbitali molecolari è uguale al numero di orbitali atomici di partenza: da due orbitali 1s si ottengono un legante e un antilegante."},{"id":"orbitalimolecolari-37","c":"orbitalimolecolari","a":4,"t":"quiz","f":"Che cos'è un orbitale molecolare antilegante?","b":"✅ Un orbitale a energia più alta, derivante da interferenza distruttiva\nUn elettrone in un orbitale antilegante è in gran parte escluso dalla regione tra i nuclei e ha energia maggiore che negli orbitali atomici."},{"id":"orbitalimolecolari-38","c":"orbitalimolecolari","a":4,"t":"quiz","f":"Come si calcola l'ordine di legame nella teoria degli orbitali molecolari?","b":"✅ ½ (elettroni leganti − elettroni antileganti)\nOgni coppia di elettroni leganti non compensata da elettroni antileganti corrisponde a un legame."},{"id":"orbitalimolecolari-39","c":"orbitalimolecolari","a":5,"t":"quiz","f":"Che cosa distingue un conduttore, un semiconduttore e un isolante?","b":"✅ L'ampiezza del gap di energia tra banda di valenza e banda di conduzione\nGap nullo o piccolo → conduttore; gap intermedio → semiconduttore; gap molto grande rispetto a kB·T → isolante."},{"id":"orbitalimolecolari-40","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Quale geometria ha la molecola PCl₅?","b":"✅ Bipiramide trigonale\nCinque coppie di legame: tre atomi equatoriali a 120° e due assiali a 90° dal piano."},{"id":"orbitalimolecolari-41","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Quale geometria ha la molecola SF₆?","b":"✅ Ottaedrica\nSei coppie di legame: quattro ai vertici di un quadrato e due sopra e sotto il piano."},{"id":"orbitalimolecolari-42","c":"orbitalimolecolari","a":0,"t":"quiz","f":"Quale geometria ha la molecola BF₃?","b":"✅ Trigonale planare, 120°\nIl boro ha tre coppie di legame e nessuna coppia solitaria (AX₃)."},{"id":"orbitalimolecolari-43","c":"orbitalimolecolari","a":1,"t":"quiz","f":"Lo ione solfito SO₃²⁻ ha una coppia solitaria sullo zolfo (AX₃E). Qual è la sua forma?","b":"✅ Piramidale trigonale\nQuattro gruppi di elettroni in disposizione tetraedrica, ma solo tre sono atomi: la forma è una piramide trigonale, come NH₃."},{"id":"orbitalimolecolari-44","c":"orbitalimolecolari","a":1,"t":"quiz","f":"Qual è l'ordine corretto dell'intensità delle repulsioni tra coppie di elettroni?","b":"✅ solitaria–solitaria > solitaria–legame > legame–legame\nLe coppie solitarie sono localizzate sull'atomo centrale e occupano più spazio: respingono di più."},{"id":"orbitalimolecolari-45","c":"orbitalimolecolari","a":1,"t":"quiz","f":"La molecola CO₂ ha legami C=O polari. È una molecola polare?","b":"✅ No, perché è lineare e i dipoli si annullano\nPer essere polare una molecola deve avere legami polari e una forma non simmetrica: in CO₂ i due dipoli sono uguali e opposti."},{"id":"orbitalimolecolari-46","c":"orbitalimolecolari","a":3,"t":"quiz","f":"Quale ibridazione ha il carbonio nel metano, CH₄?","b":"✅ sp³\nQuattro gruppi di elettroni → quattro orbitali ibridi sp³ a 109,5°."},{"id":"orbitalimolecolari-47","c":"orbitalimolecolari","a":3,"t":"quiz","f":"Quale ibridazione ha ciascun carbonio nell'etene, C₂H₄?","b":"✅ sp²\nTre gruppi di elettroni attorno a ogni carbonio → tre ibridi sp² a 120°; l'orbitale p rimasto forma il legame π."},{"id":"orbitalimolecolari-48","c":"orbitalimolecolari","a":3,"t":"quiz","f":"Quale ibridazione ha ciascun carbonio nell'etino, C₂H₂?","b":"✅ sp\nDue gruppi di elettroni → due ibridi sp a 180°; i due orbitali p rimasti formano i due legami π del triplo legame."},{"id":"orbitalimolecolari-49","c":"orbitalimolecolari","a":2,"t":"quiz","f":"Da quali legami è formato il triplo legame della molecola N₂?","b":"✅ Un legame σ e due legami π\nSolo una coppia di orbitali p può sovrapporsi frontalmente (σ); le altre due coppie si sovrappongono lateralmente (π)."},{"id":"orbitalimolecolari-50","c":"orbitalimolecolari","a":4,"t":"quiz","f":"Qual è l'ordine di legame della molecola H₂?","b":"✅ 1\nDue elettroni nell'orbitale legante e nessuno nell'antilegante: ½ (2 − 0) = 1."},{"id":"orbitalimolecolari-51","c":"orbitalimolecolari","a":5,"t":"quiz","f":"Che tipo di semiconduttore si ottiene drogando il silicio con fosforo?","b":"✅ Di tipo n, perché il fosforo fornisce elettroni in più\nIl fosforo ha un elettrone di valenza in più del silicio. Con il gallio, che ne ha uno in meno, si ottiene il tipo p."},{"id":"orbitalimolecolari-52","c":"orbitalimolecolari","a":0,"t":"calcolo","f":"Quale geometria prevede la teoria VSEPR per un atomo centrale con 3 gruppi di elettroni, tutti di legame?","b":"3 gruppi si dispongono nel modo che massimizza la distanza reciproca\nGeometria: trigonale planare (120°)"},{"id":"orbitalimolecolari-53","c":"orbitalimolecolari","a":0,"t":"calcolo","f":"Quale geometria prevede la teoria VSEPR per un atomo centrale con 6 gruppi di elettroni, tutti di legame?","b":"6 gruppi si dispongono nel modo che massimizza la distanza reciproca\nGeometria: ottaedrica"},{"id":"orbitalimolecolari-54","c":"orbitalimolecolari","a":2,"t":"calcolo","f":"Quanti legami σ e quanti legami π contiene la molecola N₂?","b":"Ogni legame è formato da un σ; i legami multipli aggiungono π\nN₂: 1 σ e 2 π"},{"id":"orbitalimolecolari-55","c":"orbitalimolecolari","a":2,"t":"calcolo","f":"Quanti legami σ e quanti legami π contiene la molecola C₂H₂?","b":"Ogni legame è formato da un σ; i legami multipli aggiungono π\nC₂H₂: 3 σ e 2 π"},{"id":"orbitalimolecolari-56","c":"orbitalimolecolari","a":4,"t":"calcolo","f":"Una molecola biatomica ha 5 elettroni leganti e 1 elettroni antileganti. Qual è il suo ordine di legame?","b":"Ordine = ½ (leganti − antileganti) = ½ (5 − 1)\nOrdine di legame = 2"},{"id":"orbitalimolecolari-57","c":"orbitalimolecolari","a":4,"t":"calcolo","f":"Una molecola biatomica ha 10 elettroni leganti e 2 elettroni antileganti. Qual è il suo ordine di legame?","b":"Ordine = ½ (leganti − antileganti) = ½ (10 − 2)\nOrdine di legame = 4"},{"id":"orbitalimolecolari-58","c":"orbitalimolecolari","a":1,"t":"calcolo","f":"Quale forma molecolare ha H₂O (formula VSEPR AX₂E₂)?","b":"Le coppie solitarie occupano le posizioni che minimizzano le repulsioni\nForma: angolare"},{"id":"orbitalimolecolari-59","c":"orbitalimolecolari","a":1,"t":"calcolo","f":"Quale forma molecolare ha XeF₂ (formula VSEPR AX₂E₃)?","b":"Le coppie solitarie occupano le posizioni che minimizzano le repulsioni\nForma: lineare"},{"id":"orbitalimolecolari-60","c":"orbitalimolecolari","a":3,"t":"calcolo","f":"Quale ibridazione presenta l'atomo centrale (C) della molecola CO₂?","b":"Gruppi di elettroni attorno a C: 2\n2 gruppi → ibridazione sp"},{"id":"orbitalimolecolari-61","c":"orbitalimolecolari","a":3,"t":"calcolo","f":"Quale ibridazione presenta l'atomo centrale (C) della molecola CO₂?","b":"Gruppi di elettroni attorno a C: 2\n2 gruppi → ibridazione sp"},{"id":"orbitalimolecolari-62","c":"orbitalimolecolari","a":5,"t":"calcolo","f":"Un solido di sodio conduce l'elettricità a temperatura ambiente? Spiega con la teoria delle bande.","b":"Caratteristica delle bande: banda s semipiena\nConduce: sì"},{"id":"orbitalimolecolari-63","c":"orbitalimolecolari","a":5,"t":"calcolo","f":"Un solido di magnesio conduce l'elettricità a temperatura ambiente? Spiega con la teoria delle bande.","b":"Caratteristica delle bande: banda s piena sovrapposta alla banda p vuota\nConduce: sì"},{"id":"organica-0","c":"organica","a":0,"t":"concetto","f":"Che cosa devi sapere su «Il carbonio e gli idrocarburi»?","b":"La chimica organica studia i composti del carbonio (molecole come CO e CO₃²⁻ non sono considerate organiche)."},{"id":"organica-1","c":"organica","a":0,"t":"concetto","f":"In parole semplici: «Il carbonio e gli idrocarburi»","b":"Il carbonio è il mattoncino con quattro attacchi: può agganciarsi ad altri carboni in catene, rami e anelli praticamente senza limiti. «Saturo» significa che ogni carbonio ha già tutti gli idrogeni che può portare; ogni doppio legame toglie due idrogeni, ogni triplo ne toglie quattro: da qui le tre formule generali."},{"id":"organica-2","c":"organica","a":0,"t":"definizione","f":"Come definisci «I legami C=C e C≡C»?","b":"I legami C=C e C≡C sono più reattivi di C–C."},{"id":"organica-3","c":"organica","a":0,"t":"definizione","f":"Come definisci «Gli alifatici saturi»?","b":"Gli alifatici saturi sono gli alcani (o paraffine): solo legami singoli C–C, formula generale CₙH₂ₙ₊₂ per le catene, molto poco reattivi; possono essere catene lineari o ramificate oppure anelli (cicloalcani, CₙH₂ₙ)."},{"id":"organica-4","c":"organica","a":0,"t":"definizione","f":"Come definisci «Gli insaturi»?","b":"Gli insaturi sono gli alcheni (olefine), con un doppio legame C=C, formula CₙH₂ₙ, geometria planare attorno al doppio legame, molto più reattivi degli alcani; e gli alchini (acetileni), con un triplo legame C≡C, formula CₙH₂ₙ₋₂, lineari."},{"id":"organica-5","c":"organica","a":0,"t":"definizione","f":"Come definisci «Solubilità: l'acqua»?","b":"Solubilità: l'acqua è polare, quindi solubilizza le sostanze polari («il simile scioglie il simile»)."},{"id":"organica-6","c":"organica","a":0,"t":"definizione","f":"Come definisci «Gli idrocarburi»?","b":"Gli idrocarburi sono apolari e non si sciolgono in acqua."},{"id":"organica-7","c":"organica","a":1,"t":"concetto","f":"Che cosa devi sapere su «Formule e nomenclatura»?","b":"La formula molecolare dice solo quali atomi ci sono; la formula di struttura mostra come sono collegati; nella formula condensata gli atomi legati sono elencati in ordine; nella formula a linee ogni vertice ed estremità rappresenta un carbonio e gli idrogeni legati al carbonio sono omessi."},{"id":"organica-8","c":"organica","a":1,"t":"concetto","f":"In parole semplici: «Formule e nomenclatura»","b":"Il nome IUPAC è un indirizzo: la radice è la via (la catena più lunga), i numeri sono i civici e i prefissi dicono chi abita a ciascun civico. La regola d'oro è scegliere il verso di numerazione che dà i civici più bassi."},{"id":"organica-9","c":"organica","a":1,"t":"definizione","f":"Come definisci «Ogni nome»?","b":"Ogni nome è formato da tre parti: il prefisso (posizione, numero e tipo dei sostituenti), la radice (lunghezza della catena o dell'anello più lungo) e il suffisso (tipo di composto: -ano, -ene, -ino, o gruppo funzionale)."},{"id":"organica-10","c":"organica","a":1,"t":"definizione","f":"Come definisci «Il benzene come sostituente»?","b":"Il benzene come sostituente si chiama fenile."},{"id":"organica-11","c":"organica","a":1,"t":"definizione","f":"Come definisci «L'aldeide più semplice»?","b":"L'aldeide più semplice è il metanale H₂C=O (formaldeide, CH₂O)."},{"id":"organica-12","c":"organica","a":2,"t":"concetto","f":"Che cosa devi sapere su «Isomeria»?","b":"Gli isomeri sono molecole diverse con la stessa formula molecolare. Gli isomeri di struttura (o costituzionali) hanno gli atomi collegati in modo diverso: butano (p.e. 0 °C) e isobutano (p.e. −12 °C) sono entrambi C₄H₁₀. La rotazione attorno a un legame singolo non dà isomeri."},{"id":"organica-13","c":"organica","a":2,"t":"concetto","f":"In parole semplici: «Isomeria»","b":"Le tue mani sono l'esempio perfetto di chiralità: sono una l'immagine speculare dell'altra, ma non riesci a sovrapporle (il guanto destro non entra nella mano sinistra). Due enantiomeri sono «molecola destra» e «molecola sinistra»: stessi pezzi, stessa costruzione, ma mai sovrapponibili."},{"id":"organica-14","c":"organica","a":2,"t":"definizione","f":"Come definisci «Gli isomeri»?","b":"Gli isomeri sono molecole diverse con la stessa formula molecolare."},{"id":"organica-15","c":"organica","a":2,"t":"definizione","f":"Come definisci «Gli isomeri ottici»?","b":"Gli isomeri ottici sono immagini speculari non sovrapponibili: una molecola con questa proprietà è chirale, e un carbonio con quattro sostituenti diversi è un centro chirale; le due immagini speculari formano una coppia di enantiomeri."},{"id":"organica-16","c":"organica","a":2,"t":"definizione","f":"Come definisci «Una miscela equimolare dei due»?","b":"Una miscela equimolare dei due è una miscela racemica e non dà rotazione."},{"id":"organica-17","c":"organica","a":2,"t":"definizione","f":"Come definisci «Gli isomeri geometrici»?","b":"Gli isomeri geometrici sono stereoisomeri che non sono isomeri ottici: poiché la rotazione attorno a un doppio legame è fortemente impedita, i gruppi possono trovarsi dallo stesso lato (cis) o da lati opposti (trans)."},{"id":"organica-18","c":"organica","a":3,"t":"concetto","f":"Che cosa devi sapere su «Reazioni degli idrocarburi e combustibili»?","b":"Tutti gli idrocarburi danno combustione, sempre esotermica, producendo CO₂ e H₂O. Gli alcani danno inoltre reazioni di sostituzione: un idrogeno è sostituito da un atomo di alogeno; la reazione è avviata da calore o luce ultravioletta e di solito dà più prodotti."},{"id":"organica-19","c":"organica","a":3,"t":"concetto","f":"In parole semplici: «Reazioni degli idrocarburi e combustibili»","b":"Gli alcani hanno solo legami σ, forti e «tranquilli»: per farli reagire bisogna strappare un H e mettere altro al suo posto (sostituzione). Alcheni e alchini hanno invece un legame π più debole e «a portata di mano»: si apre e aggancia due nuovi atomi (addizione). Il benzene ha i π, ma li tiene delocalizzati e stabili: preferisce la sostituzione."},{"id":"organica-20","c":"organica","a":3,"t":"definizione","f":"Come definisci «Un gruppo alchilico (R–)»?","b":"Un gruppo alchilico (R–) è un alcano privato di un atomo di idrogeno, con formula CₙH₂ₙ₊₁: metile –CH₃, etile –CH₂CH₃, propile –CH₂CH₂CH₃."},{"id":"organica-21","c":"organica","a":4,"t":"concetto","f":"Che cosa devi sapere su «Gruppi funzionali con alogeni e ossigeno»?","b":"Molti composti organici sono idrocarburi in cui un idrogeno è sostituito da un gruppo funzionale, un gruppo di atomi che influenza in modo caratteristico le proprietà della molecola e ne determina le reazioni; la catena idrocarburica si indica con R."},{"id":"organica-22","c":"organica","a":4,"t":"concetto","f":"In parole semplici: «Gruppi funzionali con alogeni e ossigeno»","b":"Il gruppo funzionale è la «testa» che decide il carattere della molecola, mentre la catena R è il «corpo» che lo porta in giro. Due molecole con catene diverse ma lo stesso gruppo funzionale reagiscono allo stesso modo: basta imparare la chimica di una dozzina di gruppi per orientarsi tra milioni di composti."},{"id":"organica-23","c":"organica","a":4,"t":"definizione","f":"Come definisci «Alogenoalcani (alogenuri alchilici): un H»?","b":"Alogenoalcani (alogenuri alchilici): un H è sostituito da un alogeno; l'alogeno si nomina come sostituente (2-bromobutano)."},{"id":"organica-24","c":"organica","a":4,"t":"definizione","f":"Come definisci «Il fenolo»?","b":"Il fenolo è un OH legato a un anello benzenico."},{"id":"organica-25","c":"organica","a":4,"t":"definizione","f":"Come definisci «Il gruppo carbonilico C=O»?","b":"Il gruppo carbonilico C=O è molto polare: le aldeidi hanno almeno un H legato al carbonile (suffisso -ale: metanale, pentanale), i chetoni due gruppi R (suffisso -one: propanone, cioè acetone)."},{"id":"organica-26","c":"organica","a":4,"t":"definizione","f":"Come definisci «Una reazione di condensazione»?","b":"Una reazione di condensazione è una reazione in cui si elimina una piccola molecola, come l'acqua."},{"id":"organica-27","c":"organica","a":4,"t":"definizione","f":"Come definisci «Il gruppo carbonilico C=O»?","b":"Il gruppo carbonilico C=O è presente in aldeidi, chetoni, acidi carbossilici, esteri e ammidi, ma non negli alcoli (R–OH) né negli eteri."},{"id":"organica-28","c":"organica","a":4,"t":"definizione","f":"Come definisci «Il gruppo –OH degli alcoli»?","b":"Il gruppo –OH degli alcoli è detto ossidrile o ossidrilico."},{"id":"organica-29","c":"organica","a":4,"t":"definizione","f":"Come definisci «Formule: gli acidi carbossilici saturi»?","b":"Formule: gli acidi carbossilici saturi sono CₙH₂ₙO₂ (acido etanoico C₂H₄O₂, acido butanoico CH₃CH₂CH₂COOH = C₄H₈O₂)."},{"id":"organica-30","c":"organica","a":4,"t":"definizione","f":"Come definisci «I perossidi»?","b":"I perossidi sono composti con il legame O–O (H₂O₂, BaO₂): in essi l'ossigeno ha numero di ossidazione −1."},{"id":"organica-31","c":"organica","a":5,"t":"concetto","f":"Che cosa devi sapere su «Ammine, ammidi e amminoacidi»?","b":"Le ammine sono composti organici contenenti azoto: hanno odore sgradevole, si formano nella decomposizione delle proteine (putrescina, cadaverina) e sono basi organiche deboli."},{"id":"organica-32","c":"organica","a":5,"t":"concetto","f":"In parole semplici: «Ammine, ammidi e amminoacidi»","b":"Un'ammina è ammoniaca in cui uno o più idrogeni sono stati sostituiti da catene di carbonio: per questo si comporta da base, proprio come NH₃. Unendo il «lato acido» di una molecola con il «lato basico» di un'altra ed eliminando acqua si ottiene il legame ammidico, lo stesso che tiene insieme le proteine e il nylon."},{"id":"organica-33","c":"organica","a":5,"t":"definizione","f":"Come definisci «Le ammine»?","b":"Le ammine sono composti organici contenenti azoto: hanno odore sgradevole, si formano nella decomposizione delle proteine (putrescina, cadaverina) e sono basi organiche deboli."},{"id":"organica-34","c":"organica","a":5,"t":"definizione","f":"Come definisci «Molte ammine»?","b":"Molte ammine sono biologicamente attive: dopamina (neurotrasmettitore), adrenalina (ormone), e gli alcaloidi, prodotti vegetali basici come nicotina, cocaina e morfina."},{"id":"organica-35","c":"organica","a":5,"t":"definizione","f":"Come definisci «Un amminoacido»?","b":"Un amminoacido è un acido carbossilico che contiene anche un gruppo amminico: ha nella stessa molecola un gruppo basico (–NH₂) e uno acido (–COOH)."},{"id":"organica-36","c":"organica","a":5,"t":"definizione","f":"Come definisci «Tra i composti organici le ammine»?","b":"Tra i composti organici le ammine sono le basi (le ammine sono basi deboli); gli acidi carbossilici sono acidi, gli alcoli, gli eteri e gli idrocarburi sono sostanzialmente neutri e le ammidi sono praticamente neutre."},{"id":"organica-37","c":"organica","a":6,"t":"concetto","f":"Che cosa devi sapere su «Polimeri»?","b":"I polimeri sono molecole molto grandi formate dall'unione ripetuta di piccole molecole, i monomeri. Possono essere naturali, naturali modificati o sintetici (plastiche, elastomeri come la gomma, fibre, adesivi)."},{"id":"organica-38","c":"organica","a":6,"t":"concetto","f":"In parole semplici: «Polimeri»","b":"Un polimero è una collana e i monomeri sono le perle. Nell'addizione le perle si agganciano una all'altra senza scarti, come vagoni che si uniscono a un treno. Nella condensazione ogni aggancio «butta via» una piccola molecola d'acqua, come due persone che per darsi la mano devono lasciar cadere ciò che tenevano."},{"id":"organica-39","c":"organica","a":6,"t":"definizione","f":"Come definisci «I polimeri»?","b":"I polimeri sono molecole molto grandi formate dall'unione ripetuta di piccole molecole, i monomeri."},{"id":"organica-40","c":"organica","a":6,"t":"definizione","f":"Come definisci «La polimerizzazione»?","b":"La polimerizzazione è il processo che unisce i monomeri e avviene in due modi."},{"id":"organica-41","c":"organica","a":6,"t":"definizione","f":"Come definisci «Il PET»?","b":"Il PET è un poliestere (bottiglie di plastica); il nylon è una poliammide: il nylon 6,6 si ottiene condensando 1,6-esandiammina con acido esandioico."},{"id":"organica-42","c":"organica","a":0,"t":"quiz","f":"Che cosa sono gli idrocarburi?","b":"✅ Composti formati solo da carbonio e idrogeno\nGli idrocarburi contengono solo C e H; per questo non hanno legami polari e sono insolubili in acqua."},{"id":"organica-43","c":"organica","a":0,"t":"quiz","f":"Qual è la formula generale degli alcani a catena aperta?","b":"✅ CₙH₂ₙ₊₂\nCₙH₂ₙ è la formula degli alcheni con un doppio legame (e dei cicloalcani), CₙH₂ₙ₋₂ quella degli alchini."},{"id":"organica-44","c":"organica","a":0,"t":"quiz","f":"Che cosa caratterizza un alchene?","b":"✅ La presenza di un doppio legame C=C\nGli alcheni (olefine) sono idrocarburi alifatici insaturi con almeno un doppio legame carbonio-carbonio."},{"id":"organica-45","c":"organica","a":0,"t":"quiz","f":"Che cosa significa che un idrocarburo è saturo?","b":"✅ Che contiene solo legami singoli C–C\nÈ «saturo di idrogeni»: ogni carbonio lega il massimo numero possibile di atomi di H. Gli idrocarburi saturi sono gli alcani."},{"id":"organica-46","c":"organica","a":2,"t":"quiz","f":"Che cosa sono gli isomeri?","b":"✅ Molecole diverse con la stessa formula molecolare\nGli isomeri hanno gli stessi atomi, ma collegati o orientati in modo diverso."},{"id":"organica-47","c":"organica","a":2,"t":"quiz","f":"Quando una molecola si dice chirale?","b":"✅ Quando non è sovrapponibile alla propria immagine speculare\nCome le mani: immagini speculari che non si possono sovrapporre. Un carbonio con quattro sostituenti diversi è un centro chirale."},{"id":"organica-48","c":"organica","a":2,"t":"quiz","f":"Che cosa sono gli enantiomeri?","b":"✅ Una coppia di immagini speculari non sovrapponibili\nGli enantiomeri sono i due isomeri ottici di una molecola chirale."},{"id":"organica-49","c":"organica","a":4,"t":"quiz","f":"Che cos'è un gruppo funzionale?","b":"✅ Un gruppo di atomi che determina le proprietà e le reazioni caratteristiche della molecola\nLe reazioni di un composto dipendono dai suoi gruppi funzionali; la catena idrocarburica si indica genericamente con R."},{"id":"organica-50","c":"organica","a":4,"t":"quiz","f":"Qual è il gruppo funzionale degli alcoli?","b":"✅ –OH\nGli alcoli hanno formula R–OH e prendono il suffisso -olo."},{"id":"organica-51","c":"organica","a":4,"t":"quiz","f":"Qual è il gruppo funzionale degli acidi carbossilici?","b":"✅ –COOH\nGli acidi carbossilici hanno formula RCOOH: sono acidi deboli, come l'acido acetico dell'aceto."},{"id":"organica-52","c":"organica","a":6,"t":"quiz","f":"Che cosa sono i polimeri?","b":"✅ Molecole molto grandi formate dall'unione ripetuta di piccole molecole (monomeri)\nLa polimerizzazione è il processo che collega tra loro le unità monomeriche."},{"id":"organica-53","c":"organica","a":3,"t":"quiz","f":"Che cos'è l'idrogenazione?","b":"✅ L'addizione di H₂ a un legame multiplo\nL'idrogenazione trasforma un composto insaturo in saturo: alchene o alchino + H₂ → alcano."},{"id":"organica-54","c":"organica","a":0,"t":"quiz","f":"Qual è la formula molecolare di un alchene a catena aperta con 5 atomi di carbonio e un doppio legame?","b":"✅ C₅H₁₀\nFormula generale CₙH₂ₙ: per n = 5 si ha C₅H₁₀ (due idrogeni in meno dell'alcano C₅H₁₂)."},{"id":"organica-55","c":"organica","a":0,"t":"quiz","f":"Qual è la formula molecolare di un alchino a catena aperta con 4 atomi di carbonio e un triplo legame?","b":"✅ C₄H₆\nFormula generale CₙH₂ₙ₋₂: per n = 4 si ha C₄H₆ (quattro idrogeni in meno dell'alcano)."},{"id":"organica-56","c":"organica","a":0,"t":"quiz","f":"Qual è la formula molecolare del cicloesano?","b":"✅ C₆H₁₂\nI cicloalcani hanno formula CₙH₂ₙ: chiudendo l'anello si perdono due idrogeni rispetto all'esano C₆H₁₄. C₆H₆ è il benzene."},{"id":"organica-57","c":"organica","a":1,"t":"quiz","f":"Qual è il nome dell'alcano CH₃CH₂CH₂CH₃?","b":"✅ Butano\nQuattro atomi di carbonio: metano (1), etano (2), propano (3), butano (4), pentano (5), esano (6)."},{"id":"organica-58","c":"organica","a":1,"t":"quiz","f":"Come si chiama il sostituente –CH₃?","b":"✅ Metile\nIl nome del sostituente si ottiene cambiando la desinenza -ano dell'alcano in -ile."},{"id":"organica-59","c":"organica","a":1,"t":"quiz","f":"A quale nome numerico corrisponde il para-clorotoluene?","b":"✅ 4-clorotoluene\norto = 1,2; meta = 1,3; para = 1,4."},{"id":"organica-60","c":"organica","a":2,"t":"quiz","f":"Butano e isobutano hanno entrambi formula C₄H₁₀. Che relazione c'è tra loro?","b":"✅ Sono isomeri di struttura\nGli atomi sono collegati in modo diverso (catena lineare e catena ramificata); infatti hanno punti di ebollizione diversi: 0 °C e −12 °C."},{"id":"organica-61","c":"organica","a":2,"t":"quiz","f":"In un isomero cis, come sono disposti i due gruppi rispetto al doppio legame?","b":"✅ Dallo stesso lato\ncis = stesso lato; trans = lati opposti."},{"id":"organica-62","c":"organica","a":4,"t":"quiz","f":"A quale classe appartiene l'acetone, CH₃COCH₃?","b":"✅ Chetoni\nIl carbonile è legato a due gruppi R: è un chetone (propanone). Nelle aldeidi il carbonile lega almeno un idrogeno."},{"id":"organica-63","c":"organica","a":4,"t":"quiz","f":"Da quali composti si ottiene un estere?","b":"✅ Da un acido carbossilico e un alcol, con eliminazione di acqua\nL'esterificazione è una reazione di condensazione catalizzata da acidi. Da ammina + acido si ottiene invece un'ammide."},{"id":"organica-64","c":"organica","a":3,"t":"quiz","f":"Quale tipo di reazione danno prevalentemente gli idrocarburi aromatici?","b":"✅ Sostituzione\nA differenza degli alcheni, gli areni sostituiscono un H con un altro atomo o gruppo lasciando intatti i legami π dell'anello."},{"id":"organica-65","c":"organica","a":5,"t":"quiz","f":"Che cosa si ottiene dalla reazione di un'ammina con un acido carbossilico?","b":"✅ Un'ammide e acqua\nRCOOH + HNHR' → RCONHR' + H₂O: è una condensazione. Con un acido forte come HCl l'ammina dà invece un sale di ammonio."},{"id":"organica-66","c":"organica","a":0,"t":"calcolo","f":"Qual è la formula molecolare di un alcano a catena aperta con 9 atomi di carbonio? (scrivila come CₙHₘ)","b":"Formula generale CₙH₂ₙ₊₂\nH = 2 · 9 + 2 = 20 → C9H20"},{"id":"organica-67","c":"organica","a":0,"t":"calcolo","f":"Qual è la formula molecolare di un alcano a catena aperta con 7 atomi di carbonio? (scrivila come CₙHₘ)","b":"Formula generale CₙH₂ₙ₊₂\nH = 2 · 7 + 2 = 16 → C7H16"},{"id":"organica-68","c":"organica","a":0,"t":"calcolo","f":"Quanti atomi di idrogeno possiede un alchene a catena aperta con 8 atomi di carbonio?","b":"Alchene (un doppio legame): formula CₙH₂ₙ\nH = 16"},{"id":"organica-69","c":"organica","a":0,"t":"calcolo","f":"Quanti atomi di idrogeno possiede un alchene a catena aperta con 3 atomi di carbonio?","b":"Alchene (un doppio legame): formula CₙH₂ₙ\nH = 6"},{"id":"organica-70","c":"organica","a":4,"t":"calcolo","f":"Qual è il gruppo funzionale caratteristico di alcol?","b":"Gruppo funzionale: –OH"},{"id":"organica-71","c":"organica","a":4,"t":"calcolo","f":"Qual è il gruppo funzionale caratteristico di alcol?","b":"Gruppo funzionale: –OH"},{"id":"organica-72","c":"organica","a":1,"t":"calcolo","f":"Come si chiama l'alcano CH₃CH(CH₃)CH₂CH₃?","b":"Catena più lunga, numerazione con i sostituenti a numeri più bassi\nNome: 2-metilbutano"},{"id":"organica-73","c":"organica","a":1,"t":"calcolo","f":"Come si chiama l'alcano CH₃CH₂CH(CH₃)CH₂CH₃?","b":"Catena più lunga, numerazione con i sostituenti a numeri più bassi\nNome: 3-metilpentano"},{"id":"organica-74","c":"organica","a":2,"t":"calcolo","f":"Quanti isomeri di struttura ha l'alcano C5H12?","b":"Con 5 atomi di carbonio si possono ottenere catene lineari e ramificate diverse\nIsomeri di struttura = 3"},{"id":"organica-75","c":"organica","a":2,"t":"calcolo","f":"Quanti isomeri di struttura ha l'alcano C6H14?","b":"Con 6 atomi di carbonio si possono ottenere catene lineari e ramificate diverse\nIsomeri di struttura = 5"},{"id":"organica-76","c":"organica","a":3,"t":"calcolo","f":"Quale prodotto si ottiene dalla reazione di 1-butene con HBr?","b":"Addizione al doppio legame C=C\nProdotto: 2-bromobutano"},{"id":"organica-77","c":"organica","a":3,"t":"calcolo","f":"Quale prodotto si ottiene dalla reazione di etene con Br₂?","b":"Addizione al doppio legame C=C\nProdotto: 1,2-dibromoetano"},{"id":"gas-0","c":"gas","a":0,"t":"concetto","f":"Che cosa devi sapere su «Proprietà dei gas e pressione»?","b":"Un gas non ha né forma né volume propri: può essere compresso o espanso. Le sue molecole sono in genere lontane le une dalle altre e si muovono in modo casuale; la temperatura misura l'energia cinetica delle molecole: più è alta, più velocemente (in media) si muovono."},{"id":"gas-1","c":"gas","a":0,"t":"concetto","f":"In parole semplici: «Proprietà dei gas e pressione»","b":"Immagina una stanza piena di palline che rimbalzano a caso: ogni urto contro le pareti è una piccola spinta. La pressione è la somma di tutte queste spinte. Se scaldi, le palline corrono di più e colpiscono più forte; se rimpicciolisci la stanza, colpiscono più spesso. In entrambi i casi la pressione sale."},{"id":"gas-2","c":"gas","a":0,"t":"definizione","f":"Come definisci «Le sue molecole»?","b":"Le sue molecole sono in genere lontane le une dalle altre e si muovono in modo casuale; la temperatura misura l'energia cinetica delle molecole: più è alta, più velocemente (in media) si muovono."},{"id":"gas-3","c":"gas","a":0,"t":"definizione","f":"Come definisci «La pressione di un gas»?","b":"La pressione di un gas è il risultato degli urti delle molecole, in continuo movimento, contro le pareti interne del recipiente: più frequenti sono gli urti, più alta è la pressione."},{"id":"gas-4","c":"gas","a":0,"t":"definizione","f":"Come definisci «La pressione atmosferica»?","b":"La pressione atmosferica è dovuta alle molecole dell'aria; Torricelli la misurò nel 1643 con il barometro: al livello del mare vale 760 torr."},{"id":"gas-5","c":"gas","a":1,"t":"concetto","f":"Che cosa devi sapere su «Le leggi empiriche dei gas»?","b":"Legge di Boyle: a temperatura costante (e moli costanti) il volume di un gas è inversamente proporzionale alla pressione applicata, P₁V₁ = P₂V₂. Legge di Charles: a pressione costante il volume è direttamente proporzionale alla temperatura assoluta, V₁/T₁ = V₂/T₂ (T in kelvin)."},{"id":"gas-6","c":"gas","a":1,"t":"concetto","f":"In parole semplici: «Le leggi empiriche dei gas»","b":"Sono tre modi di guardare lo stesso palloncino. Lo schiacci: il volume cala e la pressione sale (Boyle). Lo scaldi lasciandolo libero: si gonfia (Charles). Lo scaldi in un contenitore rigido: non può gonfiarsi e allora sale la pressione (Gay-Lussac). In tutti i casi la temperatura va in kelvin, mai in gradi Celsius."},{"id":"gas-7","c":"gas","a":1,"t":"definizione","f":"Come definisci «Il volume di una mole di gas»?","b":"Il volume di una mole di gas è il volume molare, Vm = V/n."},{"id":"gas-8","c":"gas","a":2,"t":"concetto","f":"Che cosa devi sapere su «Equazione di stato dei gas ideali»?","b":"Dalle leggi empiriche risulta che il volume è proporzionale a 1/P (Boyle), a T assoluta (Charles) e a n (Avogadro). Combinando le tre proporzionalità si ottiene la legge dei gas ideali: PV = nRT, con R = 0,0821 L·atm/(mol·K) = 8,314 J/(mol·K). È una legge limite, valida solo a pressioni relativamente basse."},{"id":"gas-9","c":"gas","a":2,"t":"concetto","f":"In parole semplici: «Equazione di stato dei gas ideali»","b":"PV = nRT è la «formula unica» dei gas: conosci tre grandezze e ricavi la quarta. Due attenzioni evitano quasi tutti gli errori: la temperatura sempre in kelvin e le unità coerenti con il valore di R che usi (litri e atmosfere con 0,0821)."},{"id":"gas-10","c":"gas","a":3,"t":"concetto","f":"Che cosa devi sapere su «Massa molare, densità e stechiometria dei gas»?","b":"Poiché n = m/M, sostituendo nell'equazione dei gas ideali si ottiene la massa molare: M = mRT/(PV). Risolvendo per m/V si ottiene la densità: d = PM/(RT)."},{"id":"gas-11","c":"gas","a":3,"t":"concetto","f":"In parole semplici: «Massa molare, densità e stechiometria dei gas»","b":"Pesando un volume noto di gas a T e P note si scopre «quanto pesa una mole», cioè la massa molare: è un modo per identificare un gas sconosciuto. E la densità spiega perché una mongolfiera sale: l'aria calda, a pari pressione, è meno densa di quella fredda."},{"id":"gas-12","c":"gas","a":4,"t":"concetto","f":"Che cosa devi sapere su «Miscele gassose»?","b":"Legge di Dalton delle pressioni parziali: la pressione totale di una miscela di gas è la somma delle pressioni dei singoli gas, Ptot = Pa + Pb + Pc + … Legge di Amagat dei volumi parziali: Vtot = V₁ + V₂ + V₃ + … La composizione di una fase gassosa si può esprimere come percentuale in peso, percentuale in volume o frazione molare."},{"id":"gas-13","c":"gas","a":4,"t":"concetto","f":"In parole semplici: «Miscele gassose»","b":"In una miscela ogni gas si comporta come se fosse solo nel recipiente e contribuisce alla pressione in proporzione a quante molecole ha. Se l'ossigeno è il 21% delle molecole dell'aria, «fa» il 21% della pressione: a 1 atm, 0,21 atm."},{"id":"gas-14","c":"gas","a":4,"t":"definizione","f":"Come definisci «La frazione molare xᵢ»?","b":"La frazione molare xᵢ è il numero di moli del componente diviso il numero totale di moli: è compresa tra 0 e 1 e la somma di tutte le frazioni molari vale 1."},{"id":"gas-15","c":"gas","a":4,"t":"definizione","f":"Come definisci «La percentuale in volume»?","b":"La percentuale in volume è uguale alla percentuale in moli: %vᵢ = xᵢ · 100."},{"id":"gas-16","c":"gas","a":4,"t":"definizione","f":"Come definisci «La frazione molare non»?","b":"La frazione molare non è la frazione in massa: da grammi si passa a moli con n = m/M (48 g di Cl₂ con M = 70,90 e 9 g di H₂ con M = 2,02 → 0,677 e 4,46 mol → x(Cl₂) = 0,677/5,14 = 0,132)."},{"id":"gas-17","c":"gas","a":5,"t":"concetto","f":"Che cosa devi sapere su «Gas reali»?","b":"Tutti i gas reali hanno proprietà diverse da quelle previste dalla legge dei gas ideali; le differenze sono significative ad alte pressioni e basse temperature. Il fattore di compressione Z è il rapporto tra il volume molare reale del gas e quello di un gas ideale nelle stesse condizioni: Z = Vm / Vm(ideale)."},{"id":"gas-18","c":"gas","a":5,"t":"concetto","f":"In parole semplici: «Gas reali»","b":"Il gas ideale è fatto di punti senza volume che si ignorano a vicenda. Le molecole vere invece occupano spazio (quindi a pressioni alte il gas si comprime meno del previsto) e si attraggono (quindi a temperature basse si «tengono» un po' e premono meno sulle pareti). Van der Waals aggiunge esattamente queste due correzioni."},{"id":"gas-19","c":"gas","a":5,"t":"definizione","f":"Come definisci «Il fattore di compressione Z»?","b":"Il fattore di compressione Z è il rapporto tra il volume molare reale del gas e quello di un gas ideale nelle stesse condizioni: Z = Vm / Vm(ideale)."},{"id":"gas-20","c":"gas","a":5,"t":"definizione","f":"Come definisci «La temperatura critica»?","b":"La temperatura critica è la temperatura al di sopra della quale una sostanza non può esistere come liquido, qualunque sia la pressione; la pressione critica è la pressione corrispondente a questa condizione limite."},{"id":"gas-21","c":"gas","a":0,"t":"quiz","f":"A che cosa è dovuta la pressione esercitata da un gas?","b":"✅ Agli urti delle molecole contro le pareti del recipiente\nLe molecole, in continuo movimento, colpiscono le pareti: più frequenti sono gli urti, maggiore è la pressione."},{"id":"gas-22","c":"gas","a":0,"t":"quiz","f":"Che cosa misura la temperatura di un gas?","b":"✅ L'energia cinetica media delle sue molecole\nPiù alta è la temperatura, più velocemente (in media) si muovono le molecole."},{"id":"gas-23","c":"gas","a":1,"t":"quiz","f":"Che cosa afferma la legge di Boyle?","b":"✅ A temperatura costante il volume è inversamente proporzionale alla pressione\nP₁V₁ = P₂V₂ a temperatura e moli costanti: raddoppiando la pressione il volume si dimezza."},{"id":"gas-24","c":"gas","a":1,"t":"quiz","f":"Che cosa afferma la legge di Charles?","b":"✅ A pressione costante il volume è direttamente proporzionale alla temperatura assoluta\nV₁/T₁ = V₂/T₂ a pressione costante, con T in kelvin."},{"id":"gas-25","c":"gas","a":1,"t":"quiz","f":"Che cosa afferma la legge di Gay-Lussac?","b":"✅ A volume costante la pressione è direttamente proporzionale alla temperatura assoluta\nP₁/T₁ = P₂/T₂ a volume costante, con T in kelvin."},{"id":"gas-26","c":"gas","a":1,"t":"quiz","f":"Che cosa afferma la legge di Avogadro?","b":"✅ A pari temperatura e pressione, lo stesso numero di molecole occupa lo stesso volume, qualunque sia il gas\nIl volume dipende da quante molecole ci sono, non dalla loro natura chimica."},{"id":"gas-27","c":"gas","a":2,"t":"quiz","f":"Qual è l'equazione di stato dei gas ideali?","b":"✅ PV = nRT\nCombina le leggi di Boyle, Charles e Avogadro; R = 0,0821 L·atm/(mol·K)."},{"id":"gas-28","c":"gas","a":2,"t":"quiz","f":"A quali condizioni corrisponde la sigla STP?","b":"✅ 0 °C e 1 atm\nA temperatura e pressione standard (0 °C, 1 atm) una mole di gas ideale occupa 22,4 L."},{"id":"gas-29","c":"gas","a":4,"t":"quiz","f":"Che cosa afferma la legge di Dalton?","b":"✅ La pressione totale di una miscela è la somma delle pressioni parziali dei gas\nPtot = Pa + Pb + Pc + …: ogni gas contribuisce come se fosse da solo nel recipiente."},{"id":"gas-30","c":"gas","a":4,"t":"quiz","f":"Che cos'è la frazione molare di un componente?","b":"✅ Le moli del componente divise per le moli totali\nÈ un numero tra 0 e 1; la somma delle frazioni molari di tutti i componenti vale 1."},{"id":"gas-31","c":"gas","a":5,"t":"quiz","f":"Quanto vale il fattore di compressione Z per un gas ideale?","b":"✅ 1\nZ è il rapporto tra il volume molare reale e quello ideale: per un gas ideale i due coincidono."},{"id":"gas-32","c":"gas","a":5,"t":"quiz","f":"Che cos'è la temperatura critica?","b":"✅ La temperatura sopra la quale una sostanza non può esistere come liquido, a qualunque pressione\nSopra la temperatura critica nessuna compressione riesce a liquefare il gas."},{"id":"gas-33","c":"gas","a":0,"t":"quiz","f":"A quante atmosfere corrispondono 380 mmHg?","b":"✅ 0,50 atm\n1 atm = 760 mmHg, quindi 380 / 760 = 0,50 atm."},{"id":"gas-34","c":"gas","a":1,"t":"quiz","f":"Un gas occupa 2,0 L a 1,0 atm. A temperatura costante viene compresso fino a 4,0 atm. Qual è il nuovo volume?","b":"✅ 0,50 L\nBoyle: V₂ = P₁V₁ / P₂ = 1,0 · 2,0 / 4,0 = 0,50 L."},{"id":"gas-35","c":"gas","a":1,"t":"quiz","f":"Un gas occupa 3,0 L a 300 K. A pressione costante viene scaldato fino a 600 K. Qual è il nuovo volume?","b":"✅ 6,0 L\nCharles: V₂ = V₁ · T₂/T₁ = 3,0 · 600/300 = 6,0 L."},{"id":"gas-36","c":"gas","a":1,"t":"quiz","f":"Un gas in un recipiente rigido ha pressione 1,0 atm a 273 K. Quale pressione ha a 546 K?","b":"✅ 2,0 atm\nGay-Lussac: P₂ = P₁ · T₂/T₁ = 1,0 · 546/273 = 2,0 atm."},{"id":"gas-37","c":"gas","a":2,"t":"quiz","f":"Quale volume occupa 1,00 mol di gas ideale a 273 K e 1,00 atm?","b":"✅ 22,4 L\nV = nRT/P = 1,00 · 0,0821 · 273 / 1,00 = 22,4 L: è il volume molare a STP."},{"id":"gas-38","c":"gas","a":2,"t":"quiz","f":"Quante moli di gas sono contenute in 10,0 L a 2,00 atm e 300 K? (R = 0,0821 L·atm/(mol·K))","b":"✅ 0,812 mol\nn = PV/RT = (2,00 · 10,0) / (0,0821 · 300) = 0,812 mol."},{"id":"gas-39","c":"gas","a":4,"t":"quiz","f":"Una miscela contiene N₂ a 0,60 atm, O₂ a 0,30 atm e Ar a 0,10 atm. Qual è la pressione totale?","b":"✅ 1,00 atm\nDalton: Ptot = 0,60 + 0,30 + 0,10 = 1,00 atm."},{"id":"gas-40","c":"gas","a":4,"t":"quiz","f":"Nell'aria la frazione molare dell'ossigeno è 0,21. A una pressione totale di 1,0 atm, qual è la pressione parziale di O₂?","b":"✅ 0,21 atm\nPᵢ = xᵢ · Ptot = 0,21 · 1,0 = 0,21 atm."},{"id":"gas-41","c":"gas","a":3,"t":"quiz","f":"A parità di temperatura e pressione, quale di questi gas è il più denso?","b":"✅ CO₂ (44 g/mol)\nd = PM/RT: a pari P e T la densità cresce con la massa molare."},{"id":"gas-42","c":"gas","a":1,"t":"quiz","f":"A quale temperatura in gradi Celsius corrisponde lo zero assoluto?","b":"✅ −273,15 °C\nEstrapolando la legge di Charles, il volume di tutti i gas si annullerebbe a −273,15 °C = 0 K."},{"id":"gas-43","c":"gas","a":5,"t":"quiz","f":"In quali condizioni i gas reali si discostano di più dal comportamento ideale?","b":"✅ Alte pressioni e basse temperature\nA pressioni alte le molecole sono vicine e a temperature basse sono lente: le forze intermolecolari diventano importanti."},{"id":"gas-44","c":"gas","a":4,"t":"quiz","f":"In una miscela gassosa, a che cosa è uguale la percentuale in volume di un componente?","b":"✅ Alla sua percentuale in moli\n%vᵢ = xᵢ · 100: per Avogadro il volume è proporzionale al numero di moli."},{"id":"gas-45","c":"gas","a":0,"t":"calcolo","f":"Converti 809 mmHg in atmosfere (1 atm = 760 mmHg).","b":"809 / 760 = 1,06 atm"},{"id":"gas-46","c":"gas","a":0,"t":"calcolo","f":"Converti 990 mmHg in atmosfere (1 atm = 760 mmHg).","b":"990 / 760 = 1,30 atm"},{"id":"gas-47","c":"gas","a":1,"t":"calcolo","f":"Un gas occupa 20 L a 3 atm, a temperatura costante. Quale volume occupa a 12 atm?","b":"P₁V₁ = P₂V₂\nV₂ = 20 · 3 / 12 = 5,00 L"},{"id":"gas-48","c":"gas","a":1,"t":"calcolo","f":"Un gas occupa 13 L a 1 atm, a temperatura costante. Quale volume occupa a 3 atm?","b":"P₁V₁ = P₂V₂\nV₂ = 13 · 1 / 3 = 4,33 L"},{"id":"gas-49","c":"gas","a":1,"t":"calcolo","f":"Un gas occupa 6 L a 355 K, a pressione costante. Quale volume occupa a 370 K?","b":"V₁ / T₁ = V₂ / T₂ (temperature in kelvin)\nV₂ = 6 · 370 / 355 = 6,25 L"},{"id":"gas-50","c":"gas","a":1,"t":"calcolo","f":"Un gas occupa 2 L a 228 K, a pressione costante. Quale volume occupa a 214 K?","b":"V₁ / T₁ = V₂ / T₂ (temperature in kelvin)\nV₂ = 2 · 214 / 228 = 1,88 L"},{"id":"gas-51","c":"gas","a":2,"t":"calcolo","f":"Quanti litri occupano 5 mol di gas ideale a 273 K e 2 atm? (R = 0,0821 L·atm/(mol·K))","b":"V = n·R·T / P\nV = 5 · 0,0821 · 273 / 2 = 56,03 L"},{"id":"gas-52","c":"gas","a":2,"t":"calcolo","f":"Quanti litri occupano 4 mol di gas ideale a 300 K e 2 atm? (R = 0,0821 L·atm/(mol·K))","b":"V = n·R·T / P\nV = 4 · 0,0821 · 300 / 2 = 49,26 L"},{"id":"gas-53","c":"gas","a":2,"t":"calcolo","f":"Quante moli di gas ideale sono contenute in 26 L a 2 atm e 300 K? (R = 0,0821 L·atm/(mol·K))","b":"n = P·V / (R·T)\nn = 2 · 26 / (0,0821 · 300) = 2,11 mol"},{"id":"gas-54","c":"gas","a":2,"t":"calcolo","f":"Quante moli di gas ideale sono contenute in 27 L a 2 atm e 300 K? (R = 0,0821 L·atm/(mol·K))","b":"n = P·V / (R·T)\nn = 2 · 27 / (0,0821 · 300) = 2,19 mol"},{"id":"gas-55","c":"gas","a":4,"t":"calcolo","f":"In una miscela gassosa a pressione totale 3 atm la frazione molare di un componente è 0,40. Qual è la sua pressione parziale?","b":"Pᵢ = xᵢ · Ptot\nPᵢ = 0,40 · 3 = 1,20 atm"},{"id":"gas-56","c":"gas","a":4,"t":"calcolo","f":"In una miscela gassosa a pressione totale 2 atm la frazione molare di un componente è 0,60. Qual è la sua pressione parziale?","b":"Pᵢ = xᵢ · Ptot\nPᵢ = 0,60 · 2 = 1,20 atm"},{"id":"termo1-0","c":"termo1","a":0,"t":"concetto","f":"Che cosa devi sapere su «Sistema, ambiente, lavoro e calore»?","b":"La termodinamica studia come l'energia si trasforma da una forma all'altra e si trasferisce da un luogo all'altro. La regione che ci interessa (un pallone di gas, una miscela di reazione) è il sistema; tutto il resto è l'ambiente."},{"id":"termo1-1","c":"termo1","a":0,"t":"concetto","f":"In parole semplici: «Sistema, ambiente, lavoro e calore»","b":"Il sistema è «ciò che sto guardando», l'ambiente è tutto il resto. L'energia può passare dall'uno all'altro in due soli modi: spingendo qualcosa (lavoro) o per differenza di temperatura (calore). Un thermos chiuso è quasi un sistema isolato: non entra e non esce né materia né energia."},{"id":"termo1-2","c":"termo1","a":0,"t":"definizione","f":"Come definisci «Il lavoro»?","b":"Il lavoro è il processo con cui si ottiene un movimento contro una forza che si oppone: lavoro = forza × spostamento; si misura in joule (1 J = 1 kg·m²/s² = 1 N·m)."},{"id":"termo1-3","c":"termo1","a":0,"t":"definizione","f":"Come definisci «L'energia»?","b":"L'energia è la capacità di un sistema di compiere lavoro."},{"id":"termo1-4","c":"termo1","a":0,"t":"definizione","f":"Come definisci «Il calore»?","b":"Il calore è lo scambio di energia termica tra sistema e ambiente dovuto a una differenza di temperatura: fluisce dal corpo più caldo a quello più freddo finché raggiungono la stessa temperatura (equilibrio termico)."},{"id":"termo1-5","c":"termo1","a":0,"t":"definizione","f":"Come definisci «Anche il calore si misura in joule;»?","b":"Anche il calore si misura in joule; è ancora usata la caloria: 1 cal = 4,184 J; la caloria alimentare (Cal) è in realtà una chilocaloria."},{"id":"termo1-6","c":"termo1","a":0,"t":"definizione","f":"Come definisci «Con P in atm e V in L il risultato»?","b":"Con P in atm e V in L il risultato è in L·atm, che si converte in joule con 1 L·atm = 101,3 J (101,325 J)."},{"id":"termo1-7","c":"termo1","a":1,"t":"concetto","f":"Che cosa devi sapere su «Primo principio e funzioni di stato»?","b":"La riserva totale di energia di un sistema è la sua energia interna U; se ne misurano le variazioni, ΔU = U(finale) − U(iniziale), indicando sempre il segno. Quando l'energia entra nel sistema come lavoro, U aumenta e w è positivo; quando esce, w è negativo."},{"id":"termo1-8","c":"termo1","a":1,"t":"concetto","f":"In parole semplici: «Primo principio e funzioni di stato»","b":"L'energia interna è il saldo di un conto in banca: q e w sono i versamenti (positivi) e i prelievi (negativi). Il saldo finale dipende solo da quanto è entrato e uscito in totale, non dall'ordine delle operazioni: è una funzione di stato. Come l'altitudine di una vetta: è la stessa qualunque sentiero tu abbia percorso, mentre i chilometri fatti (il lavoro) dipendono dal sentiero."},{"id":"termo1-9","c":"termo1","a":1,"t":"definizione","f":"Come definisci «La riserva totale di energia di un sistema»?","b":"La riserva totale di energia di un sistema è la sua energia interna U; se ne misurano le variazioni, ΔU = U(finale) − U(iniziale), indicando sempre il segno."},{"id":"termo1-10","c":"termo1","a":1,"t":"definizione","f":"Come definisci «L'energia interna»?","b":"L'energia interna è una funzione di stato: dipende solo dallo stato attuale del sistema e non da come ci si è arrivati."},{"id":"termo1-11","c":"termo1","a":1,"t":"definizione","f":"Come definisci «Il lavoro e il calore non»?","b":"Il lavoro e il calore non sono funzioni di stato: dipendono da come avviene la trasformazione."},{"id":"termo1-12","c":"termo1","a":2,"t":"concetto","f":"Che cosa devi sapere su «Capacità termica e calorimetria»?","b":"Quando un sistema assorbe calore la sua temperatura aumenta in modo proporzionale al calore assorbito: q = C·ΔT, dove C è la capacità termica (J/°C o J/K). La capacità termica dipende dalla massa (200 g di acqua richiedono il doppio del calore di 100 g per lo stesso aumento di temperatura) e dal tipo di materiale."},{"id":"termo1-13","c":"termo1","a":2,"t":"concetto","f":"In parole semplici: «Capacità termica e calorimetria»","b":"Il calore specifico dice quanto una sostanza è «pigra» a scaldarsi. L'acqua è molto pigra: ne serve tanto, di calore, per farle cambiare temperatura. La sabbia no: per questo d'estate la spiaggia scotta e il mare resta fresco, pur ricevendo lo stesso sole."},{"id":"termo1-14","c":"termo1","a":2,"t":"definizione","f":"Come definisci «Il calore specifico Cs»?","b":"Il calore specifico Cs è il calore necessario per aumentare di 1 °C la temperatura di un grammo di sostanza, in J/(g·°C): q = m·Cs·ΔT."},{"id":"termo1-15","c":"termo1","a":3,"t":"concetto","f":"Che cosa devi sapere su «Entalpia e cambiamenti di stato»?","b":"Se il sistema ha pareti rigide non compie lavoro di espansione: a volume costante ΔU = q. In chimica però interessano soprattutto gli scambi di calore a pressione costante, perché la maggior parte delle reazioni avviene in recipienti aperti all'atmosfera (circa 1 atm). La funzione di stato adatta è l'entalpia: H = U + PV."},{"id":"termo1-16","c":"termo1","a":3,"t":"concetto","f":"In parole semplici: «Entalpia e cambiamenti di stato»","b":"L'entalpia è l'energia interna con dentro già «il biglietto» per fare spazio nell'atmosfera: così, a pressione costante, il calore che misuri è direttamente ΔH. Durante un passaggio di stato il calore non alza la temperatura perché viene speso tutto per separare le molecole: ecco i tratti piatti della curva di riscaldamento."},{"id":"termo1-17","c":"termo1","a":3,"t":"definizione","f":"Come definisci «La funzione di stato adatta»?","b":"La funzione di stato adatta è l'entalpia: H = U + PV."},{"id":"termo1-18","c":"termo1","a":3,"t":"definizione","f":"Come definisci «L'entalpia di vaporizzazione»?","b":"L'entalpia di vaporizzazione è ΔHvap = Hm(vapore) − Hm(liquido); l'entalpia di fusione è ΔHfus = Hm(liquido) − Hm(solido)."},{"id":"termo1-19","c":"termo1","a":3,"t":"definizione","f":"Come definisci «Poiché l'entalpia»?","b":"Poiché l'entalpia è una funzione di stato, ΔH del processo inverso è l'opposto di quello diretto: l'entalpia di congelamento è −ΔHfus."},{"id":"termo1-20","c":"termo1","a":3,"t":"definizione","f":"Come definisci «L'entalpia di sublimazione»?","b":"L'entalpia di sublimazione è ΔHsub = ΔHfus + ΔHvap (alla stessa temperatura)."},{"id":"termo1-21","c":"termo1","a":3,"t":"definizione","f":"Come definisci «Il passaggio solido → vapore diretto»?","b":"Il passaggio solido → vapore diretto si chiama sublimazione."},{"id":"termo1-22","c":"termo1","a":4,"t":"concetto","f":"Che cosa devi sapere su «Entalpia di reazione e relazione tra ΔH e ΔU»?","b":"La variazione di entalpia di una reazione è una proprietà estensiva: più reagenti si usano, maggiore è ΔH. Per convenzione si riferisce al numero di moli indicato dai coefficienti dell'equazione così come è scritta: l'insieme di equazione e ΔH è un'equazione termochimica."},{"id":"termo1-23","c":"termo1","a":4,"t":"concetto","f":"In parole semplici: «Entalpia di reazione e relazione tra ΔH e ΔU»","b":"L'equazione termochimica è una ricetta con lo scontrino: «per queste quantità, questo calore». Se raddoppi le dosi raddoppi il calore, se inverti la reazione cambi il segno. La differenza tra ΔH e ΔU è solo il lavoro fatto dai gas che si formano o scompaiono: se il numero di moli di gas non cambia, le due grandezze coincidono."},{"id":"termo1-24","c":"termo1","a":4,"t":"definizione","f":"Come definisci «La variazione di entalpia di una reazione»?","b":"La variazione di entalpia di una reazione è una proprietà estensiva: più reagenti si usano, maggiore è ΔH."},{"id":"termo1-25","c":"termo1","a":4,"t":"definizione","f":"Come definisci «Il valore standard di una proprietà»?","b":"Il valore standard di una proprietà si indica con il simbolo °: ogni reagente e prodotto è nel suo stato standard, cioè in forma pura a 1 bar (per un soluto, concentrazione 1 mol/L); i dati sono di solito riportati a 25 °C (298,15 K)."},{"id":"termo1-26","c":"termo1","a":4,"t":"definizione","f":"Come definisci «L'entalpia standard di reazione ΔH°»?","b":"L'entalpia standard di reazione ΔH° è l'entalpia di reazione quando reagenti negli stati standard si trasformano in prodotti negli stati standard."},{"id":"termo1-27","c":"termo1","a":5,"t":"concetto","f":"Che cosa devi sapere su «Legge di Hess, entalpie di formazione e ciclo di Born-Haber»?","b":"Legge di Hess: se una reazione può essere espressa come una serie di stadi, il ΔH della reazione complessiva è la somma dei ΔH dei singoli stadi."},{"id":"termo1-28","c":"termo1","a":5,"t":"concetto","f":"In parole semplici: «Legge di Hess, entalpie di formazione e ciclo di Born-Haber»","b":"La legge di Hess è la regola del dislivello: per sapere di quanto sei salito tra due rifugi puoi sommare i dislivelli di qualunque percorso a tappe che li collega. Le entalpie di formazione sono il «livello del mare» comune: ogni sostanza ha la sua quota rispetto agli elementi, e la differenza di quota tra prodotti e reagenti è il ΔH della reazione."},{"id":"termo1-29","c":"termo1","a":0,"t":"quiz","f":"Che cosa scambia con l'ambiente un sistema chiuso?","b":"✅ Energia ma non materia\nAperto: materia ed energia. Chiuso: solo energia. Isolato: nulla."},{"id":"termo1-30","c":"termo1","a":0,"t":"quiz","f":"Che cosa scambia con l'ambiente un sistema isolato?","b":"✅ Nulla\nUn sistema isolato non scambia né materia né energia: la sua energia interna resta costante."},{"id":"termo1-31","c":"termo1","a":1,"t":"quiz","f":"Che cosa afferma il primo principio della termodinamica?","b":"✅ L'energia interna di un sistema isolato è costante\nIn un sistema chiuso ΔU = q + w; se il sistema è isolato non ci sono scambi e U non cambia."},{"id":"termo1-32","c":"termo1","a":1,"t":"quiz","f":"Che cos'è una funzione di stato?","b":"✅ Una proprietà che dipende solo dallo stato attuale del sistema, non da come è stato raggiunto\nU, H, P e V sono funzioni di stato; calore e lavoro no, perché dipendono dal modo in cui avviene la trasformazione."},{"id":"termo1-33","c":"termo1","a":1,"t":"quiz","f":"Che cos'è un processo esotermico?","b":"✅ Un processo che rilascia calore nell'ambiente\nNelle trasformazioni esotermiche (per esempio le combustioni) q è negativo: l'energia esce dal sistema."},{"id":"termo1-34","c":"termo1","a":2,"t":"quiz","f":"Che cos'è il calore specifico?","b":"✅ Il calore necessario per aumentare di 1 °C la temperatura di 1 g di sostanza\nSi misura in J/(g·°C) e compare
