<script>
/* Strumenti: ricerca, formulario, tavola periodica interattiva, calcolatore di massa molare */
let strum = { sez: "formule", modulo: null, q: "", z: null, colora: "cat", formula: "H2SO4", grammi: "10" };
const SEZIONI = [["formule", "📐 Formulario"], ["tavola", "🧪 Tavola periodica"], ["massa", "⚖️ Massa molare"], ["cerca", "🔎 Cerca"]];
const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const numIt = (x, d = 2) => Number(x).toFixed(d).replace(".", ",");

function renderStrumenti(opz = {}) {
  if (opz.sez) strum.sez = opz.sez;
  if (opz.modulo !== undefined) strum.modulo = opz.modulo;
  $("#vista").innerHTML = '<div class="chips aperta sticky">' + SEZIONI.map(([k, t]) => '<button class="chip' + (strum.sez === k ? " on" : "") + '" data-sez="' + k + '">' + t + '</button>').join("") + '</div><div id="strum"></div>';
  ({ formule: renderFormule, tavola: renderTavola, massa: renderMassa, cerca: renderCerca })[strum.sez]();
}

/* ---------- Formulario ---------- */
function voceFormula([t, f, n]) {
  return '<div class="formula"><span class="ft">' + esc(t) + '</span><code>' + esc(f) + '</code>' + (n ? '<small>' + esc(n) + '</small>' : "") + '</div>';
}
function renderFormule() {
  const scelti = strum.modulo ? [strum.modulo] : MODULI.map(m => m.id);
  let html = '<div class="chips aperta"><button class="chip' + (!strum.modulo ? " on" : "") + '" data-fmod="">Tutti</button>' +
    MODULI.map(m => '<button class="chip' + (strum.modulo === m.id ? " on" : "") + '" data-fmod="' + m.id + '">' + SIMBOLI[m.id] + ' ' + esc(m.titolo) + '</button>').join("") + '</div>';
  if (!strum.modulo) html += '<p class="titolo-sez">Costanti e conversioni</p><section class="glass gruppo-f">' + COSTANTI.map(voceFormula).join("") + '</section>';
  scelti.forEach(id => {
    const m = capById(id);
    html += '<p class="titolo-sez" style="color:' + m.colore + '">' + esc(m.icona + " " + m.titolo) + '</p><section class="glass gruppo-f">' + FORMULARIO[id].map(voceFormula).join("") + '</section>';
  });
  $("#strum").innerHTML = html;
}

/* ---------- Tavola periodica ---------- */
function coloreEN(en) {
  if (en == null) return "rgba(255,255,255,.06)";
  const t = Math.min(1, Math.max(0, (en - .7) / 3.3));
  return "hsl(" + (220 - t * 220) + " 75% " + (30 + t * 22) + "%)";
}
function renderTavola() {
  let celle = "";
  ELEMENTI.forEach(e => {
    const [z, s, , , en, cat] = e, [r, c] = posizioneElemento(z);
    const bg = strum.colora === "en" ? coloreEN(en) : CATEGORIE[cat][1] + "33";
    const bd = strum.colora === "en" ? "transparent" : CATEGORIE[cat][1] + "aa";
    celle += '<button class="el' + (strum.z === z ? " sel" : "") + '" data-z="' + z + '" style="grid-row:' + r + ';grid-column:' + c + ';background:' + bg + ';border-color:' + bd + '"><i>' + z + '</i>' + s + '</button>';
  });
  celle += '<div class="el segnaposto" style="grid-row:6;grid-column:3">57–71</div><div class="el segnaposto" style="grid-row:7;grid-column:3">89–103</div><div style="grid-row:8;grid-column:1/19;height:8px"></div>';
  const leg = strum.colora === "en"
    ? '<div class="legenda"><span>Elettronegatività:</span><span class="scala"></span><span>0,7 → 4,0</span></div>'
    : '<div class="legenda">' + Object.values(CATEGORIE).map(([n, c]) => '<span><i style="background:' + c + '"></i>' + n + '</span>').join("") + '</div>';
  $("#strum").innerHTML =
    '<div class="chips aperta"><button class="chip' + (strum.colora === "cat" ? " on" : "") + '" data-colora="cat">Colora per categoria</button><button class="chip' + (strum.colora === "en" ? " on" : "") + '" data-colora="en">Colora per elettronegatività</button></div>' +
    '<div class="tavola-wrap glass"><div class="tavola">' + celle + '</div></div>' + leg +
    '<div id="scheda-el">' + (strum.z ? schedaElemento(strum.z) : '<p class="desc" style="text-align:center;margin:14px">Tocca un elemento per vedere configurazione elettronica, massa ed elettronegatività.</p>') + '</div>';
}
function schedaElemento(z) {
  const [, s, nome, massa, en, cat] = ELEMENTI[z - 1], [r, c] = posizioneElemento(z), conf = configurazione(z);
  const periodo = r > 7 ? (r === 9 ? 6 : 7) : r, gruppo = r > 7 ? "— (blocco f)" : c;
  const blocco = r > 7 ? "f" : c <= 2 || z === 2 ? "s" : c >= 13 ? "p" : "d";
  const val = blocco === "s" ? (z === 2 ? 2 : c) : blocco === "p" ? c - 10 : null;
  const m = SENZA_MASSA_STANDARD.has(z) ? "(" + massa + ")" : numIt(massa, massa < 100 ? 3 : 2);
  return '<section class="glass scheda" style="--col:' + CATEGORIE[cat][1] + '">' +
    '<div class="testa-el"><div class="grande-el"><i>' + z + '</i>' + s + '</div><div><h3>' + esc(nome) + '</h3><small>' + CATEGORIE[cat][0] + '</small></div></div>' +
    '<div class="griglia-stat">' +
      [["Massa atomica", m + " u"], ["Elettronegatività", en == null ? "n.d." : numIt(en, 2)], ["Periodo · gruppo", periodo + " · " + gruppo], ["Blocco", blocco + (val ? " · " + val + " e⁻ di valenza" : "")]]
        .map(([t, v]) => '<div class="stat"><span>' + t + '</span><b class="medio">' + v + '</b></div>').join("") + '</div>' +
    '<div class="conf"><span>Configurazione elettronica' + (conf.prevista ? " (prevista)" : "") + '</span><code>' + conf.breve + '</code><small>' + conf.completa + '</small>' +

    '<button class="btn sec" style="width:100%;margin-top:10px" data-usa-el="' + s + '">⚖️ Usa nel calcolatore di massa molare</button></section>';
}

/* ---------- Calcolatore di massa molare ---------- */
function calcolaMassa() {
  const out = $("#massa-out"); if (!out) return;
  try {
    const comp = analizzaFormula(strum.formula);
    const righe = Object.entries(comp).map(([s, n]) => ({ s, n, m: EL[s][3] * n }));
    const M = righe.reduce((a, r) => a + r.m, 0);
    const g = parseFloat(String(strum.grammi).replace(",", "."));
    const sint = righe.some(r => SENZA_MASSA_STANDARD.has(EL[r.s][0]));
    out.innerHTML = '<div class="risultato"><span>Massa molare</span><b>' + numIt(M, 3) + ' g/mol</b></div>' +
      '<table class="tab"><thead><tr><th>Elemento</th><th>Atomi</th><th>Massa</th><th>% in massa</th></tr></thead><tbody>' +
      righe.map(r => '<tr><td><b>' + r.s + '</b> ' + esc(EL[r.s][2]) + '</td><td>' + r.n + '</td><td>' + numIt(r.m, 3) + '</td><td>' + numIt(r.m / M * 100, 2) + ' %</td></tr>').join("") + '</tbody></table>' +
      (isFinite(g) && g > 0 ? '<div class="conv"><div><span>Moli</span><b>' + numIt(g / M, 4) + ' mol</b></div><div><span>Particelle (molecole o unità formula)</span><b>' + (g / M * 6.022e23).toExponential(3).replace(".", ",").replace("e+", "·10^") + '</b></div></div>' : "") +
      '<p class="desc" style="font-size:12px;margin-top:8px">n = m / M · N = n · Nₐ' + (sint ? " · contiene elementi senza massa standard: usato il numero di massa dell'isotopo più stabile" : "") + '</p>';
  } catch (e) { out.innerHTML = '<p class="errore">⚠️ ' + esc(e.message) + '</p>'; }
}
function renderMassa() {
  const esempi = ["H2SO4", "Ca(OH)2", "Al2(SO4)3", "CuSO4·5H2O", "C6H12O6", "KMnO4", "NaHCO3", "Fe2O3"];
  $("#strum").innerHTML = '<section class="glass hero"><label class="campo"><span>Formula</span><input id="in-formula" value="' + esc(strum.formula) + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="es. Al2(SO4)3"></label>' +
    '<label class="campo"><span>Grammi (facoltativo)</span><input id="in-grammi" value="' + esc(strum.grammi) + '" inputmode="decimal" placeholder="es. 10"></label>' +
    '<div class="chips aperta">' + esempi.map(f => '<button class="chip" data-esempio="' + f + '">' + f + '</button>').join("") + '</div>' +
    '<div id="massa-out"></div></section>';
  calcolaMassa();
}

/* ---------- Ricerca ---------- */
function renderCerca() {
  $("#strum").innerHTML = '<label class="campo glass" style="padding:12px 14px;display:block"><input id="in-cerca" value="' + esc(strum.q) + '" placeholder="Cerca un concetto: entalpia, ibridazione, Hund…" autocomplete="off"></label><div id="ris-cerca"></div>';
  cerca(); const i = $("#in-cerca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
}
function cerca() {
  const out = $("#ris-cerca"), q = norm(strum.q.trim());
  if (q.length < 2) { out.innerHTML = '<p class="desc" style="text-align:center;margin:20px">Scrivi almeno 2 lettere. La ricerca guarda in tutti i paragrafi e nel formulario.</p>'; return; }
  const parole = q.split(/\s+/), ris = [];
  MODULI.forEach(m => m.argomenti.forEach((a, k) => {
    const testo = norm(a.titolo + " " + a.riassunto + " " + a.esempi.join(" "));
    if (parole.every(p => testo.includes(p))) {
      const pos = norm(a.riassunto).indexOf(parole[0]);
      const snip = pos >= 0 ? "…" + a.riassunto.slice(Math.max(0, pos - 60), pos + 140) + "…" : a.riassunto.slice(0, 180) + "…";
      ris.push({ peso: norm(a.titolo).includes(parole[0]) ? 0 : 1, html: '<button class="riga-err" style="--col:' + m.colore + ';width:100%;text-align:left" data-vai-par="' + m.id + '|' + k + '"><span class="pt"></span><div><b>' + esc(a.titolo) + '</b><small>' + esc(m.titolo) + '</small><small>' + esc(snip) + '</small></div></button>' });
    }
  }));
  Object.entries(FORMULARIO).forEach(([id, voci]) => voci.forEach(v => {
    if (parole.every(p => norm(v.join(" ")).includes(p))) ris.push({ peso: .5, html: '<div class="glass" style="margin-bottom:8px;border-radius:14px"><small style="display:block;padding:10px 14px 0;color:' + capById(id).colore + '">📐 ' + esc(capById(id).titolo) + '</small>' + voceFormula(v) + '</div>' });
  }));
  out.innerHTML = ris.length ? '<p class="titolo-sez">' + ris.length + ' risultati</p>' + ris.sort((a, b) => a.peso - b.peso).slice(0, 40).map(r => r.html).join("") : '<div class="vuoto"><b>🔎</b>Nessun risultato per «' + esc(strum.q) + '».</div>';
}

document.addEventListener("click", e => {
  if (vistaCorrente !== "strumenti") return;
  const t = e.target.closest("[data-sez],[data-fmod],[data-z],[data-colora],[data-esempio],[data-usa-el],[data-vai-par]"); if (!t) return;
  const d = t.dataset; suono("click");
  if (d.sez) { strum.sez = d.sez; renderStrumenti(); }
  else if (d.fmod !== undefined) { strum.modulo = d.fmod || null; renderFormule(); }
  else if (d.z) { strum.z = Number(d.z); $$(".el.sel").forEach(x => x.classList.remove("sel")); t.classList.add("sel"); $("#scheda-el").innerHTML = schedaElemento(strum.z); $("#scheda-el").scrollIntoView({ behavior: "smooth", block: "nearest" }); }

});

  if (e.target.id === "in-formula") { strum.formula = e.target.value; calcolaMassa(); }
  else if (e.target.id === "in-grammi") { strum.grammi = e.target.value; calcolaMassa(); }
  else if (e.target.id === "in-cerca") { strum.q = e.target.value; cerca(); }
});


</script>
<script>
/* Avvio e navigazione tra le viste */
let vistaCorrente = "oggi";
const VISTE = { oggi: renderOggi, mappa: renderMappa, feed: renderFeed, errori: renderErrori, strumenti: renderStrumenti, profilo: renderProfilo };

function vai(nome, opz) {
  if (!VISTE[nome]) nome = "oggi";
  vistaCorrente = nome;
  $$("#nav button").forEach(b => b.classList.toggle("attivo", b.dataset.vai === nome));
  const v = $("#vista");
  v.classList.remove("feedmode");
  v.scrollTop = 0;
  VISTE[nome](opz || {});
  aggiornaTop();
  if (location.hash.slice(1) !== nome) history.replaceState(null, "", "#" + nome);
}

document.addEventListener("click", e => {
  const b = e.target.closest("#nav [data-vai], #top [data-vai]");
  if (b) { suono("click"); vai(b.dataset.vai); }
});
$("#btn-audio").addEventListener("click", () => {
  S.audio = !S.audio; salva(); aggiornaTop();
  if (S.audio) suono("ok");
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-modulo]");
  if (t && vistaCorrente === "mappa") apriModulo(t.dataset.modulo);
});
// Esc chiude le schede aperte
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const ov = $(".overlay"); if (ov) { ov.remove(); if (vistaCorrente === "mappa" || vistaCorrente === "oggi") vai(vistaCorrente); } }
});
// Al cambio di giorno (app lasciata aperta) aggiorna missioni e ripasso
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.giorno && S.giorno.data !== oggi() && !$(".schermo")) vai(vistaCorrente);
});

// Altezza reale dell'area visibile: su telefono 100dvh può includere la barra del browser e il menu in basso taglierebbe i pulsanti
function adattaAltezza() { document.documentElement.style.setProperty("--vh", (window.visualViewport ? window.visualViewport.height : window.innerHeight) + "px"); }
adattaAltezza();
window.addEventListener("resize", adattaAltezza);
window.addEventListener("orientationchange", () => setTimeout(adattaAltezza, 200));
if (window.visualViewport) window.visualViewport.addEventListener("resize", adattaAltezza);
DOMANDE.push(...GL.modelli());   // i modelli con numeri variabili entrano nel database delle domande
carica();
giornata();
vai(location.hash.slice(1) || "oggi");

// Installabile come app (PWA) e utilizzabile offline quando servita da un server (non da file://)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* facoltativo */ });
}

</script>
</body>
