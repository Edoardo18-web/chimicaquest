const CARTE = [{"id":"atomo-0","c":"atomo","a":0,"t":"concetto","f":"Che cosa devi sapere su «Dall'idea di atomo alla teoria di Dalton»?","b":"Intorno al 400 a.C. Democrito ipotizzò che la materia non si possa dividere all'infinito: prima o poi si arriva a una particella indivisibile, l'«atomos» («che non si può tagliare»). L'idea fu ignorata per circa 2000 anni perché prevalse la teoria di Aristotele e Platone dei quattro elementi (terra, fuoco, aria, acqua)."},{"id":"atomo-1","c":"atomo","a":0,"t":"concetto","f":"In parole semplici: «Dall'idea di atomo alla teoria di Dalton»","b":"Pensa ai mattoncini delle costruzioni: puoi smontare e rimontare un modellino quante volte vuoi, ma i mattoncini sono sempre gli stessi e il loro numero non cambia. Una reazione chimica fa la stessa cosa con gli atomi: li separa e li ricombina, senza crearne o distruggerne. Per questo la massa totale non cambia."},{"id":"atomo-2","c":"atomo","a":0,"t":"definizione","f":"Come definisci «Non»?","b":"Non è un postulato di Dalton che gli atomi siano formati da protoni, neutroni ed elettroni: queste particelle furono scoperte dopo (Thomson, Millikan, Rutherford)."},{"id":"atomo-3","c":"atomo","a":1,"t":"concetto","f":"Che cosa devi sapere su «La scoperta dell'elettrone»?","b":"Stoney (1891) osservò che i composti possono essere decomposti dalla corrente elettrica e concluse che l'elettricità esiste in unità discrete associate agli atomi, che chiamò elettroni."},{"id":"atomo-4","c":"atomo","a":1,"t":"concetto","f":"In parole semplici: «La scoperta dell'elettrone»","b":"Thomson ha misurato «quanto pesa l'elettrone per ogni unità di carica» (il rapporto e/m), Millikan ha misurato la carica da sola. È come conoscere il prezzo al chilo e il prezzo totale: con i due dati ricavi il peso. Il modello di Thomson è spesso chiamato «a panettone»: l'impasto è la carica positiva, l'uvetta sono gli elettroni."},{"id":"atomo-5","c":"atomo","a":1,"t":"definizione","f":"Come definisci «Formule: la carica di una gocciolina»?","b":"Formule: la carica di una gocciolina è Q = n·e con e = 1,602·10⁻¹⁹ C, e il numero di elettroni in eccesso è n = Q/e."},{"id":"atomo-6","c":"atomo","a":2,"t":"concetto","f":"Che cosa devi sapere su «Rutherford e il modello nucleare»?","b":"Per capire se l'atomo fosse «vuoto», Rutherford bombardò una sottilissima lamina d'oro con particelle α (massa 4 u, carica +2) ad alta energia."},{"id":"atomo-7","c":"atomo","a":2,"t":"concetto","f":"In parole semplici: «Rutherford e il modello nucleare»","b":"Immagina di sparare proiettili contro una nebbia in cui è nascosto qualche sassolino durissimo: quasi tutti passano dritti, ma i pochi che colpiscono un sassolino rimbalzano. Dal fatto che i rimbalzi sono rarissimi capisci che i sassolini (i nuclei) sono piccolissimi rispetto allo spazio vuoto che li circonda."},{"id":"atomo-8","c":"atomo","a":2,"t":"definizione","f":"Come definisci «Le particelle α»?","b":"Le particelle α sono nuclei di elio (massa 4 u, carica +2)."},{"id":"atomo-9","c":"atomo","a":3,"t":"concetto","f":"Che cosa devi sapere su «Particelle subatomiche, Z, A e unità di massa atomica»?","b":"Gli atomi sono formati da tre particelle subatomiche: il protone (carica +1, massa 1,67·10⁻²⁷ kg), il neutrone (carica nulla, massa 1,67·10⁻²⁷ kg) e l'elettrone (carica −1, circa 1840 volte più leggero)."},{"id":"atomo-10","c":"atomo","a":3,"t":"concetto","f":"In parole semplici: «Particelle subatomiche, Z, A e unità di massa atomica»","b":"Z è la «carta d'identità» dell'elemento: cambia Z e cambia l'elemento. A dice invece quanto «pesa» quel particolare atomo, perché conta tutte le particelle pesanti del nucleo. I neutroni si ricavano per differenza: N = A − Z."},{"id":"atomo-11","c":"atomo","a":3,"t":"definizione","f":"Come definisci «Gli atomi»?","b":"Gli atomi sono formati da tre particelle subatomiche: il protone (carica +1, massa 1,67·10⁻²⁷ kg), il neutrone (carica nulla, massa 1,67·10⁻²⁷ kg) e l'elettrone (carica −1, circa 1840 volte più leggero)."},{"id":"atomo-12","c":"atomo","a":3,"t":"definizione","f":"Come definisci «Il numero di protoni»?","b":"Il numero di protoni è il numero atomico Z, che rende un elemento chimicamente diverso da un altro; il numero di nucleoni (protoni + neutroni) è il numero di massa A."},{"id":"atomo-13","c":"atomo","a":4,"t":"concetto","f":"Che cosa devi sapere su «Ioni, molecole e isotopi»?","b":"Quando protoni ed elettroni non sono in numero uguale si ha uno ione: se prevalgono gli elettroni è un anione (negativo, attratto dall'anodo), se prevalgono i protoni è un catione (positivo, attratto dal catodo). Gli atomi possono legarsi tra loro formando molecole (O₂, H₂O)."},{"id":"atomo-14","c":"atomo","a":4,"t":"concetto","f":"In parole semplici: «Ioni, molecole e isotopi»","b":"Gli isotopi sono come gemelli con peso diverso: stesso «carattere» chimico (stessi protoni ed elettroni), ma qualche neutrone in più o in meno. La massa atomica che leggi sulla tavola periodica è la media della «classe», pesata su quanti atomi di ciascun tipo esistono in natura; per questo non è un numero intero."},{"id":"atomo-15","c":"atomo","a":0,"t":"quiz","f":"Che cosa significa il termine «atomos» usato da Democrito?","b":"✅ Che non si può tagliare (indivisibile)\nPer Democrito, dividendo la materia si arriva a un pezzo che non può più essere diviso: lo chiamò «atomos», cioè «non tagliabile»."},{"id":"atomo-16","c":"atomo","a":0,"t":"quiz","f":"Che cosa afferma la legge di Lavoisier (1785)?","b":"✅ La massa dei prodotti di una reazione è uguale a quella dei reagenti\nÈ la legge di conservazione della massa: in una reazione chimica la massa totale non cambia."},{"id":"atomo-17","c":"atomo","a":0,"t":"quiz","f":"Quale di queste affermazioni NON è un postulato di Dalton?","b":"✅ Gli atomi sono formati da protoni, neutroni ed elettroni\nPer Dalton l'atomo era indivisibile (una «palla da biliardo»): le particelle subatomiche furono scoperte più tardi da Thomson, Millikan e Rutherford."},{"id":"atomo-18","c":"atomo","a":1,"t":"quiz","f":"Da che cosa sono costituiti i raggi catodici?","b":"✅ Da particelle di carica negativa (elettroni)\nPerrin dimostrò che un magnete devia i raggi catodici nella direzione corrispondente a una carica negativa: sono elettroni."},{"id":"atomo-19","c":"atomo","a":1,"t":"quiz","f":"Che cosa determinò Millikan con l'esperimento delle goccioline d'olio?","b":"✅ La carica dell'elettrone (1,6·10⁻¹⁹ C)\nLe cariche misurate sulle goccioline avevano un fattore comune, 1,6·10⁻¹⁹ C: la più piccola carica elettrica, attribuita all'elettrone."},{"id":"atomo-20","c":"atomo","a":2,"t":"quiz","f":"Secondo il modello di Rutherford, dove si trova quasi tutta la massa dell'atomo?","b":"✅ In un nucleo piccolissimo, denso e carico positivamente\nIl nucleo occupa una frazione minuscola del volume dell'atomo ma ne contiene praticamente tutta la massa; gli elettroni contribuiscono in modo trascurabile."},{"id":"atomo-21","c":"atomo","a":3,"t":"quiz","f":"Che cosa indica il numero atomico Z?","b":"✅ Il numero di protoni\nZ è il numero di protoni ed è ciò che rende un elemento chimicamente diverso da un altro."},{"id":"atomo-22","c":"atomo","a":3,"t":"quiz","f":"Che cosa indica il numero di massa A?","b":"✅ Il numero totale di nucleoni (protoni + neutroni)\nA conta le particelle del nucleo: protoni più neutroni."},{"id":"atomo-23","c":"atomo","a":3,"t":"quiz","f":"Come è definita l'unità di massa atomica (u)?","b":"✅ 1/12 della massa di un atomo di ¹²C\nPer convenzione il riferimento è il carbonio-12: 1 u = 1/12 della sua massa = 1,66·10⁻²⁷ kg."},{"id":"atomo-24","c":"atomo","a":4,"t":"quiz","f":"Che cosa sono gli isotopi?","b":"✅ Atomi dello stesso elemento con diverso numero di neutroni\nGli isotopi hanno lo stesso Z (stessi protoni) ma diverso A, perché cambia il numero di neutroni."},{"id":"atomo-25","c":"atomo","a":4,"t":"quiz","f":"Che cos'è un catione?","b":"✅ Uno ione positivo, in cui i protoni prevalgono sugli elettroni\nSe un atomo perde elettroni restano più protoni che elettroni: lo ione è positivo ed è attratto dal catodo."},{"id":"atomo-26","c":"atomo","a":3,"t":"quiz","f":"Quale particella subatomica è priva di carica elettrica?","b":"✅ Il neutrone\nIl neutrone ha carica nulla e massa circa uguale a quella del protone (≈ 1 u)."},{"id":"atomo-27","c":"atomo","a":3,"t":"quiz","f":"Quanti neutroni contiene un atomo di ⁵²Cr (Z = 24)?","b":"✅ 28\nNeutroni = A − Z = 52 − 24 = 28."},{"id":"atomo-28","c":"atomo","a":4,"t":"quiz","f":"Quanti elettroni possiede lo ione Al³⁺ (Z = 13)?","b":"✅ 10\nL'atomo neutro ha 13 elettroni; la carica 3+ indica che ne ha persi 3: 13 − 3 = 10."},{"id":"atomo-29","c":"atomo","a":4,"t":"quiz","f":"Lo ione F⁻ (Z = 9) contiene:","b":"✅ 9 protoni e 10 elettroni\nI protoni restano 9 (è sempre fluoro); la carica 1− indica un elettrone in più: 10."},{"id":"atomo-30","c":"atomo","a":3,"t":"quiz","f":"Un atomo ha 20 protoni e 20 neutroni. La sua massa è circa:","b":"✅ 40 u\nProtoni e neutroni hanno massa di circa 1 u ciascuno; gli elettroni sono trascurabili: 20 + 20 = 40 u."},{"id":"atomo-31","c":"atomo","a":4,"t":"quiz","f":"Un atomo ha 20 protoni e 18 elettroni. Qual è la sua carica?","b":"✅ 2+\nCi sono due cariche positive in più rispetto a quelle negative: lo ione è 2+ (non 2−)."},{"id":"atomo-32","c":"atomo","a":4,"t":"quiz","f":"Quanti protoni e neutroni contiene il carbonio-13 (Z = 6)?","b":"✅ 6 protoni e 7 neutroni\nZ = 6 protoni; neutroni = 13 − 6 = 7."},{"id":"atomo-33","c":"atomo","a":4,"t":"quiz","f":"Il trizio è l'isotopo dell'idrogeno il cui nucleo contiene:","b":"✅ 1 protone e 2 neutroni\nTutti gli isotopi dell'idrogeno hanno 1 protone: prozio 0 neutroni, deuterio 1, trizio 2."},{"id":"atomo-34","c":"atomo","a":2,"t":"quiz","f":"Nell'esperimento di Rutherford, che cosa accadeva alla maggior parte delle particelle α?","b":"✅ Attraversavano la lamina d'oro senza essere deviate\nL'atomo è quasi tutto spazio vuoto: solo le poche particelle che passano vicino a un nucleo vengono deviate."},{"id":"atomo-35","c":"atomo","a":1,"t":"quiz","f":"Come è descritto l'atomo nel modello di Thomson?","b":"✅ Una nube di carica positiva in cui sono immerse le particelle negative\nNel modello di Thomson non esiste un nucleo: la carica positiva è diffusa e gli elettroni vi sono immersi."},{"id":"atomo-36","c":"atomo","a":0,"t":"quiz","f":"Bruciando, il magnesio aumenta di massa. Perché questo non contraddice la legge di Lavoisier?","b":"✅ Perché si combina con l'ossigeno: la massa di Mg + O₂ è uguale a quella di MgO\nTra i reagenti va contato anche l'ossigeno dell'aria: la massa dei reagenti è uguale a quella del prodotto MgO."},{"id":"atomo-37","c":"atomo","a":3,"t":"quiz","f":"Di quanto la massa del protone è maggiore di quella dell'elettrone?","b":"✅ Circa 1840 volte\nL'elettrone è circa 1840 volte più leggero del protone: per questo la massa dell'atomo sta quasi tutta nel nucleo."},{"id":"atomo-38","c":"atomo","a":3,"t":"quiz","f":"L'atomo ha dimensioni di circa 10⁻¹⁰ m, protoni e neutroni di circa 10⁻¹⁵ m. Il nucleo è quindi più piccolo dell'atomo di circa:","b":"✅ 5 ordini di grandezza\n10⁻¹⁰ / 10⁻¹⁵ = 10⁵: il nucleo è centomila volte più piccolo dell'atomo."},{"id":"atomo-39","c":"atomo","a":3,"t":"calcolo","f":"Un atomo neutro di calcio (Ca) ha numero di massa A = 22. Quanti protoni, elettroni e neutroni contiene?","b":"Protoni = Z = 20\nElettroni = protoni (atomo neutro) = 20\nNeutroni = A − Z = 22 − 20 = 2"},{"id":"atomo-40","c":"atomo","a":3,"t":"calcolo","f":"Un atomo neutro di zolfo (S) ha numero di massa A = 24. Quanti protoni, elettroni e neutroni contiene?","b":"Protoni = Z = 16\nElettroni = protoni (atomo neutro) = 16\nNeutroni = A − Z = 24 − 16 = 8"},{"id":"atomo-41","c":"atomo","a":4,"t":"calcolo","f":"Quanti elettroni possiede lo ione Ca²+, sapendo che l'atomo neutro ha Z = 20?","b":"Atomo neutro: 20 elettroni\nCatione (carica +2): ha perso 2 elettroni → 20 − 2 = 18"},{"id":"atomo-42","c":"atomo","a":4,"t":"calcolo","f":"Quanti elettroni possiede lo ione F−, sapendo che l'atomo neutro ha Z = 9?","b":"Atomo neutro: 9 elettroni\nAnione (carica −1): ha acquistato 1 elettroni → 9 + 1 = 10"},{"id":"atomo-43","c":"atomo","a":0,"t":"calcolo","f":"In una reazione reagiscono completamente 3 g di ferro e 35 g di zolfo. Quanti grammi di prodotto si ottengono?","b":"Legge di Lavoisier: massa prodotti = massa reagenti\nm = 3 g + 35 g = 38 g"},{"id":"atomo-44","c":"atomo","a":0,"t":"calcolo","f":"In una reazione reagiscono completamente 8 g di idrogeno e 52 g di ossigeno. Quanti grammi di prodotto si ottengono?","b":"Legge di Lavoisier: massa prodotti = massa reagenti\nm = 8 g + 52 g = 60 g"},{"id":"atomo-45","c":"atomo","a":4,"t":"calcolo","f":"Il Br è formato da due isotopi di massa 79 u e 81 u, con massa atomica media 79,90 u. Qual è la percentuale dell'isotopo più leggero?","b":"Massa media = x·79 + (100 − x)·81 all'interno di 100, con x = % dell'isotopo leggero\nQuindi x = (M − 81) / (79 − 81) · 100 = (79,90 − 81) / -2 · 100 ≈ 55,0 %"},{"id":"atomo-46","c":"atomo","a":4,"t":"calcolo","f":"Il Cl è formato da due isotopi di massa 35 u e 37 u, con massa atomica media 35,74 u. Qual è la percentuale dell'isotopo più leggero?","b":"Massa media = x·35 + (100 − x)·37 all'interno di 100, con x = % dell'isotopo leggero\nQuindi x = (M − 37) / (35 − 37) · 100 = (35,74 − 37) / -2 · 100 ≈ 63,0 %"},{"id":"atomo-47","c":"atomo","a":3,"t":"calcolo","f":"Un atomo di ossigeno ha massa atomica 16,00 u. Quanto vale la sua massa in unità di 10⁻²³ g? (1 u = 1,66·10⁻²⁴ g)","b":"m = 16,00 u · 1,66·10⁻²⁴ g/u = 26,56·10⁻²⁴ g\nIn unità di 10⁻²³ g: 2,66·10⁻²³ g"},{"id":"atomo-48","c":"atomo","a":3,"t":"calcolo","f":"Un atomo di alluminio ha massa atomica 26,98 u. Quanto vale la sua massa in unità di 10⁻²³ g? (1 u = 1,66·10⁻²⁴ g)","b":"m = 26,98 u · 1,66·10⁻²⁴ g/u = 44,79·10⁻²⁴ g\nIn unità di 10⁻²³ g: 4,48·10⁻²³ g"},{"id":"atomo-49","c":"atomo","a":4,"t":"calcolo","f":"Quante volte è più pesante un atomo di zolfo rispetto a un atomo di ossigeno, usando le masse atomiche?","b":"Rapporto = massa(zolfo) / massa(ossigeno) = 32,06 / 16,00\n= 2,00"},{"id":"atomo-50","c":"atomo","a":4,"t":"calcolo","f":"Quante volte è più pesante un atomo di ossigeno rispetto a un atomo di carbonio, usando le masse atomiche?","b":"Rapporto = massa(ossigeno) / massa(carbonio) = 16,00 / 12,01\n= 1,33"},{"id":"mole-0","c":"mole","a":0,"t":"concetto","f":"Che cosa devi sapere su «Composti, molecole e formule chimiche»?","b":"Un composto è una sostanza elettricamente neutra formata da due o più elementi diversi, i cui atomi sono presenti in un rapporto definito. I composti si dividono in organici e inorganici, e in molecolari e ionici."},{"id":"mole-1","c":"mole","a":0,"t":"concetto","f":"In parole semplici: «Composti, molecole e formule chimiche»","b":"La formula molecolare è come la lista degli ingredienti: dice quali atomi ci sono e quanti, ma non come sono collegati. La formula di struttura è invece la «ricetta montata»: mostra chi è legato a chi. C₂H₆O può essere sia etanolo sia un'altra sostanza: solo la struttura le distingue."},{"id":"mole-2","c":"mole","a":0,"t":"definizione","f":"Come definisci «Un composto»?","b":"Un composto è una sostanza elettricamente neutra formata da due o più elementi diversi, i cui atomi sono presenti in un rapporto definito."},{"id":"mole-3","c":"mole","a":0,"t":"definizione","f":"Come definisci «Una molecola»?","b":"Una molecola è un gruppo discreto di atomi legati tra loro in una disposizione specifica; uno ione è un atomo o una molecola con carica positiva o negativa."},{"id":"mole-4","c":"mole","a":0,"t":"definizione","f":"Come definisci «Il numero totale di atomi»?","b":"Il numero totale di atomi è la somma di tutti gli atomi della formula."},{"id":"mole-5","c":"mole","a":0,"t":"definizione","f":"Come definisci «La formula bruta»?","b":"La formula bruta indica il numero esatto di atomi della molecola: l'etanolo C₂H₅OH si scrive anche C₂H₆O, con 2 C, 6 H e 1 O, quindi 9 atomi in tutto."},{"id":"mole-6","c":"mole","a":1,"t":"concetto","f":"Che cosa devi sapere su «Massa atomica, mole e massa molare»?","b":"La massa di un atomo si misura in unità di massa atomica (u) e tiene conto dell'abbondanza relativa degli isotopi: per il carbonio 12 u · 0,989 + 13 u · 0,011 = 12,011 u. La massa di una molecola è la somma delle masse dei suoi atomi (H₂O: 2 · 1,008 + 15,999 = 18,015 u)."},{"id":"mole-7","c":"mole","a":1,"t":"concetto","f":"In parole semplici: «Massa atomica, mole e massa molare»","b":"La mole è la «dozzina» dei chimici, solo enormemente più grande. Il trucco è che il numero che leggi sulla tavola periodica vale due volte: in u è la massa di un atomo, in grammi è la massa di una mole di atomi. Così si passa dalla bilancia al numero di particelle con n = m / M."},{"id":"mole-8","c":"mole","a":1,"t":"definizione","f":"Come definisci «La massa di una molecola»?","b":"La massa di una molecola è la somma delle masse dei suoi atomi (H₂O: 2 · 1,008 + 15,999 = 18,015 u)."},{"id":"mole-9","c":"mole","a":1,"t":"definizione","f":"Come definisci «La massa molare M»?","b":"La massa molare M è la massa di una mole di particelle (g/mol): per un elemento coincide numericamente con la massa atomica, per un composto molecolare è la massa di una mole di molecole, per un composto ionico di una mole di unità formula."},{"id":"mole-10","c":"mole","a":1,"t":"definizione","f":"Come definisci «Il difetto di massa»?","b":"Il difetto di massa è la differenza tra la massa di un nucleo e la somma delle masse dei suoi nucleoni: corrisponde all'energia necessaria per separarli, secondo ΔE = Δm·c²."},{"id":"mole-11","c":"mole","a":1,"t":"definizione","f":"Come definisci «Massa atomica media:»?","b":"Massa atomica media: è la media pesata M̄ = Σ (abbondanza frazionaria × massa isotopica); per due isotopi di massa m₁ e m₂ con M̄ nota, l'abbondanza del primo è x = (M̄ − m₂) / (m₁ − m₂)."},{"id":"mole-12","c":"mole","a":2,"t":"concetto","f":"Che cosa devi sapere su «Formula empirica, formula molecolare e composizione percentuale»?","b":"La formula empirica mostra i numeri relativi (il rapporto minimo) degli atomi di ciascun elemento nel composto; la formula molecolare mostra il numero effettivo di atomi nella molecola. Formaldeide CH₂O, acido acetico C₂H₄O₂, acido lattico C₃H₆O₃ e glucosio C₆H₁₂O₆ hanno tutti la stessa formula empirica CH₂O."},{"id":"mole-13","c":"mole","a":2,"t":"concetto","f":"In parole semplici: «Formula empirica, formula molecolare e composizione percentuale»","b":"La formula empirica è una frazione ridotta ai minimi termini: 6/12/6 diventa 1/2/1. Per risalire alla formula vera serve un'informazione in più, la massa molare: se la molecola «pesa» sei volte l'unità CH₂O, basta moltiplicare tutti i pedici per sei."},{"id":"mole-14","c":"mole","a":3,"t":"concetto","f":"Che cosa devi sapere su «Equazioni chimiche e reazioni non redox»?","b":"Un'equazione chimica indica i reagenti («reagisce con») e i prodotti («per dare»). Per rispettare la conservazione della massa si usano i coefficienti stechiometrici davanti alle formule: ogni elemento deve avere lo stesso numero di atomi tra reagenti e prodotti; anche la carica deve essere bilanciata."},{"id":"mole-15","c":"mole","a":3,"t":"concetto","f":"In parole semplici: «Equazioni chimiche e reazioni non redox»","b":"Bilanciare significa mettere in pari gli atomi sui due lati della freccia, cambiando solo «quante porzioni» di ogni sostanza usi (i coefficienti), mai la sostanza stessa (i pedici). Nell'equazione ionica netta si cancellano gli «ioni spettatori», quelli che compaiono identici a sinistra e a destra."},{"id":"mole-16","c":"mole","a":3,"t":"definizione","f":"Come definisci «Un'equazione chimica»?","b":"Un'equazione chimica indica i reagenti («reagisce con») e i prodotti («per dare»)."},{"id":"mole-17","c":"mole","a":3,"t":"definizione","f":"Come definisci «Reagente limitante:»?","b":"Reagente limitante: è quello che finisce per primo; si trova dividendo le moli di ciascun reagente per il suo coefficiente: il valore minore indica il limitante."},{"id":"mole-18","c":"mole","a":4,"t":"concetto","f":"Che cosa devi sapere su «Numeri di ossidazione»?","b":"Il numero (o stato) di ossidazione di un atomo è il numero di elettroni virtualmente ceduti (valore positivo) o acquistati (valore negativo) dall'elemento quando si forma il composto. L'ossidazione comporta un aumento del numero di ossidazione, la riduzione una diminuzione."},{"id":"mole-19","c":"mole","a":4,"t":"concetto","f":"In parole semplici: «Numeri di ossidazione»","b":"Il numero di ossidazione è una contabilità: si fa finta che in ogni legame gli elettroni vadano tutti all'atomo più elettronegativo e si conta chi è «in credito» e chi «in debito». Si procede come un'equazione: si mettono i valori noti e si ricava l'incognita imponendo che la somma dia zero (o la carica dello ione)."},{"id":"mole-20","c":"mole","a":4,"t":"definizione","f":"Come definisci «Chi si ossida cede elettroni ed»?","b":"Chi si ossida cede elettroni ed è il riducente; chi si riduce acquista elettroni ed è l'ossidante: in Zn + Cu²⁺ → Zn²⁺ + Cu lo zinco si ossida (0 → +2) ed è il riducente, il rame si riduce (+2 → 0) ed è l'ossidante."},{"id":"mole-21","c":"mole","a":5,"t":"concetto","f":"Che cosa devi sapere su «Bilanciamento delle redox e calcoli stechiometrici»?","b":"Le reazioni redox comportano un trasferimento di elettroni da una specie che si ossida a una che si riduce: cambia il numero di ossidazione di alcuni atomi."},{"id":"mole-22","c":"mole","a":5,"t":"concetto","f":"In parole semplici: «Bilanciamento delle redox e calcoli stechiometrici»","b":"In una redox gli elettroni persi da qualcuno devono essere tutti presi da qualcun altro: è un passaggio di mano, niente va perso. Se un atomo ne cede 2 e un altro ne prende 5, servono 5 del primo e 2 del secondo per fare 10 e 10. Il resto del bilanciamento è una normale messa in pari degli atomi."},{"id":"mole-23","c":"mole","a":6,"t":"concetto","f":"Che cosa devi sapere su «Nomenclatura dei composti inorganici»?","b":"La nomenclatura inorganica ha due sistemi. Quello tradizionale usa i suffissi -oso (numero di ossidazione minore) e -ico (maggiore) e, per gli elementi con più di due valenze, i prefissi ipo- (il più basso) e per- (il più alto): per il cloro +1 ipocloroso, +3 cloroso, +5 clorico, +7 perclorico."},{"id":"mole-24","c":"mole","a":6,"t":"concetto","f":"In parole semplici: «Nomenclatura dei composti inorganici»","b":"Il nome dice tre cose: che famiglia è (ossido, acido, sale…), quale elemento c'è e con quale numero di ossidazione. Per scrivere la formula si parte dalle cariche e le si «incrocia» (alluminio 3+ e solfato 2− → Al₂(SO₄)₃). Per i nomi tradizionali impara la scala dell'acido: -oso < -ico, e ipo- e per- agli estremi; poi cambia il suffisso nei sali: -oso → -ito, -ico → -ato."},{"id":"mole-25","c":"mole","a":6,"t":"definizione","f":"Come definisci «Gli IDRACIDI»?","b":"Gli IDRACIDI sono H + non metallo, senza ossigeno: HF fluoridrico, HCl cloridrico, HBr bromidrico, HI iodidrico, H₂S solfidrico."},{"id":"mole-26","c":"mole","a":6,"t":"definizione","f":"Come definisci «Gli IDRURI»?","b":"Gli IDRURI sono metallo + H con H = −1 (NaH, CaH₂); i PEROSSIDI contengono il gruppo O₂²⁻ con O = −1 (H₂O₂ perossido di idrogeno, Na₂O₂, BaO₂)."},{"id":"mole-27","c":"mole","a":6,"t":"definizione","f":"Come definisci «Un SALE ACIDO»?","b":"Un SALE ACIDO è un sale in cui gli idrogeni acidi non sono stati completamente sostituiti (KHS, NaHSO₄, Na₂HPO₄, NaHCO₃)."},{"id":"mole-28","c":"mole","a":6,"t":"definizione","f":"Come definisci «Gli idruri e i perossidi: gli idruri»?","b":"Gli idruri e i perossidi: gli idruri sono basi fortissime e forti riducenti (H = −1); nei perossidi l'ossigeno vale −1 (BaO₂: Ba = +2, quindi O = −1)."},{"id":"mole-29","c":"mole","a":0,"t":"quiz","f":"Che cos'è un composto?","b":"✅ Una sostanza neutra formata da due o più elementi diversi in rapporto definito\nIl composto è elettricamente neutro e contiene atomi di elementi diversi in un rapporto fisso. Una specie carica è invece uno ione."},{"id":"mole-30","c":"mole","a":1,"t":"quiz","f":"Quante entità contiene una mole?","b":"✅ Tante quanti sono gli atomi in 12 g di carbonio-12, cioè 6,022·10²³\nLa mole è definita rispetto a 12 g di ¹²C e contiene sempre un numero di Avogadro di entità, qualunque esse siano."},{"id":"mole-31","c":"mole","a":1,"t":"quiz","f":"Che cos'è la massa molare?","b":"✅ La massa di una mole di particelle, espressa in g/mol\nLa massa molare M lega grammi e moli (n = m / M); per un elemento coincide numericamente con la massa atomica."},{"id":"mole-32","c":"mole","a":2,"t":"quiz","f":"Che cosa indica la formula empirica?","b":"✅ I numeri relativi (rapporto minimo) degli atomi di ciascun elemento\nLa formula empirica dà solo il rapporto più semplice tra gli atomi: CH₂O vale per formaldeide, acido acetico e glucosio."},{"id":"mole-33","c":"mole","a":2,"t":"quiz","f":"Che cosa indica la formula molecolare?","b":"✅ Il numero effettivo di atomi di ciascun elemento nella molecola\nLa formula molecolare riporta quanti atomi ci sono davvero nella molecola (C₆H₁₂O₆ per il glucosio)."},{"id":"mole-34","c":"mole","a":3,"t":"quiz","f":"A che cosa servono i coefficienti stechiometrici?","b":"✅ A rispettare la conservazione della massa: stesso numero di atomi tra reagenti e prodotti\nI coefficienti si mettono davanti alle formule per avere lo stesso numero di atomi di ogni elemento sui due lati della freccia."},{"id":"mole-35","c":"mole","a":4,"t":"quiz","f":"Qual è il numero di ossidazione di un elemento non combinato (per esempio Cl₂ o S₈)?","b":"✅ Zero\nUn elemento allo stato elementare ha numero di ossidazione zero, qualunque sia la sua struttura."},{"id":"mole-36","c":"mole","a":4,"t":"quiz","f":"Che cosa accade al numero di ossidazione di un elemento che si ossida?","b":"✅ Aumenta\nOssidazione = aumento del numero di ossidazione (perdita di elettroni); riduzione = diminuzione."},{"id":"mole-37","c":"mole","a":4,"t":"quiz","f":"Che cosa caratterizza una reazione redox?","b":"✅ Un trasferimento di elettroni, con variazione dei numeri di ossidazione\nNelle redox una specie cede elettroni (si ossida) e un'altra li acquista (si riduce); nelle reazioni non redox i numeri di ossidazione non cambiano."},{"id":"mole-38","c":"mole","a":4,"t":"quiz","f":"A quanto è uguale la somma dei numeri di ossidazione degli atomi di uno ione poliatomico?","b":"✅ Alla carica dello ione\nIn un composto neutro la somma è zero; in uno ione è uguale alla sua carica."},{"id":"mole-39","c":"mole","a":1,"t":"quiz","f":"Come si calcola la massa di una molecola?","b":"✅ Sommando le masse degli atomi che la compongono\nPer H₂O: 2 · 1,008 + 15,999 = 18,015 u."},{"id":"mole-40","c":"mole","a":1,"t":"quiz","f":"Che cos'è il difetto di massa?","b":"✅ La differenza tra la massa del nucleo e la somma delle masse dei nucleoni che lo formano\nIl nucleo pesa meno dei suoi nucleoni separati: la differenza corrisponde all'energia che serve per separarli (ΔE = Δm·c²)."},{"id":"mole-41","c":"mole","a":1,"t":"quiz","f":"Qual è la massa molare di Ba(OH)₂? (Ba = 137,33; O = 16,00; H = 1,01)","b":"✅ 171,35 g/mol\n137,33 + 2 · 16,00 + 2 · 1,01 = 171,35 g/mol: il pedice 2 vale per tutto il gruppo OH."},{"id":"mole-42","c":"mole","a":1,"t":"quiz","f":"Quanti grammi corrispondono a 1,667 mol di O₂ (M = 32,00 g/mol)?","b":"✅ 53,3 g\nm = n · M = 1,667 · 32,00 = 53,3 g. (26,7 g è l'errore di chi usa la massa atomica 16 invece di quella della molecola O₂.)"},{"id":"mole-43","c":"mole","a":1,"t":"quiz","f":"Quante moli sono contenute in 45 g di argento (M = 107,87 g/mol)?","b":"✅ 0,42 mol\nn = m / M = 45 / 107,87 = 0,42 mol."},{"id":"mole-44","c":"mole","a":4,"t":"quiz","f":"Qual è il numero di ossidazione del cromo in CrCl₃?","b":"✅ +3\nIl cloro vale −1: n + 3·(−1) = 0 → n = +3."},{"id":"mole-45","c":"mole","a":4,"t":"quiz","f":"Qual è il numero di ossidazione del cromo nello ione dicromato Cr₂O₇²⁻?","b":"✅ +6\n2n + 7·(−2) = −2 → 2n = +12 → n = +6. Attenzione: gli atomi di cromo sono due."},{"id":"mole-46","c":"mole","a":4,"t":"quiz","f":"Qual è il numero di ossidazione dell'ossigeno in H₂O₂?","b":"✅ −1\nÈ un perossido: ogni H vale +1, quindi per avere somma zero ogni O deve valere −1."},{"id":"mole-47","c":"mole","a":4,"t":"quiz","f":"Qual è il numero di ossidazione dell'idrogeno in NaH?","b":"✅ −1\nNegli idruri metallici l'idrogeno è presente come ione H⁻: il sodio (gruppo 1) vale sempre +1, quindi H vale −1."},{"id":"mole-48","c":"mole","a":3,"t":"quiz","f":"Quali coefficienti bilanciano __ N₂ + __ H₂ → __ NH₃ ?","b":"✅ 1, 3, 2\nN₂ + 3 H₂ → 2 NH₃: 2 atomi di N e 6 di H su entrambi i lati."},{"id":"mole-49","c":"mole","a":3,"t":"quiz","f":"Nella reazione H₂SO₄ + Ca(OH)₂ → CaSO₄ + __ H₂O, quante moli di acqua si formano?","b":"✅ 2\nL'acido cede 2 H⁺ e la base 2 OH⁻: si formano 2 H₂O. È una reazione acido-base (salificazione)."},{"id":"mole-50","c":"mole","a":2,"t":"quiz","f":"Qual è la formula empirica del glucosio, C₆H₁₂O₆?","b":"✅ CH₂O\nDividendo tutti i pedici per 6 si ottiene il rapporto minimo 1 : 2 : 1."},{"id":"mole-51","c":"mole","a":3,"t":"quiz","f":"Qual è l'equazione ionica netta di HNO₃(aq) + NaOH(aq) → NaNO₃(aq) + H₂O(l)?","b":"✅ H⁺ + OH⁻ → H₂O\nNa⁺ e NO₃⁻ compaiono identici tra reagenti e prodotti (ioni spettatori) e si cancellano: resta la formazione di acqua."},{"id":"mole-52","c":"mole","a":1,"t":"quiz","f":"Il carbonio naturale è formato per il 98,9% da ¹²C (12 u) e per l'1,1% da ¹³C (13 u). Qual è la massa atomica media?","b":"✅ 12,011 u\n12 · 0,989 + 13 · 0,011 = 11,868 + 0,143 = 12,011 u."},{"id":"mole-53","c":"mole","a":6,"t":"quiz","f":"Qual è la formula del cloruro di sodio?","b":"✅ NaCl\nI sali degli idracidi finiscono in -uro: Na⁺ e Cl⁻ si combinano 1 a 1, quindi NaCl."},{"id":"mole-54","c":"mole","a":6,"t":"quiz","f":"Che cosa si ottiene facendo reagire un ossido basico con l'acqua?","b":"✅ Un idrossido\nOssido basico + H₂O → idrossido (per esempio Na₂O + H₂O → 2 NaOH)."},{"id":"mole-55","c":"mole","a":6,"t":"quiz","f":"Qual è il nome di H₂SO₄?","b":"✅ Acido solforico\nLo zolfo ha numero di ossidazione +6 (il maggiore): suffisso -ico, acido solforico."},{"id":"mole-56","c":"mole","a":6,"t":"quiz","f":"Qual è il nome tradizionale di CO₂?","b":"✅ Anidride carbonica\nUn non metallo + ossigeno è un'anidride: CO₂ è l'anidride carbonica (IUPAC: diossido di carbonio)."},{"id":"mole-57","c":"mole","a":6,"t":"quiz","f":"Qual è il numero di ossidazione dell'ossigeno nei perossidi (come H₂O₂)?","b":"✅ −1\nNei perossidi c'è il gruppo O₂²⁻: ogni ossigeno vale −1."},{"id":"mole-58","c":"mole","a":6,"t":"quiz","f":"Da un acido con suffisso -ico si ottiene un sale con suffisso:","b":"✅ -ato\n-ico → -ato (acido nitrico → nitrato); -oso → -ito (acido nitroso → nitrito)."},{"id":"mole-59","c":"mole","a":6,"t":"quiz","f":"Qual è la formula dell'idrossido di calcio?","b":"✅ Ca(OH)₂\nCa ha carica 2+ e l'ione idrossido OH⁻ ha carica 1−: servono due OH, quindi Ca(OH)₂."},{"id":"mole-60","c":"mole","a":6,"t":"quiz","f":"Quale di questi composti è un idracido?","b":"✅ HCl\nGli idracidi sono H + non metallo, senza ossigeno: HCl è l'acido cloridrico."},{"id":"mole-61","c":"mole","a":6,"t":"quiz","f":"Qual è la formula dell'acido nitrico?","b":"✅ HNO₃\nAzoto con numero di ossidazione +5 (il maggiore): HNO₃. HNO₂ è l'acido nitroso."},{"id":"mole-62","c":"mole","a":6,"t":"quiz","f":"Come si chiama NaH?","b":"✅ Idruro di sodio\nMetallo + idrogeno con H = −1 è un idruro: NaH è l'idruro di sodio."},{"id":"mole-63","c":"mole","a":6,"t":"quiz","f":"Come si chiama Fe₂O₃ nella nomenclatura tradizionale?","b":"✅ Ossido ferrico\nFe₂O₃ contiene Fe³⁺ (la valenza maggiore): ossido ferrico, o ossido di ferro(III)."},{"id":"mole-64","c":"mole","a":6,"t":"quiz","f":"Come si chiama HClO₄?","b":"✅ Acido perclorico\nIl cloro ha numero di ossidazione +7, il massimo: prefisso per- e suffisso -ico."},{"id":"mole-65","c":"mole","a":6,"t":"quiz","f":"Come si chiama NaClO₂?","b":"✅ Clorito di sodio\nCl ha numero di ossidazione +3 (acido cloroso): il sale è un clorito."},{"id":"mole-66","c":"mole","a":6,"t":"quiz","f":"Come si chiama KHS?","b":"✅ Idrogenosolfuro (solfuro acido) di potassio\nDeriva dall'acido solfidrico H₂S con un solo H sostituito da K: è un sale acido, un solfuro acido."},{"id":"mole-67","c":"mole","a":6,"t":"quiz","f":"Qual è il prodotto di SO₃ + H₂O?","b":"✅ H₂SO₄\nUn'anidride più acqua dà l'ossiacido: SO₃ (S +6) → H₂SO₄."},{"id":"mole-68","c":"mole","a":6,"t":"quiz","f":"Come si chiama NaHCO₃?","b":"✅ Idrogenocarbonato (bicarbonato) di sodio\nÈ il sale acido dell'acido carbonico: un solo H è stato sostituito da Na."},{"id":"mole-69","c":"mole","a":6,"t":"quiz","f":"Qual è la formula del solfato di alluminio?","b":"✅ Al₂(SO₄)₃\nAl³⁺ e SO₄²⁻: con la regola dell'incrocio si ottiene Al₂(SO₄)₃ (2·3 = 3·2)."},{"id":"mole-70","c":"mole","a":6,"t":"quiz","f":"Come si chiama N₂O₅ nella nomenclatura tradizionale?","b":"✅ Anidride nitrica\nN ha numero di ossidazione +5: anidride nitrica (IUPAC: pentossido di diazoto)."},{"id":"mole-71","c":"mole","a":6,"t":"quiz","f":"Qual è la formula del perossido di idrogeno (acqua ossigenata)?","b":"✅ H₂O₂\nContiene il gruppo O₂²⁻ (O = −1): H₂O₂."},{"id":"mole-72","c":"mole","a":1,"t":"quiz","f":"Quante moli sono contenute in 36 g di H₂O? (M = 18,02 g/mol)","b":"✅ 2 mol\nn = m / M = 36 / 18,02 ≈ 2,0 mol."},{"id":"mole-73","c":"mole","a":1,"t":"quiz","f":"Qual è il valore del numero di Avogadro?","b":"✅ 6,022·10²³ mol⁻¹\nNₐ = 6,022·10²³ mol⁻¹: è il numero di particelle contenute in una mole."},{"id":"mole-74","c":"mole","a":1,"t":"quiz","f":"Quante molecole ci sono in 0,5 mol di CO₂?","b":"✅ 3,01·10²³\nN = n · Nₐ = 0,5 · 6,022·10²³ = 3,01·10²³ molecole."},{"id":"mole-75","c":"mole","a":1,"t":"calcolo","f":"Qual è la massa di 5 mol di NH₃? (massa molare 17,03 g/mol)","b":"m = n · M\nm = 5 mol · 17,03 g/mol = 85,2 g"},{"id":"mole-76","c":"mole","a":1,"t":"calcolo","f":"Qual è la massa di 5 mol di H₂O? (massa molare 18,02 g/mol)","b":"m = n · M\nm = 5 mol · 18,02 g/mol = 90,1 g"},{"id":"mole-77","c":"mole","a":0,"t":"calcolo","f":"Quante molecole di CH₄ sono contenute in 2,0 mol di CH₄? (Nₐ = 6,022·10²³ mol⁻¹)","b":"N = n · Nₐ = 2,0 · 6,022·10²³\nN = 12,044·10²³ molecole"},{"id":"mole-78","c":"mole","a":0,"t":"calcolo","f":"Quante molecole di NH₃ sono contenute in 3,0 mol di NH₃? (Nₐ = 6,022·10²³ mol⁻¹)","b":"N = n · Nₐ = 3,0 · 6,022·10²³\nN = 18,066·10²³ molecole"},{"id":"mole-79","c":"mole","a":3,"t":"calcolo","f":"Nella reazione A + B → C reagiscono completamente 8 g di A e 11 g di B. Quanti grammi di C si ottengono?","b":"Conservazione della massa: m(C) = m(A) + m(B)\nm(C) = 8 g + 11 g = 19 g"},{"id":"mole-80","c":"mole","a":3,"t":"calcolo","f":"Nella reazione A + B → C reagiscono completamente 18 g di A e 13 g di B. Quanti grammi di C si ottengono?","b":"Conservazione della massa: m(C) = m(A) + m(B)\nm(C) = 18 g + 13 g = 31 g"},{"id":"mole-81","c":"mole","a":1,"t":"calcolo","f":"Quante moli sono contenute in 48 g di H₂O (M = 18,02 g/mol)?","b":"n = m / M = 48 g / 18,02 g/mol\nn = 2,66 mol"},{"id":"mole-82","c":"mole","a":1,"t":"calcolo","f":"Quante moli sono contenute in 22 g di H₂SO₄ (M = 98,08 g/mol)?","b":"n = m / M = 22 g / 98,08 g/mol\nn = 0,22 mol"},{"id":"mole-83","c":"mole","a":3,"t":"calcolo","f":"Bilancia la reazione N₂ + H₂ → NH₃. Quali sono i coefficienti stechiometrici, nell'ordine in cui compaiono?","b":"Coefficienti: 1, 3, 2\nEquazione bilanciata: N₂ + 3 H₂ → 2 NH₃"},{"id":"mole-84","c":"mole","a":3,"t":"calcolo","f":"Bilancia la reazione Al + O₂ → Al₂O₃. Quali sono i coefficienti stechiometrici, nell'ordine in cui compaiono?","b":"Coefficienti: 4, 3, 2\nEquazione bilanciata: 4 Al + 3 O₂ → 2 Al₂O₃"},{"id":"mole-85","c":"mole","a":2,"t":"calcolo","f":"Un composto contiene il 92.3 % in massa di C e il 7.7 % di H. Qual è la sua formula empirica? (C = 12, H = 1)","b":"n(C) = 92,3 / 12 = 7,69 mol; n(H) = 7,7 / 1 = 7,70 mol\nRapporto C : H = 1,00 : 1,00 → formula empirica CH"},{"id":"mole-86","c":"mole","a":2,"t":"calcolo","f":"Un composto contiene il 80 % in massa di C e il 20 % di H. Qual è la sua formula empirica? (C = 12, H = 1)","b":"n(C) = 80,0 / 12 = 6,67 mol; n(H) = 20,0 / 1 = 20,00 mol\nRapporto C : H = 1,00 : 3,00 → formula empirica CH₃"},{"id":"orbitali-0","c":"orbitali","a":0,"t":"concetto","f":"Che cosa devi sapere su «La luce: onde elettromagnetiche e quanti»?","b":"La luce è una radiazione elettromagnetica, formata da un campo elettrico e uno magnetico che oscillano perpendicolarmente. Tutte le onde elettromagnetiche viaggiano nel vuoto alla stessa velocità, c = 3,00·10⁸ m/s."},{"id":"orbitali-1","c":"orbitali","a":0,"t":"concetto","f":"In parole semplici: «La luce: onde elettromagnetiche e quanti»","b":"Pensa alla luce come a una pioggia di palline (i fotoni). Il colore decide quanto è «pesante» ogni pallina, l'intensità quante ne arrivano. Per staccare un elettrone serve una pallina abbastanza pesante: mille palline leggere (luce rossa intensa) non ci riescono, una sola pesante (luce blu) sì."},{"id":"orbitali-2","c":"orbitali","a":0,"t":"definizione","f":"Come definisci «La luce»?","b":"La luce è una radiazione elettromagnetica, formata da un campo elettrico e uno magnetico che oscillano perpendicolarmente."},{"id":"orbitali-3","c":"orbitali","a":0,"t":"definizione","f":"Come definisci «L'ampiezza»?","b":"L'ampiezza è l'altezza dell'onda e misura l'intensità (luminosità); la lunghezza d'onda λ è la distanza tra due creste successive; la frequenza ν è il numero di onde che passano in un punto nell'unità di tempo (hertz, 1 Hz = 1 s⁻¹)."},{"id":"orbitali-4","c":"orbitali","a":1,"t":"concetto","f":"Che cosa devi sapere su «Spettri atomici e modello di Bohr»?","b":"Quando atomi o molecole assorbono energia, spesso la riemettono sotto forma di luce (fuochi d'artificio, luci al neon). Facendo passare questa luce attraverso un prisma si ottiene uno spettro di emissione non continuo, a righe, caratteristico di ogni elemento: può essere usato per riconoscerlo (saggi alla fiamma)."},{"id":"orbitali-5","c":"orbitali","a":1,"t":"concetto","f":"In parole semplici: «Spettri atomici e modello di Bohr»","b":"L'elettrone di Bohr è come una persona su una scala: può stare su un gradino o su un altro, mai a metà. Scendendo di un gradino libera un pacchetto di energia (un fotone) esattamente pari al dislivello. Poiché i gradini sono fissi, anche i colori emessi sono sempre gli stessi: ecco le righe."},{"id":"orbitali-6","c":"orbitali","a":1,"t":"definizione","f":"Come definisci «L'energia»?","b":"L'energia è negativa perché l'elettrone è legato (E = 0 per n = ∞, elettrone libero): il livello più basso è n = 1 (stato fondamentale)."},{"id":"orbitali-7","c":"orbitali","a":1,"t":"definizione","f":"Come definisci «L'energia di ionizzazione dell'idrogeno»?","b":"L'energia di ionizzazione dell'idrogeno è l'energia per portare l'elettrone da n = 1 a n = ∞: 2,18·10⁻¹⁸ J."},{"id":"orbitali-8","c":"orbitali","a":2,"t":"concetto","f":"Che cosa devi sapere su «Dualismo onda-particella, Heisenberg e Schrödinger»?","b":"Le onde, quando incontrano una fenditura di dimensioni simili alla loro lunghezza d'onda, la aggirano (diffrazione) e si sovrappongono dando interferenza: costruttiva se sono in fase, distruttiva se sono in opposizione di fase. Le particelle, in senso classico, non diffrangono."},{"id":"orbitali-9","c":"orbitali","a":2,"t":"concetto","f":"In parole semplici: «Dualismo onda-particella, Heisenberg e Schrödinger»","b":"Non possiamo «fotografare» un elettrone lungo un'orbita: osservarlo ne cambia il comportamento. Al posto di una traiettoria abbiamo una mappa di probabilità, come una mappa meteo che non dice dove cadrà la singola goccia ma dove è più probabile che piova. Quella mappa è l'orbitale."},{"id":"orbitali-10","c":"orbitali","a":2,"t":"definizione","f":"Come definisci «I nodi»?","b":"I nodi sono i punti in cui la probabilità si annulla."},{"id":"orbitali-11","c":"orbitali","a":2,"t":"definizione","f":"Come definisci «L'atomo di idrogeno»?","b":"L'atomo di idrogeno è l'unico per cui l'equazione si risolve esattamente."},{"id":"orbitali-12","c":"orbitali","a":2,"t":"definizione","f":"Come definisci «Più la massa»?","b":"Più la massa è grande, più la lunghezza d'onda è piccola: per un oggetto macroscopico (una palla) λ è inconcepibilmente piccola e non si osserva, per un elettrone o un neutrone sì."},{"id":"orbitali-13","c":"orbitali","a":3,"t":"concetto","f":"Che cosa devi sapere su «Numeri quantici e forma degli orbitali»?","b":"Le soluzioni dell'equazione di Schrödinger sono tridimensionali e caratterizzate da tre numeri quantici; le funzioni d'onda degli elettroni negli atomi si chiamano orbitali atomici. Un orbitale è la regione di spazio fuori dalla quale la probabilità di trovare l'elettrone è trascurabile."},{"id":"orbitali-14","c":"orbitali","a":3,"t":"concetto","f":"In parole semplici: «Numeri quantici e forma degli orbitali»","b":"I numeri quantici sono l'indirizzo dell'elettrone: n è il piano del palazzo (più in alto, più energia), l è il tipo di appartamento (la forma), ml è l'orientamento dell'appartamento, ms dice quale dei due letti occupa. Ogni «indirizzo completo» può appartenere a un solo elettrone."},{"id":"orbitali-15","c":"orbitali","a":3,"t":"definizione","f":"Come definisci «Le soluzioni dell'equazione di Schrödinger»?","b":"Le soluzioni dell'equazione di Schrödinger sono tridimensionali e caratterizzate da tre numeri quantici; le funzioni d'onda degli elettroni negli atomi si chiamano orbitali atomici."},{"id":"orbitali-16","c":"orbitali","a":3,"t":"definizione","f":"Come definisci «Un orbitale»?","b":"Un orbitale è la regione di spazio fuori dalla quale la probabilità di trovare l'elettrone è trascurabile."},{"id":"orbitali-17","c":"orbitali","a":3,"t":"definizione","f":"Come definisci «Le energie dei livelli dell'idrogeno»?","b":"Le energie dei livelli dell'idrogeno sono Eₙ = −2,18·10⁻¹⁸ J / n²."},{"id":"orbitali-18","c":"orbitali","a":4,"t":"concetto","f":"Che cosa devi sapere su «Configurazione elettronica»?","b":"La configurazione elettronica indica come gli elettroni sono distribuiti negli orbitali, seguendo il principio generale della minima energia. Ogni orbitale ospita al massimo due elettroni; il livello n può contenerne al massimo 2n² (2, 8, 18, 32)."},{"id":"orbitali-19","c":"orbitali","a":4,"t":"concetto","f":"In parole semplici: «Configurazione elettronica»","b":"Riempire gli orbitali è come far sedere i passeggeri su un autobus: si occupano prima le file davanti (energia più bassa); ogni sedile doppio tiene al massimo due persone «rivolte in versi opposti» (Pauli); e finché ci sono sedili doppi liberi nella stessa fila, ognuno si siede da solo prima di fare coppia (Hund)."},{"id":"orbitali-20","c":"orbitali","a":4,"t":"definizione","f":"Come definisci «La configurazione elettronica»?","b":"La configurazione elettronica indica come gli elettroni sono distribuiti negli orbitali, seguendo il principio generale della minima energia."},{"id":"orbitali-21","c":"orbitali","a":4,"t":"definizione","f":"Come definisci «Configurazione abbreviata:»?","b":"Configurazione abbreviata: si indica con il simbolo del gas nobile precedente ([He], [Ne], [Ar], [Kr], [Xe]) e si scrive solo la parte che segue: P (Z = 15) = [Ne] 3s² 3p³; Zn (Z = 30) = [Ar] 3d¹⁰ 4s²; Fe (Z = 26) = [Ar] 3d⁶ 4s²."},{"id":"orbitali-22","c":"orbitali","a":4,"t":"definizione","f":"Come definisci «Eccezioni da ricordare: il cromo»?","b":"Eccezioni da ricordare: il cromo è [Ar] 3d⁵ 4s¹ e il rame [Ar] 3d¹⁰ 4s¹ (sottolivello d pieno o semipieno più stabile)."},{"id":"orbitali-23","c":"orbitali","a":5,"t":"concetto","f":"Che cosa devi sapere su «Elettroni di valenza, simboli di Lewis e ioni»?","b":"La tavola periodica si può dividere in blocchi a seconda del tipo di orbitali di valenza."},{"id":"orbitali-24","c":"orbitali","a":5,"t":"concetto","f":"In parole semplici: «Elettroni di valenza, simboli di Lewis e ioni»","b":"Gli elettroni di valenza sono quelli «di frontiera»: gli unici che incontrano gli altri atomi, quindi gli unici che decidono la chimica dell'elemento. Per questo elementi della stessa colonna, che hanno la stessa frontiera, si comportano in modo simile."},{"id":"orbitali-25","c":"orbitali","a":6,"t":"concetto","f":"Che cosa devi sapere su «Tabella dei numeri quantici: valori e orbitali corrispondenti»?","b":"Riepilogo operativo. n (principale) = 1, 2, 3, 4… (livello: energia e dimensione). l (momento angolare, forma) = 0, 1, …, n−1: l = 0 → s, l = 1 → p, l = 2 → d, l = 3 → f. ml (magnetico, orientazione) = −l, …, 0, …, +l: sono 2l+1 valori, cioè 2l+1 orbitali nel sottolivello (1 orbitale s, 3 p, 5 d, 7 f). ms (spin) = +½ oppure −½."},{"id":"orbitali-26","c":"orbitali","a":6,"t":"concetto","f":"In parole semplici: «Tabella dei numeri quantici: valori e orbitali corrispondenti»","b":"Per scoprire quale orbitale indica una terna (n, l, ml): n dà il numero davanti, l dà la lettera (0 s, 1 p, 2 d, 3 f), e ml dice solo quale degli orbitali di quel sottolivello è (px, py, pz per i p). Per controllare se una terna è permessa si verifica in ordine: l ≤ n−1 e poi |ml| ≤ l."},{"id":"orbitali-27","c":"orbitali","a":6,"t":"definizione","f":"Come definisci «Il numero di nodi totali di un orbitale»?","b":"Il numero di nodi totali di un orbitale è n−1: l nodi angolari e n−l−1 nodi radiali."},{"id":"orbitali-28","c":"orbitali","a":0,"t":"quiz","f":"Che cos'è la lunghezza d'onda λ?","b":"✅ La distanza tra due creste successive dell'onda\nλ misura la distanza coperta da un'oscillazione completa. L'altezza è l'ampiezza, il numero di onde al secondo è la frequenza."},{"id":"orbitali-29","c":"orbitali","a":0,"t":"quiz","f":"Che cos'è la frequenza ν di un'onda?","b":"✅ Il numero di onde che passano in un punto nell'unità di tempo\nLa frequenza si misura in hertz (1 Hz = 1 s⁻¹) ed è legata alla lunghezza d'onda da c = λ·ν."},{"id":"orbitali-30","c":"orbitali","a":0,"t":"quiz","f":"Quale relazione, introdotta da Planck, lega l'energia di un quanto alla frequenza?","b":"✅ E = h·ν\nL'energia è scambiata in quanti proporzionali alla frequenza; h = 6,626·10⁻³⁴ J·s è la costante di Planck."},{"id":"orbitali-31","c":"orbitali","a":0,"t":"quiz","f":"Che cos'è un fotone?","b":"✅ Un pacchetto (quanto) di energia luminosa\nEinstein propose che la luce ceda energia agli atomi in pacchetti discreti, i fotoni, ciascuno di energia hν."},{"id":"orbitali-32","c":"orbitali","a":1,"t":"quiz","f":"Secondo Bohr, gli elettroni nell'atomo:","b":"✅ Possono avere solo valori ben precisi (quantizzati) di energia\nNel modello di Bohr gli elettroni si muovono su orbite a distanza fissa dal nucleo (stati stazionari), ciascuna con un'energia definita."},{"id":"orbitali-33","c":"orbitali","a":2,"t":"quiz","f":"Che cosa afferma il principio di indeterminazione di Heisenberg?","b":"✅ Non si possono conoscere con precisione, insieme, posizione e velocità di una particella\nPiù accuratamente si conosce la posizione di un elettrone, meno si conosce la sua velocità, e viceversa."},{"id":"orbitali-34","c":"orbitali","a":2,"t":"quiz","f":"Che cosa rappresenta il quadrato della funzione d'onda, ψ²?","b":"✅ La densità di probabilità di trovare l'elettrone in un punto\nψ non ha un significato fisico diretto; ψ² indica dove è più o meno probabile trovare l'elettrone."},{"id":"orbitali-35","c":"orbitali","a":3,"t":"quiz","f":"Che cosa determina il numero quantico principale n?","b":"✅ L'energia e la dimensione dell'orbitale\nPiù grande è n, maggiori sono l'energia e le dimensioni dell'orbitale."},{"id":"orbitali-36","c":"orbitali","a":3,"t":"quiz","f":"Che cosa determina il numero quantico l?","b":"✅ La forma dell'orbitale\nl = 0, 1, 2, 3 corrispondono agli orbitali s, p, d, f, che hanno forme diverse."},{"id":"orbitali-37","c":"orbitali","a":4,"t":"quiz","f":"Che cosa afferma il principio di Pauli?","b":"✅ Un orbitale può ospitare al massimo due elettroni, con spin opposto\nDue elettroni nello stesso orbitale devono avere spin opposto (ms = +½ e −½)."},{"id":"orbitali-38","c":"orbitali","a":4,"t":"quiz","f":"Che cosa afferma la regola di Hund?","b":"✅ È favorita la configurazione con il massimo numero di elettroni spaiati\nNegli orbitali di uguale energia gli elettroni si dispongono prima uno per orbitale, con spin paralleli, e solo dopo si appaiano."},{"id":"orbitali-39","c":"orbitali","a":3,"t":"quiz","f":"Quali valori può assumere il numero quantico di spin ms?","b":"✅ +½ e −½\nLo spin ha solo due orientazioni possibili («su» e «giù»)."},{"id":"orbitali-40","c":"orbitali","a":3,"t":"quiz","f":"Per n = 3, quali valori può assumere l?","b":"✅ 0, 1, 2\nl va da 0 a n − 1: per n = 3 si hanno i sottolivelli 3s, 3p e 3d."},{"id":"orbitali-41","c":"orbitali","a":3,"t":"quiz","f":"Quanti orbitali d esistono in un livello che li possiede?","b":"✅ 5\nPer l = 2, ml assume i valori −2, −1, 0, +1, +2: cinque orbitali (che ospitano fino a 10 elettroni)."},{"id":"orbitali-42","c":"orbitali","a":4,"t":"quiz","f":"Quanti elettroni può contenere al massimo il livello n = 3?","b":"✅ 18\nIl numero massimo è 2n² = 2 · 9 = 18."},{"id":"orbitali-43","c":"orbitali","a":4,"t":"quiz","f":"Qual è la configurazione elettronica del magnesio (Z = 12)?","b":"✅ 1s² 2s² 2p⁶ 3s²\n12 elettroni disposti in ordine di energia crescente: [Ne] 3s². Il sottolivello 2p contiene al massimo 6 elettroni."},{"id":"orbitali-44","c":"orbitali","a":4,"t":"quiz","f":"Quanti elettroni spaiati ha l'atomo di azoto (Z = 7) nello stato fondamentale?","b":"✅ 3\nConfigurazione 1s² 2s² 2p³: per la regola di Hund i tre elettroni 2p occupano tre orbitali diversi."},{"id":"orbitali-45","c":"orbitali","a":0,"t":"quiz","f":"Qual è la frequenza di una luce con λ = 500 nm? (c = 3,00·10⁸ m/s)","b":"✅ 6,0·10¹⁴ Hz\nν = c / λ = 3,00·10⁸ / 5,00·10⁻⁷ = 6,0·10¹⁴ Hz. Attenzione a convertire i nanometri in metri."},{"id":"orbitali-46","c":"orbitali","a":0,"t":"quiz","f":"Quale di queste radiazioni ha l'energia più alta?","b":"✅ Raggi gamma\nMinore è la lunghezza d'onda, maggiori sono frequenza ed energia: i raggi gamma sono all'estremo ad alta energia dello spettro."},{"id":"orbitali-47","c":"orbitali","a":3,"t":"quiz","f":"Quale forma hanno gli orbitali s e p?","b":"✅ s sferica, p a due lobi\nGli orbitali s sono sferici; i tre orbitali p hanno due lobi e sono orientati lungo gli assi x, y, z."},{"id":"orbitali-48","c":"orbitali","a":4,"t":"quiz","f":"Qual è la configurazione elettronica dell'alluminio (Z = 13)?","b":"✅ [Ne] 3s² 3p¹\nDopo i 10 elettroni del neon, due vanno in 3s e uno in 3p."},{"id":"orbitali-49","c":"orbitali","a":1,"t":"quiz","f":"Nel modello di Bohr, quando un atomo emette un fotone?","b":"✅ Quando un elettrone passa da un'orbita a energia maggiore a una a energia minore\nScendendo di livello l'elettrone libera la differenza di energia come fotone (E₂ − E₁ = hν); salendo, lo assorbe."},{"id":"orbitali-50","c":"orbitali","a":5,"t":"quiz","f":"Quanti elettroni di valenza ha l'ossigeno (1s² 2s² 2p⁴)?","b":"✅ 6\nGli elettroni del livello più esterno (n = 2) sono 2 + 4 = 6."},{"id":"orbitali-51","c":"orbitali","a":3,"t":"quiz","f":"Quale di queste combinazioni di numeri quantici NON è permessa?","b":"✅ n = 2, l = 2, ml = 0\nl può valere al massimo n − 1: per n = 2 sono ammessi solo l = 0 e l = 1 (non esiste l'orbitale 2d)."},{"id":"orbitali-52","c":"orbitali","a":6,"t":"quiz","f":"Per l = 1, quanti valori può assumere ml?","b":"✅ 3\nml va da −l a +l: −1, 0, +1, cioè 2l + 1 = 3 valori (i tre orbitali p)."},{"id":"orbitali-53","c":"orbitali","a":6,"t":"quiz","f":"A quale tipo di orbitale corrisponde l = 2?","b":"✅ Orbitale d\nl = 0 s, l = 1 p, l = 2 d, l = 3 f."},{"id":"orbitali-54","c":"orbitali","a":6,"t":"quiz","f":"Quali sottolivelli esistono nel livello n = 2?","b":"✅ 2s e 2p\nl va da 0 a n−1 = 1: 2s (l = 0) e 2p (l = 1)."},{"id":"orbitali-55","c":"orbitali","a":6,"t":"quiz","f":"Quanti orbitali contiene un sottolivello p?","b":"✅ 3\nPer l = 1 ci sono 3 valori di ml: px, py e pz."},{"id":"orbitali-56","c":"orbitali","a":6,"t":"quiz","f":"Quanti elettroni può contenere al massimo un sottolivello d?","b":"✅ 10\nUn sottolivello d ha 5 orbitali da 2 elettroni ciascuno: 10."},{"id":"orbitali-57","c":"orbitali","a":6,"t":"quiz","f":"A quale orbitale corrispondono n = 1, l = 0, ml = 0?","b":"✅ 1s\nn = 1 dà il numero e l = 0 la lettera s: orbitale 1s."},{"id":"orbitali-58","c":"orbitali","a":6,"t":"quiz","f":"A quale orbitale corrispondono n = 3, l = 1, ml = 0?","b":"✅ 3p\nn = 3, l = 1 è un sottolivello 3p; ml = 0 è uno dei suoi tre orbitali."},{"id":"orbitali-59","c":"orbitali","a":6,"t":"quiz","f":"Quanti orbitali ci sono in totale nel livello n = 3?","b":"✅ 9\n1 (3s) + 3 (3p) + 5 (3d) = 9 = n²."},{"id":"orbitali-60","c":"orbitali","a":6,"t":"quiz","f":"Quanti elettroni può contenere al massimo il livello n = 4?","b":"✅ 32\nIl livello n contiene al massimo 2n² elettroni: 2 · 16 = 32."},{"id":"orbitali-61","c":"orbitali","a":6,"t":"quiz","f":"Quale di queste combinazioni (n, l, ml) NON è permessa?","b":"✅ n = 2, l = 2, ml = 0\nPer n = 2 il valore massimo di l è 1: l = 2 non è permesso (non esiste il sottolivello 2d)."},{"id":"orbitali-62","c":"orbitali","a":6,"t":"quiz","f":"Quale terna (n, l, ml) descrive un orbitale 4d?","b":"✅ n = 4, l = 2, ml = +1\n4d: n = 4 e l = 2 (lettera d); ml può valere −2, …, +2."},{"id":"orbitali-63","c":"orbitali","a":6,"t":"quiz","f":"Quale di questi sottolivelli NON esiste?","b":"✅ 2d\nIl sottolivello d richiede l = 2, quindi n ≥ 3: il 2d non esiste."},{"id":"orbitali-64","c":"orbitali","a":6,"t":"quiz","f":"Qual è il massimo valore di ml in un orbitale 4f?","b":"✅ +3\nPer un f è l = 3: ml va da −3 a +3."},{"id":"orbitali-65","c":"orbitali","a":6,"t":"quiz","f":"Quanti numeri quantici servono per identificare completamente un elettrone in un atomo?","b":"✅ 4\nn, l, ml e ms: due elettroni non possono avere gli stessi quattro valori (principio di Pauli)."},{"id":"orbitali-66","c":"orbitali","a":6,"t":"quiz","f":"Quanti elettroni possono avere i numeri quantici n = 3 e l = 2?","b":"✅ 10\nSono gli elettroni del sottolivello 3d: 5 orbitali, 2 elettroni ciascuno."},{"id":"orbitali-67","c":"orbitali","a":6,"t":"quiz","f":"Quali valori di n e l descrivono un orbitale 5p?","b":"✅ n = 5, l = 1\n5 è il numero del livello (n) e p corrisponde a l = 1."},{"id":"orbitali-68","c":"orbitali","a":0,"t":"calcolo","f":"Calcola la frequenza di una luce con lunghezza d'onda 650 nm (c = 3,00·10⁸ m/s). Esprimi il risultato in 10¹⁴ Hz.","b":"ν = c / λ = 3,00·10⁸ m/s / (650·10⁻⁹ m)\nν = 4,62·10¹⁴ Hz"},{"id":"orbitali-69","c":"orbitali","a":0,"t":"calcolo","f":"Calcola la frequenza di una luce con lunghezza d'onda 450 nm (c = 3,00·10⁸ m/s). Esprimi il risultato in 10¹⁴ Hz.","b":"ν = c / λ = 3,00·10⁸ m/s / (450·10⁻⁹ m)\nν = 6,67·10¹⁴ Hz"},{"id":"orbitali-70","c":"orbitali","a":4,"t":"calcolo","f":"Scrivi la configurazione elettronica abbreviata (con il gas nobile) dell'elemento Al (Z = 13).","b":"Z = 13 → 13 elettroni\nConfigurazione: [Ne] 3s² 3p¹"},{"id":"orbitali-71","c":"orbitali","a":4,"t":"calcolo","f":"Scrivi la configurazione elettronica abbreviata (con il gas nobile) dell'elemento K (Z = 19).","b":"Z = 19 → 19 elettroni\nConfigurazione: [Ar] 4s¹"},{"id":"orbitali-72","c":"orbitali","a":3,"t":"calcolo","f":"Quanti elettroni può contenere al massimo il livello n = 5?","b":"Massimo = 2n² = 2 · 5² = 50 elettroni"},{"id":"orbitali-73","c":"orbitali","a":3,"t":"calcolo","f":"Quanti elettroni può contenere al massimo il livello n = 5?","b":"Massimo = 2n² = 2 · 5² = 50 elettroni"},{"id":"orbitali-74","c":"orbitali","a":1,"t":"calcolo","f":"Un atomo di idrogeno passa dal livello n = 4 al livello n = 3 emettendo un fotone. Calcola la lunghezza d'onda del fotone (Eₙ = −2,18·10⁻¹⁸/n² J).","b":"ΔE = 2,18·10⁻¹⁸ · |1/3² − 1/4²| = 1,06·10⁻¹⁹ J\nλ = h·c / ΔE ≈ 1875 nm"},{"id":"orbitali-75","c":"orbitali","a":1,"t":"calcolo","f":"Un atomo di idrogeno passa dal livello n = 4 al livello n = 2 emettendo un fotone. Calcola la lunghezza d'onda del fotone (Eₙ = −2,18·10⁻¹⁸/n² J).","b":"ΔE = 2,18·10⁻¹⁸ · |1/2² − 1/4²| = 4,09·10⁻¹⁹ J\nλ = h·c / ΔE ≈ 486 nm"},{"id":"orbitali-76","c":"orbitali","a":4,"t":"calcolo","f":"Quanti elettroni ha lo ione Cl⁻ (Z = 17) e a quale gas nobile è isoelettronico?","b":"e = Z − carica = 17 − (-1) = 18\nConfigurazione isoelettronica con [Ar]"},{"id":"orbitali-77","c":"orbitali","a":4,"t":"calcolo","f":"Quanti elettroni ha lo ione Ca²⁺ (Z = 20) e a quale gas nobile è isoelettronico?","b":"e = Z − carica = 20 − (2) = 18\nConfigurazione isoelettronica con [Ar]"},{"id":"orbitali-78","c":"orbitali","a":2,"t":"calcolo","f":"Calcola la lunghezza d'onda di de Broglie di un elettrone (m = 9,11·10⁻³¹ kg) che viaggia a 3·10⁶ m/s. Esprimi il risultato in 10⁻¹⁰ m.","b":"λ = h / (m·v) = 6,63·10⁻³⁴ / (9,11·10⁻³¹ · 3·10⁶)\nλ = 2,42·10⁻¹⁰ m"},{"id":"orbitali-79","c":"orbitali","a":2,"t":"calcolo","f":"Calcola la lunghezza d'onda di de Broglie di un elettrone (m = 9,11·10⁻³¹ kg) che viaggia a 3·10⁶ m/s. Esprimi il risultato in 10⁻¹⁰ m.","b":"λ = h / (m·v) = 6,63·10⁻³⁴ / (9,11·10⁻³¹ · 3·10⁶)\nλ = 2,42·10⁻¹⁰ m"},{"id":"tavola-0","c":"tavola","a":0,"t":"concetto","f":"Che cosa devi sapere su «Legge periodica e struttura della tavola»?","b":"La legge periodica (1869, Mendeleev in Russia e Meyer in Germania) afferma che, ordinando gli elementi per massa atomica crescente, alcune proprietà variano periodicamente. Mendeleev raggruppò i 66 elementi allora noti in base alle proprietà e previde quelle di elementi non ancora scoperti, come gallio e germanio."},{"id":"tavola-1","c":"tavola","a":0,"t":"concetto","f":"In parole semplici: «Legge periodica e struttura della tavola»","b":"La tavola periodica è un calendario: le righe sono le settimane, le colonne i giorni. Tutti i lunedì si somigliano anche se appartengono a settimane diverse. Allo stesso modo litio, sodio e potassio si somigliano perché hanno tutti un solo elettrone esterno, anche se in gusci diversi."},{"id":"tavola-2","c":"tavola","a":0,"t":"definizione","f":"Come definisci «La tavola»?","b":"La tavola è divisa in colonne (gruppi) e righe (periodi): le proprietà chimiche degli elementi di un gruppo sono simili, quelle degli elementi di un periodo cambiano progressivamente."},{"id":"tavola-3","c":"tavola","a":1,"t":"concetto","f":"Che cosa devi sapere su «Configurazione elettronica e carica degli ioni»?","b":"Il numero di elettroni di valenza determina in larga parte il comportamento chimico (e in parte fisico) di un elemento; poiché questo numero segue un andamento periodico, anche le proprietà sono periodiche. Otto elettroni di valenza danno un atomo molto stabile: i gas nobili sono infatti poco reattivi."},{"id":"tavola-4","c":"tavola","a":1,"t":"concetto","f":"In parole semplici: «Configurazione elettronica e carica degli ioni»","b":"Ogni atomo «punta» alla configurazione del gas nobile più vicino e sceglie la strada più corta: chi ha uno o due elettroni esterni li perde, chi ne ha sei o sette ne acquista due o uno. Dal numero del gruppo si legge quindi direttamente la carica dello ione."},{"id":"tavola-5","c":"tavola","a":1,"t":"definizione","f":"Come definisci «Specie isoelettroniche»?","b":"Specie isoelettroniche sono atomi o ioni con lo stesso numero di elettroni (per uno ione: Z meno la carica, oppure Z più la carica negativa): Kr ha 36 elettroni, come Br⁻ (35 + 1), Rb⁺ (37 − 1), Sr²⁺ (38 − 2) e Y³⁺ (39 − 3)."},{"id":"tavola-6","c":"tavola","a":2,"t":"concetto","f":"Che cosa devi sapere su «Raggio atomico e raggio ionico»?","b":"Il raggio di un atomo si può misurare in modi diversi (raggio di van der Waals, non legante; raggio covalente, di legame); il raggio atomico è una media. 100 pm = 0,1 nm = 1 Å."},{"id":"tavola-7","c":"tavola","a":2,"t":"concetto","f":"In parole semplici: «Raggio atomico e raggio ionico»","b":"Scendendo in un gruppo si aggiunge un «piano» all'edificio: l'atomo cresce. Andando verso destra nel periodo, invece, i piani restano gli stessi ma il nucleo tira sempre più forte, come una calamita più potente che stringe la stessa nuvola di elettroni: l'atomo si restringe."},{"id":"tavola-8","c":"tavola","a":2,"t":"definizione","f":"Come definisci «I cationi»?","b":"I cationi sono più piccoli dell'atomo di partenza (si rimuove l'elettrone più esterno e le repulsioni diminuiscono): maggiore è la carica positiva, più piccolo è il catione."},{"id":"tavola-9","c":"tavola","a":2,"t":"definizione","f":"Come definisci «Gli anioni»?","b":"Gli anioni sono più grandi dell'atomo di partenza (si aggiungono elettroni e le repulsioni aumentano): maggiore è la carica negativa, più grande è l'anione."},{"id":"tavola-10","c":"tavola","a":3,"t":"concetto","f":"Che cosa devi sapere su «Energia di ionizzazione e affinità elettronica»?","b":"L'energia di ionizzazione (EI) è l'energia minima necessaria per rimuovere un elettrone da un atomo allo stato gassoso; è un processo endotermico. La prima EI riguarda l'atomo neutro, la seconda lo ione +1, e così via."},{"id":"tavola-11","c":"tavola","a":3,"t":"concetto","f":"In parole semplici: «Energia di ionizzazione e affinità elettronica»","b":"L'energia di ionizzazione è il «prezzo» da pagare per portare via un elettrone: costa poco se l'elettrone è lontano e poco trattenuto (in basso a sinistra nella tavola), molto se è vicino e ben trattenuto (in alto a destra). L'affinità elettronica è invece il «premio» che l'atomo riceve quando accetta un elettrone: gli alogeni, a cui ne manca uno solo, incassano il premio più alto."},{"id":"tavola-12","c":"tavola","a":3,"t":"definizione","f":"Come definisci «L'energia di ionizzazione (EI)»?","b":"L'energia di ionizzazione (EI) è l'energia minima necessaria per rimuovere un elettrone da un atomo allo stato gassoso; è un processo endotermico."},{"id":"tavola-13","c":"tavola","a":3,"t":"definizione","f":"Come definisci «Maggiore»?","b":"Maggiore è la carica nucleare efficace sull'elettrone, più energia serve; più l'elettrone è lontano dal nucleo, meno ne serve."},{"id":"tavola-14","c":"tavola","a":3,"t":"definizione","f":"Come definisci «La prima EI»?","b":"La prima EI è massima in alto a destra (elio e neon hanno i valori più alti) e minima in basso a sinistra (cesio e francio): Na < Si < P < Cl < Ar nello stesso periodo; Li > Na > K scendendo nel gruppo."},{"id":"tavola-15","c":"tavola","a":3,"t":"definizione","f":"Come definisci «Quante energie di ionizzazione consecutive»?","b":"Quante energie di ionizzazione consecutive sono vicine fra loro prima di un salto molto grande: quel numero è il numero di elettroni di valenza (EI di 490, 840, 1430, poi 7850: tre elettroni di valenza, gruppo 13)."},{"id":"tavola-16","c":"tavola","a":4,"t":"concetto","f":"Che cosa devi sapere su «Elettronegatività e carattere metallico»?","b":"L'elettronegatività è la proprietà di un atomo in una molecola di attrarre verso di sé gli elettroni dell'atomo a cui è legato. Secondo Mulliken è proporzionale alla media tra prima energia di ionizzazione e affinità elettronica, ½(EI + AE): un compromesso tra la tendenza a cedere e quella ad acquistare elettroni."},{"id":"tavola-17","c":"tavola","a":4,"t":"concetto","f":"In parole semplici: «Elettronegatività e carattere metallico»","b":"Il carattere metallico va di pari passo con la facilità a cedere elettroni: massimo in basso a sinistra (cesio, francio), minimo in alto a destra (fluoro). L'elettronegatività va esattamente al contrario. Ricordando un angolo della tavola, si ricavano tutti gli andamenti."},{"id":"tavola-18","c":"tavola","a":4,"t":"definizione","f":"Come definisci «L'elettronegatività»?","b":"L'elettronegatività è la proprietà di un atomo in una molecola di attrarre verso di sé gli elettroni dell'atomo a cui è legato."},{"id":"tavola-19","c":"tavola","a":4,"t":"definizione","f":"Come definisci «Secondo Mulliken»?","b":"Secondo Mulliken è proporzionale alla media tra prima energia di ionizzazione e affinità elettronica, ½(EI + AE): un compromesso tra la tendenza a cedere e quella ad acquistare elettroni."},{"id":"tavola-20","c":"tavola","a":4,"t":"definizione","f":"Come definisci «I metalli»?","b":"I metalli sono malleabili e duttili, lucenti, conducono calore ed elettricità; i loro ossidi sono per lo più basici e ionici; formano cationi e nelle reazioni perdono elettroni (si ossidano)."},{"id":"tavola-21","c":"tavola","a":4,"t":"definizione","f":"Come definisci «I non metalli»?","b":"I non metalli sono fragili allo stato solido, opachi, isolanti; i loro ossidi sono per lo più acidi e molecolari; formano anioni e nelle reazioni acquistano elettroni (si riducono)."},{"id":"tavola-22","c":"tavola","a":4,"t":"definizione","f":"Come definisci «Classificazione: i semimetalli (metalloidi)»?","b":"Classificazione: i semimetalli (metalloidi) sono B, Si, Ge, As, Sb, Te; i gas nobili (Ar, Rn) e gli elementi in alto a destra (S, Cl, P, C, O…) sono non metalli; Cs, Y e gli elementi di transizione sono metalli."},{"id":"tavola-23","c":"tavola","a":5,"t":"concetto","f":"Che cosa devi sapere su «I gruppi principali»?","b":"L'idrogeno ha un solo elettrone: come i metalli alcalini ha configurazione ns¹ e stato di ossidazione +1, ma condivide gli elettroni con i non metalli invece di cederli e ha un'energia di ionizzazione molto più alta, per via delle piccole dimensioni; come gli alogeni è biatomico e gli manca un elettrone per completare il guscio, ma ha un'affinità elettronica molto minore e lo ione idruro H⁻ è raro e reattivo."},{"id":"tavola-24","c":"tavola","a":5,"t":"concetto","f":"In parole semplici: «I gruppi principali»","b":"Ogni gruppo ha una «personalità» dettata dai suoi elettroni esterni: i metalli alcalini non vedono l'ora di liberarsi dell'unico elettrone, gli alogeni di trovarne uno, i gas nobili sono già a posto e non reagiscono. L'idrogeno è un caso a parte: somiglia un po' ai primi e un po' ai secondi, ma non appartiene davvero a nessuno dei due."},{"id":"tavola-25","c":"tavola","a":5,"t":"definizione","f":"Come definisci «Gli allotropi»?","b":"Gli allotropi sono forme cristalline o molecolari diverse dello stesso elemento: grafite, diamante e fullereni per il carbonio; O₂ e O₃ (ozono) per l'ossigeno."},{"id":"tavola-26","c":"tavola","a":6,"t":"concetto","f":"Che cosa devi sapere su «Metalli di transizione e proprietà magnetiche»?","b":"I metalli di transizione mostrano grandi somiglianze sia lungo un periodo sia lungo un gruppo, perché gli ultimi elettroni aggiunti sono interni (d e f) e partecipano ai legami meno facilmente degli elettroni di valenza s e p."},{"id":"tavola-27","c":"tavola","a":6,"t":"concetto","f":"In parole semplici: «Metalli di transizione e proprietà magnetiche»","b":"Ogni elettrone è una piccola calamita. Se gli elettroni sono tutti in coppia, le calamite si annullano a due a due (diamagnetico); se ne resta qualcuno spaiato, l'atomo intero si comporta da calamita e viene attirato da un campo magnetico (paramagnetico). Basta contare gli elettroni spaiati nella configurazione."},{"id":"tavola-28","c":"tavola","a":6,"t":"definizione","f":"Come definisci «I metalli di transizione»?","b":"I metalli di transizione sono gli elementi dei gruppi 3–12 (da Sc a Zn, e le serie 4d e 5d); Na, Mg (blocco s), Si (non metallo) e Pb (blocco p) non lo sono: Be è un metallo alcalino-terroso, V è di transizione, S è un non metallo."},{"id":"tavola-29","c":"tavola","a":0,"t":"quiz","f":"In base a quale criterio Mendeleev ordinò gli elementi?","b":"✅ Per massa atomica crescente\nLa legge periodica del 1869 si basa sulla massa atomica: ordinando così gli elementi, alcune proprietà si ripetono periodicamente."},{"id":"tavola-30","c":"tavola","a":0,"t":"quiz","f":"Su quale grandezza è organizzata la tavola periodica attuale?","b":"✅ Sul numero atomico\nMoseley stabilì che ogni elemento ha un numero atomico unico: è il criterio usato oggi."},{"id":"tavola-31","c":"tavola","a":0,"t":"quiz","f":"Perché gli elementi di uno stesso gruppo hanno proprietà chimiche simili?","b":"✅ Perché hanno lo stesso numero di elettroni di valenza nello stesso tipo di orbitali\nIl comportamento chimico dipende dagli elettroni di valenza, che sono uguali in numero e tipo lungo una colonna."},{"id":"tavola-32","c":"tavola","a":3,"t":"quiz","f":"Che cos'è l'energia di ionizzazione?","b":"✅ L'energia minima per rimuovere un elettrone da un atomo allo stato gassoso\nÈ un processo endotermico: bisogna fornire energia per strappare un elettrone all'atomo."},{"id":"tavola-33","c":"tavola","a":3,"t":"quiz","f":"Che cos'è l'affinità elettronica?","b":"✅ L'energia rilasciata quando un atomo neutro gassoso acquista un elettrone\nX(g) + e⁻ → X⁻(g): l'energia in gioco è l'affinità elettronica, massima per gli alogeni."},{"id":"tavola-34","c":"tavola","a":4,"t":"quiz","f":"Che cos'è l'elettronegatività?","b":"✅ La proprietà di un atomo in una molecola di attrarre gli elettroni di legame\nL'elettronegatività riguarda un atomo legato, non isolato: misura quanto «tira» verso di sé gli elettroni condivisi."},{"id":"tavola-35","c":"tavola","a":2,"t":"quiz","f":"Come varia il raggio atomico scendendo lungo un gruppo?","b":"✅ Aumenta\nScendendo, il guscio di valenza è sempre più lontano dal nucleo."},{"id":"tavola-36","c":"tavola","a":2,"t":"quiz","f":"Come varia il raggio atomico lungo un periodo, da sinistra a destra?","b":"✅ Diminuisce\nGli elettroni si aggiungono allo stesso guscio mentre la carica nucleare efficace cresce: il guscio è attratto più vicino al nucleo."},{"id":"tavola-37","c":"tavola","a":5,"t":"quiz","f":"Che cosa sono gli allotropi?","b":"✅ Forme cristalline o molecolari diverse dello stesso elemento\nGrafite, diamante e fullereni sono allotropi del carbonio; O₂ e O₃ dell'ossigeno. Atomi con neutroni diversi sono invece isotopi."},{"id":"tavola-38","c":"tavola","a":6,"t":"quiz","f":"Da che cosa dipende il paramagnetismo di un atomo o di uno ione?","b":"✅ Dalla presenza di elettroni spaiati\nGli elettroni spaiati generano un campo magnetico netto: la specie è attratta da un campo magnetico."},{"id":"tavola-39","c":"tavola","a":4,"t":"quiz","f":"Come si comportano i metalli nelle reazioni chimiche?","b":"✅ Tendono a perdere elettroni (si ossidano) formando cationi\nI metalli hanno bassa energia di ionizzazione: cedono elettroni. I non metalli li acquistano."},{"id":"tavola-40","c":"tavola","a":5,"t":"quiz","f":"Perché i gas nobili sono poco reattivi?","b":"✅ Perché hanno il guscio di valenza completo\nCon il guscio esterno completo non hanno tendenza né a cedere né ad acquistare elettroni."},{"id":"tavola-41","c":"tavola","a":2,"t":"quiz","f":"Quale atomo è più grande tra azoto e fluoro?","b":"✅ L'azoto, perché è più a sinistra nel periodo\nLungo un periodo il raggio diminuisce verso destra: N è più a sinistra di F."},{"id":"tavola-42","c":"tavola","a":2,"t":"quiz","f":"Quale atomo è più grande tra carbonio e germanio?","b":"✅ Il germanio, perché è più in basso nel gruppo\nScendendo in un gruppo si occupano gusci sempre più esterni."},{"id":"tavola-43","c":"tavola","a":3,"t":"quiz","f":"Quale elemento ha la prima energia di ionizzazione minore tra Al e S?","b":"✅ Al, perché è più a sinistra nel periodo\nL'energia di ionizzazione in generale aumenta lungo un periodo: l'elemento più a sinistra perde l'elettrone più facilmente."},{"id":"tavola-44","c":"tavola","a":3,"t":"quiz","f":"Quale elemento ha la prima energia di ionizzazione minore tra As e Sb?","b":"✅ Sb, perché è più in basso nel gruppo\nScendendo nel gruppo l'elettrone di valenza è più lontano dal nucleo e si rimuove più facilmente."},{"id":"tavola-45","c":"tavola","a":4,"t":"quiz","f":"Quale elemento è più metallico tra Sn e Te?","b":"✅ Sn, perché è più a sinistra nel periodo\nIl carattere metallico diminuisce da sinistra a destra lungo un periodo."},{"id":"tavola-46","c":"tavola","a":1,"t":"quiz","f":"Quale ione forma tipicamente lo zolfo (gruppo 16)?","b":"✅ S²⁻\nHa 6 elettroni di valenza: acquistandone 2 raggiunge l'ottetto e la configurazione dell'argon."},{"id":"tavola-47","c":"tavola","a":1,"t":"quiz","f":"Qual è la configurazione elettronica dello ione Mg²⁺?","b":"✅ 1s² 2s² 2p⁶\nMg perde i due elettroni 3s e resta con la configurazione del neon."},{"id":"tavola-48","c":"tavola","a":2,"t":"quiz","f":"Come sono le dimensioni di un catione rispetto all'atomo da cui deriva?","b":"✅ Minori\nSi rimuovono gli elettroni più esterni e diminuiscono le repulsioni: il catione è più piccolo."},{"id":"tavola-49","c":"tavola","a":2,"t":"quiz","f":"Come sono le dimensioni di un anione rispetto all'atomo da cui deriva?","b":"✅ Maggiori\nSi aggiungono elettroni e le repulsioni aumentano: l'anione è più grande."},{"id":"tavola-50","c":"tavola","a":4,"t":"quiz","f":"Che carattere ha l'ossido di un non metallo, come SO₃?","b":"✅ Acido\nGli ossidi dei non metalli sono per lo più acidi e molecolari; quelli dei metalli basici e ionici."},{"id":"tavola-51","c":"tavola","a":5,"t":"quiz","f":"Qual è la configurazione elettronica di valenza dei metalli alcalini?","b":"✅ ns¹\nHanno un solo elettrone esterno, che cedono facilmente formando ioni +1."},{"id":"tavola-52","c":"tavola","a":6,"t":"quiz","f":"Lo ione Zn²⁺ ha configurazione [Ar] 3d¹⁰. È paramagnetico o diamagnetico?","b":"✅ Diamagnetico, perché tutti gli elettroni sono appaiati\nIl sottolivello 3d è completo: nessun elettrone spaiato. Lo ione ha perso i due elettroni 4s, non i 3d."},{"id":"tavola-53","c":"tavola","a":1,"t":"calcolo","f":"Quale carica assume di solito lo ione più stabile dell'elemento fluoro (gruppo 17)?","b":"Gruppo 17: l'atomo acquista elettroni per completare l'ottetto\nCarica dello ione: −1"},{"id":"tavola-54","c":"tavola","a":1,"t":"calcolo","f":"Quale carica assume di solito lo ione più stabile dell'elemento zolfo (gruppo 16)?","b":"Gruppo 16: l'atomo acquista elettroni per completare l'ottetto\nCarica dello ione: −2"},{"id":"tavola-55","c":"tavola","a":2,"t":"calcolo","f":"Quale atomo ha raggio atomico maggiore, Li o Cs?","b":"Il raggio cresce scendendo nel gruppo e diminuisce andando verso destra nel periodo\nRisposta: Cs"},{"id":"tavola-56","c":"tavola","a":2,"t":"calcolo","f":"Quale atomo ha raggio atomico maggiore, C o Ge?","b":"Il raggio cresce scendendo nel gruppo e diminuisce andando verso destra nel periodo\nRisposta: Ge"},{"id":"tavola-57","c":"tavola","a":0,"t":"calcolo","f":"In quale periodo e in quale gruppo si trova l'elemento Br (Z = 35)?","b":"Periodo = 4 (livello più esterno n = 4)\nGruppo = 17"},{"id":"tavola-58","c":"tavola","a":0,"t":"calcolo","f":"In quale periodo e in quale gruppo si trova l'elemento Ca (Z = 20)?","b":"Periodo = 4 (livello più esterno n = 4)\nGruppo = 2"},{"id":"tavola-59","c":"tavola","a":3,"t":"calcolo","f":"Ordina per energia di ionizzazione crescente: Li, Be, B.","b":"Ordine: Li < B < Be\nRegola: l'energia di ionizzazione cresce lungo il periodo e diminuisce scendendo nel gruppo (attenzione alle eccezioni Be/B e N/O)"},{"id":"tavola-60","c":"tavola","a":3,"t":"calcolo","f":"Ordina per energia di ionizzazione crescente: F, O, N.","b":"Ordine: O < N < F\nRegola: l'energia di ionizzazione cresce lungo il periodo e diminuisce scendendo nel gruppo (attenzione alle eccezioni Be/B e N/O)"},{"id":"tavola-61","c":"tavola","a":4,"t":"calcolo","f":"Calcola la differenza di elettronegatività tra H e Cl e stabilisci il tipo di legame (EN: H = 2.2, Cl = 3).","b":"ΔEN = |2.2 − 3| = 0,8\nTipo di legame: legame covalente polare"},{"id":"tavola-62","c":"tavola","a":4,"t":"calcolo","f":"Calcola la differenza di elettronegatività tra Li e F e stabilisci il tipo di legame (EN: Li = 1, F = 4).","b":"ΔEN = |1 − 4| = 3,0\nTipo di legame: legame ionico"},{"id":"tavola-63","c":"tavola","a":5,"t":"calcolo","f":"Scrivi la reazione del litio con l'acqua e indica il gas che si sviluppa.","b":"2 Li + 2 H₂O → 2 LiOH + H₂↑\nIl gas è l'idrogeno (H₂)"},{"id":"tavola-64","c":"tavola","a":5,"t":"calcolo","f":"Scrivi la reazione del litio con l'acqua e indica il gas che si sviluppa.","b":"2 Li + 2 H₂O → 2 LiOH + H₂↑\nIl gas è l'idrogeno (H₂)"},{"id":"legame-0","c":"legame","a":0,"t":"concetto","f":"Che cosa devi sapere su «Teoria di Lewis e perché gli atomi si legano»?","b":"La teoria di Lewis è una delle teorie di legame più semplici: spiega i legami a partire dagli elettroni di valenza e permette di disegnare modelli, le strutture di Lewis (o strutture a puntini), con cui prevedere molte proprietà delle molecole, come forma, dimensioni e polarità."},{"id":"legame-1","c":"legame","a":0,"t":"concetto","f":"In parole semplici: «Teoria di Lewis e perché gli atomi si legano»","b":"Una pallina in cima a una discesa rotola giù perché in basso ha meno energia: lì è più stabile. Per gli atomi legarsi è «rotolare giù»: insieme hanno meno energia che da soli. Tutta la chimica dei legami è la ricerca della sistemazione a energia più bassa."},{"id":"legame-2","c":"legame","a":0,"t":"definizione","f":"Come definisci «L'energia potenziale tra particelle cariche»?","b":"L'energia potenziale tra particelle cariche è direttamente proporzionale al prodotto delle cariche e inversamente proporzionale alla loro distanza."},{"id":"legame-3","c":"legame","a":1,"t":"concetto","f":"Che cosa devi sapere su «Legame ionico ed energia reticolare»?","b":"Il legame ionico è di natura elettrostatica: gli elettroni vengono trasferiti da un atomo con bassa energia di ionizzazione (elettropositivo) a uno con grande affinità elettronica (elettronegativo), fino a che il metallo ha perso tutti i suoi elettroni di valenza e il non metallo ha l'ottetto."},{"id":"legame-4","c":"legame","a":1,"t":"concetto","f":"In parole semplici: «Legame ionico ed energia reticolare»","b":"Un cristallo ionico è una scacchiera tridimensionale di cariche + e −. Finché le caselle restano al loro posto ognuna è circondata da vicine di segno opposto e tutto tiene. Se un colpo fa slittare uno strato di una casella, i + si trovano accanto ai + e i − accanto ai −: si respingono e il cristallo si spacca. Ecco perché il sale è duro ma fragile."},{"id":"legame-5","c":"legame","a":1,"t":"definizione","f":"Come definisci «L'energia reticolare»?","b":"L'energia reticolare è l'energia rilasciata quando il solido cristallino si forma dagli ioni separati allo stato gassoso: è sempre esotermica, dipende direttamente dalla carica degli ioni e inversamente dalla distanza tra essi."},{"id":"legame-6","c":"legame","a":1,"t":"definizione","f":"Come definisci «I composti ionici»?","b":"I composti ionici sono solidi cristallini duri e fragili, con punti di fusione in genere superiori a 300 °C; non conducono allo stato solido, ma conducono fusi o in soluzione."},{"id":"legame-7","c":"legame","a":2,"t":"concetto","f":"Che cosa devi sapere su «Legame covalente e strutture di Lewis»?","b":"Il legame covalente si forma quando gli atomi condividono coppie di elettroni per raggiungere l'ottetto. Gli elettroni condivisi sono coppie di legame; quelli non condivisi, che appartengono a un solo atomo, sono coppie solitarie (o di non legame)."},{"id":"legame-8","c":"legame","a":2,"t":"concetto","f":"In parole semplici: «Legame covalente e strutture di Lewis»","b":"La struttura di Lewis è un gioco di contabilità: hai un certo numero di elettroni da distribuire e ogni atomo vuole arrivare a otto (l'idrogeno a due). La carica formale è il controllo finale: confronta quanti elettroni l'atomo «possiede» nella struttura con quanti ne aveva da solo. Più le cariche formali sono vicine a zero, più la struttura è plausibile."},{"id":"legame-9","c":"legame","a":2,"t":"definizione","f":"Come definisci «Gli elettroni condivisi»?","b":"Gli elettroni condivisi sono coppie di legame; quelli non condivisi, che appartengono a un solo atomo, sono coppie solitarie (o di non legame)."},{"id":"legame-10","c":"legame","a":2,"t":"definizione","f":"Come definisci «La somma delle cariche formali»?","b":"La somma delle cariche formali è zero in una molecola e uguale alla carica in uno ione."},{"id":"legame-11","c":"legame","a":2,"t":"def
