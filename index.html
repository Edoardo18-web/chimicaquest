elettrone allo ione Cl⁺ e portarlo a distanza infinita). La prima EI è massima in alto a destra (elio e neon hanno i valori più alti) e minima in basso a sinistra (cesio e francio): Na < Si < P < Cl < Ar nello stesso periodo; Li > Na > K scendendo nel gruppo. Quante energie di ionizzazione consecutive sono vicine fra loro prima di un salto molto grande: quel numero è il numero di elettroni di valenza (EI di 490, 840, 1430, poi 7850: tre elettroni di valenza, gruppo 13). Affinità elettronica: gli alogeni (gruppo 17) hanno le AE più negative tra i gruppi principali (il cloro ha l'AE più negativa in assoluto; il fluoro, per le forti repulsioni nel suo atomo piccolo, ha un valore un po' meno negativo); è circa nulla per i gas nobili e per i metalli alcalino-terrosi.","spiegazione":"L'energia di ionizzazione è il «prezzo» da pagare per portare via un elettrone: costa poco se l'elettrone è lontano e poco trattenuto (in basso a sinistra nella tavola), molto se è vicino e ben trattenuto (in alto a destra). L'affinità elettronica è invece il «premio» che l'atomo riceve quando accetta un elettrone: gli alogeni, a cui ne manca uno solo, incassano il premio più alto.","esempi":["EI: Na (496) < P (1012) < Cl (1251) < Ar (1521 kJ/mol).","EI = 490, 840, 1430, 7850, 43190 → salto dopo la 3ª → 3 elettroni di valenza.","Al ha EI minore di S (più a sinistra); Sb minore di As (più in basso).","EI: Be > B e N > O, contro l'andamento generale.","Mg: grande salto tra la seconda e la terza energia di ionizzazione."]},{"titolo":"Elettronegatività e carattere metallico","riassunto":"L'elettronegatività è la proprietà di un atomo in una molecola di attrarre verso di sé gli elettroni dell'atomo a cui è legato. Secondo Mulliken è proporzionale alla media tra prima energia di ionizzazione e affinità elettronica, ½(EI + AE): un compromesso tra la tendenza a cedere e quella ad acquistare elettroni. Pauling la ricava invece dalle energie di legame. I metalli sono malleabili e duttili, lucenti, conducono calore ed elettricità; i loro ossidi sono per lo più basici e ionici; formano cationi e nelle reazioni perdono elettroni (si ossidano). I non metalli sono fragili allo stato solido, opachi, isolanti; i loro ossidi sono per lo più acidi e molecolari; formano anioni e nelle reazioni acquistano elettroni (si riducono). I semimetalli (metalloidi) hanno proprietà intermedie: il silicio è lucente ma fragile e conduce poco. Il carattere metallico diminuisce da sinistra a destra lungo un periodo e aumenta scendendo lungo un gruppo. Di conseguenza gli ossidi passano da basici (a sinistra) ad anfoteri ad acidi (a destra). Elettronegatività (scala di Pauling): massima per il fluoro (3,98), minima per cesio e francio (circa 0,7–0,8); cresce da sinistra a destra lungo il periodo e dal basso verso l'alto nel gruppo (Cl 3,16 > P 2,19 > Si 1,90 > Li 0,98). Il carattere ionico di un legame cresce con la differenza di elettronegatività ΔEN tra i due atomi: ΔEN grande → legame ionico, ΔEN piccola → covalente. Classificazione: i semimetalli (metalloidi) sono B, Si, Ge, As, Sb, Te; i gas nobili (Ar, Rn) e gli elementi in alto a destra (S, Cl, P, C, O…) sono non metalli; Cs, Y e gli elementi di transizione sono metalli. Tipi di ossidi: basici (di metalli: Na₂O, MgO), acidi (di non metalli: SO₃, CO₂), anfoteri (Al₂O₃, ZnO, BeO). Un ossido basico + acqua dà un idrossido (MgO + H₂O → Mg(OH)₂); un ossido acido + acqua dà un acido (SO₃ + H₂O → H₂SO₄).","spiegazione":"Il carattere metallico va di pari passo con la facilità a cedere elettroni: massimo in basso a sinistra (cesio, francio), minimo in alto a destra (fluoro). L'elettronegatività va esattamente al contrario. Ricordando un angolo della tavola, si ricavano tutti gli andamenti.","esempi":["Tra Itrrio, Cesio, Radon, Silicio: metalli solo Y e Cs (2); Rn è un gas nobile, Si un semimetallo.","MgO è un ossido basico (metallo + O).","Sn è più metallico di Te (più a sinistra); Sb più di P (più in basso).","Na₂O è un ossido basico, SO₃ un ossido acido, Al₂O₃ è anfotero.","In è più metallico di Ge (più in basso e più a sinistra)."]},{"titolo":"I gruppi principali","riassunto":"L'idrogeno ha un solo elettrone: come i metalli alcalini ha configurazione ns¹ e stato di ossidazione +1, ma condivide gli elettroni con i non metalli invece di cederli e ha un'energia di ionizzazione molto più alta, per via delle piccole dimensioni; come gli alogeni è biatomico e gli manca un elettrone per completare il guscio, ma ha un'affinità elettronica molto minore e lo ione idruro H⁻ è raro e reattivo. I metalli alcalini (gruppo 1, ns¹) sono gli elementi più grandi dei rispettivi periodi, teneri, con bassi punti di fusione e basse densità, molto reattivi. I metalli alcalino-terrosi (gruppo 2) hanno energie di ionizzazione più alte e sono forti riducenti. Nei gruppi 13 e 14 gli elementi più pesanti mostrano più stati di ossidazione e quello inferiore diventa più importante scendendo, perché gli elettroni ns² formano una coppia inerte. Gli allotropi sono forme cristalline o molecolari diverse dello stesso elemento: grafite, diamante e fullereni per il carbonio; O₂ e O₃ (ozono) per l'ossigeno. Nel gruppo 15 gli ossidi passano da acidi ad anfoteri a basici scendendo. Gli alogeni (gruppo 17) hanno bisogno di un solo elettrone e sono molto reattivi; la reattività diminuisce scendendo nel gruppo. I gas nobili (gruppo 18) hanno il guscio di valenza completo, sono gli elementi più piccoli dei rispettivi periodi e hanno le energie di ionizzazione più alte. Alcalino-terrosi (gruppo 2): reattività con l'acqua crescente scendendo: Be non reagisce, Mg reagisce lentamente (a caldo), Ca, Sr e Ba reagiscono con decisione; non reagiscono quindi tutti violentemente con l'acqua. Il radio (Ra) è radioattivo. A temperatura e pressione standard la forma più stabile del carbonio è la grafite; il diamante è una forma metastabile che non si trasforma in grafite a velocità apprezzabile. Allotropi: stesso elemento in forme diverse (grafite, diamante, fullereni; O₂ e O₃); isotopi: stesso elemento con numero diverso di neutroni.","spiegazione":"Ogni gruppo ha una «personalità» dettata dai suoi elettroni esterni: i metalli alcalini non vedono l'ora di liberarsi dell'unico elettrone, gli alogeni di trovarne uno, i gas nobili sono già a posto e non reagiscono. L'idrogeno è un caso a parte: somiglia un po' ai primi e un po' ai secondi, ma non appartiene davvero a nessuno dei due.","esempi":["Gruppo 2 + acqua: Be nessuna reazione, Mg lenta a caldo, Ba violenta.","Grafite e diamante: allotropi del carbonio; la grafite è più stabile in condizioni standard.","Il potassio reagisce violentemente con l'acqua; il litio galleggia sull'olio.","Carbonio: grafite, diamante e fullereni sono allotropi.","In laboratorio: Zn + 2 HCl → ZnCl₂ + H₂.","Un alogeno può acquistare un elettrone (ione alogenuro) o condividere una coppia con un non metallo."]},{"titolo":"Metalli di transizione e proprietà magnetiche","riassunto":"I metalli di transizione mostrano grandi somiglianze sia lungo un periodo sia lungo un gruppo, perché gli ultimi elettroni aggiunti sono interni (d e f) e partecipano ai legami meno facilmente degli elettroni di valenza s e p. Nella prima serie gli orbitali 3d iniziano a riempirsi dopo il 4s; poiché le energie di 3d e 4s sono molto vicine, ci sono eccezioni: cromo è [Ar] 4s¹ 3d⁵ e rame è [Ar] 4s¹ 3d¹⁰ invece di 4s² 3d⁹. I metalli 4d e 5d hanno dimensioni molto simili per effetto della contrazione lantanidica: gli orbitali 4f schermano poco il nucleo e i raggi dei lantanidi diminuiscono sensibilmente. I metalli di transizione formano ioni diversi perdendo uno o più elettroni: per i primi cinque il massimo stato di ossidazione corrisponde alla perdita di tutti gli elettroni 4s e 3d; verso destra prevale lo ione 2+. Molti loro composti sono colorati. Le configurazioni con elettroni spaiati danno un campo magnetico netto (paramagnetismo: attrazione verso un campo magnetico); quelle con tutti gli elettroni appaiati no (diamagnetismo: debole repulsione). Quando si formano i cationi, gli elettroni 4s vengono persi prima dei 3d. Configurazioni da conoscere (prima serie 3d): Ti [Ar] 3d² 4s²; V 3d³ 4s²; Cr 3d⁵ 4s¹ (eccezione); Mn 3d⁵ 4s²; Fe 3d⁶ 4s²; Co 3d⁷ 4s²; Ni 3d⁸ 4s²; Cu 3d¹⁰ 4s¹ (eccezione); Zn 3d¹⁰ 4s². I metalli di transizione sono gli elementi dei gruppi 3–12 (da Sc a Zn, e le serie 4d e 5d); Na, Mg (blocco s), Si (non metallo) e Pb (blocco p) non lo sono: Be è un metallo alcalino-terroso, V è di transizione, S è un non metallo. Per riconoscere uno ione dalla configurazione: si contano gli elettroni e si confronta con Z − carica: [Ar] 3d⁶ ha 24 elettroni, quindi Z = 27 e carica +3 (27 − 3 = 24): Co³⁺. Per decidere se uno ione è para- o diamagnetico: si toglie prima il 4s, poi il 3d, e si contano gli elettroni spaiati (Hund: un elettrone per orbitale d prima di appaiarli): d¹ → 1, d² → 2, d³ → 3, d⁴ → 4, d⁵ → 5, d⁶ → 4, d⁷ → 3, d⁸ → 2, d⁹ → 1, d¹⁰ → 0. Cr³⁺ ([Ar] 3d³): 3 spaiati, paramagnetico; Fe³⁺ (d⁵): 5; Zn²⁺ (d¹⁰): 0, diamagnetico.","spiegazione":"Ogni elettrone è una piccola calamita. Se gli elettroni sono tutti in coppia, le calamite si annullano a due a due (diamagnetico); se ne resta qualcuno spaiato, l'atomo intero si comporta da calamita e viene attirato da un campo magnetico (paramagnetico). Basta contare gli elettroni spaiati nella configurazione.","esempi":["Cr³⁺: Cr [Ar] 3d⁵ 4s¹ → togli 4s¹ e due 3d → 3d³ → 3 spaiati, paramagnetico.","[Ar] 3d⁶: 24 e⁻; Z = 27 → Co con carica +3 → Co³⁺.","Zn: [Ar] 4s² 3d¹⁰ e Zn²⁺: [Ar] 3d¹⁰ → entrambi diamagnetici.","Fe: [Ar] 4s² 3d⁶ → paramagnetico; Fe³⁺: [Ar] 3d⁵ → 5 elettroni spaiati, paramagnetico.","CuSO₄ idrato è blu; scaldandolo perde l'acqua e diventa bianco."]}]},{"id":"legame","n":5,"titolo":"Il legame chimico","icona":"🔗","colore":"#22d3ee","descrizione":"Lezione 5 · Teoria di Lewis, legame ionico ed energia reticolare, legame covalente, risonanza, polarità e legame metallico.","argomenti":[{"titolo":"Teoria di Lewis e perché gli atomi si legano","riassunto":"La teoria di Lewis è una delle teorie di legame più semplici: spiega i legami a partire dagli elettroni di valenza e permette di disegnare modelli, le strutture di Lewis (o strutture a puntini), con cui prevedere molte proprietà delle molecole, come forma, dimensioni e polarità. Per un elemento dei gruppi principali il numero del gruppo indica quanti elettroni di valenza possiede. Nel simbolo di Lewis il simbolo dell'elemento rappresenta nucleo ed elettroni interni, i puntini gli elettroni di valenza. I cationi hanno simboli di Lewis senza elettroni di valenza (li hanno persi), gli anioni con 8 elettroni di valenza. Gli atomi si legano perché un processo è spontaneo se porta a un sistema con energia potenziale più bassa: i legami chimici si formano perché abbassano l'energia potenziale tra le particelle cariche che compongono gli atomi. L'energia potenziale tra particelle cariche è direttamente proporzionale al prodotto delle cariche e inversamente proporzionale alla loro distanza. Per contare gli elettroni di valenza di una molecola o di uno ione si sommano quelli di tutti gli atomi (H 1, C 4, N 5, O 6, F e Cl 7, gruppo 16 → 6, gruppo 17 → 7) e si aggiunge un elettrone per ogni carica negativa o se ne toglie uno per ogni carica positiva: HNO₃ = 1 + 5 + 3·6 = 24; NO₃⁻ = 5 + 3·6 + 1 = 24; NH₄⁺ = 5 + 4 − 1 = 8; SO₄²⁻ = 6 + 4·6 + 2 = 32. L'ottetto (8 elettroni attorno all'atomo) dà stabilità agli atomi dei gruppi principali; l'idrogeno si ferma a 2 (duetto). La carica formale di un atomo in una struttura è CF = elettroni di valenza − (elettroni di non legame + ½ elettroni di legame): un atomo di fosforo (5 elettroni di valenza) con 2 legami e 2 coppie solitarie ha CF = 5 − (4 + 2) = −1. Le cariche formali di una struttura plausibile sono vicine a zero e la loro somma è la carica della specie.","spiegazione":"Una pallina in cima a una discesa rotola giù perché in basso ha meno energia: lì è più stabile. Per gli atomi legarsi è «rotolare giù»: insieme hanno meno energia che da soli. Tutta la chimica dei legami è la ricerca della sistemazione a energia più bassa.","esempi":["PO₄³⁻: 5 + 4·6 + 3 = 32 elettroni di valenza.","P con 3 legami e 1 coppia solitaria: CF = 5 − (2 + 3) = 0.","Li ha 1 puntino, C ne ha 4, F ne ha 7, Ne ne ha 8.","Na⁺ si scrive senza puntini; F⁻ con otto puntini tra parentesi quadre.","Due cariche opposte vicine hanno energia potenziale più bassa che lontane."]},{"titolo":"Legame ionico ed energia reticolare","riassunto":"Il legame ionico è di natura elettrostatica: gli elettroni vengono trasferiti da un atomo con bassa energia di ionizzazione (elettropositivo) a uno con grande affinità elettronica (elettronegativo), fino a che il metallo ha perso tutti i suoi elettroni di valenza e il non metallo ha l'ottetto. L'attrazione elettrostatica non è direzionale: non esiste una coppia anione-catione né una molecola ionica; gli ioni si dispongono in un reticolo cristallino in cui ogni catione è circondato da anioni e viceversa, e la formula chimica è una formula empirica che indica solo il rapporto tra gli ioni. L'energia reticolare è l'energia rilasciata quando il solido cristallino si forma dagli ioni separati allo stato gassoso: è sempre esotermica, dipende direttamente dalla carica degli ioni e inversamente dalla distanza tra essi. Ioni più grandi danno attrazione più debole (LiCl −834, NaCl −787, KCl −701, CsCl −657 kJ/mol); ioni con carica maggiore danno attrazione molto più forte (−910 contro −3414 kJ/mol passando da ioni 1+/1− a ioni 2+/2−). Dei due fattori, la carica è in genere il più importante. I composti ionici sono solidi cristallini duri e fragili, con punti di fusione in genere superiori a 300 °C; non conducono allo stato solido, ma conducono fusi o in soluzione. Per confrontare le energie reticolari si usa U ∝ (q₁ · q₂) / (r₊ + r₋): contano soprattutto le cariche (2+/2− ≫ 1+/1−) e poi la somma dei raggi ionici. Raggi ionici (pm): Li⁺ 76, Na⁺ 102, K⁺ 138, Cs⁺ 167; Mg²⁺ 72, Ca²⁺ 100, Al³⁺ 54; F⁻ 133, Cl⁻ 181, Br⁻ 196, I⁻ 220, O²⁻ 140. Esempi: MgO (2·2/212 ≈ 1,9) ha un'energia reticolare molto maggiore di NaCl (1·1/283 ≈ 0,4); AlF₃ (3·1/187 ≈ 1,6) supera CsI (1·1/387 ≈ 0,3). Per riconoscere un composto ionico: un metallo + un non metallo (MgO, CaO, BaCl₂, NaCl, KBr, CsF), con differenza di elettronegatività di circa 2 o più (Ca e F: ΔEN ≈ 3); i composti tra soli non metalli (H₂O, CH₄, CO₂, HCl) sono covalenti. Un solido ionico non conduce l'elettricità perché gli ioni sono bloccati nel reticolo: una buona conducibilità allo stato solido non è una proprietà dei solidi ionici.","spiegazione":"Un cristallo ionico è una scacchiera tridimensionale di cariche + e −. Finché le caselle restano al loro posto ognuna è circondata da vicine di segno opposto e tutto tiene. Se un colpo fa slittare uno strato di una casella, i + si trovano accanto ai + e i − accanto ai −: si respingono e il cristallo si spacca. Ecco perché il sale è duro ma fragile.","esempi":["MgO: U ∝ 2·2 / (72 + 140) ≈ 1,9; NaCl: 1·1 / (102 + 181) ≈ 0,4 → MgO ha energia reticolare molto maggiore.","Ionici: NaCl, KBr, CsF, CaO, BaCl₂, MgO. Covalenti: H₂O, CH₄, CO₂, HCl.","Na ([Ne] 3s¹) + Cl ([Ne] 3s² 3p⁵) → Na⁺ ([Ne]) + Cl⁻ ([Ar]).","2 Li + O → Li₂O: servono due atomi di litio per cedere i due elettroni che servono all'ossigeno.","NaCl solido non conduce (ioni bloccati); NaCl in soluzione conduce (ioni liberi di muoversi)."]},{"titolo":"Legame covalente e strutture di Lewis","riassunto":"Il legame covalente si forma quando gli atomi condividono coppie di elettroni per raggiungere l'ottetto. Gli elettroni condivisi sono coppie di legame; quelli non condivisi, che appartengono a un solo atomo, sono coppie solitarie (o di non legame). Nel legame singolo si condivide una coppia (2 elettroni), nel doppio due coppie (4 elettroni), nel triplo tre coppie (6 elettroni). A differenza del legame ionico, l'attrazione è direzionale: si formano molecole e non un reticolo. Schemi di legame comuni: C forma 4 legami e non ha coppie solitarie; N 3 legami e 1 coppia solitaria; O 2 legami e 2 coppie solitarie; H e alogeni 1 legame (gli alogeni hanno anche 3 coppie solitarie). Per disegnare una struttura di Lewis: si contano gli elettroni di valenza (aggiungendone uno per ogni carica negativa e togliendone uno per ogni carica positiva); si scrive lo scheletro, con l'atomo meno elettronegativo al centro e H sempre terminale; si collega ogni coppia di atomi con una coppia di elettroni; si completano gli ottetti dall'esterno verso l'interno; se l'atomo centrale non ha l'ottetto si formano legami multipli. La carica formale di un atomo è: elettroni di valenza − (elettroni di non legame + ½ elettroni di legame). La somma delle cariche formali è zero in una molecola e uguale alla carica in uno ione. Valenze usuali (numero di legami): H 1, alogeni 1, O 2, N 3, C 4, B 3; per questo l'ossigeno forma due legami singoli (H₂O) oppure un doppio (O₂). Numero di legami di una molecola biatomica: legami = (elettroni necessari per gli ottetti − elettroni di valenza disponibili) / 2: N₂ ha 10 elettroni di valenza e per gli ottetti ne servirebbero 16, quindi (16 − 10)/2 = 3 legami (triplo, N≡N). Legami σ e π: ogni legame singolo è un σ; un doppio legame è 1 σ + 1 π; un triplo è 1 σ + 2 π. HCN (H–C≡N): 1 σ (H–C) + 1 σ + 2 π (C≡N) = 2 σ e 2 π; CO₂ (O=C=O): 2 σ e 2 π; C₂H₄: 5 σ e 1 π; N₂: 1 σ e 2 π. Gli elettroni di valenza dell'azoto sono 5 (gruppo 15).","spiegazione":"La struttura di Lewis è un gioco di contabilità: hai un certo numero di elettroni da distribuire e ogni atomo vuole arrivare a otto (l'idrogeno a due). La carica formale è il controllo finale: confronta quanti elettroni l'atomo «possiede» nella struttura con quanti ne aveva da solo. Più le cariche formali sono vicine a zero, più la struttura è plausibile.","esempi":["HCN: H–C≡N → 2 σ e 2 π.","N₂: (16 − 10)/2 = 3 legami → N≡N.","HNO₃: 1 + 5 + 3·6 = 24 elettroni di valenza; N al centro, H legato a un O.","NH₃: tre coppie di legame e una coppia solitaria sull'azoto.","SO₂ (un doppio e un singolo legame): O con doppio legame 0, S +1, O con legame singolo −1."]},{"titolo":"Risonanza, eccezioni all'ottetto e legame coordinato","riassunto":"Quando per una molecola si possono scrivere più strutture di Lewis che differiscono solo per la posizione degli elettroni, queste si chiamano strutture di risonanza: la molecola reale è una combinazione di tutte, un ibrido di risonanza, e non oscilla tra le forme. Gli elettroni che compaiono in posizioni diverse sono delocalizzati, cioè distribuiti su più coppie di atomi. Le strutture di risonanza devono avere la stessa connettività e lo stesso numero di elettroni; contribuiscono di più quelle con meno cariche formali, con cariche formali più piccole e con la carica negativa sull'atomo più elettronegativo. Eccezioni alla regola dell'ottetto: ottetto espanso (elementi dal terzo periodo in poi, che usano orbitali d vuoti: composti ipervalenti); specie con numero dispari di elettroni (NO, NO₂), che hanno un elettrone spaiato, sono radicali molto reattivi e paramagnetici; ottetto incompleto (H stabile con 2 elettroni, Be con 4, B e Al con 6). Nel legame covalente coordinato (un tempo detto dativo) la coppia di elettroni proviene da un solo atomo e occupa un orbitale libero dell'altro. Quando c'è risonanza: servono almeno due strutture di Lewis equivalenti che differiscono solo per la posizione degli elettroni (un doppio legame che può spostarsi tra atomi uguali): NO₃⁻, CO₃²⁻, SO₃, O₃, HNO₃ (2 strutture limite, perché i due O terminali si scambiano il doppio legame). Non hanno risonanza le molecole con soli legami singoli (CCl₄, CH₄) e quelle in cui il doppio legame è fisso (CH₃COOH neutro: C=O e O–H sono distinti, mentre l'anione acetato ha due strutture equivalenti). La molecola reale esiste solo come ibrido di risonanza (A), non come le singole formule limite (A₁ o A₂). Eccezioni all'ottetto: espanso (più di 8 elettroni, dal 3° periodo in poi): PCl₅ (10 elettroni attorno a P), SF₆ (12), XeF₄, ClF₃; incompleto: BF₃, BCl₃, AlCl₃ (6 elettroni), BeCl₂ (4); numero dispari di elettroni: NO, NO₂. Rispettano l'ottetto: NF₃, H₂O, N₂, CCl₄, CH₄, CO₂, NH₃.","spiegazione":"Le strutture di risonanza sono come più fotografie sfocate della stessa persona: nessuna è quella vera, ma sovrapponendole ottieni un'immagine fedele. Un mulo non è a volte cavallo e a volte asino: è un ibrido, sempre uguale a se stesso. Così nel carbonato i tre legami C–O sono identici, a metà strada tra singolo e doppio.","esempi":["Con risonanza: NO₃⁻, CO₃²⁻, SO₃, HNO₃. Senza risonanza: CCl₄, CH₄, CH₃COOH.","Senza ottetto: PCl₅ (10 e⁻), BCl₃ (6 e⁻), NO (11 e⁻).","CO₃²⁻ e SO₂: più strutture equivalenti, legami tutti uguali nella realtà.","SF₆ e PCl₅: ottetto espanso. BF₃: boro con soli 6 elettroni.","NH₃ + BF₃ → H₃N–BF₃: l'azoto dona la sua coppia solitaria al boro (acido di Lewis).","NO ha un elettrone spaiato: è paramagnetico."]},{"titolo":"Polarità di legame ed elettronegatività","riassunto":"Il legame covalente tra atomi diversi comporta una condivisione non equa degli elettroni: un atomo attira gli elettroni di legame più vicino a sé e un'estremità del legame ha densità elettronica maggiore dell'altra. Il risultato è un legame covalente polare: l'estremità più ricca di elettroni ha una parziale carica negativa (δ−), quella più povera una parziale carica positiva (δ+). L'elettronegatività misura l'attrazione di un atomo sugli elettroni di legame: aumenta lungo un periodo da sinistra a destra e diminuisce scendendo lungo un gruppo; il fluoro è l'elemento più elettronegativo, il francio il meno elettronegativo. Più grande è la differenza di elettronegatività (ΔEN), più polare è il legame: ΔEN = 0 covalente puro; da 0,1 a 0,4 covalente non polare; da 0,5 a 1,9 covalente polare; maggiore o uguale a 2,0 ionico. Il momento di dipolo μ = q·r misura quantitativamente la polarità di un legame: è proporzionale alle cariche parziali e alla distanza tra esse e si misura in debye (D). Il carattere ionico percentuale è il rapporto tra il momento di dipolo misurato e quello che il legame avrebbe se le cariche fossero intere. Applicazione: si calcola ΔEN = |EN₁ − EN₂| e si usa la scala 0 puro, 0,1–0,4 non polare, 0,5–1,9 polare, ≥ 2,0 ionico (HCl: 3,0 − 2,1 = 0,9, polare, covalente; N–O: 3,5 − 3,0 = 0,5, polare). Elettronegatività di riferimento: H 2,1; C 2,5; N 3,0; O 3,5; F 4,0; Cl 3,0; Na 0,9; K 0,8. Un legame tra due atomi uguali (Cl–Cl, O=O) è covalente puro (ΔEN = 0). Un composto che ha solo legami covalenti è formato da non metalli: CH₄, H₂O e HCl sono covalenti, mentre KBr, CsF e NaCl (metallo + non metallo) sono ionici. Il momento di dipolo si misura in debye (1 D = 3,336·10⁻³⁰ C·m).","spiegazione":"Un legame è un tiro alla fune per gli elettroni. Se i due atomi tirano uguale la fune resta al centro (covalente puro); se uno tira di più la fune si sposta dalla sua parte (covalente polare); se uno è molto più forte si prende tutta la fune (ionico). La differenza di elettronegatività dice di quanto un atomo è più forte dell'altro.","esempi":["HCl: ΔEN = 3,0 − 2,1 = 0,9 → covalente polare.","NaCl: ΔEN = 3,0 − 0,9 = 2,1 → ionico.","H–F: EN 2,1 e 4,0 → δ+ su H, δ− su F.","N–O: 3,5 − 3,0 = 0,5 → covalente polare.","Un filo d'acqua è deviato da una bacchetta di vetro carica; un filo di esano no."]},{"titolo":"Energia e lunghezza di legame","riassunto":"Le reazioni chimiche comportano la rottura dei legami nei reagenti e la formazione di nuovi legami nei prodotti. L'energia di legame è l'energia necessaria per rompere una mole di un certo legame in un composto allo stato gassoso, in modo omolitico (ogni atomo riceve metà degli elettroni di legame). Più elettroni condividono due atomi, più forte è il legame: C≡C (837 kJ/mol) > C=C (611) > C–C (347). Più corto è il legame, più è forte: Br–F (237) > Br–Cl (218) > Br–Br (193); i legami si indeboliscono scendendo lungo un gruppo. La lunghezza di legame è la distanza tra i nuclei degli atomi legati; poiché dipende dagli altri atomi presenti, si usa un valore medio. Più elettroni condividono due atomi, più corto è il legame: C≡C (120 pm) < C=C (134 pm) < C–C (154 pm). La lunghezza diminuisce da sinistra a destra lungo un periodo (C–C 154 > C–N 147 > C–O 143 pm) e aumenta scendendo lungo un gruppo. Le energie dei legami multipli non sono multipli esatti di quelle dei legami singoli. Valori utili (kJ/mol): H–H 436, N≡N 945 (il legame più forte tra quelli comuni), N–H 391, O–H 463, O=O 498, C–H 413, C=O 799, Cl–Cl 243, F–F 155, H–F 567, H–Cl 431, H–Br 366, H–I 299. Lungo il gruppo 17 l'energia di legame H–X diminuisce: HF > HCl > HBr > HI. Il legame più forte tra due atomi uguali è quello triplo: N≡N è più forte di O=O e di F–F; a parità di atomi C≡C > C=C > C–C. Stima di ΔH con le energie di legame: ΔH ≈ Σ energie dei legami rotti (reagenti) − Σ energie dei legami formati (prodotti): se si formano legami più forti di quelli rotti la reazione è esotermica (ΔH < 0). Per 2 H₂ + O₂ → 2 H₂O: rotti 2 H–H e 1 O=O, formati 4 O–H: ΔH ≈ (2·436 + 498) − 4·463 = −482 kJ; per H₂ + Cl₂ → 2 HCl: ΔH ≈ (436 + 243) − 2·431 = −183 kJ. L'energia di dissociazione di una molecola biatomica coincide con l'energia del suo legame.","spiegazione":"Più coppie di elettroni fanno da «colla» tra due nuclei, più i nuclei vengono tirati vicini e più fatica serve per separarli: i legami tripli sono i più corti e i più forti. Ma la seconda e la terza coppia incollano meno della prima: per questo un doppio legame non vale due legami singoli.","esempi":["2 H₂ + O₂ → 2 H₂O: ΔH ≈ (2·436 + 498) − 4·463 = −482 kJ.","H–F 567 > H–Cl 431 > H–Br 366 > H–I 299 kJ/mol.","C–C 347, C=C 611, C≡C 837 kJ/mol: 611 è meno del doppio di 347.","F–F 144 pm, Cl–Cl 198 pm, Br–Br 228 pm: più lunghi scendendo nel gruppo.","Il legame O–O è piuttosto debole."]},{"titolo":"Legame metallico","riassunto":"La bassa energia di ionizzazione dei metalli permette loro di perdere facilmente elettroni. Nella teoria più semplice gli atomi del metallo rilasciano i propri elettroni di valenza, che vengono condivisi da tutti gli atomi/ioni: si hanno «isole» di cationi metallici in un mare di elettroni delocalizzati su tutta la struttura. Il legame nasce dall'attrazione dei cationi per gli elettroni delocalizzati. Il numero di elettroni condivisi per atomo aumenta da Na a Mg ad Al, e nello stesso ordine aumenta la forza del legame. I metalli hanno in genere alti punti di fusione e di ebollizione (tutti solidi a temperatura ambiente tranne il mercurio): i punti di fusione in genere aumentano verso destra lungo un periodo, perché aumenta la carica del catione, e diminuiscono scendendo lungo un gruppo, perché i cationi diventano più grandi. I metalli conducono l'elettricità perché gli elettroni liberi sono mobili; la conducibilità diminuisce all'aumentare della temperatura, perché gli ioni vibrano di più e ostacolano il moto degli elettroni. Sono malleabili e duttili perché i cationi possono spostarsi nel mare di elettroni senza rompere le attrazioni e la struttura cristallina.","spiegazione":"Immagina delle biglie (i cationi) immerse nel miele (gli elettroni): se spingi, le biglie scivolano le une sulle altre ma il miele continua a tenerle insieme. Per questo un metallo si piega e si lamina senza rompersi, al contrario di un cristallo ionico.","esempi":["Na cede 1 elettrone per atomo, Mg 2, Al 3: il legame è via via più forte.","Un filo di rame conduce perché gli elettroni delocalizzati scorrono lungo il filo.","Scaldando un metallo la sua resistenza elettrica aumenta."]}]},{"id":"orbitalimolecolari","n":6,"titolo":"Orbitali molecolari","icona":"🧬","colore":"#fb923c","descrizione":"Lezione 6 · Geometria molecolare (VSEPR), legame di valenza e ibridazione, orbitali molecolari, teoria delle bande e semiconduttori.","argomenti":[{"titolo":"Teoria VSEPR: le geometrie di base","riassunto":"Le proprietà delle sostanze molecolari dipendono dalla struttura della molecola: disposizione degli atomi, tipo di legame e forma. La forma si descrive con figure geometriche che indicano la posizione degli atomi attorno a un atomo centrale, con angoli di legame caratteristici. La teoria più semplice è la VSEPR (repulsione delle coppie di elettroni del guscio di valenza): le regioni ad alta densità elettronica attorno all'atomo centrale (legami e coppie solitarie) si respingono e, per ridurre al minimo la repulsione, si dispongono il più lontano possibile tra loro. Ogni coppia solitaria è un gruppo di elettroni; ogni legame è un gruppo, indipendentemente dal fatto che sia singolo, doppio o triplo. Esistono cinque disposizioni di base: 2 gruppi → lineare (180°); 3 gruppi → trigonale planare (120°); 4 gruppi → tetraedrica (109,5°); 5 gruppi → bipiramide trigonale (tre atomi equatoriali a 120° e due assiali a 90° dai primi), come PCl₅; 6 gruppi → ottaedrica, come SF₆. Se la molecola presenta risonanza, la geometria è la stessa qualunque struttura si usi. Nelle molecole con più atomi centrali si descrive la forma attorno a ciascuno. Il numero sterico (NS) dell'atomo centrale è il numero di atomi legati più il numero di coppie solitarie sull'atomo centrale (un legame doppio o triplo conta come un solo atomo legato): CHCl₃ ha 4 atomi legati e 0 coppie solitarie, quindi NS = 4; H₂O ha 2 atomi legati e 2 coppie solitarie, NS = 4. Il numero sterico fissa la disposizione dei gruppi: 2 lineare, 3 trigonale planare, 4 tetraedrica, 5 bipiramide trigonale, 6 ottaedrica. Molecole con tutti i gruppi di legame (nessuna coppia solitaria): BeCl₂ e CO₂ lineari (NS 2), BF₃, BCl₃ e SO₃ trigonali planari (NS 3), CH₄, CCl₄, NH₄⁺, SO₄²⁻ e CHCl₃ tetraedrici (NS 4), PCl₅ bipiramide trigonale (NS 5), SF₆ ottaedrica (NS 6).","spiegazione":"Lega insieme per il nodo dei palloncini: si sistemano da soli il più lontano possibile uno dall'altro. Due palloncini si mettono in linea, tre a triangolo, quattro a tetraedro. Le coppie di elettroni fanno lo stesso attorno all'atomo centrale, e un legame doppio o triplo conta come un solo palloncino.","esempi":["BF₃: 3 atomi legati + 0 coppie solitarie → NS = 3 → trigonale planare.","CHCl₃: 4 atomi legati → NS = 4 → tetraedrica.","CO₂: due gruppi (due doppi legami) → lineare, 180°.","BF₃: tre gruppi → trigonale planare, 120°.","CF₄ e CH₄: quattro gruppi → tetraedrica, 109,5°.","PCl₅ bipiramide trigonale; SF₆ ottaedrica."]},{"titolo":"Coppie solitarie e polarità delle molecole","riassunto":"Nella descrizione della disposizione elettronica si contano tutte le regioni ad alta densità (legami e coppie solitarie), ma per indicare la forma della molecola si considerano solo le posizioni degli atomi. Si usa la formula VSEPR AXₙEₘ: A è l'atomo centrale, X un atomo legato, E una coppia solitaria. Le coppie solitarie sono localizzate sull'atomo centrale e occupano più spazio delle coppie di legame; l'intensità delle repulsioni segue l'ordine: coppia solitaria–coppia solitaria > coppia solitaria–coppia di legame > coppia di legame–coppia di legame. Per questo gli angoli di legame sono più piccoli di quelli ideali. Con 3 gruppi e una coppia solitaria la forma è angolare (< 120°); con 4 gruppi si hanno la piramide trigonale (AX₃E, come NH₃ e SO₃²⁻) e la forma angolare (AX₂E₂, come H₂O). Nella bipiramide trigonale la coppia solitaria si colloca in posizione equatoriale, dove l'energia è minore: AX₄E (SF₄) ad altalena, AX₃E₂ (ClF₃) a T, AX₂E₃ (XeF₂) lineare. Dall'ottaedro derivano AX₅E (BrF₅) piramide a base quadrata e AX₄E₂ (XeF₄) planare quadrata. Una molecola è polare se ha legami polari e una forma non simmetrica: i dipoli si sommano come vettori. La polarità influenza le forze intermolecolari, quindi punti di ebollizione e solubilità: le molecole polari si sciolgono bene in acqua. Tabella delle molecole (atomo centrale: NS = legati + solitarie → forma, polarità, ibridazione): NH₃ (3 + 1 = 4) piramide trigonale, polare, sp³; H₂O (2 + 2) angolata, polare, sp³; H₂S (2 + 2) angolata, polare; PCl₃ (3 + 1) piramide trigonale, polare, sp³; H₃O⁺ (3 + 1) piramide trigonale; ClO₃⁻ (3 + 1) piramide trigonale (come SO₃²⁻); SO₂ (2 + 1 = 3) angolata, polare, sp²; NO₃⁻ (3 + 0) trigonale planare; SF₄ (4 + 1 = 5) altalena, polare, sp³d; ClF₃ (3 + 2 = 5) a T, polare, sp³d; XeF₂ (2 + 3 = 5) lineare, apolare, sp³d; I₃⁻ (2 + 3 = 5) lineare; XeF₄ (4 + 2 = 6) planare quadrata, apolare, sp³d²; BrF₅ (5 + 1) piramide a base quadrata. Per trovare le coppie solitarie di un atomo centrale legato solo con legami singoli: (elettroni di valenza di A − numero di legami) / 2: NH₃ (5 − 3)/2 = 1; H₂O (6 − 2)/2 = 2; SF₄ (6 − 4)/2 = 1; ClF₃ (7 − 3)/2 = 2; XeF₂ (8 − 2)/2 = 3; XeF₄ (8 − 4)/2 = 2. Specie isoelettroniche hanno la stessa forma: ClO₃⁻ come SO₃²⁻. Polarità: una molecola è apolare se è simmetrica con atomi esterni uguali (BF₃, CCl₄, CO₂, SO₃, SF₆, PCl₅, XeF₄, XeF₂, BeCl₂); è polare se ha coppie solitarie sull'atomo centrale o atomi esterni diversi (H₂O, NH₃, SO₂, SF₄, ClF₃, CHCl₃, PCl₃); le biatomiche omonucleari (Br₂, H₂) sono apolari, quelle eteronucleari (HBr, HCl, HF) polari. Nel cis-2-butene i dipoli non si annullano (momento di dipolo non nullo), nel trans sì.","spiegazione":"Una coppia solitaria è un palloncino più gonfio degli altri: si prende più spazio e schiaccia i vicini, chiudendo gli angoli. Ecco perché si passa da 109,5° nel metano a circa 107° nell'ammoniaca e a circa 104,5° nell'acqua. La coppia solitaria però «non si vede»: la forma della molecola si legge guardando solo dove sono gli atomi.","esempi":["H₂O: NS = 2 + 2 = 4 → angolata, polare.","XeF₄: (8 − 4)/2 = 2 coppie solitarie, NS = 6 → planare quadrata, apolare.","CO₂ e BF₃: legami polari ma molecole simmetriche → apolari.","CH₄ 109,5° > NH₃ circa 107° > H₂O circa 104,5°.","CO₂: legami polari ma molecola lineare e simmetrica → apolare.","H₂O: legami polari e forma angolare → polare.","SF₄: cinque gruppi, uno solitario in posizione equatoriale → forma ad altalena."]},{"titolo":"Teoria del legame di valenza: legami σ e π","riassunto":"Il modello di Lewis assume che ogni coppia di legame sia localizzata tra i due atomi legati. La teoria del legame di valenza descrive il legame covalente con la meccanica quantistica: il legame nasce dalla sovrapposizione di orbitali atomici, e gli orbitali sovrapposti ospitano al massimo due elettroni (principio di Pauli). Maggiore è la sovrapposizione, più forte è il legame; se però gli atomi si avvicinano troppo, la repulsione tra i nuclei fa aumentare l'energia. Il legame singolo si forma lungo l'asse che congiunge i due nuclei ed è detto legame sigma (σ): ha simmetria cilindrica attorno all'asse e nessun piano nodale che lo contenga; i più comuni derivano da sovrapposizioni s-s, s-p e p-p frontali. Gli orbitali p perpendicolari all'asse possono sovrapporsi solo lateralmente, formando un legame pi greco (π), con due lobi di densità elettronica ai due lati dell'asse e un piano nodale che lo contiene. Un legame multiplo è formato da un solo legame σ più uno (doppio) o due (triplo) legami π. La sovrapposizione laterale è minore di quella frontale, quindi il legame π è più debole del σ: per questo un legame multiplo carbonio-carbonio è più debole della somma dei legami singoli (circa 350, 610 e 840 kJ/mol). Come contare σ e π in una molecola: ogni legame singolo è un σ; un doppio legame è 1 σ + 1 π; un triplo è 1 σ + 2 π. C₂H₄: 4 C–H + 1 C=C = 5 σ e 1 π; C₂H₂: 2 C–H + 1 C≡C = 3 σ e 2 π; CO₂: 2 σ e 2 π; N₂: 1 σ e 2 π.","spiegazione":"Due orbitali che si incontrano «di punta», come due mani che si stringono, danno il legame σ: solido e libero di ruotare. Due orbitali p affiancati che si toccano «di fianco», sopra e sotto l'asse, danno il legame π: più debole e che blocca la rotazione. Ogni legame ha sempre un σ; i π si aggiungono dopo.","esempi":["C₂H₄: 5 σ e 1 π.","C₂H₂: 3 σ e 2 π.","N₂: un legame σ (2pz frontali) + due legami π (2px e 2py laterali).","C–C circa 350 kJ/mol, C=C circa 610: il π vale circa 260, meno del σ.","I doppi legami sono rari tra elementi dal terzo periodo in poi: gli atomi sono troppo grandi per una buona sovrapposizione laterale."]},{"titolo":"Ibridazione degli orbitali","riassunto":"Applicando il legame di valenza al metano si incontra una difficoltà: il carbonio ha solo due orbitali 2p semipieni, ma forma sempre quattro legami disposti a tetraedro. L'ibridazione è la combinazione lineare di orbitali atomici dello stesso atomo in nuovi orbitali, gli ibridi. Mescolando l'orbitale s con tre orbitali p si ottengono quattro orbitali ibridi sp³ diretti verso i vertici di un tetraedro (109,5°); ogni ibrido ha un lobo più esteso dell'altro, che gli permette una sovrapposizione più efficace e legami più forti. Nel metano ciascun ibrido sp³ si sovrappone a un orbitale 1s dell'idrogeno. Lo stesso schema vale per ammoniaca e acqua, che hanno disposizione elettronica tetraedrica. Per una disposizione trigonale planare (BF₃, ciascun carbonio dell'etene) si mescolano un orbitale s e due p: tre ibridi sp² a 120°, e resta un orbitale p non ibridato che forma il legame π. Per una disposizione lineare (CO₂, etino) si mescolano un s e un p: due ibridi sp a 180°, con due orbitali p liberi per due legami π. Per cinque o sei coppie (PCl₅, SF₆) si usano anche orbitali d. Nel benzene ogni carbonio è sp²: i sei orbitali p formano una nube π delocalizzata sopra e sotto il piano dell'anello, e tutti i legami C–C misurano 139 pm, tra un legame singolo (154 pm) e uno doppio (134 pm). Come si trova l'ibridazione: si calcola il numero sterico NS dell'atomo centrale (atomi legati + coppie solitarie): NS 2 → sp, 3 → sp², 4 → sp³, 5 → sp³d, 6 → sp³d². PCl₃ (3 + 1 = 4) è sp³; NH₄⁺ (4) sp³; SO₂ (2 + 1 = 3) sp²; BF₃ sp²; PCl₅ sp³d; SF₆ sp³d². Il carbonio con 4 legami singoli (CH₄, etano, diamante) è sp³; con un doppio legame (etene, benzene) è sp²; con un triplo legame (etino) è sp. Nel diamante ogni carbonio è ibridato sp³ (legato a 4 altri carbonio in un reticolo tetraedrico): l'affermazione «il carbonio del diamante non è ibridato» è falsa. Il benzene è planare perché i suoi carboni sono sp², e ha in comune con l'etene l'ibridazione sp².","spiegazione":"Ibridare significa mescolare gli ingredienti prima di usarli: un orbitale s e tre p, impastati insieme, danno quattro porzioni identiche (sp³). Il nome dice la ricetta, e il numero di ibridi coincide con il numero di gruppi di elettroni attorno all'atomo: 4 gruppi sp³, 3 gruppi sp², 2 gruppi sp.","esempi":["PCl₃: NS = 3 + 1 = 4 → sp³.","Diamante: C sp³ (4 legami σ tetraedrici).","CH₄, NH₃, H₂O: atomo centrale sp³.","Etene C₂H₄: carboni sp², un σ e un π tra i due carboni.","Etino C₂H₂: carboni sp, un σ e due π.","Etano C₂H₆: legame σ tra due ibridi sp³."]},{"titolo":"Teoria degli orbitali molecolari","riassunto":"Le teorie di Lewis e del legame di valenza prevedono che O₂ sia diamagnetico (tutti gli elettroni appaiati), mentre l'ossigeno liquido è paramagnetico. Nella teoria degli orbitali molecolari (OM) gli elettroni occupano orbitali estesi a tutta la molecola: tutti gli elettroni di valenza sono delocalizzati. Gli OM si ottengono in modo approssimato con il metodo LCAO (combinazione lineare di orbitali atomici): il numero di orbitali molecolari formati è uguale al numero di orbitali atomici combinati. Se le onde interferiscono costruttivamente si ha un orbitale legante, a energia più bassa degli orbitali atomici, con maggiore densità elettronica tra i nuclei; se interferiscono distruttivamente si ha un orbitale antilegante (indicato con *), a energia più alta. Gli OM si riempiono secondo aufbau, Pauli e Hund. Gli orbitali atomici si combinano solo se hanno energia simile, buona sovrapposizione e la stessa simmetria rispetto all'asse di legame. L'ordine di legame è ½ (elettroni negli orbitali leganti − elettroni negli antileganti): se è maggiore di zero la molecola è più stabile degli atomi separati, se è zero la molecola non si forma; più è alto, più forte è il legame. HOMO è l'orbitale occupato a più alta energia, LUMO quello vuoto a più bassa energia. Nelle molecole biatomiche eteronucleari il diagramma è asimmetrico: l'atomo più elettronegativo ha orbitali atomici a energia più bassa e la densità elettronica è maggiore vicino a esso. Costruire l'ordine di legame di una biatomica omonucleare del secondo periodo: si riempiono gli orbitali molecolari con gli elettroni di valenza totali, nell'ordine di energia. Per Li₂, Be₂, B₂, C₂, N₂: σ2s, σ*2s, π2p (due orbitali), σ2p, π*2p (due), σ*2p; per O₂ e F₂ lo σ2p sta sotto i π2p. Ordine di legame OL = (e⁻ leganti − e⁻ antileganti) / 2; gli orbitali π e π* hanno due orbitali degeneri: si riempiono uno per uno (Hund). Elettroni di valenza: Li₂ 2, Be₂ 4, B₂ 6, C₂ 8, N₂ 10, O₂ 12, F₂ 14; per uno ione si toglie o si aggiunge un elettrone per carica. Risultati: H₂ OL 1; H₂⁺ 0,5; H₂⁻ 0,5; He₂ 0 (non esiste); Li₂ 1 (diamagnetico); Be₂ 0; B₂ 1 (2 spaiati, paramagnetico); C₂ 2 (diamagnetico); N₂ 3 (diamagnetico); N₂⁺ 2,5; O₂⁺ 2,5; O₂ 2 (2 spaiati, paramagnetico); O₂⁻ 1,5; O₂²⁻ 1; F₂ 1; Ne₂ 0. Più alto è OL, più il legame è forte e corto; una specie con elettroni spaiati è paramagnetica, con tutti gli elettroni appaiati è diamagnetica.","spiegazione":"Gli elettroni negli orbitali leganti sono «colla» tra i nuclei, quelli negli antileganti sono «solvente» che la scioglie. L'ordine di legame fa il bilancio: colla meno solvente, diviso due. Se il bilancio è zero, come in He₂, non resta nessun legame e la molecola non esiste.","esempi":["O₂⁻ (13 e⁻): leganti 8, antileganti 5 → OL = 1,5; un elettrone spaiato.","C₂ (8 e⁻): π2p⁴ pieno → OL = 2, diamagnetico.","H₂: 2 elettroni leganti, 0 antileganti → ordine di legame 1.","He₂: 2 leganti e 2 antileganti → ordine di legame 0: non esiste.","N₂: ordine di legame 3. O₂: ordine di legame 2, con due elettroni spaiati → paramagnetico.","NO: un elettrone spaiato, molto reattivo, ordine di legame maggiore di 2."]},{"titolo":"Teoria delle bande, semiconduttori e diodi","riassunto":"Nel modello a elettroni liberi il metallo è un reticolo di nuclei in un mare di elettroni: spiega conducibilità elettrica e termica, malleabilità, opacità e lucentezza. La teoria delle bande tratta i solidi come la teoria degli OM: combinando gli orbitali atomici di tutti gli atomi si ottengono tanti stati quanti sono gli orbitali combinati, così vicini in energia da formare una banda; ogni stato contiene al massimo due elettroni. Lo stato occupato a più alta energia nello stato fondamentale è il livello di Fermi. Nei metalli alcalini la banda di valenza s è piena solo a metà: per questo conducono, e la banda di valenza è anche banda di conduzione. Nei metalli alcalino-terrosi la banda s è piena, ma si sovrappone alla banda p vuota, quindi conducono. La differenza tra metalli, semiconduttori e isolanti sta nel gap di energia tra banda di valenza e banda di conduzione, da confrontare con l'energia termica kB·T: gap molto maggiore → isolante (diamante); gap nullo o piccolo → conduttore (sodio, stagno); gap intermedio → semiconduttore (silicio). Nei semiconduttori intrinseci una piccola frazione di elettroni è eccitata nella banda di conduzione, e anche le lacune lasciate nella banda di valenza trasportano corrente. Nei semiconduttori estrinseci si aggiungono impurezze (droganti): tipo n se forniscono elettroni in più (Si con P), tipo p se forniscono lacune (Si con Ga). Un diodo è la giunzione tra un semiconduttore n e uno p: la corrente passa in un solo verso. Nel fotodiodo la luce eccita gli elettroni e genera corrente: è il principio delle celle solari. Droganti: il silicio (gruppo 14) drogato con elementi del gruppo 15 (P, As, Sb) dà un semiconduttore di tipo n (un elettrone di valenza in più), drogato con elementi del gruppo 13 (B, Al, Ga) dà il tipo p (un elettrone in meno, quindi lacune). Gap di riferimento a temperatura ambiente: silicio 1,1 eV, germanio 0,67 eV (semiconduttori); diamante circa 5,5 eV (isolante); i metalli hanno gap nullo (bande sovrapposte o semipiene). In generale: gap fino a circa 3 eV → semiconduttore; gap molto più grande → isolante; gap nullo → conduttore.","spiegazione":"Pensa a un parcheggio a due piani. Il piano di sotto (banda di valenza) è dove stanno normalmente le auto; quello di sopra (banda di conduzione) è dove possono circolare. Nei metalli i due piani sono collegati o il primo è mezzo vuoto: si circola sempre. Negli isolanti la rampa è altissima e nessuno sale. Nei semiconduttori la rampa è bassa: basta un po' di energia (calore, luce) per far salire qualche auto. Drogare significa aggiungere auto in più (tipo n) o posti vuoti (tipo p).","esempi":["Si + Sb (gruppo 15): tipo n. Si + Ga (gruppo 13): tipo p.","Gap 1,4 eV → semiconduttore; gap 6 eV → isolante.","Sodio: banda 3s semipiena → ottimo conduttore.","Berillio: banda 2s piena ma sovrapposta alla 2p → conduce.","Silicio drogato con fosforo: tipo n. Silicio drogato con gallio: tipo p.","Diodi, LED e celle solari al silicio sono applicazioni delle giunzioni p-n."]}]},{"id":"organica","n":7,"titolo":"Chimica organica","icona":"🛢️","colore":"#facc15","descrizione":"Lezione 7 · Idrocarburi, nomenclatura, isomeria, reazioni, gruppi funzionali e polimeri.","argomenti":[{"titolo":"Il carbonio e gli idrocarburi","riassunto":"La chimica organica studia i composti del carbonio (molecole come CO e CO₃²⁻ non sono considerate organiche). Il carbonio forma soprattutto legami covalenti ed è più stabile con quattro legami: con quattro legami singoli è tetraedrico (sp³); con due singoli e uno doppio è trigonale planare (sp², 3 legami σ e 1 π); con due doppi, o un triplo e un singolo, è lineare (sp, 2 σ e 2 π). I legami C=C e C≡C sono più reattivi di C–C. Gli idrocarburi contengono solo carbonio e idrogeno; sono insolubili in acqua perché non hanno legami polari. Si dividono in alifatici e aromatici. Gli alifatici saturi sono gli alcani (o paraffine): solo legami singoli C–C, formula generale CₙH₂ₙ₊₂ per le catene, molto poco reattivi; possono essere catene lineari o ramificate oppure anelli (cicloalcani, CₙH₂ₙ). Gli insaturi sono gli alcheni (olefine), con un doppio legame C=C, formula CₙH₂ₙ, geometria planare attorno al doppio legame, molto più reattivi degli alcani; e gli alchini (acetileni), con un triplo legame C≡C, formula CₙH₂ₙ₋₂, lineari. Gli idrocarburi aromatici contengono l'anello del benzene: anche se spesso si disegna con doppi legami, non si comporta come un alchene. Tra le molecole di alcani agiscono forze di London; le catene lunghe e non ramificate hanno punti di fusione ed ebollizione più alti dei loro isomeri ramificati. Per contare gli atomi nelle formule generali si usa n = numero di atomi di carbonio. Un alcano saturo con n atomi di C ha 2n + 2 idrogeni (CH₄, C₂H₆, C₃H₈, C₄H₁₀, C₅H₁₂, C₆H₁₄); un alchene o un cicloalcano ne ha 2n (C₂H₄, C₅H₁₀, C₆H₁₂); un alchino 2n − 2 (C₂H₂, C₄H₆). Per ricordare i nomi dei primi dieci alcani servono i prefissi numerici: met- (1), et- (2), prop- (3), but- (4), pent- (5), es- (6), ept- (7), ott- (8), non- (9), dec- (10), seguiti da -ano (alcano), -ene (alchene), -ino (alchino); il cicloalcano ha davanti «ciclo» (ciclopentano C₅H₁₀, cicloesano C₆H₁₂). Per trovare le insaturazioni di una formula CₙHₘ: si calcola l'idrogeno dell'alcano saturo (2n + 2), si sottrae m e si divide per 2; ogni doppio legame o ogni anello vale 1 insaturazione, ogni triplo legame vale 2. Per C₅H₆: (12 − 6)/2 = 3 insaturazioni. Il benzene C₆H₆ ha (14 − 6)/2 = 4 insaturazioni (tre doppi legami e un anello). Poiché alcheni e cicloalcani hanno la stessa formula CₙH₂ₙ, un cicloalcano è isomero dell'alchene con lo stesso numero di C: il cicloesano e l'esene sono entrambi C₆H₁₂. Solubilità: l'acqua è polare, quindi solubilizza le sostanze polari («il simile scioglie il simile»). Gli idrocarburi sono apolari e non si sciolgono in acqua. Un alcol ha un gruppo –OH polare che forma legami a idrogeno con l'acqua: quelli a catena corta (metanolo, etanolo) sono miscibili con l'acqua in ogni proporzione; più la catena apolare si allunga, più la solubilità diminuisce. Tra un alcano e l'etanolo, il più solubile in acqua è l'etanolo. Il toluene (metilbenzene, C₆H₅CH₃) è un composto aromatico: contiene l'anello benzenico con un gruppo metile –CH₃; anche fenolo, anilina e stirene sono aromatici.","spiegazione":"Il carbonio è il mattoncino con quattro attacchi: può agganciarsi ad altri carboni in catene, rami e anelli praticamente senza limiti. «Saturo» significa che ogni carbonio ha già tutti gli idrogeni che può portare; ogni doppio legame toglie due idrogeni, ogni triplo ne toglie quattro: da qui le tre formule generali.","esempi":["Alcano con 6 C: 2·6 + 2 = 14 H → C₆H₁₄ (esano). Alchino con 4 C: 2·4 − 2 = 6 H → C₄H₆ (butino). Cicloalcano con 9 C: 18 H → C₉H₁₈.","C₅H₆: alcano saturo C₅H₁₂, mancano 6 H, cioè 3 coppie → 3 insaturazioni. C₅H₁₀: mancano 2 H → 1 insaturazione (un doppio legame oppure un anello: pentene o ciclopentano).","Solubilità in acqua: pentano e benzene insolubili (apolari); etanolo miscibile in ogni proporzione; 1-ottanolo poco solubile (catena lunga apolare).","Metano CH₄ (−162 °C), etano, propano, butano (0 °C), pentano (36 °C), esano (69 °C): il punto di ebollizione cresce con la catena.","Etene (etilene) C₂H₄; etino (acetilene) C₂H₂.","Cicloesano C₆H₁₂: esiste nelle conformazioni a sedia e a barca.","Da 1 a 4 atomi di C gli idrocarburi sono gas (combustibili da riscaldamento e cucina); oltre 50 sono solidi (paraffina)."]},{"titolo":"Formule e nomenclatura","riassunto":"La formula molecolare dice solo quali atomi ci sono; la formula di struttura mostra come sono collegati; nella formula condensata gli atomi legati sono elencati in ordine; nella formula a linee ogni vertice ed estremità rappresenta un carbonio e gli idrogeni legati al carbonio sono omessi. Ogni nome è formato da tre parti: il prefisso (posizione, numero e tipo dei sostituenti), la radice (lunghezza della catena o dell'anello più lungo) e il suffisso (tipo di composto: -ano, -ene, -ino, o gruppo funzionale). Regole per gli alcani: 1) si trova la catena continua più lunga; 2) si individuano i sostituenti, il cui nome si ottiene cambiando -ano in -ile (metile, etile, propile); 3) si numera la catena in modo da dare ai sostituenti i numeri più bassi; 4) si indica quanti sostituenti uguali ci sono con di-, tri-, tetra-; 5) si elencano i sostituenti in ordine alfabetico, ignorando i prefissi moltiplicativi. Nei cicloalcani la numerazione parte da un carbonio sostituito. Per alcheni e alchini il suffisso diventa -ene o -ino e la posizione del legame multiplo è indicata dal numero più basso dei due carboni coinvolti; i legami multipli hanno la precedenza nella numerazione. Per i derivati del benzene: (sostituente)benzene, oppure nomi comuni (toluene, anilina, fenolo, stirene); per due sostituenti si usano i prefissi orto- (1,2), meta- (1,3), para- (1,4). Il benzene come sostituente si chiama fenile. Prefissi per la lunghezza della catena: met- (1 C), et- (2), prop- (3), but- (4), pent- (5), es- (6), ept- (7), ott- (8), non- (9), dec- (10); l'alcano si chiama prefisso + «-ano» (metano, etano, propano, butano, pentano, esano). Il sostituente si ottiene cambiando -ano in -ile: –CH₃ metile, –CH₂CH₃ etile. Il suffisso dipende dal gruppo funzionale: alcol -olo (la posizione dell'OH è un numero: 1-butanolo = CH₃CH₂CH₂CH₂OH, OH sul primo carbonio; il suo nome alternativo è butan-1-olo), aldeide -ale (il carbonile è sempre in fondo alla catena, quindi è il carbonio 1), chetone -one (il carbonile sta all'interno della catena, tra due carboni: il chetone più semplice ha 3 C ed è il propanone o acetone), acido carbossilico «acido … -oico», estere «…-oato di alchile», ammina -ammina. L'aldeide più semplice è il metanale H₂C=O (formaldeide, CH₂O). Nomi comuni da conoscere: etilene = etene (C₂H₄), acetilene = etino (C₂H₂), acetone = propanone, formaldeide = metanale, acido formico = acido metanoico, acido acetico = acido etanoico, toluene = metilbenzene, fenolo = benzene con un OH (C₆H₅OH, formula bruta C₆H₆O). Non confondere con la nomenclatura inorganica: CO è il monossido di carbonio (un atomo di C e uno di O), CO₂ il diossido (anidride carbonica). Per ricavare la formula bruta da una formula condensata si contano tutti gli atomi: il 2-propanolo CH₃CH(OH)CH₃ ha 3 C, 8 H (3 + 1 + 1 + 3) e 1 O → C₃H₈O; il 1-butanolo CH₃CH₂CH₂CH₂OH → C₄H₁₀O. Il numero di atomi di C si legge dal prefisso: l'etano ne ha 2, il pentano 5. Nei derivati del benzene con due sostituenti, para = posizioni 1,4: il para-clorotoluene è il 4-clorotoluene.","spiegazione":"Il nome IUPAC è un indirizzo: la radice è la via (la catena più lunga), i numeri sono i civici e i prefissi dicono chi abita a ciascun civico. La regola d'oro è scegliere il verso di numerazione che dà i civici più bassi.","esempi":["Alcano lineare con 7 C: ept- + -ano = eptano. Il nome «ottano» corrisponde a 8 C, «nonano» a 9.","CH₃CH₂CH₂OH: 3 C (prop-), gruppo OH sul carbonio 1 → 1-propanolo. CH₃CH₂CH₂CH₂CHO: aldeide a 5 C → pentanale. CH₃CH₂COOH: acido propanoico (3 C).","Formula bruta dall'aspetto condensato: contare C, H, O. CH₃CH₂OH → C₂H₆O. CH₃COCH₃ → C₃H₆O (propanone).","CH₃CH(CH₃)CH₂CH(CH₂CH₃)CH₂CH₃ → 4-etil-2-metilesano.","1-etil-3-metilcicloesano; 3-etil-1,1-dimetilcicloesano.","2-metil-1-pentene; 3-metil-1-pentino.","o-clorotoluene = 2-clorotoluene; 1,3-dibromobenzene = meta-dibromobenzene."]},{"titolo":"Isomeria","riassunto":"Gli isomeri sono molecole diverse con la stessa formula molecolare. Gli isomeri di struttura (o costituzionali) hanno gli atomi collegati in modo diverso: butano (p.e. 0 °C) e isobutano (p.e. −12 °C) sono entrambi C₄H₁₀. La rotazione attorno a un legame singolo non dà isomeri. Gli stereoisomeri hanno gli atomi collegati nello stesso ordine ma orientati diversamente nello spazio. Gli isomeri ottici sono immagini speculari non sovrapponibili: una molecola con questa proprietà è chirale, e un carbonio con quattro sostituenti diversi è un centro chirale; le due immagini speculari formano una coppia di enantiomeri. Gli enantiomeri hanno le stesse proprietà fisiche tranne una: ruotano il piano della luce polarizzata della stessa quantità ma in versi opposti (destrogiro e levogiro). Una miscela equimolare dei due è una miscela racemica e non dà rotazione. In un ambiente non chirale gli enantiomeri hanno la stessa reattività, in un ambiente chirale (per esempio un enzima) possono comportarsi diversamente. Gli isomeri geometrici sono stereoisomeri che non sono isomeri ottici: poiché la rotazione attorno a un doppio legame è fortemente impedita, i gruppi possono trovarsi dallo stesso lato (cis) o da lati opposti (trans). Isomeria cis-trans: serve un doppio legame C=C in cui ciascuno dei due carboni abbia due sostituenti diversi. Il 2-butene CH₃CH=CHCH₃ e il 2-esene CH₃CH=CHCH₂CH₂CH₃ la hanno (su ogni carbonio c'è un H e un gruppo alchilico). L'1-butene, il propene CH₂=CHCH₃, l'etene e il 2-metilpropene no, perché un carbonio del doppio legame porta due gruppi uguali (due H o due metili). Per il momento di dipolo: nel cis-2-butene i due gruppi –CH₃ stanno dallo stesso lato e i dipoli dei legami si sommano, per cui μ ≠ 0; nel trans-2-butene stanno da lati opposti e i dipoli si annullano, quindi μ = 0 (la molecola è simmetrica). Numero di isomeri di struttura da ricordare: C₄H₁₀ ne ha 2 (butano e isobutano), C₅H₁₂ ne ha 3, C₆H₁₄ ne ha 5, C₇H₁₆ ne ha 9, C₈H₁₈ ne ha 18; metano, etano e propano ne hanno uno solo, quindi 4 atomi di C è il minimo per avere isomeria di struttura. Altri casi: C₃H₈O ha 3 isomeri (1-propanolo, 2-propanolo ed etere metiletilico), C₄H₈ come alcheni ne ha 3 (1-butene, 2-butene e 2-metilpropene), il bromobutano C₄H₉Br ne ha 4. Nel benzene bisostituito (per esempio il dibromobenzene C₆H₄Br₂) gli isomeri sono 3: orto (1,2), meta (1,3), para (1,4); il tribromobenzene C₆H₃Br₃ ne ha 3 (1,2,3; 1,2,4; 1,3,5). Lo stesso numero di atomi può dare classi diverse: il cicloesano e l'esene sono entrambi C₆H₁₂ e sono isomeri.","spiegazione":"Le tue mani sono l'esempio perfetto di chiralità: sono una l'immagine speculare dell'altra, ma non riesci a sovrapporle (il guanto destro non entra nella mano sinistra). Due enantiomeri sono «molecola destra» e «molecola sinistra»: stessi pezzi, stessa costruzione, ma mai sovrapponibili.","esempi":["2-pentene: C2 lega H e CH₃, C3 lega H e CH₂CH₃ → ha forma cis e trans. Propene: C1 lega due H → non ha isomeria cis-trans.","Cis-2-butene: μ ≠ 0. Trans-2-butene: μ = 0. Il cis ha di norma punto di ebollizione leggermente più alto perché è polare.","Isomeri di C₅H₁₂: pentano, 2-metilbutano (isopentano), 2,2-dimetilpropano (neopentano) → 3.","C₄H₁₀: butano e isobutano, isomeri di struttura.","3-metilesano: il carbonio 3 lega H, metile, etile e propile → centro chirale.","cis-2-butene e trans-2-butene: isomeri geometrici.","Un enzima può riconoscere un solo enantiomero di una coppia."]},{"titolo":"Reazioni degli idrocarburi e combustibili","riassunto":"Tutti gli idrocarburi danno combustione, sempre esotermica, producendo CO₂ e H₂O. Gli alcani danno inoltre reazioni di sostituzione: un idrogeno è sostituito da un atomo di alogeno; la reazione è avviata da calore o luce ultravioletta e di solito dà più prodotti. Alcheni e alchini danno reazioni di addizione al legame multiplo: idrogenazione (addizione di H₂, che trasforma l'insaturo in saturo), alogenazione (addizione di X₂) e idroalogenazione (addizione di HX). Quando si addiziona un reagente polare, la parte positiva si lega al carbonio che ha più idrogeni. Gli idrocarburi aromatici, pur essendo insaturi, sono poco reattivi e danno soprattutto sostituzione, lasciando intatti i legami π dell'anello. Gli idrocarburi alifatici si ottengono principalmente dal petrolio; il carbone è un'altra fonte di aromatici. La quantità di benzina ottenibile dal petrolio si aumenta con il cracking (rottura delle catene lunghe) e l'alchilazione (unione di molecole piccole). L'aromatizzazione converte un alcano in un arene; l'isomerizzazione converte gli idrocarburi lineari (basso numero di ottano) nei loro isomeri ramificati (alto numero di ottano). Il numero di ottano misura la qualità della benzina, cioè quanto regolarmente brucia. Equazione della combustione completa: CₓHᵧ + (x + y/4) O₂ → x CO₂ + (y/2) H₂O. Per un alcano CₙH₂ₙ₊₂ i coefficienti diventano (3n + 1)/2 per O₂, n per CO₂ e (n + 1) per H₂O. Per esempio CH₄ + 2 O₂ → CO₂ + 2 H₂O; C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O; C₅H₈ richiede 5 + 8/4 = 7 mol di O₂ per mole. Per bilanciare: prima i C (nella CO₂), poi gli H (nell'acqua), infine gli O. Per calcolare i grammi: n = m/M del combustibile, le moli di CO₂ sono x volte tante, m(CO₂) = n(CO₂) · 44,01 g/mol (la massa dell'acqua con M(H₂O) = 18,02 g/mol). Per i gas, a temperatura e pressione costanti i volumi sono proporzionali alle moli (Avogadro): i rapporti dei coefficienti sono anche rapporti di volume, quindi 35 L di CH₄ danno 35 L di CO₂ e consumano 70 L di O₂. Un gruppo alchilico (R–) è un alcano privato di un atomo di idrogeno, con formula CₙH₂ₙ₊₁: metile –CH₃, etile –CH₂CH₃, propile –CH₂CH₂CH₃. Riassunto dei tre idrocarburi alifatici: alcani CₙH₂ₙ₊₂ (saturi, solo legami singoli), alcheni CₙH₂ₙ (un doppio legame, insaturi), alchini CₙH₂ₙ₋₂ (un triplo legame, insaturi). L'etilene (etene, C₂H₄) è un alchene: è insaturo, ha un doppio legame C=C e geometria planare; non è un idrocarburo saturo.","spiegazione":"Gli alcani hanno solo legami σ, forti e «tranquilli»: per farli reagire bisogna strappare un H e mettere altro al suo posto (sostituzione). Alcheni e alchini hanno invece un legame π più debole e «a portata di mano»: si apre e aggancia due nuovi atomi (addizione). Il benzene ha i π, ma li tiene delocalizzati e stabili: preferisce la sostituzione.","esempi":["C₈H₁₈ (M = 114,23 g/mol), 55 g: n = 55/114,23 = 0,481 mol; CO₂ = 8·0,481 = 3,85 mol → 3,85·44,01 = 170 g.","CH₄: 1 vol → 1 vol CO₂ e 2 vol O₂ (A T e P costanti). 35 L di CH₄ → 35 L di CO₂ e 70 L di O₂.","Moli di O₂ per 1 mol di C₅H₈: x = 5, y = 8 → 5 + 8/4 = 7 mol.","Gruppo alchilico: propano C₃H₈ − H → propile C₃H₇–.","2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O.","CH₃CH₃ + Cl₂ → CH₃CH₂Cl + HCl (con calore o luce UV).","CH₂=CH₂ + H₂ → CH₃CH₃ (idrogenazione).","CH₃CH=CH₂ + HCl → CH₃CHClCH₃ (2-cloropropano)."]},{"titolo":"Gruppi funzionali con alogeni e ossigeno","riassunto":"Molti composti organici sono idrocarburi in cui un idrogeno è sostituito da un gruppo funzionale, un gruppo di atomi che influenza in modo caratteristico le proprietà della molecola e ne determina le reazioni; la catena idrocarburica si indica con R. Alogenoalcani (alogenuri alchilici): un H è sostituito da un alogeno; l'alogeno si nomina come sostituente (2-bromobutano). Alcoli, R–OH: il nome si ottiene con il suffisso -olo (metanolo, etanolo, 2-butanolo) o con il prefisso idrossi-; sono primari, secondari o terziari secondo il numero di gruppi organici legati al carbonio che porta l'OH. Il fenolo è un OH legato a un anello benzenico. Eteri, R–O–R: poco reattivi e più volatili degli alcoli di massa molare simile, perché le loro molecole non formano legami a idrogeno tra loro. Il gruppo carbonilico C=O è molto polare: le aldeidi hanno almeno un H legato al carbonile (suffisso -ale: metanale, pentanale), i chetoni due gruppi R (suffisso -one: propanone, cioè acetone). Acidi carbossilici, RCOOH: acidi deboli dal sapore aspro (acido metanoico o formico, acido etanoico o acetico). Esteri, R–COO–R: odore dolce, si ottengono da un acido carbossilico e un alcol (esterificazione) e si nominano come alcanoati di alchile (butanoato di metile). Una reazione di condensazione è una reazione in cui si elimina una piccola molecola, come l'acqua. Riconoscere la classe dal gruppo: –OH legato a un carbonio saturo = alcol (R–OH); –CHO (C=O con almeno un H) = aldeide; –CO– tra due carboni = chetone; –COOH = acido carbossilico; –COO– tra due carboni = estere; –O– tra due carboni = etere; –NH₂, –NHR, –NR₂ = ammina; –CONH₂ = ammide. Il gruppo carbonilico C=O è presente in aldeidi, chetoni, acidi carbossilici, esteri e ammidi, ma non negli alcoli (R–OH) né negli eteri. Il gruppo –OH degli alcoli è detto ossidrile o ossidrilico. Ossidazione degli alcoli: un alcol primario si ossida ad aldeide e poi ad acido carbossilico (stesso numero di C); un alcol secondario si ossida a chetone e si ferma lì; un alcol terziario (nessun H sul carbonio che porta l'OH) non si ossida. Quindi dal 2-propanolo si ottiene solo propanone: non si può ottenere acido propanoico (servirebbe un alcol primario come l'1-propanolo), né metanolo (che ha un solo C e il numero di carboni non cambia). 2-butanolo → butanone; 1-butanolo → butanale → acido butanoico; etanolo → etanale → acido etanoico. Un acido carbossilico ha un solo idrogeno acido: quello del gruppo –COOH; gli H legati ai carboni non sono acidi, quindi CH₃CH₂COOH ha 1 H acido. Formule: gli acidi carbossilici saturi sono CₙH₂ₙO₂ (acido etanoico C₂H₄O₂, acido butanoico CH₃CH₂CH₂COOH = C₄H₈O₂). Il metanolo CH₃OH, cioè CH₄O, ha M = 12,011 + 4·1,008 + 15,999 ≈ 32 g/mol. Esterificazione: R–COOH + R'–OH → R–COO–R' + H₂O (acido carbossilico + alcol; si catalizza con un acido). I perossidi sono composti con il legame O–O (H₂O₂, BaO₂): in essi l'ossigeno ha numero di ossidazione −1. Il toluene (metilbenzene) contiene il gruppo metile –CH₃.","spiegazione":"Il gruppo funzionale è la «testa» che decide il carattere della molecola, mentre la catena R è il «corpo» che lo porta in giro. Due molecole con catene diverse ma lo stesso gruppo funzionale reagiscono allo stesso modo: basta imparare la chimica di una dozzina di gruppi per orientarsi tra milioni di composti.","esempi":["Classificare: CH₃COCH₃ → chetone; CH₃CHO → aldeide; CH₃COOCH₃ → estere; CH₃OCH₃ → etere; CH₃CH₂OH → alcol; HCOOH → acido carbossilico.","2-butanolo (secondario) → butanone. 2-metil-2-propanolo (terziario) → nessuna ossidazione.","Etanolo + acido acetico → acetato di etile + H₂O.","Etanolo CH₃CH₂OH (bevande alcoliche); metanolo CH₃OH (velenoso).","Etere dietilico CH₃CH₂OCH₂CH₃, un tempo usato come anestetico.","Formaldeide H₂C=O (aldeide); acetone CH₃COCH₃ (chetone).","Acido acetico + alcol → estere + H₂O. L'aspirina contiene un gruppo estere."]},{"titolo":"Ammine, ammidi e amminoacidi","riassunto":"Le ammine sono composti organici contenenti azoto: hanno odore sgradevole, si formano nella decomposizione delle proteine (putrescina, cadaverina) e sono basi organiche deboli. Si nominano elencando in ordine alfabetico i gruppi legati all'azoto, seguiti dal suffisso -ammina (dimetilammina, trimetilammina); il gruppo –NH₂ come sostituente si chiama ammino-. Sono primarie, secondarie o terziarie secondo il numero di gruppi R legati all'azoto. Molte ammine sono biologicamente attive: dopamina (neurotrasmettitore), adrenalina (ormone), e gli alcaloidi, prodotti vegetali basici come nicotina, cocaina e morfina. Le ammine reagiscono con gli acidi forti formando sali di ammonio (RNH₂ + HCl → RNH₃⁺Cl⁻) e con gli acidi carbossilici, in una reazione di condensazione, formando ammidi (RCOOH + HNHR' → RCONHR' + H₂O). Un amminoacido è un acido carbossilico che contiene anche un gruppo amminico: ha nella stessa molecola un gruppo basico (–NH₂) e uno acido (–COOH). Il carattere basico delle ammine viene dall'azoto, che ha un doppietto elettronico libero capace di legare un H⁺ come nell'ammoniaca: R–NH₂ + H⁺ → R–NH₃⁺. Tra i composti organici le ammine sono le basi (le ammine sono basi deboli); gli acidi carbossilici sono acidi, gli alcoli, gli eteri e gli idrocarburi sono sostanzialmente neutri e le ammidi sono praticamente neutre. Primarie, secondarie, terziarie: si conta quante catene R sono legate all'azoto (1, 2 o 3). Ammina + acido forte (HCl) → sale di ammonio; ammina + acido carbossilico → ammide + H₂O (condensazione).","spiegazione":"Un'ammina è ammoniaca in cui uno o più idrogeni sono stati sostituiti da catene di carbonio: per questo si comporta da base, proprio come NH₃. Unendo il «lato acido» di una molecola con il «lato basico» di un'altra ed eliminando acqua si ottiene il legame ammidico, lo stesso che tiene insieme le proteine e il nylon.","esempi":["CH₃CH₂NH₂ (etilammina) è una base debole: CH₃CH₂NH₂ + H⁺ → CH₃CH₂NH₃⁺.","CH₃COOH + CH₃NH₂ → CH₃CONHCH₃ (N-metiletanammide) + H₂O.","CH₃NHCH₂CH₃: etilmetilammina (secondaria).","H₂N(CH₂)₄NH₂: 1,4-butandiammina (putrescina).","RNH₂ + HCl → RNH₃⁺Cl⁻.","Alanina: un amminoacido, con –NH₂ e –COOH nella stessa molecola."]},{"titolo":"Polimeri","riassunto":"I polimeri sono molecole molto grandi formate dall'unione ripetuta di piccole molecole, i monomeri. Possono essere naturali, naturali modificati o sintetici (plastiche, elastomeri come la gomma, fibre, adesivi). Per struttura si distinguono polimeri lineari (polietilene ad alta densità HDPE, PVC, nylon, cotone), ramificati (polietilene a bassa densità LDPE), reticolati (gomma) e a rete (Kevlar, resine epossidiche). La polimerizzazione è il processo che unisce i monomeri e avviene in due modi. Nella polimerizzazione per addizione i monomeri si aggiungono alla catena in crescita in modo che tutti i loro atomi finiscano nella catena: non si formano sottoprodotti; è una reazione a catena che parte con il calore o con un iniziatore che «apre» il primo monomero. Nella polimerizzazione per condensazione i monomeri si uniscono eliminando piccole molecole (acqua, nel caso di poliesteri e poliammidi); non serve un iniziatore e ogni monomero ha due estremità reattive, per cui la catena cresce in due direzioni. Il PET è un poliestere (bottiglie di plastica); il nylon è una poliammide: il nylon 6,6 si ottiene condensando 1,6-esandiammina con acido esandioico. Per sapere come si polimerizza un monomero: se contiene un doppio legame C=C (etene, propene, cloruro di vinile, stirene, tetrafluoroetene, acrilonitrile) polimerizza per addizione, aprendo il doppio legame; se ha due gruppi funzionali reattivi (diammina + diacido, diolo + diacido) polimerizza per condensazione eliminando acqua. Coppie monomero → polimero da ricordare: etene → polietilene (M monomero 28,05 g/mol), propene → polipropilene (42,08), cloruro di vinile (cloroetene) → PVC (62,50), stirene → polistirene (104,15), tetrafluoroetene (C₂F₄) → teflon, cioè PTFE (100,02), acrilonitrile → poliacrilonitrile (53,06), metacrilato di metile → PMMA, o plexiglas (100,12); diammina + diacido → nylon; diolo + diacido (acido tereftalico) → PET. Grado di polimerizzazione: il numero n di unità monomeriche di una catena è n ≈ M(polimero)/M(monomero): ottenuto dividendo la massa molare media del polimero per quella del monomero. Per un polimero di addizione la massa del polimero è la somma delle masse dei monomeri (nessuna perdita); per uno di condensazione ogni legame forma una molecola di acqua da sottrarre.","spiegazione":"Un polimero è una collana e i monomeri sono le perle. Nell'addizione le perle si agganciano una all'altra senza scarti, come vagoni che si uniscono a un treno. Nella condensazione ogni aggancio «butta via» una piccola molecola d'acqua, come due persone che per darsi la mano devono lasciar cadere ciò che tenevano.","esempi":["PTFE: M = 2,75·10⁵ g/mol, monomero C₂F₄ (100,02): n = 275000/100,02 ≈ 2749 unità.","Polietilene con M = 280000 g/mol: n = 280000/28,05 ≈ 9982 unità di etene.","Etene → polietilene; cloruro di vinile → PVC (addizione).","LDPE: 1000–2000 unità; HDPE: 10 000–100 000; UHMWPE: 2–6 milioni.","Diammina + diacido → nylon 6,6 + H₂O (condensazione).","PET: gruppi estere ripetuti lungo la catena."]}]},{"id":"gas","n":8,"titolo":"Lo stato gassoso","icona":"💨","colore":"#60a5fa","descrizione":"Lezione 8 · Proprietà dei gas, leggi empiriche, equazione dei gas ideali, miscele gassose e gas reali.","argomenti":[{"titolo":"Proprietà dei gas e pressione","riassunto":"Un gas non ha né forma né volume propri: può essere compresso o espanso. Le sue molecole sono in genere lontane le une dalle altre e si muovono in modo casuale; la temperatura misura l'energia cinetica delle molecole: più è alta, più velocemente (in media) si muovono. I gas assumono la forma del recipiente e lo riempiono completamente; hanno densità basse (l'aria è circa 1000 volte meno densa dell'acqua); si mescolano completamente tra loro formando miscele omogenee (l'aria); si comprimono (e, riducendo abbastanza il volume, liquefano) e si espandono. La pressione di un gas è il risultato degli urti delle molecole, in continuo movimento, contro le pareti interne del recipiente: più frequenti sono gli urti, più alta è la pressione. P = forza / area. Unità: 1 atm = 760 mmHg (torr) = 101 325 Pa = 14,7 psi; 1 bar = 10⁵ Pa. La pressione atmosferica è dovuta alle molecole dell'aria; Torricelli la misurò nel 1643 con il barometro: al livello del mare vale 760 torr. Conversioni di pressione: si passa sempre per l'atmosfera. 1 atm = 760 mmHg = 760 torr = 101 325 Pa = 101,325 kPa = 1,01325 bar; 1 mmHg = 1 torr; 1 kPa = 1000 Pa; 1 bar = 10⁵ Pa = 100 kPa. Per convertire si divide per il valore di 1 atm nell'unità di partenza e si moltiplica per quello dell'unità di arrivo: 4,56 bar → 4,56/1,01325 = 4,5 atm → 4,5·101,325 = 456 kPa. Sono unità di pressione: atm, mmHg, torr, Pa, kPa, bar, psi; il debye (D) invece misura il momento di dipolo di una molecola, non la pressione. Prima legge utile (Boyle): a temperatura costante P₁V₁ = P₂V₂, cioè V₂ = P₁V₁/P₂: se la pressione raddoppia il volume si dimezza. Esempio: 500 mL a 0,75 atm portati a 1,50 atm hanno V₂ = 0,75·500/1,50 = 250 mL (l'unità del volume resta quella di partenza, basta che le due pressioni abbiano la stessa unità).","spiegazione":"Immagina una stanza piena di palline che rimbalzano a caso: ogni urto contro le pareti è una piccola spinta. La pressione è la somma di tutte queste spinte. Se scaldi, le palline corrono di più e colpiscono più forte; se rimpicciolisci la stanza, colpiscono più spesso. In entrambi i casi la pressione sale.","esempi":["4,56 bar → atm: 4,56/1,01325 = 4,50 atm → kPa: 4,50·101,325 = 456 kPa.","760 mmHg = 1 atm; 380 mmHg = 0,50 atm; 1520 torr = 2,00 atm.","Boyle: 500 mL a 0,75 atm → a 1,50 atm: V₂ = (0,75·500)/1,50 = 250 mL.","380 mmHg = 380 / 760 = 0,50 atm.","Densità dell'aria circa 0,001 g/mL, dell'acqua 1,0 g/mL.","Una molecola di gas subisce circa 10¹⁰ urti al secondo."]},{"titolo":"Le leggi empiriche dei gas","riassunto":"Legge di Boyle: a temperatura costante (e moli costanti) il volume di un gas è inversamente proporzionale alla pressione applicata, P₁V₁ = P₂V₂. Legge di Charles: a pressione costante il volume è direttamente proporzionale alla temperatura assoluta, V₁/T₁ = V₂/T₂ (T in kelvin). Estrapolando i grafici, tutti i gas raggiungerebbero volume zero a −273,15 °C = 0 K, la temperatura più bassa possibile; in pratica non ci si arriva, perché i gas reali condensano prima. Legge di Gay-Lussac: a volume costante la pressione è direttamente proporzionale alla temperatura assoluta, P₁/T₁ = P₂/T₂. Legge di Avogadro: nelle stesse condizioni di temperatura e pressione, uno stesso numero di molecole di gas occupa lo stesso volume, qualunque sia la loro natura chimica. Il volume di una mole di gas è il volume molare, Vm = V/n. I volumi dei gas si confrontano spesso a temperatura e pressione standard (STP): 0 °C e 1 atm, dove una mole di gas ideale occupa 22,4 L. Per usare le leggi si converte sempre la temperatura in kelvin: T(K) = t(°C) + 273,15 (si usa anche 273). Termini: trasformazione isoterma = a temperatura costante (Boyle: P·V costante, grafico P–V iperbolico); isobara = a pressione costante (Charles: V/T costante, grafico V–T lineare); isocora (isocòra) = a volume costante (Gay-Lussac: P/T costante, grafico P–T lineare che passa per T = 0 K, cioè tocca l'asse delle ascisse a 0 K). Quando tutte e tre le grandezze cambiano si usa la legge combinata P₁V₁/T₁ = P₂V₂/T₂ (a moli costanti). Variazioni percentuali: se il volume aumenta del 50% si moltiplica per 1,5: a P costante anche la T (in kelvin) è moltiplicata per 1,5 (100 K → 150 K). Se la pressione di un gas isocoro raddoppia (1 atm → 2 atm) la temperatura in kelvin raddoppia: da 1 °C = 274 K si passa a 548 K = 275 °C. Avogadro in pratica: stesso T e P e stesso volume = stesso numero di molecole (due contenitori da 100 mL di N₂ e di O₂ nelle stesse condizioni hanno lo stesso numero di molecole). Il numero di moli si ricava dalla massa con n = m/M: 28 g di N₂ (M = 28,01 g/mol) sono 1 mol e occupano lo stesso volume di 1 mol di He; 16 g di O₂ (M = 32,00) sono 0,5 mol. La densità di un gas (m/V) a pressione costante è inversamente proporzionale a T: scaldando il gas il volume cresce, la massa no, quindi d diminuisce (la formula completa è d = PM/RT, vedi paragrafo sulla massa molare).","spiegazione":"Sono tre modi di guardare lo stesso palloncino. Lo schiacci: il volume cala e la pressione sale (Boyle). Lo scaldi lasciandolo libero: si gonfia (Charles). Lo scaldi in un contenitore rigido: non può gonfiarsi e allora sale la pressione (Gay-Lussac). In tutti i casi la temperatura va in kelvin, mai in gradi Celsius.","esempi":["Boyle: 40 L a 1,5 atm → V₂ = 1,5·40/0,75 = 80 L a 0,75 atm.","Charles: 33,5 L a 28 °C → a 287 °C: V₂ = 33,5·(287 + 273,15)/(28 + 273,15) = 62,3 L.","Gay-Lussac: 2 atm a 36 °C → a 322 °C: P₂ = 2·595,15/309,15 = 3,85 atm.","Combinata: 19 L, 1,5 atm, 18 °C → 4 atm, 105 °C: V₂ = (1,5·19·378,15)/(291,15·4) = 9,25 L.","Il 50% in più di volume a 100 K: T₂ = 100·1,5 = 150 K.","2,0 L a 1,0 atm compressi a 4,0 atm (T costante) → 0,50 L.","3,0 L a 300 K scaldati a 600 K (P costante) → 6,0 L.","1,0 atm a 273 K portato a 546 K (V costante) → 2,0 atm.","2 H₂ + O₂: a pari T e P, 4,0 L di H₂ reagiscono con 2,0 L di O₂."]},{"titolo":"Equazione di stato dei gas ideali","riassunto":"Dalle leggi empiriche risulta che il volume è proporzionale a 1/P (Boyle), a T assoluta (Charles) e a n (Avogadro). Combinando le tre proporzionalità si ottiene la legge dei gas ideali: PV = nRT, con R = 0,0821 L·atm/(mol·K) = 8,314 J/(mol·K). È una legge limite, valida solo a pressioni relativamente basse. Quando pressione, volume e temperatura cambiano tutti insieme si usa la legge combinata: P₁V₁/(n₁T₁) = P₂V₂/(n₂T₂). La legge dei gas ideali permette anche di prevedere il volume molare in qualsiasi condizione: Vm = V/n = RT/P. Calcoli con PV = nRT: V = nRT/P; n = PV/(RT); P = nRT/V; T = PV/(nR). Si usa R = 0,0821 L·atm/(mol·K) (o 0,08206) con P in atm, V in litri, T in kelvin; con R = 8,314 J/(mol·K) servono pascal e m³. Volume molare a STP (0 °C = 273,15 K e 1 atm): Vm = 22,414 L/mol (≈ 22,4). Con una massa: prima n = m/M, poi si applica la legge: 106 g di NH₃ (M = 17,03) sono 6,22 mol e occupano a 0 °C e 1 atm 6,22 · 22,414 = 140 L; 16 g di O₂ (M = 32,00) sono 0,5 mol → 11,2 L; 3 g di Ar (M = 39,95) sono 0,0751 mol. Per ricavare la pressione da una massa: P = (m/M)RT/V. Se il volume è dato in mL si converte in litri (÷1000). Il calcolo di STP richiede sempre 1 mol = 22,4 L: 2 mol occupano 44,8 L. In una trasformazione isoterma il prodotto PV rimane costante per i gas ideali.","spiegazione":"PV = nRT è la «formula unica» dei gas: conosci tre grandezze e ricavi la quarta. Due attenzioni evitano quasi tutti gli errori: la temperatura sempre in kelvin e le unità coerenti con il valore di R che usi (litri e atmosfere con 0,0821).","esempi":["n = PV/RT: 47 L a 0,8 atm e 24 °C (297,15 K) → n = 0,8·47/(0,08206·297,15) = 1,54 mol.","V = nRT/P: 4 mol, 16 °C (289,15 K), 5 atm → V = 4·0,08206·289,15/5 = 19 L.","P: 3 g di Ar = 0,0751 mol in 37 L a 42 °C (315,15 K) → P = 0,0751·0,08206·315,15/37 = 0,0525 atm.","1,00 mol a 273 K e 1,00 atm: V = nRT/P = 22,4 L.","10,0 L a 2,00 atm e 300 K: n = PV/RT = 0,812 mol.","2,00 mol in 10,0 L a 300 K: P = nRT/V = 4,93 atm."]},{"titolo":"Massa molare, densità e stechiometria dei gas","riassunto":"Poiché n = m/M, sostituendo nell'equazione dei gas ideali si ottiene la massa molare: M = mRT/(PV). Risolvendo per m/V si ottiene la densità: d = PM/(RT). A parità di pressione e temperatura, maggiore è la massa molare del gas, maggiore è la sua densità; a temperatura costante la densità aumenta con la pressione; scaldando un gas libero di espandersi a pressione costante, il volume aumenta e la densità diminuisce. Combinando la legge dei gas ideali con i rapporti molari di una reazione bilanciata si calcola il volume di gas consumato o prodotto: prima si ricavano le moli di gas dalla stechiometria, poi il volume con V = nRT/P. Formule: massa molare M = mRT/(PV); densità d = m/V = PM/(RT); moli n = m/M; volume V = nRT/P. Le M da usare si calcolano dalla formula con le masse atomiche: H₂ 2,02; He 4,00; Ne 20,18; Ar 39,95; N₂ 28,01; O₂ 32,00; CO₂ 44,01; C₃H₈ 44,10; NH₃ 17,03; SO₂ 64,06; Cl₂ 70,90; NO₂ 46,01; H₂O₂ 34,01 (g/mol). Per identificare un gas sconosciuto si calcola M = dRT/P e si confronta con la massa molare dei gas candidati: M = 17 g/mol corrisponde a NH₃. Gas e stechiometria: si convertono i grammi in moli di reagente, i rapporti dei coefficienti danno le moli del gas, e poi V = nRT/P. Per H₂O₂: 2 H₂O₂ → 2 H₂O + O₂, quindi n(O₂) = n(H₂O₂)/2. A volume costante (isocora) il rapporto P/T resta costante: aumentando T aumenta P. Massa molare media di una miscela: M̄ = Σ xᵢMᵢ, dove la frazione in volume è uguale alla frazione molare (10% O₂ e 90% H₂ → M̄ = 0,10·32 + 0,90·2 = 5 g/mol).","spiegazione":"Pesando un volume noto di gas a T e P note si scopre «quanto pesa una mole», cioè la massa molare: è un modo per identificare un gas sconosciuto. E la densità spiega perché una mongolfiera sale: l'aria calda, a pari pressione, è meno densa di quella fredda.","esempi":["d(C₃H₈) a 87 °C e 0,8 atm: d = 0,8·44,10/(0,08206·360,15) = 1,19 g/L.","M = dRT/P = 1,131·0,08206·367,15/2 = 17,0 g/mol → NH₃.","16 g di H₂O₂ → 16/34,01 = 0,47 mol → 0,235 mol di O₂ → V = 0,235·0,08206·300,15/1,2 = 4,83 L.","Miscela 10% O₂ + 90% H₂ (in volume): M̄ = 3,2 + 1,8 = 5 g/mol.","15,5 g di gas in 5,75 L a 25 °C e 1,08 atm → M = 61,1 g/mol.","CO₂ (44 g/mol) a 273 K e 1 atm: d = PM/RT = 1,96 g/L.","2 KClO₃ → 2 KCl + 3 O₂: 0,0100 mol di KClO₃ → 0,0150 mol di
