in q = m·Cs·ΔT. Riferito a una mole è la capacità termica molare."},{"id":"termo1-35","c":"termo1","a":3,"t":"quiz","f":"Come è definita l'entalpia?","b":"✅ H = U + PV\nL'entalpia è la funzione di stato che permette di seguire gli scambi di energia a pressione costante."},{"id":"termo1-36","c":"termo1","a":3,"t":"quiz","f":"A pressione costante e senza lavoro non di espansione, a che cosa è uguale ΔH?","b":"✅ Al calore scambiato\nPer questo l'entalpia è così usata in chimica: la maggior parte delle reazioni avviene a pressione atmosferica costante."},{"id":"termo1-37","c":"termo1","a":5,"t":"quiz","f":"Che cosa afferma la legge di Hess?","b":"✅ Il ΔH di una reazione è la somma dei ΔH degli stadi in cui può essere scomposta\nÈ una conseguenza del fatto che l'entalpia è una funzione di stato: conta solo la differenza tra stato finale e iniziale."},{"id":"termo1-38","c":"termo1","a":5,"t":"quiz","f":"Che cos'è l'entalpia standard di formazione?","b":"✅ Il ΔH° per la formazione di una mole di sostanza dai suoi elementi nella forma più stabile\nSi esprime in kJ/mol e permette di calcolare l'entalpia di qualsiasi reazione."},{"id":"termo1-39","c":"termo1","a":5,"t":"quiz","f":"Quanto vale l'entalpia standard di formazione di un elemento nella sua forma più stabile?","b":"✅ Zero\nPer convenzione gli elementi nella forma stabile sono il riferimento: ΔH°f = 0."},{"id":"termo1-40","c":"termo1","a":1,"t":"quiz","f":"Quale di queste grandezze NON è una funzione di stato?","b":"✅ Il lavoro\nIl lavoro dipende da come avviene la trasformazione: un gas che si espande nel vuoto non ne compie, contro una pressione esterna sì, anche a parità di stato finale."},{"id":"termo1-41","c":"termo1","a":1,"t":"quiz","f":"Un sistema assorbe 50 J di calore e compie 20 J di lavoro sull'ambiente. Quanto vale ΔU?","b":"✅ +30 J\nq = +50 J (entra), w = −20 J (esce): ΔU = q + w = +30 J."},{"id":"termo1-42","c":"termo1","a":2,"t":"quiz","f":"Quanto calore assorbe una moneta di rame da 3,10 g scaldata da −8,0 °C a 37,0 °C? (Cs = 0,385 J/(g·°C))","b":"✅ 53,7 J\nΔT = 37,0 − (−8,0) = 45,0 °C; q = m·Cs·ΔT = 3,10 · 0,385 · 45,0 = 53,7 J. (34,6 J si ottiene sbagliando il segno e usando ΔT = 29 °C.)"},{"id":"termo1-43","c":"termo1","a":0,"t":"quiz","f":"A quanti joule corrispondono 100 cal?","b":"✅ 418,4 J\n1 cal = 4,184 J, quindi 100 cal = 418,4 J. 4184 J corrispondono a 1 kcal, cioè a una caloria alimentare."},{"id":"termo1-44","c":"termo1","a":3,"t":"quiz","f":"Che relazione c'è tra l'entalpia di congelamento e l'entalpia di fusione di una sostanza?","b":"✅ ΔH(congelamento) = −ΔH(fusione)\nL'entalpia è una funzione di stato: il processo inverso ha ΔH uguale e di segno opposto."},{"id":"termo1-45","c":"termo1","a":3,"t":"quiz","f":"Come si esprime l'entalpia di sublimazione in funzione di quelle di fusione e di vaporizzazione (alla stessa temperatura)?","b":"✅ ΔHsub = ΔHfus + ΔHvap\nPassare da solido a vapore direttamente o attraverso il liquido porta allo stesso stato finale: i ΔH si sommano."},{"id":"termo1-46","c":"termo1","a":4,"t":"quiz","f":"Per C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O, ΔH = −2044 kJ. Quanto vale ΔH per la combustione di 2 mol di propano?","b":"✅ −4088 kJ\nL'entalpia di reazione è estensiva: raddoppiando le quantità raddoppia ΔH."},{"id":"termo1-47","c":"termo1","a":5,"t":"quiz","f":"Che cosa accade al ΔH se si inverte un'equazione chimica?","b":"✅ Cambia segno\nSe la reazione diretta libera calore, quella inversa ne assorbe la stessa quantità."},{"id":"termo1-48","c":"termo1","a":2,"t":"quiz","f":"In quali condizioni misura il calore una bomba calorimetrica?","b":"✅ A volume costante\nLa bomba è un contenitore rigido: il calore misurato corrisponde a ΔU. Il calorimetro a bicchieri lavora invece a pressione costante (ΔH)."},{"id":"termo1-49","c":"termo1","a":3,"t":"quiz","f":"In una curva di riscaldamento, che cosa accade alla temperatura durante la fusione?","b":"✅ Resta costante\nIl calore fornito serve a separare le particelle e non ad aumentare la temperatura: la curva presenta un tratto orizzontale."},{"id":"termo1-50","c":"termo1","a":1,"t":"quiz","f":"La vaporizzazione di un liquido è un processo:","b":"✅ Endotermico\nPer separare le molecole bisogna fornire energia: il vapore ha entalpia maggiore del liquido."},{"id":"termo1-51","c":"termo1","a":2,"t":"quiz","f":"Come è la capacità termica di 200 g di acqua rispetto a quella di 100 g di acqua?","b":"✅ Doppia\nLa capacità termica dipende dalla massa: 200 g richiedono il doppio del calore per lo stesso aumento di temperatura. Il calore specifico invece non cambia."},{"id":"termo1-52","c":"termo1","a":0,"t":"quiz","f":"Che cosa caratterizza una parete adiabatica?","b":"✅ Non permette il trasferimento di energia sotto forma di calore\nLe pareti adiabatiche sono termicamente isolanti; quelle diatermiche lasciano passare il calore."},{"id":"termo1-53","c":"termo1","a":1,"t":"calcolo","f":"Un sistema assorbe 44 J di calore e riceve 25 J di lavoro dall'ambiente. Calcola la variazione di energia interna ΔU.","b":"Convenzione: q > 0 se assorbito; w > 0 se ricevuto dal sistema. ΔU = q + w\nΔU = 44 + (25) = 69 J"},{"id":"termo1-54","c":"termo1","a":1,"t":"calcolo","f":"Un sistema assorbe 49 J di calore e riceve 32 J di lavoro dall'ambiente. Calcola la variazione di energia interna ΔU.","b":"Convenzione: q > 0 se assorbito; w > 0 se ricevuto dal sistema. ΔU = q + w\nΔU = 49 + (32) = 81 J"},{"id":"termo1-55","c":"termo1","a":2,"t":"calcolo","f":"Quanto calore serve per scaldare 93 g di piombo di 9 °C? (Cs = 0,130 J/(g·°C))","b":"q = m · Cs · ΔT\nq = 93 · 0,130 · 9 = 109 J"},{"id":"termo1-56","c":"termo1","a":2,"t":"calcolo","f":"Quanto calore serve per scaldare 175 g di piombo di 50 °C? (Cs = 0,130 J/(g·°C))","b":"q = m · Cs · ΔT\nq = 175 · 0,130 · 50 = 1138 J"},{"id":"termo1-57","c":"termo1","a":3,"t":"calcolo","f":"Quanta energia serve per far evaporare 2 mol di acqua a 100 °C? (ΔHvap = 40,7 kJ/mol)","b":"q = n · ΔHvap\nq = 2 · 40,7 = 81,4 kJ"},{"id":"termo1-58","c":"termo1","a":3,"t":"calcolo","f":"Quanta energia serve per far evaporare 4 mol di acqua a 100 °C? (ΔHvap = 40,7 kJ/mol)","b":"q = n · ΔHvap\nq = 4 · 40,7 = 162,8 kJ"},{"id":"termo1-59","c":"termo1","a":4,"t":"calcolo","f":"La combustione di 1 mol di CH₄ ha ΔH = -890 kJ. Quanto calore si libera bruciando 5 mol di CH₄?","b":"ΔH per n mol = n · ΔH(1 mol)\n5 · (-890) = -4450 kJ"},{"id":"termo1-60","c":"termo1","a":4,"t":"calcolo","f":"La combustione di 1 mol di CH₄ ha ΔH = -890 kJ. Quanto calore si libera bruciando 5 mol di CH₄?","b":"ΔH per n mol = n · ΔH(1 mol)\n5 · (-890) = -4450 kJ"},{"id":"termo1-61","c":"termo1","a":4,"t":"calcolo","f":"Per una reazione a 298 K si conoscono ΔH = -146 kJ e la variazione di moli di gas Δn = -2. Calcola ΔU in kJ (R = 8,314 J/(K·mol)).","b":"ΔH = ΔU + Δn·R·T → ΔU = ΔH − Δn·R·T\nΔU = -146 − (-2) · 2,478 = -141,04 kJ"},{"id":"termo1-62","c":"termo1","a":4,"t":"calcolo","f":"Per una reazione a 298 K si conoscono ΔH = -100 kJ e la variazione di moli di gas Δn = 1. Calcola ΔU in kJ (R = 8,314 J/(K·mol)).","b":"ΔH = ΔU + Δn·R·T → ΔU = ΔH − Δn·R·T\nΔU = -100 − (1) · 2,478 = -102,48 kJ"},{"id":"termo1-63","c":"termo1","a":2,"t":"calcolo","f":"In un calorimetro a pressione costante, 62 g di soluzione (Cs = 4,18 J/(g·°C)) passano da 20 °C a 22 °C. Calcola il calore della reazione, con il segno.","b":"q(soluzione) = m · Cs · ΔT = 62 · 4,18 · 2 = 518 J\nq(reazione) = −q(soluzione) = -518 J (reazione esotermica)"},{"id":"termo1-64","c":"termo1","a":2,"t":"calcolo","f":"In un calorimetro a pressione costante, 69 g di soluzione (Cs = 4,18 J/(g·°C)) passano da 20 °C a 32 °C. Calcola il calore della reazione, con il segno.","b":"q(soluzione) = m · Cs · ΔT = 69 · 4,18 · 12 = 3461 J\nq(reazione) = −q(soluzione) = -3461 J (reazione esotermica)"},{"id":"termo2-0","c":"termo2","a":0,"t":"concetto","f":"Che cosa devi sapere su «Processi spontanei, reversibili e irreversibili»?","b":"Il primo principio dice che, se una reazione avviene, l'energia totale dell'universo (sistema più ambiente) resta invariata; non dice però perché alcune reazioni tendono ad avvenire e altre no. Una trasformazione spontanea è una trasformazione che tende ad avvenire senza bisogno di essere guidata da un'influenza esterna."},{"id":"termo2-1","c":"termo2","a":0,"t":"concetto","f":"In parole semplici: «Processi spontanei, reversibili e irreversibili»","b":"Spontaneo non vuol dire rapido: vuol dire «in discesa». Una palla in cima a un pendio può restare ferma finché non le dai un colpetto (l'innesco), ma una volta partita scende da sola e non risale. Un processo reversibile è invece una discesa fatta a passi infinitamente piccoli, sempre a un soffio dall'equilibrio, tanto che basterebbe un niente per tornare indietro."},{"id":"termo2-2","c":"termo2","a":0,"t":"definizione","f":"Come definisci «Una trasformazione spontanea»?","b":"Una trasformazione spontanea è una trasformazione che tende ad avvenire senza bisogno di essere guidata da un'influenza esterna."},{"id":"termo2-3","c":"termo2","a":0,"t":"definizione","f":"Come definisci «Una trasformazione spontanea non»?","b":"Una trasformazione spontanea non è necessariamente veloce e in alcuni casi deve essere innescata."},{"id":"termo2-4","c":"termo2","a":0,"t":"definizione","f":"Come definisci «Un processo reversibile»?","b":"Un processo reversibile è un processo che può essere invertito da una variazione infinitesima di una variabile; in un processo irreversibile una variazione infinitesima non ne inverte la direzione."},{"id":"termo2-5","c":"termo2","a":0,"t":"definizione","f":"Come definisci «Il caso più semplice»?","b":"Il caso più semplice è l'espansione reversibile e isoterma di un gas ideale: per essa ΔU = 0, quindi q = −w, e il lavoro reversibile vale w = −nRT·ln(V₂/V₁)."},{"id":"termo2-6","c":"termo2","a":1,"t":"concetto","f":"Che cosa devi sapere su «Entropia: definizione termodinamica e variazioni»?","b":"La tendenza di energia e materia a disperdersi si misura con l'entropia, S. A temperatura costante la variazione di entropia di un sistema è ΔS = q(rev) / T, dove q(rev) è il calore scambiato reversibilmente."},{"id":"termo2-7","c":"termo2","a":1,"t":"concetto","f":"In parole semplici: «Entropia: definizione termodinamica e variazioni»","b":"L'entropia conta in quanti modi l'energia e le molecole possono essere sparpagliate. Scaldare aggiunge agitazione, espandere aggiunge spazio: in entrambi i casi i modi possibili aumentano e l'entropia cresce. Dividere per T ha senso: lo stesso calore «disturba» molto un sistema freddo e ordinato, poco uno già caldo e caotico, come uno starnuto in biblioteca o in una strada trafficata."},{"id":"termo2-8","c":"termo2","a":1,"t":"definizione","f":"Come definisci «L'entropia»?","b":"L'entropia è una funzione di stato: per calcolare ΔS tra due stati collegati da un percorso irreversibile si può cercare un percorso reversibile tra gli stessi stati."},{"id":"termo2-9","c":"termo2","a":1,"t":"definizione","f":"Come definisci «Attenzione alle unità: ΔH»?","b":"Attenzione alle unità: ΔH è in kJ/mol e ΔS in J/(K·mol), quindi si moltiplica ΔH per 1000."},{"id":"termo2-10","c":"termo2","a":2,"t":"concetto","f":"Che cosa devi sapere su «Interpretazione molecolare e terzo principio»?","b":"Terzo principio della termodinamica: l'entropia di tutti i cristalli perfetti tende a zero quando la temperatura assoluta tende a zero."},{"id":"termo2-11","c":"termo2","a":2,"t":"concetto","f":"In parole semplici: «Interpretazione molecolare e terzo principio»","b":"W è il numero di «fotografie» diverse a livello molecolare che corrispondono allo stesso stato visto da fuori. Un cristallo perfetto a 0 K ha una sola fotografia possibile: W = 1, ln 1 = 0, entropia zero. Appena le molecole possono orientarsi o muoversi in più modi, le fotografie possibili si moltiplicano e l'entropia sale."},{"id":"termo2-12","c":"termo2","a":2,"t":"definizione","f":"Come definisci «L'entropia così calcolata»?","b":"L'entropia così calcolata si chiama entropia statistica."},{"id":"termo2-13","c":"termo2","a":3,"t":"concetto","f":"Che cosa devi sapere su «Secondo principio: entropia di sistema, ambiente e universo»?","b":"Secondo principio: l'entropia di un sistema isolato aumenta nel corso di ogni trasformazione spontanea."},{"id":"termo2-14","c":"termo2","a":3,"t":"concetto","f":"In parole semplici: «Secondo principio: entropia di sistema, ambiente e universo»","b":"Per decidere se un processo è spontaneo non basta guardare il sistema: bisogna fare il bilancio dell'universo. Una reazione può anche mettere ordine nel sistema (ΔS negativo), purché scaldi abbastanza l'ambiente da creare lì più disordine di quanto ne ha tolto. Il conto totale deve essere sempre in attivo."},{"id":"termo2-15","c":"termo2","a":3,"t":"definizione","f":"Come definisci «Le reazioni endotermiche spontanee»?","b":"Le reazioni endotermiche spontanee sono guidate dall'aumento di disordine del sistema, che prevale."},{"id":"termo2-16","c":"termo2","a":4,"t":"concetto","f":"Che cosa devi sapere su «Energia libera di Gibbs»?","b":"Usare il secondo principio richiede di calcolare tre quantità: ΔSsistema, ΔSambiente e la loro somma. Per semplificare si introduce una nuova funzione di stato, l'energia libera di Gibbs: G = H − TS. Per un processo a temperatura costante ΔG = ΔH − TΔS."},{"id":"termo2-17","c":"termo2","a":4,"t":"concetto","f":"In parole semplici: «Energia libera di Gibbs»","b":"ΔG mette sulla stessa bilancia le due «spinte» di un processo: la tendenza a cedere energia (ΔH negativo) e la tendenza al disordine (ΔS positivo), quest'ultima pesata dalla temperatura. Se il piatto pende dalla parte negativa, il processo va avanti da solo. È il secondo principio riscritto in modo da non dover più pensare all'ambiente."},{"id":"termo2-18","c":"termo2","a":4,"t":"definizione","f":"Come definisci «La spontaneità»?","b":"La spontaneità è determinata da ΔG (ΔG < 0 spontaneo, ΔG > 0 non spontaneo nella direzione scritta, ΔG = 0 equilibrio)."},{"id":"termo2-19","c":"termo2","a":5,"t":"concetto","f":"Che cosa devi sapere su «ΔG° di reazione, stabilità ed effetto della temperatura»?","b":"L'energia libera standard di reazione ΔG° si riferisce agli stati standard: è una quantità fissa per una data reazione e non cambia mentre la reazione procede."},{"id":"termo2-20","c":"termo2","a":5,"t":"concetto","f":"In parole semplici: «ΔG° di reazione, stabilità ed effetto della temperatura»","b":"La temperatura è la manopola che decide quanto conta l'entropia. A freddo comanda l'entalpia: vince chi libera calore. A caldo comanda l'entropia: vince chi crea disordine. Quando le due spinte vanno in direzioni opposte esiste una temperatura di «pareggio», T = ΔH/ΔS, oltre la quale la reazione cambia verso."},{"id":"termo2-21","c":"termo2","a":5,"t":"definizione","f":"Come definisci «Un composto con ΔG°f negativa»?","b":"Un composto con ΔG°f negativa è termodinamicamente stabile rispetto ai suoi elementi (l'acqua); uno con ΔG°f positiva è termodinamicamente instabile (il benzene)."},{"id":"termo2-22","c":"termo2","a":5,"t":"definizione","f":"Come definisci «Stabilità termodinamica e velocità»?","b":"Stabilità termodinamica e velocità sono cose diverse: le sostanze che si decompongono o reagiscono rapidamente sono labili, quelle che sopravvivono a lungo sono non labili o inerti."},{"id":"termo2-23","c":"termo2","a":5,"t":"definizione","f":"Come definisci «Il benzene»?","b":"Il benzene è termodinamicamente instabile ma non labile. ΔG° = ΔH° − TΔS° dipende dalla temperatura e può cambiare segno."},{"id":"termo2-24","c":"termo2","a":5,"t":"definizione","f":"Come definisci «Termodinamica e velocità»?","b":"Termodinamica e velocità sono indipendenti: un composto con ΔG°f > 0 è instabile, ma se non reagisce in tempi osservabili è «inerte» (non labile)."},{"id":"termo2-25","c":"termo2","a":0,"t":"quiz","f":"Che cos'è una trasformazione spontanea?","b":"✅ Una trasformazione che tende ad avvenire senza bisogno di un'influenza esterna\nSpontaneo significa che il processo ha una tendenza naturale ad avvenire; non dice nulla sulla sua velocità."},{"id":"termo2-26","c":"termo2","a":0,"t":"quiz","f":"Una trasformazione spontanea è necessariamente veloce?","b":"✅ No: può essere lenta e in alcuni casi deve essere innescata\nLa termodinamica indica la direzione di un processo, non la sua velocità."},{"id":"termo2-27","c":"termo2","a":1,"t":"quiz","f":"Come è definita la variazione di entropia di un sistema a temperatura costante?","b":"✅ ΔS = q(rev) / T\nÈ il calore scambiato reversibilmente diviso per la temperatura assoluta."},{"id":"termo2-28","c":"termo2","a":3,"t":"quiz","f":"Che cosa afferma il secondo principio della termodinamica?","b":"✅ L'entropia di un sistema isolato aumenta in ogni trasformazione spontanea\nNel bilancio vanno considerati sistema e ambiente: la loro entropia totale deve aumentare."},{"id":"termo2-29","c":"termo2","a":2,"t":"quiz","f":"Che cosa afferma il terzo principio della termodinamica?","b":"✅ L'entropia dei cristalli perfetti tende a zero quando la temperatura tende a 0 K\nA 0 K un cristallo perfetto ha una sola disposizione possibile (W = 1), quindi S = k·ln 1 = 0."},{"id":"termo2-30","c":"termo2","a":2,"t":"quiz","f":"Quale relazione, proposta da Boltzmann, definisce l'entropia a livello molecolare?","b":"✅ S = k·ln W\nk è la costante di Boltzmann (1,381·10⁻²³ J/K) e W il numero di microstati."},{"id":"termo2-31","c":"termo2","a":2,"t":"quiz","f":"Che cosa rappresenta W nella formula di Boltzmann?","b":"✅ Il numero di modi in cui le particelle possono disporsi con la stessa energia totale\nW è il numero di microstati: più sono, maggiore è l'entropia."},{"id":"termo2-32","c":"termo2","a":4,"t":"quiz","f":"Come è definita l'energia libera di Gibbs?","b":"✅ G = H − TS\nÈ una funzione di stato perché è definita solo attraverso funzioni di stato (H, T, S)."},{"id":"termo2-33","c":"termo2","a":4,"t":"quiz","f":"A temperatura e pressione costanti, quando un processo è spontaneo?","b":"✅ Quando ΔG è negativo\nLa direzione spontanea è quella in cui l'energia libera di Gibbs diminuisce; ΔG = 0 corrisponde all'equilibrio."},{"id":"termo2-34","c":"termo2","a":0,"t":"quiz","f":"Che cos'è un processo reversibile?","b":"✅ Un processo che può essere invertito da una variazione infinitesima di una variabile\nIn un processo reversibile il sistema è sempre a un passo infinitesimo dall'equilibrio."},{"id":"termo2-35","c":"termo2","a":5,"t":"quiz","f":"Quando un composto si dice termodinamicamente stabile?","b":"✅ Quando la sua energia libera standard di formazione è negativa\nCon ΔG°f < 0 il composto è più stabile degli elementi da cui si forma, come l'acqua. La lentezza di reazione riguarda invece la labilità."},{"id":"termo2-36","c":"termo2","a":1,"t":"quiz","f":"Che cosa afferma la regola di Trouton?","b":"✅ Molti liquidi hanno un'entropia di vaporizzazione vicina a 85 J/(K·mol)\nI liquidi con estesi legami a idrogeno, come l'acqua, hanno valori più alti."},{"id":"termo2-37","c":"termo2","a":2,"t":"quiz","f":"Qual è l'ordine corretto delle entropie molari degli stati di una stessa sostanza?","b":"✅ solido < liquido < gas\nDal solido al gas aumentano la libertà di movimento delle molecole e il volume a disposizione."},{"id":"termo2-38","c":"termo2","a":1,"t":"quiz","f":"Che cosa accade all'entropia di una sostanza quando viene scaldata?","b":"✅ Aumenta\nΔS = C·ln(T₂/T₁): se T₂ > T₁ il logaritmo è positivo. Il riscaldamento aumenta il disordine termico."},{"id":"termo2-39","c":"termo2","a":3,"t":"quiz","f":"Per il processo CaCl₂(s) → Ca²⁺(aq) + 2 Cl⁻(aq), che segno ha ΔS del sistema?","b":"✅ Positivo, perché da un solido si forma una soluzione\nL'entropia aumenta quando da solidi si formano liquidi o soluzioni."},{"id":"termo2-40","c":"termo2","a":3,"t":"quiz","f":"Per la reazione 2 H₂(g) + O₂(g) → 2 H₂O(g), che segno ha ΔS del sistema?","b":"✅ Negativo, perché le moli di gas diminuiscono da 3 a 2\nΔn(gas) = 2 − 3 = −1: meno molecole di gas indipendenti, minore entropia."},{"id":"termo2-41","c":"termo2","a":3,"t":"quiz","f":"Che cosa accade all'entropia dell'ambiente quando nel sistema avviene una reazione esotermica?","b":"✅ Aumenta\nIl calore che lascia il sistema entra nell'ambiente: ΔSambiente = −ΔH/T, positivo se ΔH è negativo."},{"id":"termo2-42","c":"termo2","a":3,"t":"quiz","f":"Che cosa indica una variazione totale di entropia ΔStot = 0?","b":"✅ Che il sistema è all'equilibrio\nΔStot > 0 spontaneo; ΔStot < 0 spontaneo l'inverso; ΔStot = 0 nessuna tendenza a procedere in una direzione."},{"id":"termo2-43","c":"termo2","a":5,"t":"quiz","f":"Una reazione ha ΔH < 0 e ΔS > 0. Quando è spontanea?","b":"✅ A tutte le temperature\nΔG = ΔH − TΔS è la somma di due termini negativi: è sempre negativo."},{"id":"termo2-44","c":"termo2","a":5,"t":"quiz","f":"Una reazione ha ΔH > 0 e ΔS < 0. Quando è spontanea?","b":"✅ Mai\nΔG = ΔH − TΔS è la somma di due termini positivi: è sempre positivo."},{"id":"termo2-45","c":"termo2","a":5,"t":"quiz","f":"Una reazione ha ΔH < 0 e ΔS < 0. Quando è spontanea?","b":"✅ A bassa temperatura\nIl termine −TΔS è positivo e cresce con T: a bassa temperatura prevale ΔH negativo (reazione guidata dall'entalpia)."},{"id":"termo2-46","c":"termo2","a":5,"t":"quiz","f":"Una reazione ha ΔH > 0 e ΔS > 0. Quando è spontanea?","b":"✅ Ad alta temperatura\nIl termine −TΔS è negativo e cresce in valore assoluto con T: ad alta temperatura supera ΔH positivo (reazione guidata dall'entropia)."},{"id":"termo2-47","c":"termo2","a":1,"t":"quiz","f":"Come si calcola l'entropia di vaporizzazione di un liquido al suo punto di ebollizione?","b":"✅ ΔSvap = ΔHvap / Teb\nAlla temperatura di transizione lo scambio di calore è reversibile e, a pressione costante, è uguale a ΔH."},{"id":"termo2-48","c":"termo2","a":2,"t":"quiz","f":"Quattro molecole formano un cristallo perfettamente ordinato a T = 0, con una sola disposizione possibile. Quanto vale l'entropia?","b":"✅ Zero\nW = 1 → S = k·ln 1 = 0, in accordo con il terzo principio."},{"id":"termo2-49","c":"termo2","a":4,"t":"calcolo","f":"Una reazione ha ΔH = -12 kJ e ΔS = -21 J/K a 350 K. Calcola ΔG in kJ e stabilisci se è spontanea.","b":"ΔG = ΔH − T·ΔS = -12 − 350 · -21 / 1000\nΔG = -4,7 kJ → spontanea"},{"id":"termo2-50","c":"termo2","a":4,"t":"calcolo","f":"Una reazione ha ΔH = -46 kJ e ΔS = 177 J/K a 400 K. Calcola ΔG in kJ e stabilisci se è spontanea.","b":"ΔG = ΔH − T·ΔS = -46 − 400 · 177 / 1000\nΔG = -116,8 kJ → spontanea"},{"id":"termo2-51","c":"termo2","a":1,"t":"calcolo","f":"Una sostanza ha entalpia di vaporizzazione 48 kJ/mol al punto di ebollizione 318 K. Calcola la sua entropia di vaporizzazione in J/(K·mol).","b":"ΔSvap = ΔHvap / Teb\nΔSvap = 48 · 1000 / 318 = 150,9 J/(K·mol)"},{"id":"termo2-52","c":"termo2","a":1,"t":"calcolo","f":"Una sostanza ha entalpia di vaporizzazione 36 kJ/mol al punto di ebollizione 393 K. Calcola la sua entropia di vaporizzazione in J/(K·mol).","b":"ΔSvap = ΔHvap / Teb\nΔSvap = 36 · 1000 / 393 = 91,6 J/(K·mol)"},{"id":"termo2-53","c":"termo2","a":2,"t":"calcolo","f":"Un sistema ha W = 2^9 microstati accessibili. Calcola la sua entropia statistica in unità di 10⁻²³ J/K (k = 1,381·10⁻²³ J/K).","b":"S = k · ln W = k · 9 · ln 2\nS = 8,62·10⁻²³ J/K"},{"id":"termo2-54","c":"termo2","a":2,"t":"calcolo","f":"Un sistema ha W = 2^6 microstati accessibili. Calcola la sua entropia statistica in unità di 10⁻²³ J/K (k = 1,381·10⁻²³ J/K).","b":"S = k · ln W = k · 6 · ln 2\nS = 5,74·10⁻²³ J/K"},{"id":"termo2-55","c":"termo2","a":5,"t":"calcolo","f":"Una reazione ha ΔH° = 110 kJ e ΔS° = 120 J/K. A quale temperatura ΔG° = 0?","b":"ΔG° = 0 ⇔ T = ΔH° / ΔS°\nT = 110 · 1000 / 120 = 917 K"},{"id":"termo2-56","c":"termo2","a":5,"t":"calcolo","f":"Una reazione ha ΔH° = 78 kJ e ΔS° = 131 J/K. A quale temperatura ΔG° = 0?","b":"ΔG° = 0 ⇔ T = ΔH° / ΔS°\nT = 78 · 1000 / 131 = 595 K"},{"id":"termo2-57","c":"termo2","a":3,"t":"calcolo","f":"Un processo a 298 K ha ΔH = 7 kJ. Calcola la variazione di entropia dell'ambiente in J/K.","b":"ΔS_amb = −ΔH / T\nΔS_amb = −(7 · 1000) / 298 = -23,5 J/K"},{"id":"termo2-58","c":"termo2","a":3,"t":"calcolo","f":"Un processo a 400 K ha ΔH = 153 kJ. Calcola la variazione di entropia dell'ambiente in J/K.","b":"ΔS_amb = −ΔH / T\nΔS_amb = −(153 · 1000) / 400 = -382,5 J/K"},{"id":"termo2-59","c":"termo2","a":3,"t":"calcolo","f":"Entropie molari standard (J/(K·mol)): A = 152, B = 119, C = 250. Calcola ΔS° della reazione A + B → C.","b":"ΔS° = Σ S°(prodotti) − Σ S°(reagenti)\nΔS° = 250 − (152 + 119) = -21 J/K"},{"id":"termo2-60","c":"termo2","a":3,"t":"calcolo","f":"Entropie molari standard (J/(K·mol)): A = 70, B = 80, C = 240. Calcola ΔS° della reazione A + B → C.","b":"ΔS° = Σ S°(prodotti) − Σ S°(reagenti)\nΔS° = 240 − (70 + 80) = 90 J/K"}];

</script>
<script>

/* Parser delle formule chimiche (parentesi, coefficienti, idrati) */
const PEDICI = "₀₁₂₃₄₅₆₇₈₉";
function analizzaFormula(testo) {
  let s = String(testo).replace(/\s+/g, "").replace(/[₀-₉]/g, d => PEDICI.indexOf(d)).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+$/, "").replace(/\^.*$/, "");

    if (m) { k = Number(m[1]); parte = m[2]; }
    const c = leggiGruppo(parte);
    for (const e in c) tot[e] = (tot[e] || 0) + c[e] * k;

}
function leggiGruppo(s) {
  let i = 0;
  const numero = () => { let t = ""; while (i < s.length && /\d/.test(s[i])) t += s[i++]; return t ? Number(t) : 1; };
  function gruppo() {
    const c = {};
    while (i < s.length) {
      const ch = s[i];
      if (ch === "(" || ch === "[") {
        i++; const g = gruppo();
        if (s[i] !== ")" && s[i] !== "]") throw new Error("Parentesi non chiusa");
        i++; const n = numero();
        for (const e in g) c[e] = (c[e] || 0) + g[e] * n;
      } else if (ch === ")" || ch === "]") return c;
      else if (/[A-Z]/.test(ch)) {

        if (!EL[sim]) throw new Error("Elemento sconosciuto: " + sim);
        const n = numero(); c[sim] = (c[sim] || 0) + n;
      } else throw new Error("Carattere non valido: «" + ch + "» (usa le maiuscole per i simboli: Co ≠ CO)");
    }
    return c;
  }
  const r = gruppo();
  if (i < s.length) throw new Error("Parentesi chiusa in più");
  return r;
}

<script>
/* Domande a scelta con numeri sempre diversi.
   Ogni "generatore" costruisce ogni volta una domanda nuova: valori casuali, risposta calcolata, distrattori che
   riproducono gli errori più comuni e spiegazione col procedimento. Qui: strumenti comuni e registrazione. */
const GL = (() => {
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const sh = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pickN = (arr, n) => sh(arr).slice(0, n);
  const SUPS = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻", "+": "⁺", "−": "⁻" };
  const SUBS = "₀₁₂₃₄₅₆₇₈₉";
  const sup = s => String(s).replace(/[0-9+\-−]/g, c => SUPS[c]);
  const sub = f => String(f).replace(/\d+/g, d => d.split("").map(c => SUBS[c]).join(""));
  const meno = s => String(s).replace(/^-/, "−").replace("e-", "e−");

  // numeri all'italiana: cifre significative (sf) o decimali fissi (fx); notazione scientifica per valori molto grandi o piccoli
  function sf(x, k = 3) {
    if (!isFinite(x)) throw new Error("numero non valido");
    if (x === 0) return "0";
    const a = Math.abs(x);
    if (a >= 1e5 || a < 1e-2) {
      const [m, e] = x.toExponential(k - 1).split("e");
      return meno(String(parseFloat(m)).replace(".", ",")) + "·10" + sup(parseInt(e, 10));
    }
    return meno(String(parseFloat(x.toPrecision(k))).replace(".", ","));
  }
  const fx = (x, d = 2) => { if (!isFinite(x)) throw new Error("numero non valido"); const s = (Math.abs(x) < Math.pow(10, -d) / 2 ? 0 : x).toFixed(d); return meno(s.replace(".", ",")); };
  const sg = (x, d = 0) => (x > 0 ? "+" : x < 0 ? "−" : "") + fx(Math.abs(x), d);

  // un livello alla volta: i quesiti d'esame (livello 3) hanno 5 opzioni
  let livelloCorrente = 1;
  function mc(q, giusta, errate, spieg) {
    const gi = String(giusta), visti = new Set([gi]), alt = [];
    errate.forEach(e => { const t = String(e); if (t && !visti.has(t)) { visti.add(t); alt.push(t); } });
    if (alt.length < 3) throw new Error("distrattori insufficienti: " + q);
    const o = sh([gi, ...sh(alt).slice(0, livelloCorrente === 3 ? 4 : 3)]);
    return { q, o, r: o.indexOf(gi), s: spieg, f: 0 };
  }
  // risposta numerica: se i distrattori non bastano, li completa con multipli plausibili
  function nm(q, val, errate, spieg, fmt) {
    const F = fmt || (x => sf(x));
    const gi = F(val), visti = new Set([gi]), alt = [];
    const prova = x => { if (typeof x !== "number" || !isFinite(x)) return; const t = F(x); if (!visti.has(t)) { visti.add(t); alt.push(t); } };
    errate.forEach(prova);
    [2, .5, 10, .1, 1.25, .8, 3, 1 / 3, 1.5, 2 / 3].forEach(m => { if (alt.length < 4) prova(val * m); });
    return mc(q, gi, alt, spieg);
  }

  const GENERATORI = [];
  const contatori = {};
  function g(c, l, a, fn) {
    contatori[c] = (contatori[c] || 0) + 1;
    GENERATORI.push({ id: c + "-g" + contatori[c], c, l, a, fn });
  }
  // Crea una domanda concreta da un modello (prova più volte se un valore casuale non produce distrattori validi)
  function materializza(t) {
    const gen = GENERATORI.find(x => x.id === t.id);
    livelloCorrente = gen.l;
    let ultimo = null;
    for (let i = 0; i < 30; i++) {
      try {
        const d = gen.fn(), norm = t => String(t).replace(/(^|[\s(=:;,])-(?=\d)/g, "$1−");   // segno meno tipografico
        return Object.assign({ id: gen.id, c: gen.c, l: gen.l, a: gen.a, e: 0, gen: 1 }, d, { q: norm(d.q), o: d.o.map(norm), s: norm(d.s) });
      }
      catch (e) { ultimo = e; }
    }
    throw ultimo;
  }
  const modelli = () => GENERATORI.map(x => ({ id: x.id, c: x.c, l: x.l, a: x.a, g: 1, q: "", o: [], r: 0, s: "", f: 0, e: 0 }));

  // massa molare e conteggio atomi da una formula in ASCII (usa il parser dello strumento di massa molare)
  const M = f => Object.entries(analizzaFormula(f)).reduce((s, [e, n]) => s + EL[e][3] * n, 0);
  const atomi = f => analizzaFormula(f);
  const NA = 6.022e23, R_ATM = 0.08206, R_J = 8.314, H = 6.626e-34, C = 2.998e8, KB = 1.381e-23;

  // reazioni bilanciate: [coefficiente, formula]
  const RZ = [
    { r: [[2, "H2"], [1, "O2"]], p: [[2, "H2O"]] },
    { r: [[1, "N2"], [3, "H2"]], p: [[2, "NH3"]] },
    { r: [[1, "CH4"], [2, "O2"]], p: [[1, "CO2"], [2, "H2O"]] },
    { r: [[1, "C3H8"], [5, "O2"]], p: [[3, "CO2"], [4, "H2O"]] },
    { r: [[2, "Mg"], [1, "O2"]], p: [[2, "MgO"]] },
    { r: [[4, "Al"], [3, "O2"]], p: [[2, "Al2O3"]] },
    { r: [[4, "Fe"], [3, "O2"]], p: [[2, "Fe2O3"]] },
    { r: [[2, "Na"], [1, "Cl2"]], p: [[2, "NaCl"]] },
    { r: [[1, "CaCO3"]], p: [[1, "CaO"], [1, "CO2"]] },
    { r: [[1, "Zn"], [2, "HCl"]], p: [[1, "ZnCl2"], [1, "H2"]] },
    { r: [[2, "KClO3"]], p: [[2, "KCl"], [3, "O2"]] },
    { r: [[2, "C2H6"], [7, "O2"]], p: [[4, "CO2"], [6, "H2O"]] },
    { r: [[1, "Fe2O3"], [3, "CO"]], p: [[2, "Fe"], [3, "CO2"]] },
    { r: [[2, "Al"], [6, "HCl"]], p: [[2, "AlCl3"], [3, "H2"]] },
    { r: [[2, "SO2"], [1, "O2"]], p: [[2, "SO3"]] },
    { r: [[1, "NaOH"], [1, "HCl"]], p: [[1, "NaCl"], [1, "H2O"]] },
    { r: [[2, "NaOH"], [1, "H2SO4"]], p: [[1, "Na2SO4"], [2, "H2O"]] },
    { r: [[1, "Ca(OH)2"], [2, "HCl"]], p: [[1, "CaCl2"], [2, "H2O"]] },
    { r: [[1, "AgNO3"], [1, "NaCl"]], p: [[1, "AgCl"], [1, "NaNO3"]] },
    { r: [[1, "CaCO3"], [2, "HCl"]], p: [[1, "CaCl2"], [1, "H2O"], [1, "CO2"]] }
  ];
  const lato = arr => arr.map(([c, f]) => (c > 1 ? c + " " : "") + sub(f)).join(" + ");
  const rzTesto = z => lato(z.r) + " → " + lato(z.p);

  return { rnd, pick, sh, pickN, sup, sub, sf, fx, sg, meno, mc, nm, g, materializza, modelli, GENERATORI, M, atomi, NA, R_ATM, R_J, H, C, KB, RZ, rzTesto, lato,
    setLivello: l => { livelloCorrente = l; } };
})();

// Il modello compare nel database delle domande come una voce normale; la domanda vera nasce quando serve
function materializzaDomanda(q) { return q.g ? GL.materializza(q) : q; }

<script>
/* Stato del giocatore (localStorage): XP, livelli, streak, ripetizione dilazionata, padronanza, missioni, esami */
const CHIAVE = "chimicaquest-v1";
const LIVELLI = [
  { min: 0, nome: "Apprendista Alchimista" },
  { min: 120, nome: "Mescolatore di Provette" },
  { min: 300, nome: "Custode del Becco Bunsen" },
  { min: 550, nome: "Tecnico di Laboratorio" },
  { min: 900, nome: "Bilanciatore di Reazioni" },
  { min: 1350, nome: "Domatore di Orbitali" },
  { min: 1900, nome: "Chimico Esperto" },
  { min: 2600, nome: "Architetto Molecolare" },
  { min: 3500, nome: "Gran Sintetizzatore" },
  { min: 4600, nome: "Maestro della Chimica" }
];
// Ripetizione dilazionata (Leitner): giorni prima del prossimo ripasso per ogni "scatola"
const INTERVALLI = [0, 1, 3, 7, 16, 35];
const ESAMI_PREDEFINITI = [
  { id: "itinere", nome: "Prova in itinere", data: "2026-11-27", moduli: ["atomo", "mole", "orbitali", "tavola", "legame", "orbitalimolecolari", "organica", "gas"] },
  { id: "finale", nome: "Esame finale", data: "2027-01-09", moduli: MODULI.map(m => m.id) }
];

function statoVuoto() {
  return {
    xp: 0, streak: { n: 0, best: 0, last: null }, giorni: {}, moduli: {}, carte: {}, errori: {}, storico: {}, padr: {},
    giorno: null, badge: {}, sim: [], esami: JSON.parse(JSON.stringify(ESAMI_PREDEFINITI)),
    audio: true, libera: false, nuoveGiorno: 40, penalita: 0,
    stats: { risposte: 0, corrette: 0, boss: 0, carte: 0, recuperati: 0, giornatePerfette: 0, gufo: false }
  };
}
let S = statoVuoto();
let memoriaOk = true;

// Controlla davvero che il browser conservi i dati (anteprime, modalità privata e file aperti da app esterne spesso no)
function provaMemoria() {
  try { const k = "cq-prova"; localStorage.setItem(k, "1"); const ok = localStorage.getItem(k) === "1"; localStorage.removeItem(k); return ok; }
  catch (e) { return false; }
}
// Backup dei progressi: un codice testuale (CQ1:…) che si può copiare, incollare o salvare in un file
function esportaCodice() { return "CQ1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importaCodice(testo) {
  const t = String(testo).trim().replace(/\s+/g, "");
  if (!t.startsWith("CQ1:")) throw new Error("Il codice deve iniziare con CQ1:");
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))); } catch (e) { throw new Error("Codice incompleto o danneggiato: copialo di nuovo per intero"); }
  if (!obj || typeof obj !== "object" || obj.xp === undefined || !obj.moduli) throw new Error("Questo non sembra un backup di ChimicaQuest");
  const v = statoVuoto();
  S = Object.assign(v, obj);
  S.stats = Object.assign(statoVuoto().stats, obj.stats || {});
  S.streak = Object.assign(statoVuoto().streak, obj.streak || {});
  if (!Array.isArray(S.esami) || !S.esami.length) S.esami = statoVuoto().esami;
  livelloPrima = livello().i;
  salva();
}
function carica() {
  memoriaOk = provaMemoria();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* facoltativo */ }
  try {
    const raw = localStorage.getItem(CHIAVE);
    if (raw) {
      const v = statoVuoto(), letto = JSON.parse(raw);
      S = Object.assign(v, letto);
      S.stats = Object.assign(statoVuoto().stats, letto.stats || {});
      S.streak = Object.assign(statoVuoto().streak, letto.streak || {});
      if (!Array.isArray(S.esami) || !S.esami.length) S.esami = statoVuoto().esami;
    }
  } catch (e) { memoriaOk = false; }
  livelloPrima = livello().i;
}
function salva() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(S)); } catch (e) { memoriaOk = false; }
}

/* ---------- Date ---------- */
const oggi = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function piuGiorni(data, n) { const d = new Date(data + "T12:00:00"); d.setDate(d.getDate() + n); return oggi(d); }
const ieri = () => piuGiorni(oggi(), -1);
const giorniA = data => Math.round((new Date(data + "T12:00:00") - new Date(oggi() + "T12:00:00")) / 86400000);
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const GIORNI_SETT = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
function dataLunga(s) { const d = new Date(s + "T12:00:00"); return GIORNI_SETT[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()]; }

/* ---------- Attività del giorno, streak ---------- */
function giornata() {
  if (!S.giorno || S.giorno.data !== oggi())
    S.giorno = { data: oggi(), carte: 0, nuove: 0, risposte: 0, giuste: 0, recuperati: 0, paragrafi: 0, boss: 0, sim: 0, premi: [], terza: numErrori() ? "errori" : "paragrafi" };
  return S.giorno;
}
function segnaAttivita() {
  const g = oggi();
  S.giorni[g] = (S.giorni[g] || 0) + 1;
  const ora = new Date().getHours();
  if (ora >= 23 || ora < 4) S.stats.gufo = true;
  if (S.streak.last !== g) {
    S.streak.n = S.streak.last === ieri() ? S.streak.n + 1 : 1;
    S.streak.last = g;
    S.streak.best = Math.max(S.streak.best, S.streak.n);
    if (S.streak.n > 1) toast("🔥 Streak di " + S.streak.n + " giorni!");

/* ---------- XP e livelli ---------- */
let livelloPrima = 0;
function livello(xp = S.xp) {
  let i = 0;
  while (i + 1 < LIVELLI.length && xp >= LIVELLI[i + 1].min) i++;

  return { i, nome: LIVELLI[i].nome, min: LIVELLI[i].min, max: succ ? succ.min : null,
    perc: succ ? (xp - LIVELLI[i].min) / (succ.min - LIVELLI[i].min) * 100 : 100 };

function controllaLivello() {
  const l = livello();

  livelloPrima = l.i;
}
// Punto unico dopo ogni attività: XP, streak, missioni, traguardi, salvataggio
function aggiungiXP(n, ancora) {

/* ---------- Moduli ---------- */
const modulo = id => (S.moduli[id] = S.moduli[id] || { stelle: 0, vinto: false, tentativi: 0, letti: [] });
function sbloccato(i) { return S.libera || i === 0 || (S.moduli[MODULI[i - 1].id] || {}).vinto; }
const indiceModulo = id => MODULI.findIndex(m => m.id === id);

/* ---------- Padronanza per paragrafo (ultime 8 risposte, con correzione per pochi dati) ---------- */
function registraPadronanza(q, ok) {
  const k = q.c + "|" + q.a, p = S.padr[k] = S.padr[k] || { r: [], tot: 0 };
  p.r.push(ok ? 1 : 0); if (p.r.length > 8) p.r.shift(); p.tot++;
}
function padronanza(c, a) {
  const p = S.padr[c + "|" + a];
  if (!p || !p.r.length) return null;
  return (p.r.reduce((x, y) => x + y, 0) + 1) / (p.r.length + 2);
}
// Prontezza di un modulo: media della padronanza dei paragrafi (un paragrafo mai provato vale 0)
function prontezzaModulo(id) {
  const m = MODULI[indiceModulo(id)];
  return m.argomenti.reduce((s, _, a) => s + (padronanza(id, a) || 0), 0) / m.argomenti.length;
}
function prontezzaEsame(es) { return es.moduli.reduce((s, id) => s + prontezzaModulo(id), 0) / Math.max(1, es.moduli.length); }

/* ---------- Esiti delle risposte, registro errori ---------- */
// Una domanda esce dagli errori dopo 2 risposte giuste di fila
function registraEsito(q, giusta) {
  const g = giornata();
  S.stats.risposte++; g.risposte++;
  if (giusta) { S.stats.corrette++; g.giuste++; }
  S.storico[q.id] = (S.storico[q.id] || 0) + 1;
  registraPadronanza(q, giusta);
  const e = S.errori[q.id];
  if (!giusta) {
    S.errori[q.id] = { n: (e ? e.n : 0) + 1, ok: 0, t: Date.now() };
    // le domande con numeri variabili cambiano a ogni volta: si conserva quella sbagliata, per mostrarla nell'elenco
    if (q.gen) S.errori[q.id].snap = { q: q.q, o: q.o, r: q.r, s: q.s, c: q.c, a: q.a, l: q.l };
  }
  else if (e) {
    e.ok++;
    if (e.ok >= 2) { delete S.errori[q.id]; S.stats.recuperati++; g.recuperati++; toast("🩹 Errore recuperato!"); return "recuperato"; }
  }
  return null;
}
const numErrori = () => Object.keys(S.errori).length;

/* ---------- Flashcard: ripetizione dilazionata ---------- */
function votaSRS(id, sa) {
  const st = S.carte[id] = S.carte[id] || { box: 0, n: 0 };
  const nuova = !st.n, g = giornata();

  st.due = piuGiorni(oggi(), sa ? INTERVALLI[st.box] : 0);
  g.carte++; if (nuova) g.nuove++;
  S.stats.carte++;
  return nuova;
}
const cartaVista = c => S.carte[c.id] && S.carte[c.id].n;
const scaduta = c => cartaVista(c) && (S.carte[c.id].due || oggi()) <= oggi();

/* ---------- Esami ---------- */
function esameAttivo() {
  const futuri = S.esami.filter(e => e.data >= oggi()).sort((a, b) => a.data < b.data ? -1 : 1);
  return futuri[0] || S.esami[S.esami.length - 1];
}

let ctxAudio = null;

}

    if (e.target === ov || e.target.closest("[data-chiudi]")) return chiudi();
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.apriArgo !== undefined) { b.parentElement.classList.toggle("aperto"); suono("flip"); }
    else if (b.dataset.letto !== undefined) {
      const k = Number(b.dataset.letto);
      if (!st.letti.includes(k)) {
        st.letti.push(k); giornata().paragrafi++;
        const box = b.closest(".argo"); box.classList.add("letto"); $(".chk", box).textContent = "✓";
        b.textContent = "✓ Studiato"; suono("ok");
        aggiungiXP(5, b);
      }
    }
    else if (b.dataset.quizPar !== undefined) avviaBoss(id, "paragrafo", Number(b.dataset.quizPar));
    else if (b.dataset.feedModulo) { ov.remove(); vai("feed", { filtro: b.dataset.feedModulo }); }
    else if (b.dataset.boss) avviaBoss(b.dataset.boss);
    else if (b.dataset.infinito) avviaBoss(b.dataset.infinito, "infinito");
    else if (b.dataset.formule) { ov.remove(); vai("strumenti", { sez: "formule", modulo: b.dataset.formule }); }
  });
}

<script>
/* Feed di flashcard a scorrimento verticale (stile Reel) con ripetizione dilazionata.
   "Oggi" = carte in scadenza + nuove carte (fino al limite giornaliero), nell'ordine del programma d'esame. */
const TIPI_CARTA = { definizione: "📖 Definizione", concetto: "💡 Ragionamento", formula: "🧮 Formula", quiz: "❓ Domanda", calcolo: "✏️ Esercizio" };
let feed = { filtro: "oggi", coda: [], pos: 0, visti: new Set() };

const moduloAperto = c => sbloccato(indiceModulo(c.c));
// Coda del ripasso di oggi: prima le scadute (scatole basse per prime), poi le nuove dei moduli d'esame in ordine
function codaOggi() {
  const es = esameAttivo();
  const ordineMod = id => { const k = es.moduli.indexOf(id); return k < 0 ? 100 + indiceModulo(id) : k; };
  const dovute = CARTE.filter(scaduta).sort((a, b) => (S.carte[a.id].box - S.carte[b.id].box) || (S.carte[a.id].due < S.carte[b.id].due ? -1 : 1));
  const quante = Math.max(0, S.nuoveGiorno - giornata().nuove);
  const nuove = CARTE.filter(c => !cartaVista(c) && moduloAperto(c))
    .sort((a, b) => ordineMod(a.c) - ordineMod(b.c) || a.a - b.a).slice(0, quante);
  // alterna: 3 ripassi e 2 nuove, così la sessione resta varia
  const out = [];
  while (dovute.length || nuove.length) { out.push(...dovute.splice(0, 3)); out.push(...nuove.splice(0, 2)); }
  return out;
}
// Peso nel feed "Mix": le "Da rivedere" escono molto più spesso, quelle consolidate raramente
function pesoCarta(c) {
  const st = S.carte[c.id];
  if (!st || !st.n) return 2;
  if (st.da) return 5;
  return [2, 1.2, .7, .35, .2, .1][Math.min(st.box || 0, 5)];
}
function lottoMix(pool, n = 20) {
  let liberi = pool.filter(c => !feed.visti.has(c.id));
  if (liberi.length < n) { feed.visti.clear(); liberi = pool; }
  const out = liberi.map(c => ({ c, k: Math.pow(Math.random(), 1 / pesoCarta(c)) })).sort((a, b) => b.k - a.k).slice(0, n).map(x => x.c);
  out.forEach(c => feed.visti.add(c.id));
  return out;
}
function prossimoLotto() {
  if (feed.filtro === "oggi") { const l = feed.coda.slice(feed.pos, feed.pos + 20); feed.pos += l.length; return l; }
  if (feed.filtro === "rivedere") return lottoMix(CARTE.filter(c => S.carte[c.id] && S.carte[c.id].da));
  if (feed.filtro === "mix") return lottoMix(CARTE.filter(moduloAperto));
  return lottoMix(CARTE.filter(c => c.c === feed.filtro));
}

function renderFeed(opz = {}) {
  if (opz.filtro) feed.filtro = opz.filtro;
  feed.visti.clear(); feed.pos = 0;
  if (feed.filtro === "oggi") feed.coda = codaOggi();
  const vista = $("#vista");
  vista.classList.add("feedmode");
  const nRiv = CARTE.filter(c => S.carte[c.id] && S.carte[c.id].da).length;
  const chips = [["oggi", "📅 Oggi (" + (feed.filtro === "oggi" ? feed.coda.length : codaOggi().length) + ")"], ["mix", "✨ Mix"], ["rivedere", "🔁 Da rivedere (" + nRiv + ")"]]
    .concat(MODULI.map((m, i) => [m.id, (sbloccato(i) ? "" : "🔒 ") + m.titolo]));
  vista.innerHTML = '<div class="feedwrap"><div class="chips">' +
    chips.map(([k, t]) => '<button class="chip' + (feed.filtro === k ? " on" : "") + '" data-filtro="' + k + '">' + esc(t) + '</button>').join("") +
    '</div><div class="feed" id="feed" tabindex="0"></div></div>';
  const f = $("#feed");
  const bloccato = MODULI.some((m, i) => m.id === feed.filtro && !sbloccato(i));
  if (bloccato) { f.innerHTML = vuotoFeed("🔒", "Modulo ancora bloccato: sconfiggi il boss precedente o attiva la modalità libera nel Profilo.", "libera"); return; }
  aggiungiCarte();
  if (!$(".fcard", f)) {
    f.innerHTML = feed.filtro === "oggi" ? vuotoFeed("🎉", "Ripasso di oggi completato! Le carte torneranno quando sarà il momento giusto per ripassarle. Se vuoi continuare, passa al Mix.", "mix")
      : vuotoFeed("🧼", "Nessuna carta da rivedere: quando segni una carta come «Da rivedere» la trovi qui.", "mix");
  }
  const on = $(".chip.on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  f.focus({ preventScroll: true });
  f.addEventListener("scroll", () => { if (f.scrollTop + f.clientHeight * 3 > f.scrollHeight) aggiungiCarte(); }, { passive: true });
}
function vuotoFeed(ico, testo, az) {
  return '<div class="fcard"><div class="vuoto glass" style="margin:auto 0"><b>' + ico + '</b>' + esc(testo) +
    '<div style="margin-top:16px"><button class="btn primario" data-filtro="' + (az === "libera" ? "__libera" : az) + '">' + (az === "libera" ? "Vai al Profilo" : "✨ Passa al Mix") + '</button></div></div></div>';
}

function htmlCarta(c, extra = "") {
  const m = capById(c.c), st = S.carte[c.id] || {};
  const lungo = c.f.length > 140 ? " lungo" : "", lungoB = c.b.length > 260 ? " lungo" : "";
  const stato = !st.n ? "🆕 nuova" : st.da ? "🔁 da rivedere" : "📦 scatola " + st.box;
  return '<article class="fcard" data-id="' + c.id + '" style="--col:' + m.colore + '">' +
    '<div class="flip" data-flip>' +
      '<div class="faccia fronte"><div class="riga-et"><span class="etichetta">' + TIPI_CARTA[c.t] + '</span><span class="etichetta grigia">' + esc(m.titolo) + '</span></div>' +
        '<p class="testo-card' + lungo + '">' + esc(c.f) + '</p><span class="tocca">👆 Tocca per girare · ' + stato + extra + '</span></div>' +
      '<div class="faccia retro"><span class="etichetta">' + esc(m.argomenti[c.a] ? m.argomenti[c.a].titolo : m.titolo) + '</span>' +
        // i pulsanti stanno in ALTO, sopra la risposta: così non finiscono mai sotto la barra del telefono
        '<div class="voti"><button class="btn no" data-voto="no">🔁 Da rivedere</button><button class="btn si" data-voto="si">✅ So già</button></div>' +
        '<p class="testo-card' + lungoB + '">' + esc(c.b) + '</p></div>' +
    '</div>' +
  '</article>';
}
function aggiungiCarte() {
  const f = $("#feed"); if (!f) return;
  f.insertAdjacentHTML("beforeend", prossimoLotto().map(c => htmlCarta(c)).join(""));
}

function giraCarta(card) {
  const fl = $(".flip", card); if (!fl) return;
  fl.classList.toggle("girata");
  suono("flip");
}
function votaCarta(card, voto, bottone) {
  const id = card.dataset.id, sa = voto === "si";
  const nuova = votaSRS(id, sa);
  suono(sa ? "ok" : "click");
  aggiungiXP(sa ? (nuova ? 2 : 3) : 1, bottone);
  const st = S.carte[id];
  $(".voti", card).innerHTML = '<p class="suggerimento" style="grid-column:1/-1;align-self:center">' +
    (sa ? "✅ Prossimo ripasso " + (INTERVALLI[st.box] === 1 ? "domani" : "tra " + INTERVALLI[st.box] + " giorni") : "🔁 Te la ripropongo tra poco") + '</p>';
  // "Da rivedere": la stessa carta torna 5 posizioni più avanti nel feed
  if (!sa) {
    const cards = $$(".fcard", $("#feed")), i = cards.indexOf(card), dopo = cards[Math.min(cards.length - 1, i + 5)];
    const c = CARTE.find(x => x.id === id);
    if (dopo && c) dopo.insertAdjacentHTML("afterend", htmlCarta(c, " · di nuovo"));
  }
  setTimeout(() => scorriFeed(1, card), 380);
}
function cartaCorrente() {
  const f = $("#feed"); if (!f) return null;
  return $$(".fcard", f)[Math.round(f.scrollTop / f.clientHeight)] || null;
}
function scorriFeed(dir, da) {
  const f = $("#feed"); if (!f) return;
  const cards = $$(".fcard", f), i = cards.indexOf(da || cartaCorrente());
  const dest = cards[Math.max(0, i + dir)];
  if (dest) f.scrollTo({ top: dest.offsetTop - f.offsetTop, behavior: "smooth" });
  else if (dir > 0 && feed.filtro === "oggi") { renderFeed(); toast(feed.coda.length ? "🔁 Ancora un giro sulle carte da rivedere" : "🎉 Ripasso di oggi completato!"); }
}

document.addEventListener("click", e => {
  if (vistaCorrente !== "feed") return;
  const chip = e.target.closest("[data-filtro]");
  if (chip) { suono("click"); if (chip.dataset.filtro === "__libera") return vai("profilo"); return renderFeed({ filtro: chip.dataset.filtro }); }
  const voto = e.target.closest("[data-voto]");
  if (voto) return votaCarta(voto.closest(".fcard"), voto.dataset.voto, voto);
  const fl = e.target.closest("[data-flip]");
  if (fl) giraCarta(fl.closest(".fcard"));
});
document.addEventListener("keydown", e => {
  if (vistaCorrente !== "feed" || document.querySelector(".schermo, .overlay") || e.target.tagName === "INPUT") return;
  const card = cartaCorrente(); if (!card) return;
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); scorriFeed(1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); scorriFeed(-1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); giraCarta(card); }
  else if ((e.key === "1" || e.key === "2") && $(".flip", card).classList.contains("girata") && $(".voti [data-voto]", card))
    votaCarta(card, e.key === "2" ? "si" : "no", $('[data-voto="' + (e.key === "2" ? "si" : "no") + '"]', card));
});

</script>
<script>
/* Boss Fight (3 vite, game over anti-frustrazione) + allenamenti senza vite: errori e singolo paragrafo */
const VITE_MAX = 3, DOMANDE_BOSS = { 1: 3, 2: 4, 3: 3 }, XP_LIVELLO = { 1: 10, 2: 15, 3: 20 };
let B = null;

// Adattiva: preferisce domande uscite poco e dei paragrafi in cui vai peggio
// Le domande con numeri variabili non "si consumano" (ogni volta sono diverse): hanno un leggero vantaggio
const usi = q => q.g ? -.4 : (S.storico[q.id] || 0);
function scegliDomande(pool, n) {
  const punteggio = q => usi(q) - 1.5 * (1 - (padronanza(q.c, q.a) ?? .5)) + Math.random() * 1.6 + (S.errori[q.id] ? -1 : 0);
  return pool.map(q => ({ q, k: punteggio(q) })).sort((a, b) => a.k - b.k).slice(0, n).map(x => x.q);
}
function istanza(q0) {
  const q = materializzaDomanda(q0);   // per i modelli con numeri variabili nasce qui la domanda vera
  const opz = q.o.map((t, i) => ({ t, ok: i === q.r }));
  return { q, opz: q.f ? opz : mescola(opz), scelta: null };
}
// Allenamento infinito: domande con numeri sempre nuovi, senza vite, orientate ai paragrafi più deboli
function pescaInfinito(modelli, ultimo) {
  const cand = modelli.filter(m => m.id !== ultimo);
  const peso = m => 1 + 2.5 * (1 - (padronanza(m.c, m.a) ?? .5)) + (S.errori[m.id] ? 1.5 : 0);
  let r = Math.random() * cand.reduce((s, m) => s + peso(m), 0);
  for (const m of cand) { r -= peso(m); if (r <= 0) return m; }
  return cand[0];
}

// tipo: "boss" (modulo, con vite) · "errori" (allenamento sugli errori) · "paragrafo" (quiz mirato su un paragrafo)
function avviaBoss(capId, tipo = "boss", arg = null) {
  let lista;
  if (tipo === "errori") {
    const ids = Object.entries(S.errori).sort((a, b) => b[1].n - a[1].n || b[1].t - a[1].t).map(([id]) => id);
    lista = mescola(ids.slice(0, 10)).map(id => DOMANDE.find(q => q.id === id)).filter(Boolean);
    if (!lista.length) { toast("🎉 Nessun errore da ripassare!"); return; }
  } else if (tipo === "infinito") {
    const modelli = DOMANDE.filter(q => q.g && q.c === capId);
    if (!modelli.length) { toast("Nessun esercizio con numeri variabili per questo modulo"); return; }
    lista = [pescaInfinito(modelli, null)];
  } else if (tipo === "paragrafo") {
    lista = mescola(scegliDomande(DOMANDE.filter(q => q.c === capId && q.a === arg), 8)).sort((a, b) => a.l - b.l);
    if (!lista.length) { toast("Nessuna domanda a scelta per questo paragrafo"); return; }
  } else {
    const pool = DOMANDE.filter(q => q.c === capId);
    lista = [];
    [1, 2, 3].forEach(l => lista.push(...mescola(scegliDomande(pool.filter(q => q.l === l), DOMANDE_BOSS[l]))));
    modulo(capId).tentativi++;
    salva();
  }
  $$(".overlay").forEach(o => o.remove());
  B = { capId, tipo, arg, domande: lista.map(istanza), i: 0, vite: VITE_MAX, sbagliate: [], xp: 0, infinito: tipo === "infinito", serie: 0, giuste: 0 };
  let el = $(".schermo");
  if (!el) { el = document.createElement("div"); el.className = "schermo"; document.body.appendChild(el); }
  el.style.setProperty("--col", capId ? capById(capId).colore : "#f472b6");
  suono("click");
  disegnaBoss();
}

function chiudiBoss() { const el = $(".schermo"); if (el) el.remove(); B = null; vai(vistaCorrente); }

function disegnaBoss() {
  const el = $(".schermo"), d = B.domande[B.i], risposto = d.scelta !== null;
  const totale = B.domande.length, conVite = B.tipo === "boss";
  const cuori = conVite ? '<div class="cuori" aria-label="Vite: ' + B.vite + '">' +
    Array.from({ length: VITE_MAX }, (_, k) => '<span class="' + (k >= B.vite ? "perso" : "") + '">❤️</span>').join("") + '</div>' : '<div class="pill">🎯 Allenamento</div>';
  const m = capById(d.q.c);
  const nomeBoss = conVite ? "⚔️ " + BOSS[B.capId] : B.infinito ? "♾️ " + m.titolo : B.tipo === "paragrafo" ? "🎯 " + m.argomenti[B.arg].titolo : "🩹 Ripasso errori · " + m.titolo;
  const progr = B.infinito ? "domanda " + (B.i + 1) + " · serie " + B.serie : (B.i + 1) + "/" + totale;
  let fb = "";
  if (risposto) {
    const ok = d.opz[d.scelta].ok, giusta = d.opz.find(o => o.ok).t;
    fb = '<div class="feedback ' + (ok ? "bene" : "male") + '"><b>' + (ok ? "✅ Colpo a segno!" : "💥 Colpito! " + (conVite ? "Perdi una vita" : "Risposta sbagliata")) + '</b>' +
      (ok ? "" : '<div>Risposta corretta: <strong style="color:var(--li)">' + esc(giusta) + '</strong></div>') +
      '<div style="margin-top:6px;color:#d6deef">' + esc(d.q.s) + '</div>' +
      '<div style="margin-top:6px;font-size:12px;color:var(--muted)">📖 ' + esc(m.argomenti[d.q.a].titolo) + (d.q.e ? " · 📋 domanda d'esame reale" : "") + '</div></div>';
  }
  const fineVite = conVite && B.vite === 0;
  el.innerHTML =
    '<div class="btop"><button class="esci" data-b="esci" aria-label="Esci">✕</button>' +
      '<div class="barra"><i style="width:' + ((B.i + (risposto ? 1 : 0)) / totale * 100) + '%"></i></div>' + cuori + '</div>' +
    '<div class="bcorpo"><div class="bossnome">' + esc(nomeBoss) + ' · ' + progr + ' · ' + ["", "base", "intermedia", "d'esame"][d.q.l] + (d.q.gen ? " · 🔢 numeri nuovi" : "") + '</div>' +
      '<div class="domanda glass">' + esc(d.q.q) + '</div>' +
      '<div class="opz' + (risposto ? " bloccato" : "") + '">' + d.opz.map((o, k) => {
        let c = "";
        if (risposto) c = o.ok ? "giusta" : (k === d.scelta ? "sbagliata" : "spenta");
        return '<button class="' + c + '" data-opz="' + k + '"><i>' + LETTERE[k] + '</i><span>' + esc(o.t) + '</span></button>';
      }).join("") + '</div>' + fb + '</div>' +
    '<div class="bpiede">' + (risposto ? '<button class="btn ' + (fineVite ? "boss" : "primario") + '" style="width:100%" data-b="avanti">' +
      (fineVite ? "Vedi cosa ripassare →" : B.infinito || B.i + 1 < totale ? "Continua →" : "Concludi 🏁") + '</button>' : "") + '</div>';
  if (risposto) $(".feedback", el).scrollIntoView({ behavior: "smooth", block: "nearest" });
  else $(".bcorpo", el).scrollTop = 0;
}

function rispondiBoss(k) {
  if (!B) return;
  const d = B.domande[B.i];
  if (d.scelta !== null || k >= d.opz.length) return;
  d.scelta = k;
  const ok = d.opz[k].ok;
  registraEsito(d.q, ok);
  if (ok) {
    suono("ok");
    const xp = Math.round((XP_LIVELLO[d.q.l] || 10) * (B.infinito ? .5 : 1));
    B.xp += xp; B.giuste++; B.serie++;
    disegnaBoss();
    aggiungiXP(xp, $(".opz .giusta"));
  } else {
    B.sbagliate.push(d); B.serie = 0;
    if (B.tipo === "boss") B.vite--;
    suono(B.tipo === "boss" ? "cuore" : "no");
    if (navigator.vibrate) navigator.vibrate(120);
    aggiungiXP(0);
    disegnaBoss();
    const persi = $$(".cuori span.perso");
    if (persi.length && B.tipo === "boss") persi[0].classList.add("rompi");
  }
}

function avantiBoss() {
  if (B.tipo === "boss" && B.vite === 0) return gameOver();
  if (B.infinito) { B.domande.push(istanza(pescaInfinito(DOMANDE.filter(q => q.g && q.c === B.capId), B.domande[B.i].q.id))); B.i++; return disegnaBoss(); }
  if (B.i + 1 < B.domande.length) { B.i++; disegnaBoss(); }
  else vittoria();
}

function elencoErrori() {
  const visti = new Set();
  return '<div class="errlista">' + B.sbagliate.filter(d => !visti.has(d.q.id) && visti.add(d.q.id)).map(d =>
    '<div class="errcard glass"><h4>' + esc(d.q.q) + '</h4><div class="gg">✅ ' + esc(d.q.o[d.q.r]) + '</div>' + esc(d.q.s) +
    '<br><small>📖 Ripassa: ' + esc(capById(d.q.c).argomenti[d.q.a].titolo) + '</small></div>').join("") + '</div>';
}

// Game over intelligente: spiega gli errori; "Riprova" riparte sempre con le vite piene, senza blocchi
function gameOver() {
  suono("lose");
  const el = $(".schermo"), m = capById(B.capId);
  el.innerHTML = '<div class="bcorpo"><div class="fine"><div class="grande">💔</div><h2>Il boss ha vinto questo round</h2>' +
    '<p>Nessun problema: ogni errore è un’informazione. Rileggi questi concetti, poi riprova con <b>3 vite piene</b> e domande nuove.</p>' +
    elencoErrori() + '</div></div>' +
    '<div class="bpiede" style="display:grid;gap:10px">' +
      '<button class="btn boss" data-b="riprova">🔁 Riprova (vite 3/3)</button>' +
      '<div class="azioni" style="margin:0"><button class="btn sec" data-b="ripassa">📖 Ripassa ' + esc(m.titolo) + '</button><button class="btn sec" data-b="esci">🗺️ Mappa</button></div></div>';
}

function vittoria() {
  const el = $(".schermo");
  if (B.tipo !== "boss") {
    const ok = B.domande.length - B.sbagliate.length;
    suono("win"); aggiungiXP(15);
    const titolo = B.tipo === "paragrafo" ? "Quiz completato" : "Allenamento completato";
    const p = B.tipo === "paragrafo" ? padronanza(B.capId, B.arg) : null;
    el.innerHTML = '<div class="bcorpo"><div class="fine"><div class="grande">🎯</div><h2>' + titolo + '</h2>' +
      '<p>' + ok + ' risposte giuste su ' + B.domande.length + '.' + (p !== null ? ' Padronanza del paragrafo: <b>' + Math.round(p * 100) + '%</b>.' : "") +
      ' Una domanda esce dagli errori dopo 2 risposte giuste di fila. Errori rimasti: <b>' + numErrori() + '</b>.</p>' +
      (B.sbagliate.length ? elencoErrori() : "") + '</div></div>' +
      '<div class="bpiede azioni" style="margin:0"><button class="btn primario" data-b="ancora">🔁 Ancora</button><button class="btn sec" data-b="esci">Fine</button></div>';
    return;
  }
  const st = modulo(B.capId), stelle = B.vite, primaVolta = !st.vinto;
  st.vinto = true; st.stelle = Math.max(st.stelle, stelle); S.stats.boss++; giornata().boss++;
  const bonus = 50 + 25 * stelle;
  suono("win"); coriandoli(110); aggiungiXP(bonus);

      '<div class="azioni" style="margin:0"><button class="btn sec" data-b="riprova">🔁 Rigioca</button><button class="btn sec" data-b="esci">🗺️ Mappa</button></div></div>';
}

document.addEventListener("click", e => {

<script>
/* Simulazione d'esame: a tempo, senza correzione durante la prova, voto stimato in trentesimi e revisione finale */
let SIM = null;
const MIX_SIM = { 1: .2, 2: .4, 3: .4 };   // 20% base, 40% intermedie, 40% d'esame

// Pesca n domande bilanciando i moduli (a turno) e preferendo quelle uscite meno volte
function pescaBilanciato(pool, n) {
  const gruppi = {};
  mescola(pool).forEach(q => (gruppi[q.c] = gruppi[q.c] || []).push(q));
  Object.values(gruppi).forEach(g => { const k = new Map(g.map(q => [q, usi(q) + Math.random() * 1.6])); g.sort((a, b) => k.get(a) - k.get(b)); });
  const ordine = mescola(Object.keys(gruppi)), out = [];
  while (out.length < n && ordine.some(k => gruppi[k].length))
    for (const k of ordine) { if (out.length >= n) break; if (gruppi[k].length) out.push(gruppi[k].shift()); }
  return out;
}

function apriSetupSim() {
  const es = esameAttivo();
  const scelta = { esame: es.id, n: 30, tempo: true };
  const ov = document.createElement("div");
  ov.className = "overlay";
  const disegna = () => {
    const sel = S.esami.find(e => e.id === scelta.esame) || { nome: "Tutti i moduli", moduli: MODULI.map(m => m.id) };
    const minuti = Math.round(scelta.n * 1.5);
    ov.innerHTML = '<div class="foglio"><div class="testa"><div><h2>📝 Simulazione d\'esame</h2><p class="desc">Come all\'esame: nessuna correzione durante la prova, puoi tornare indietro e cambiare risposta. Alla consegna ricevi voto stimato, analisi per modulo e spiegazioni.</p></div><button class="chiudi" data-chiudi>✕</button></div>' +
      '<p class="titolo-sez">Programma</p><div class="chips aperta">' +
        S.esami.map(e => '<button class="chip' + (scelta.esame === e.id ? " on" : "") + '" data-s-esame="' + e.id + '">' + esc(e.nome) + ' (' + e.moduli.length + ')</button>').join("") +
        '<button class="chip' + (scelta.esame === "tutto" ? " on" : "") + '" data-s-esame="tutto">Tutti i moduli (10)</button></div>' +
      '<p class="titolo-sez">Domande</p><div class="chips aperta">' + [15, 30, 45].map(n => '<button class="chip' + (scelta.n === n ? " on" : "") + '" data-s-n="' + n + '">' + n + '</button>').join("") + '</div>' +
      '<div class="impo" style="margin-top:12px"><span>⏱️ A tempo (' + minuti + ' minuti, 1,5 min a domanda)</span><button class="switch' + (scelta.tempo ? " on" : "") + '" data-s-tempo></button></div>' +
      '<div class="impo"><span>➖ Penalità per risposta sbagliata<br><small style="color:var(--muted)">Imposta la regola del tuo esame; le risposte lasciate vuote valgono 0</small></span>' +
        '<select data-s-pen class="sel">' + [[0, "nessuna"], [0.25, "−0,25"], [0.33, "−0,33"], [0.5, "−0,5"]].map(([v, t]) => '<option value="' + v + '"' + (S.penalita === v ? " selected" : "") + '>' + t + '</option>').join("") + '</select></div>' +
      '<p class="desc" style="margin:10px 2px">Moduli: ' + esc(sel.moduli.map(id => capById(id).titolo).join(", ")) + '. Mix di difficoltà: 20% base, 40% intermedie, 40% domande d\'esame reali.</p>' +
      '<button class="btn primario" style="width:100%" data-s-via>▶ Inizia la simulazione</button></div>';
  };
  disegna();
  document.body.appendChild(ov);
  ov.addEventListener("click", e => {
    if (e.target === ov || e.target.closest("[data-chiudi]")) return ov.remove();
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.sEsame) { scelta.esame = b.dataset.sEsame; disegna(); }
    else if (b.dataset.sN) { scelta.n = Number(b.dataset.sN); disegna(); }
    else if (b.dataset.sTempo !== undefined) { scelta.tempo = !scelta.tempo; disegna(); }
    else if (b.dataset.sVia !== undefined) { ov.remove(); avviaSim(scelta); }
  });
  ov.addEventListener("change", e => { if (e.target.dataset.sPen !== undefined) { S.penalita = Number(e.target.value); salva(); } });
}

function avviaSim(scelta) {
  const es = S.esami.find(e => e.id === scelta.esame) || { id: "tutto", nome: "Tutti i moduli", moduli: MODULI.map(m => m.id) };
  const pool = DOMANDE.filter(q => es.moduli.includes(q.c));
  let lista = [];
  [1, 2, 3].forEach(l => lista.push(...pescaBilanciato(pool.filter(q => q.l === l), Math.round(scelta.n * MIX_SIM[l]))));
  lista = mescola(lista).slice(0, scelta.n);
  SIM = { es, domande: lista.map(istanza), i: 0, inizio: Date.now(), durata: scelta.tempo ? Math.round(scelta.n * 90) : 0, finita: false, timer: null };
  let el = $(".schermo");
  if (!el) { el = document.createElement("div"); el.className = "schermo"; document.body.appendChild(el); }
  el.style.setProperty("--col", "#a78bfa");
  if (SIM.durata) SIM.timer = setInterval(tickSim, 1000);
  suono("click");
  disegnaSim();
}
function restanti() { return SIM.durata - Math.floor((Date.now() - SIM.inizio) / 1000); }
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function tickSim() {
  if (!SIM || SIM.finita) return;
  const r = restanti(), t = $("#sim-timer");
  if (t) { t.textContent = "⏱️ " + mmss(Math.max(0, r)); t.classList.toggle("allarme", r <= 60); }
  if (r <= 0) { toast("⏰ Tempo scaduto: prova consegnata"); consegnaSim(); }
}

function disegnaSim(conIndice) {
  const el = $(".schermo"), d = SIM.domande[SIM.i], tot = SIM.domande.length;
  const fatte = SIM.domande.filter(x => x.scelta !== null).length;
  el.innerHTML =
    '<div class="btop"><button class="esci" data-sim="esci" aria-label="Esci">✕</button>' +
      '<div class="barra"><i style="width:' + fatte / tot * 100 + '%"></i></div>' +
      (SIM.durata ? '<span class="pill" id="sim-timer">⏱️ ' + mmss(Math.max(0, restanti())) + '</span>' : "") +
      '<button class="pill btn" data-sim="indice">☰ ' + fatte + '/' + tot + '</button></div>' +
    '<div class="bcorpo">' +
      (conIndice ? '<div class="glass indice">' + SIM.domande.map((x, k) => '<button class="' + (x.scelta !== null ? "fatta" : "") + (k === SIM.i ? " qui" : "") + '" data-sim-vai="' + k + '">' + (k + 1) + '</button>').join("") + '</div>' : "") +
      '<div class="bossnome">📝 ' + esc(SIM.es.nome) + ' · domanda ' + (SIM.i + 1) + ' di ' + tot + ' · ' + esc(capById(d.q.c).titolo) + '</div>' +
      '<div class="domanda glass">' + esc(d.q.q) + '</div>' +
      '<div class="opz">' + d.opz.map((o, k) => '<button class="' + (d.scelta === k ? "scelta" : "") + '" data-sim-opz="' + k + '"><i>' + LETTERE[k] + '</i><span>' + esc(o.t) + '</span></button>').join("") + '</div>' +
      (d.scelta !== null ? '<button class="link-btn" data-sim="svuota">Togli la risposta</button>' : "") +
    '</div>' +
    '<div class="bpiede azioni" style="margin:0">' +
      '<button class="btn sec" data-sim="prec"' + (SIM.i ? "" : " disabled") + '>◀ Precedente</button>' +
      (SIM.i + 1 < tot ? '<button class="btn primario" data-sim="succ">Successiva ▶</button>' : '<button class="btn boss" data-sim="consegna">📤 Consegna</button>') +
    '</div>';
}

function consegnaSim() {
  if (!SIM || SIM.finita) return;
  SIM.finita = true; clearInterval(SIM.timer);
  const tot = SIM.domande.length, pen = S.penalita || 0;
  let giuste = 0, sbagliate = 0, vuote = 0;
  const perMod = {};
  SIM.domande.forEach(d => {
    const ok = d.scelta !== null && d.opz[d.scelta].ok;
    const pm = perMod[d.q.c] = perMod[d.q.c] || { ok: 0, tot: 0 };
    pm.tot++;
    if (d.scelta === null) vuote++; else if (ok) { giuste++; pm.ok++; } else sbagliate++;
    registraEsito(d.q, ok);          // anche le vuote contano come da rivedere
  });
  const punti = giuste - pen * sbagliate;
  const voto = Math.max(0, Math.round(punti / tot * 300) / 10);
  const durata = Math.round((Date.now() - SIM.inizio) / 1000);
  S.sim.push({ data: oggi(), esame: SIM.es.id, voto, giuste, sbagliate, vuote, tot, durata });
  if (S.sim.length > 60) S.sim.shift();
  giornata().sim++;
  const xp = giuste * 5 + 40;
  suono(voto >= 18 ? "win" : "lose");
  if (voto >= 27) coriandoli(120);
  aggiungiXP(xp);
  const el = $(".schermo");
  const giudizio = voto >= 30 ? "Eccellente: pronto per il massimo 🏆" : voto >= 27 ? "Ottimo livello 🎓" : voto >= 24 ? "Buono: punta a sistemare i moduli più deboli" : voto >= 18 ? "Sufficiente: c'è margine per salire" : "Non ancora sufficiente: segui il coach e riprova";
  SIM.filtro = "errori";
  el.innerHTML = '<div class="bcorpo"><div class="fine"><div class="grande">' + (voto >= 18 ? "🎓" : "📚") + '</div>' +
    '<h2>' + voto.toFixed(1).replace(".", ",") + ' / 30</h2><p>' + giudizio + '</p>' +
    '<div class="griglia-stat" style="width:100%"><div class="stat"><b style="color:var(--li)">' + giuste + '</b><span>giuste</span></div><div class="stat"><b style="color:var(--rd)">' + sbagliate + '</b><span>sbagliate' + (pen ? " (−" + String(pen).replace(".", ",") + " ciascuna)" : "") + '</span></div>' +
      '<div class="stat"><b>' + vuote + '</b><span>vuote</span></div><div class="stat"><b>' + mmss(durata) + '</b><span>tempo impiegato · +' + xp + ' XP</span></div></div>' +
    '<p class="titolo-sez" style="align-self:flex-start">Per modulo</p><div class="glass lista-miss" style="width:100%">' +
      Object.entries(perMod).map(([id, v]) => { const m = capById(id), p = v.ok / v.tot; return '<div class="missione"><span class="mico" style="color:' + m.colore + '">' + SIMBOLI[id] + '</span><span class="mtesto"><b>' + esc(m.titolo) + '</b><span class="barra' + (p < .6 ? " rossa" : "") + '"><i style="width:' + p * 100 + '%"></i></span></span><span class="mnum">' + v.ok + '/' + v.tot + '</span></div>'; }).join("") +
    '</div><p class="desc" style="font-size:12px">Il voto è una stima: giuste' + (pen ? " − " + String(pen).replace(".", ",") + " × sbagliate" : "") + ', riportate su 30. Le risposte sbagliate e vuote sono finite nel Ripasso errori.</p>' +
    '<div class="chips aperta" style="justify-content:center"><button class="chip on" data-sim-filtro="errori">Solo errori e vuote</button><button class="chip" data-sim-filtro="tutte">Tutte le domande</button></div>' +
    '<div class="errlista" id="sim-rev"></div></div></div>' +
    '<div class="bpiede azioni" style="margin:0"><button class="btn sec" data-sim="esci">Fine</button><button class="btn primario" data-sim="nuova">🔁 Nuova simulazione</button></div>';
  revisioneSim();
}
function revisioneSim() {
  const lista = SIM.domande.filter(d => SIM.filtro === "tutte" || d.scelta === null || !d.opz[d.scelta].ok);
  $("#sim-rev").innerHTML = lista.length ? lista.map(d => {
    const ok = d.scelta !== null && d.opz[d.scelta].ok;
    return '<div class="errcard glass"><h4>' + (ok ? "✅ " : d.scelta === null ? "⬜ " : "❌ ") + esc(d.q.q) + '</h4>' +
      (d.scelta !== null && !ok ? '<div style="color:var(--rd)">La tua: ' + esc(d.opz[d.scelta].t) + '</div>' : "") +
      '<div class="gg">Giusta: ' + esc(d.q.o[d.q.r]) + '</div>' + esc(d.q.s) +
      '<br><small>📖 ' + esc(capById(d.q.c).titolo + " › " + capById(d.q.c).argomenti[d.q.a].titolo) + (d.q.e ? " · 📋 esame reale" : "") + '</small></div>';
  }).join("") : '<div class="vuoto"><b>🎉</b>Nessun errore!</div>';
}
function chiudiSim() { if (SIM) clearInterval(SIM.timer); SIM = null; const el = $(".schermo"); if (el) el.remove(); vai(vistaCorrente); }

document.addEventListener("click", e => {
  if (!SIM) return;
  const o = e.target.closest("[data-sim-opz]");
  if (o && !SIM.finita) { SIM.domande[SIM.i].scelta = Number(o.dataset.simOpz); suono("click"); return disegnaSim(); }
  const v = e.target.closest("[data-sim-vai]");
  if (v) { SIM.i = Number(v.dataset.simVai); return disegnaSim(); }
  const f = e.target.closest("[data-sim-filtro]");
  if (f) { SIM.filtro = f.dataset.simFiltro; $$("[data-sim-filtro]").forEach(c => c.classList.toggle("on", c === f)); return revisioneSim(); }
  const b = e.target.closest("[data-sim]"); if (!b) return;
  const a = b.dataset.sim;
  if (a === "succ" && SIM.i + 1 < SIM.domande.length) { SIM.i++; disegnaSim(); }
  else if (a === "prec" && SIM.i > 0) { SIM.i--; disegnaSim(); }
  else if (a === "indice") disegnaSim(!$(".schermo .indice"));
  else if (a === "svuota") { SIM.domande[SIM.i].scelta = null; disegnaSim(); }
  else if (a === "consegna") {
    const vuote = SIM.domande.filter(d => d.scelta === null).length;
    if (!vuote || confirm("Ci sono " + vuote + " domande senza risposta. Consegnare comunque?")) consegnaSim();
  }
  else if (a === "nuova") { chiudiSim(); apriSetupSim(); }
  else if (a === "esci") { if (SIM.finita || confirm("Abbandonare la simulazione? Le risposte date finora non verranno salvate.")) chiudiSim(); }
});
document.addEventListener("keydown", e => {
  if (!SIM || SIM.finita || !$(".schermo")) return;
  if (/^[1-6]$/.test(e.key) && Number(e.key) <= SIM.domande[SIM.i].opz.length) { SIM.domande[SIM.i].scelta = Number(e.key) - 1; disegnaSim(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") { const b = $('.schermo [data-sim="succ"]'); if (b) { e.preventDefault(); b.click(); } }
  else if (e.key === "ArrowLeft") { const b = $('.schermo [data-sim="prec"]'); if (b) b.click(); }
});

<script>
/* Sezione "Ripasso Errori" e Profilo (statistiche, traguardi, simulazioni, impostazioni ed esami) */
function renderErrori() {
  const voci = Object.entries(S.errori).map(([id, e]) => ({ q: e.snap ? Object.assign({ id, gen: 1 }, e.snap) : DOMANDE.find(x => x.id === id), e })).filter(v => v.q)
    .sort((a, b) => b.e.n - a.e.n || b.e.t - a.e.t);
  let html = '<p class="titolo-sez">Ripasso errori</p>';
  if (!voci.length) {
    $("#vista").innerHTML = html + '<div class="glass vuoto"><b>🧼</b>Nessun errore registrato.<br>Le domande che sbagli (boss, quiz, simulazioni) finiscono qui automaticamente, e ne escono dopo 2 risposte giuste di fila.</div>';
    return;
  }
  const perModulo = {};
  voci.forEach(v => (perModulo[v.q.c] = perModulo[v.q.c] || []).push(v));
  const ripetuti = voci.filter(v => v.e.n > 1).length;
  html += '<section class="glass hero"><div class="riga"><div><div class="rango">' + voci.length + ' domande da sistemare</div>' +
    '<small>' + (ripetuti ? ripetuti + " sbagliate più di una volta · " : "") + 'allenamento senza vite, 10 domande, prima le più sbagliate</small></div></div>' +
    '<button class="btn boss" data-allena>🎯 Allenati sui miei errori</button></section>';
  MODULI.forEach(m => {
    const lista = perModulo[m.id]; if (!lista) return;
    const perPar = {}; lista.forEach(v => perPar[v.q.a] = (perPar[v.q.a] || 0) + 1);
    const top = Object.entries(perPar).sort((a, b) => b[1] - a[1])[0];
    html += '<p class="titolo-sez" style="color:' + m.colore + '">' + esc(m.icona + " " + m.titolo) + ' · ' + lista.length + '</p>' +
      (top && top[1] > 1 ? '<button class="glass consiglio larga" data-quiz-err="' + m.id + '|' + top[0] + '"><div class="cico">🎯</div><div class="ctesto"><b>' + esc(m.argomenti[top[0]].titolo) + '</b><p>' + top[1] + ' errori in questo paragrafo: fai un quiz mirato</p></div></button>' : "") +
      lista.map(v => '<div class="riga-err" style="--col:' + m.colore + '"><span class="pt"></span><div>' + esc(v.q.q) +
        '<small>✅ ' + esc(v.q.o[v.q.r]) + (v.q.gen ? ' · 🔢 i numeri cambiano a ogni tentativo' : '') + '</small>' +
        '<small>' + (v.e.n > 1 ? "🔥 sbagliata " + v.e.n + " volte" : "sbagliata 1 volta") + (v.e.ok ? " · 1 giusta di fila, ne manca una" : "") + ' · 📖 ' + esc(m.argomenti[v.q.a].titolo) + '</small></div></div>').join("");
  });
  $("#vista").innerHTML = html;
}

function renderProfilo() {
  const vinti = MODULI.filter(m => (S.moduli[m.id] || {}).vinto).length;
  const sapute = Object.values(S.carte).filter(c => c.box >= 3).length, viste = Object.values(S.carte).filter(c => c.n).length;
  const acc = S.stats.risposte ? Math.round(S.stats.corrette / S.stats.risposte * 100) + "%" : "—";
  const giorni = [];
  for (let k = 27; k >= 0; k--) { const d = piuGiorni(oggi(), -k), n = S.giorni[d] || 0; giorni.push('<i class="' + (n ? (n > 40 ? "l3" : n > 12 ? "l2" : "l1") : "") + '" title="' + d + ': ' + n + ' attività"></i>'); }
  const sims = S.sim.slice(-6).reverse();
  $("#vista").innerHTML = heroLivello() +
    '<p class="titolo-sez">Statistiche</p><div class="griglia-stat">' +
      [[S.xp, "XP totali"], [streakAttuale() + " 🔥", "Streak attuale (record " + S.streak.best + ")"], [vinti + "/" + MODULI.length, "Boss sconfitti"],
       [acc, "Risposte giuste (" + S.stats.risposte + ")"], [viste + "/" + CARTE.length, "Flashcard viste"], [sapute, "Carte consolidate (≥ 7 giorni)"]]
        .map(([v, t]) => '<div class="stat"><b>' + v + '</b><span>' + t + '</span></div>').join("") + '</div>' +
    '<p class="titolo-sez">Ultime 4 settimane</p><div class="glass" style="padding:14px"><div class="heatmap">' + giorni.join("") + '</div></div>' +

// ---- backup dei progressi ----
function segnaBackup() { S.ultimoBackup = oggi(); salva(); }
function ripristinaDa(testo) {

  catch (err) { toast("⚠️ " + err.message); }
}
document.addEventListener("click", e => {
  const bk = e.target.closest("[data-bk]");
  if (bk) {
    const a = bk.dataset.bk, ta = $("#bk-testo"), az = $("#bk-azioni");
    if (a === "mostra") { segnaBackup(); ta.value = esportaCodice(); ta.readOnly = false; ta.classList.remove("nascosto"); az.classList.remove("nascosto"); ta.focus(); ta.select(); toast("Copia il codice e conservalo (note, messaggi a te stesso)"); }
    else if (a === "copia") { ta.select(); let ok = false; try { document.execCommand("copy"); ok = true; } catch (x) { /* manuale */ }
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast("📋 Codice copiato")).catch(() => toast(ok ? "📋 Codice copiato" : "Tieni premuto sul testo e scegli Copia")); else toast(ok ? "📋 Codice copiato" : "Tieni premuto sul testo e scegli Copia"); }
    else if (a === "scarica") { ta.value = esportaCodice(); ta.classList.remove("nascosto"); az.classList.remove("nascosto");   // il codice resta sempre copiabile, anche se il download non funziona
      try { segnaBackup(); const blob = new Blob([esportaCodice()], { type: "text/plain" }), u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = "chimicaquest-backup-" + oggi() + ".txt"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); segnaBackup(); toast("⬇️ Backup scaricato"); }
      catch (x) { toast("Download non disponibile qui: usa «Mostra / copia codice»"); } }
    else if (a === "incolla") { ta.value = ""; ta.readOnly = false; ta.classList.remove("nascosto"); az.classList.remove("nascosto"); ta.focus(); toast("Incolla il codice CQ1:… e premi Ripristina"); }

  if (qe) { const [id, k] = qe.dataset.quizErr.split("|"); return avviaBoss(id, "paragrafo", Number(k)); }
  if (vistaCorrente !== "profilo") return;
  if (e.target.closest("[data-p-sim]")) return apriSetupSim();

    sw.classList.toggle("on", S[k]); aggiornaTop();

    return;
  }
  const em = e.target.closest("[data-es-mod]");
  if (em) {
    const [k, id] = em.dataset.esMod.split("|"), es = S.esami[Number(k)];
    if (es.moduli.includes(id)) { if (es.moduli.length > 1) es.moduli = es.moduli.filter(x => x !== id); }
    else es.moduli = MODULI.map(m => m.id).filter(x => x === id || es.moduli.includes(x));
    salva(); renderProfilo(); return;
  }
  if (e.target.closest("[data-azzera]") && confirm("Azzerare XP, streak, moduli, carte, errori e simulazioni? Non si può annullare.")) {
    const audio = S.audio, esami = S.esami; S = statoVuoto(); S.audio = audio; S.esami = esami; livelloPrima = 0; salva(); aggiornaTop(); renderProfilo(); toast("Progressi azzerati");
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "bk-file" && t.files && t.files[0]) {

  else if (t.dataset.esNome !== undefined) { S.esami[Number(t.dataset.esNome)].nome = t.value.trim() || "Esame"; salva(); }

});
